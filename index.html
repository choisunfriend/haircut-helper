  const drawOps = []; // {sec, cPts, splitIdx, color, width, alpha}
  let _flowCutN = 0, _strandN = 0; // [진단용] 결 불연속으로 종결된 가닥 수
  // ── (8차) 슬라이스 단위 커트 — 1패스는 실측만 수집, 확정은 슬라이스 합의 후 ──
  // 사용자 설계: "실제 커트할 때 손에 몇 가닥씩 잡아 슬라이스 단위로 자르듯,
  // 가닥 몇 개씩 모아 슬라이스 너비로." 가닥별 독립 실측(7차)은 이웃 끝이 제각각
  // 흩어져 "결이 뚝뚝 끊겨 보이고 층 느낌이 약한" 문제가 있었음 → 같은 뿌리
  // 구역(섹션×가로 슬라이스 폭×깊이 밴드)의 가닥들을 한 슬라이스로 묶고,
  // 헴(끝선)을 슬라이스 실측의 중앙값으로 합의. 구성 가닥은 자기 결 경로를
  // 그대로 따르되 끝만 헴±소폭 스태거로 정렬 — 실제 커트의 패널과 동일.
  const pendingStrands = []; // 1패스 수집: 슬라이스 합의 후 확정(아래 finalize)
  function drawStrand(startX, startY, ix, rootSec, rootNy, depthScale, strandMult, jitterSeed, strokeStyleVal){
    // 조정 배율(섹션 길이 슬라이더 — 기본값=원본이라 기본 상태선 ratio=1)
    const rawRatio = lengthRatioFor(ix, rootSec, rootNy);
    const ratio = 1 + (rawRatio - 1) * depthScale;
    const layerDelta = cutLayerDeltaFor(ix, rootSec, rootNy) * depthScale;
    // 목표가 실측보다 짧은 게 확실하면(줄이는 조정) 마스크 이탈 즉시 추적 중단(성능)
    const stopAtExit = (strandMult * ratio <= 1.0 && layerDelta <= 0);
    // ① 실측: 결 필드를 따라 추적, 마스크 이탈점 + 결 불연속(겹 끝) 기록
    const probe = traceStrand(startX, startY, maxStrandLen, jitterSeed, rootSec, stopAtExit);
    const exitIdx = (typeof probe.maskExitIdx === 'number') ? probe.maskExitIdx : probe.length - 1;
    // (7차) 실측 끝 = 마스크 이탈점과 결 불연속(겹 끝) 중 먼저 오는 쪽.
    const flowIdx = (typeof probe.flowEndIdx === 'number') ? probe.flowEndIdx : null;
    const hemIdx = Math.max(1, (flowIdx !== null) ? Math.min(exitIdx, flowIdx) : exitIdx);
    if(flowIdx !== null && flowIdx < exitIdx) _flowCutN++;
    _strandN++;
    pendingStrands.push({ probe, exitIdx, hemIdx, ix, rootSec: rootSec || 'crown', rootX: startX, rootNy,
                          ratio, layerDelta, strandMult, strokeStyleVal,
                          width: curStyle.width, alpha: curStyle.alpha });
  }

  // 슬라이스 합의 + 가닥 확정(목표 길이 계산 → 캡처/op 생성) — 레이어 4개가 모두
  // pendingStrands를 채운 뒤 1회 실행. 슬라이스 폭은 실제 커트 감각(1~2cm)의 근사.
  function finalizeStrandsWithSlices(){
    const SLICE_W = Math.max(4, maskW * 0.03);      // 가로 슬라이스 폭(마스크 폭의 3%)
    const sliceMap = {};
    pendingStrands.forEach(p=>{
      // 슬라이스 = 섹션 × 가로 폭 × 뿌리 깊이 밴드(10%) — 같은 패널에서 난 가닥들
      const key = p.rootSec + '|' + Math.floor(p.rootX / SLICE_W) + '|' + Math.floor(p.rootNy * 10);
      (sliceMap[key] = sliceMap[key] || []).push(p);
    });
    Object.values(sliceMap).forEach(members=>{
      // 헴 합의: 실측(마스크 이탈/결 불연속)의 중앙값 — 고립된 조기 종결(노이즈)이
      // 슬라이스 전체를 흔들지 않고, 진짜 겹 끝이면 다수가 동의해 헴이 됨.
      const hems = members.map(m=>m.hemIdx).sort((a,b)=>a-b);
      const hemMed = hems[Math.floor(hems.length / 2)];
      members.forEach(m=>{ m.sliceHemIdx = hemMed; });
    });
    pendingStrands.forEach(p=>{
      const hemLen = Math.max(maskH * 0.03, p.sliceHemIdx * STRAND_STEP_LEN);
      // 슬라이스가 길이의 주도권을 가지므로 가닥별 랜덤 배율은 60% 축소(질감만 남김)
      const multEff = 1 + (p.strandMult - 1) * 0.4;
      // 헴 주변 ±8% 스태거(결정적 의사난수 — 프레임 간 흔들림 방지)
      const sliceJit = 0.92 + hashFract(p.rootX * 17.23 + p.rootNy * 91.7) * 0.16;
      let targetLen;
      if(p.ratio >= 1){
        // 연장: 패널 균일 성장 — 슬라이스 전체가 같은 양(hemLen×(ratio-1))만큼 자람.
        // 예전(개별 배율×ratio 곱)은 배율 큰 소수 가닥만 유독 길어져 "낙수 가닥"이 됐음.
        // (9차) 연장 이득 1.6배 — 늘리는 쪽 변화가 약하다는 실기기 피드백. 균일
        // 성장이라 이득을 키워도 뻗침(편차 증가)이 아니라 슬라이스가 통째로 길어짐.
        targetLen = hemLen * multEff * sliceJit + hemLen * (p.ratio - 1) * 1.6 + p.layerDelta;
      } else {
        targetLen = hemLen * multEff * sliceJit * p.ratio + p.layerDelta;
      }
      const texAmt = textureFor(p.ix, p.rootSec);
      if(texAmt > 0){
        targetLen *= (1 - Math.random() * (texAmt / 100) * 0.35); // 끝단 무작위 트림
      }
      targetLen = Math.max(maskH * 0.02, Math.min(targetLen, maxStrandLen));
      const nPts = Math.max(2, Math.min(p.probe.length, Math.round(targetLen / STRAND_STEP_LEN) + 1));
      const pts = p.probe.slice(0, nPts);
      // 완성 경로 캡처(3D 리프트 소스) — 색·뿌리 기반 섹션 포함, 2D와 정의상 일치.
      if(capturedStrands){
        capturedStrands.push({ pts, color: p.strokeStyleVal, sec: p.rootSec });
      }
      // clip 분할: 실측 마스크 이탈점까지=base(마스크 clip), 그 너머(연장분)=ext(자유)
      const splitIdx = Math.min(p.exitIdx, pts.length - 1);
      drawOps.push({ sec: p.rootSec, cPts: toCanvasPts(pts), splitIdx,
                     color: p.strokeStyleVal, width: p.width, alpha: p.alpha });
    });
  }

  // ── 실제 인식된 머리카락 마스크 안인지 검사 ──
  // 루트 확산 레이어(아래 "레이어 0")에서 두피 최상단선(scalpY)보다 더 깊은 지점에
  // 가닥 뿌리를 심을 때, 그 지점이 허공이나 피부 위가 아니라 실제 세그멘테이션이
  // 인식한 머리카락 픽셀 안인지 확인하기 위함 — 아니면 가닥이 이마 중간 등에서
  // 갑자기 시작되는 오류가 생길 수 있음.
  // 매 프레임 최초 호출 시 hairCanvas를 축소 해상도(orientMaskW/H, 이미 결방향
  // 계산용으로 만들어둔 것과 동일 크기)로 1회만 샘플링해서 캐시 — 매 가닥마다
  // 원본 해상도 getImageData를 부르지 않도록 함.
  let _hairSampleData = null, _hairSampleW = 0, _hairSampleH = 0, _hairSampleFailed = false;
  function isRealHairAt(x_img, y_img){
    if(_hairSampleData === null && !_hairSampleFailed){
      _hairSampleW = orientMaskW || Math.max(1, Math.round(maskW*0.5));
      _hairSampleH = orientMaskH || Math.max(1, Math.round(maskH*0.5));
      try{
        const sc = document.createElement('canvas');
        sc.width = _hairSampleW; sc.height = _hairSampleH;
        const sctx = sc.getContext('2d');
        sctx.drawImage(hairCanvas, 0, 0, _hairSampleW, _hairSampleH);
        _hairSampleData = sctx.getImageData(0,0,_hairSampleW,_hairSampleH).data;
      }catch(e){ _hairSampleFailed = true; }
    }
    if(!_hairSampleData) return true; // 샘플링 실패 시 항상 허용(안전 폴백 — 검증 없이 기존처럼 동작)
    const sx = Math.round((x_img/maskW) * _hairSampleW);
    const sy = Math.round((y_img/maskH) * _hairSampleH);
    if(sx<0||sx>=_hairSampleW||sy<0||sy>=_hairSampleH) return false;
    return _hairSampleData[(sy*_hairSampleW+sx)*4+3] > 40;
  }

  // 가닥 레이어 하나를 그리는 공용 헬퍼 — "굵은 섹션/중간 가닥/잔 가닥" 3개 레이어가
  // 개수·굵기·지터 폭만 다르고 구조는 동일해서(컬럼 선택 → 원본길이 계산 → 늘린 길이
  // 계산 → drawStrand 호출) 반복문 자체를 파라미터화해서 하나로 합침.
  // rootDepthFrac(옵션): 지정하면 두피 최상단선(scalpY) 대신 그보다 (hairEndY 방향으로)
  // 더 깊은 지점에서 가닥을 출발시킴 — 실제 머리처럼 여러 깊이에 뿌리를 둔 느낌을 내기
  // 위함(루트 확산 레이어 전용). 미지정 시 기존 3개 레이어와 완전히 동일하게 동작.
  function drawStrandLayer(cfg){
    const {
      count, alphaMul, lineWidth, pickCol, endYFallbackRatio,
      lenScale, lenMult, startXJitter, startYJitter, jitterSeedFn, tintRange, rootDepthFrac
    } = cfg;
    setStyle('globalAlpha', alpha * alphaMul);
    setStyle('lineWidth', lineWidth);
    for(let i=0; i<count; i++){
      const ix = pickCol(i);
      const sy_top = iScalpY[ix]; if(sy_top < 0) continue;
      const ey_img = iHairEndY[ix] >= 0 ? iHairEndY[ix] : sy_top + maskH*endYFallbackRatio;
      let sy_img = sy_top;
      // depthScale: 이 가닥의 시작점이 두피선(frac=0)에서 얼마나 깊이(ey_img 방향으로)
      // 파고들었는지에 따라 길이 배율(ratio)의 "1에서 벗어난 정도"를 비례 축소하는 계수.
      // 기본 1(=두피선 레이어와 동일하게 ratio 변화량 전량 반영).
      let depthScale = 1;
      if(rootDepthFrac){
        const frac = Math.max(0, Math.min(0.9, rootDepthFrac()));
        const candidateY = sy_top + (ey_img - sy_top) * frac;
        // 후보 지점이 실제 마스크 안일 때만 채택, 아니면 원래 두피선으로 안전하게 폴백
        if(frac > 0 && isRealHairAt(ix, candidateY)){
          sy_img = candidateY;
          // 루트 확산 레이어가 두피선보다 훨씬 깊은 지점에서 출발해 origLen(남은 길이)
          // 자체가 짧은데, ratio 기반으로 바뀐 지금은 origLen에 비례하므로 예전(delta
          // 절대값 방식)만큼 극단적이진 않지만, 그래도 깊이가 깊을수록 배율 변화를
          // 줄여서 두피선 근처 대비 과도하게 요동치지 않도록 유지.
          depthScale = 1 - frac * 0.3; // (4차) 겹 스택에선 깊은 뿌리=아래 겹(사이드/네이프)이 조정 주체라 감쇠를 약하게
        }
      }
      // ── 섹션 판정: "기준은 뿌리"(4차, 사용자 교정 — 미용 이론 그대로) ──
      // (6차) 길이는 여기서 계산하지 않는다: drawStrand가 결 필드를 따라 추적하며
      // 마스크 이탈점을 "실측"하고, 그 실측 길이에 섹션 조정 배율을 곱한다.
      // 4~5차의 origLen(컬럼 세로높이)/헴 캡 기반 길이 모델은 실측으로 대체·폐기.
      const rootNy = sy_img / maskH;
      const rootSec = (sections && angle) ? resolveSectionId(angle, ix/maskW, rootNy) : 'crown';
      // 레이어별 길이 배율(끝단이 층층이 어긋나는 자연스러운 스태거) — 실측 길이에 곱해짐
      const strandMult = lenMult ? lenMult() : 1;
      const startX = ix + startXJitter();
      const startY = startYJitter ? sy_img + startYJitter() : sy_img;
      const jitterSeed = jitterSeedFn(i);
      const [tMin, tRange] = tintRange;
      // 가닥 색: 실측 팔레트가 있으면(원본 모드) 실제 픽셀 색에서 하나를 뽑아
      // 미세 틴트(±6%)만 — 원본의 "어두운 다수+밝은 새치 소수" 분포 그대로.
      // 팔레트가 없으면(염색 스타일 등) 기존처럼 섹션 평균색×층별 틴트.
      // (2026-07-17) FORCED_HAIR_COLOR 활성 시 틴트 상한을 1.06으로 클램프 —
      // tintColor는 bright>1일 때 흰색을 가산 혼합하는데(검은 머리에서도
      // 하이라이트가 보이게 하려던 이전 수정), tintRange 상한(최대 1.4)이
      // #141414에 얹히면 델타 0.4×1.8 가산으로 가닥이 회백색이 돼버림
      // (실기기 스크린샷: "머리가 검정색 안나왔어" — 검정 사이 흰 가닥 다수).
      // 1.06이면 미세한 윤기만 남고 검정 유지. 어두운 쪽(tMin~1)은 그대로.
      const brightRaw = usePalette ? (0.94 + Math.random()*0.12) : (tMin + Math.random()*tRange);
      const bright = FORCED_HAIR_COLOR ? Math.min(1.06, brightRaw) : brightRaw;
      const strokeCol = usePalette
        ? tintColor(colorPalette[Math.floor(Math.random()*colorPalette.length)], bright)
        : tintColor(colorForSection(ix, rootSec), bright);
      drawStrand(startX, startY, ix, rootSec, rootNy, depthScale, strandMult, jitterSeed, strokeCol);
    }
  }

  // ── 레이어 0: 루트 확산 레이어 (110~190개) ──
  // 기존 3개 레이어는 전부 두피 최상단선(scalpY) "한 줄"에서만 출발해서, 그 줄
  // 아래로 인식된 머리 영역(hairEndY까지)이 짧은 컬럼(옆머리 아래쪽, 프로필 하단
  // 등)에서는 가닥이 금방 끝나버려 비어 보이는 문제가 있었음. 실제 머리는 두피
  // 전체에 뿌리가 흩어져 있어서 시작 높이 자체가 제각각인데, 지금까지는 "출발선"이
  // 하나뿐이라 그 아래를 다른 가닥으로 못 채우고 있었던 것.
  // → rootDepthFrac으로 두피선~모발끝 사이 임의 깊이에서 추가로 뿌리를 심어, 옆/하단처럼
  //   원래 짧게 끊기던 구간을 다른 깊이의 가닥들이 겹쳐서 메우도록 함. 다른 레이어보다
  //   먼저 그려서 그 위에 레이어 1~3이 덮이게 하고, 두께는 잔가닥과 비슷하게 얇게 유지.
  // 버그 수정: 기존 Math.sqrt(Math.random())*0.55는 주석에 "얕은 쪽에 몰리게"라 적혀
  // 있었지만 실제로는 sqrt(균등분포)라 반대로 "깊은 쪽(0.55에 가까운 값)"에 밀도가 더
  // 쏠리는 공식이었음 + 최대 깊이도 0.55로 막혀 있어 두피선~모발끝의 아래쪽 45%는
  // 애초에 뿌리를 못 심었음. 정수리(얕은 지점)만 계속 밀집되고 중간·아래는 비어
  // 보이는 원인 중 하나 → 특정 깊이에 쏠리지 않는 균등분포로 바꾸고, 최대 깊이를
  // 0.55→0.8로 넓혀서 중간·아래쪽까지 뿌리가 실제로 닿도록 함.
  // 개수 1.6배 상향: 굵기를 0.367배로 줄인 만큼(테스트 결과 "듬성듬성해짐" 확인됨)
  // 가닥 사이 빈틈을 메우기 위한 보정. 완전 보정(1/0.367≈2.7배)까지는 안 가고
  // 우선 중간 지점(1.6배)부터 테스트.
  // sub-pixel 렌더링 문제 수정: 0.22~0.51px는 1px 미만이라 브라우저가 "더 얇게"가
  // 아니라 알파를 낮춰 흐릿하게 그려버림(캔버스가 sub-pixel 굵기를 실제로 표현 못 함).
  // 1px 근처로 최소굵기를 올려서 흐려지는 걸 막고, 대신 개수를 더 늘려 밀도로 보완.
  const numRootScatter = Math.round(830 + (volume/100) * 590); // 2026-07-14 증량(460+330→×1.8): 굵기 하향 커버리지 보상 — 사용자 합의
  drawStrandLayer({
    count: numRootScatter,
    alphaMul: 1.0,
    // 705px 기준 튜닝값 → 실제 해상도(resScale)에 비례 스케일 + sub-pixel 방지 하한
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.5 + (thickness/100) * 0.28) * widthScale), // 2026-07-14 굵기 하향 → 2026-07-16 전역 STRAND_THIN 추가 하향
    pickCol: ()=> validCols[Math.floor(Math.random()*validCols.length)],
    endYFallbackRatio: 0.35,
    // 균등분포 → 제곱분포로 변경: 두피선(frac=0) 근처에 확률이 더 실리고 꼬리가 길게
    // 빠지는 형태(Math.pow(Math.random(),2))라, 실제 헤어라인 밀도는 유지하면서
    // 중간·아래쪽까지 여전히 뿌리가 퍼짐. 균등분포일 때 두피선 근처 밀도가 과소해져
    // "정수리가 빈다"는 오버코렉션이 발생했던 것에 대한 수정.
    rootDepthFrac: ()=> Math.pow(Math.random(), 1.1) * 0.8, // (4차) 제곱편향→준균등: 겹 스택에선 아래 겹(사이드/네이프)도 자기 뿌리로 커버해야 함
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02),
    lenMult: ()=> 0.6+Math.random()*0.4, // 랜덤 배율 분리(중립 길이 계산과 공유 — 동작 동일)
    startXJitter: ()=> (Math.random()-0.5)*maskW*0.01,
    jitterSeedFn: (i)=> i*0.271,
    tintRange: [0.68, 0.55],
  });

  // ── 레이어 1: 굵은 섹션 (38~60개) ──
  // 가닥을 불투명하게 바꾸면서 밀도를 다시 소폭 상향 (30~48 → 38~60).
  // 개수 1.6배 상향 — 위 레이어0과 동일한 이유
  const numSections = Math.round(85 + (volume/100) * 49); // 2026-07-14 증량(61+35→×1.4): 굵은 레이어는 뭉침 방지 위해 소폭만
  drawStrandLayer({
    count: numSections,
    alphaMul: 1.0, // 형태를 잡는 가장 굵은 레이어 — 완전 불투명하게 해서 밑의 살색이 안 비치게
    // 705px 기준 튜닝값 → 해상도 비례 스케일
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.65 + (volume/100) * 0.6) * widthScale), // 2026-07-14 굵기 하향 → 2026-07-16 전역 STRAND_THIN 추가 하향
    pickCol: (i)=> validCols[Math.floor((i/numSections)*validCols.length)],
    endYFallbackRatio: 0.40,
    // 한 줄(scalpY) 제한 해제: 다른 레이어처럼 두피선~모발끝 사이에 깊이를 분산시켜서,
    // 이 레이어 전체가 정수리 한 줄에 몰려 밀도가 뭉치는 걸 방지.
    rootDepthFrac: ()=> Math.pow(Math.random(), 1.1) * 0.6, // (4차) 제곱편향→준균등(겹 스택 커버리지)
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02),
    startXJitter: ()=> (Math.random()-0.5)*(maskW/numSections)*1.5,
    jitterSeedFn: (i)=> i,
    tintRange: [0.70, 0.55],
  });

  // ── 레이어 2: 중간 가닥 (160~330개) ──
  // 개수 1.6배 상향 — 위와 동일한 이유
  const numMid = Math.round(460 + (volume/100) * 490); // 2026-07-14 증량(256+272→×1.8)
  drawStrandLayer({
    count: numMid,
    alphaMul: 1.0,
    // 705px 기준 튜닝값 → 해상도 비례 스케일 + sub-pixel 방지 하한
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.48 + (thickness/100) * 0.33) * widthScale), // 2026-07-14 굵기 하향 → 2026-07-16 전역 STRAND_THIN 추가 하향
    pickCol: ()=> validCols[Math.floor(Math.random()*validCols.length)],
    endYFallbackRatio: 0.38,
    rootDepthFrac: ()=> Math.pow(Math.random(), 1.1) * 0.7, // 한 줄 제한 해제, (4차) 준균등 — 겹 스택 커버리지
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02),
    lenMult: ()=> 0.85+Math.random()*0.3, // 랜덤 배율 분리(중립 길이 계산과 공유 — 동작 동일)
    startXJitter: ()=> (Math.random()-0.5)*maskW*0.008,
    jitterSeedFn: (i)=> i*0.618,
    tintRange: [0.72, 0.60],
  });

  // ── 레이어 3: 잔 가닥 (160~320개) ──
  // 이 레이어가 가장 밝은 하이라이트(tintRange 상단)를 담당 — 완전 불투명(alphaMul 1.0)으로
  // 그려서 하이라이트가 살색에 묻히지 않고 또렷하게 도드라짐.
  // 개수 1.6배 상향 — 위와 동일한 이유
  // sub-pixel 문제 수정 + 개수 추가 상향 — 위 레이어0과 동일한 이유.
  // 이 레이어는 하이라이트(밝은 톤) 담당이라 흐려지면 머리 전체 광택감이 죽는
  // 영향이 가장 커서 우선적으로 손봄.
  const numFine = Math.round(595 + (volume/100) * 595); // 2026-07-14 증량(330+330→×1.8)
  drawStrandLayer({
    count: numFine,
    alphaMul: 1.0,
    // 705px 기준 튜닝값 → 해상도 비례 스케일 + sub-pixel 방지 하한
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.5 + (thickness/100) * 0.28) * widthScale), // 2026-07-14 굵기 하향 → 2026-07-16 전역 STRAND_THIN 추가 하향
    pickCol: ()=> validCols[Math.floor(Math.random()*validCols.length)],
    endYFallbackRatio: 0.35,
    rootDepthFrac: ()=> Math.pow(Math.random(), 1.1) * 0.85, // 한 줄 제한 해제 — 잔가닥은 가장 넓게 분산, (4차) 준균등
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02),
    lenMult: ()=> 0.7+Math.random()*0.5, // 랜덤 배율 분리(중립 길이 계산과 공유 — 동작 동일)
    startXJitter: ()=> (Math.random()-0.5)*maskW*0.012,
    startYJitter: ()=> (Math.random()-0.5)*maskH*0.01,
    jitterSeedFn: (i)=> i*0.382,
    tintRange: [0.65, 0.75],
  });

  // ── (6차) 섹션 스택 드로잉 — "세그멘테이션 통짜 페인팅" 폐지 ──
  // 사용자 지적: "세그멘테이션 전체를 처음에 그려버리잖아 — 실제랑 완전히 다르다."
  // ① 언더코트: 마스크 실루엣을 통째로 두피색으로 칠하던 것(renderFrame에서 제거)
  //    대신, "실제 가닥 경로"를 두피색 굵은 획으로 먼저 깔아 가닥 사이 빈틈만 메움
  //    — 조정으로 헤어 모양이 바뀌면 바탕도 그대로 따라간다(통짜 실루엣 잔상 없음).
  // ② 가닥 스트로크를 섹션 스택 순서(네이프→후두부→템플→사이드→프론트→크라운)로
  //    일괄 실행 — 아래 겹 위에 위 겹이 쌓이는 실제 구조. 같은 섹션 안에서는
  //    생성 순서(레이어 0→3)가 유지된다(Array.sort는 안정 정렬).
  finalizeStrandsWithSlices(); // (8차) 슬라이스 합의 → drawOps/캡처 확정

  const SECTION_STACK = { nape:0, occipital:1, temple:2, side:3, front:4, crown:5 };
  drawOps.sort((a,b)=> (SECTION_STACK[a.sec] ?? 2) - (SECTION_STACK[b.sec] ?? 2));
  function strokeOp(op, color, widthMul, baseOnly){
    const bPts = op.cPts.slice(0, op.splitIdx + 1);
    baseCtx.strokeStyle = color; baseCtx.lineWidth = op.width * widthMul; baseCtx.globalAlpha = op.alpha;
    strokePolyline(baseCtx, bPts);
    if(!baseOnly && op.splitIdx < op.cPts.length - 1){
      extCtx.strokeStyle = color; extCtx.lineWidth = op.width * widthMul; extCtx.globalAlpha = op.alpha;
      strokePolyline(extCtx, op.cPts.slice(op.splitIdx)); // 분할점 공유로 선이 안 끊기게
    }
  }
  const scalpUnderCol = opts.scalpColor || 'rgb(224,178,148)';
  // 언더코트는 base(마스크 안)만 — 연장 구간까지 두피색 굵은 획을 깔면
  // 얼굴/배경 위에 살구톤 밑줄이 비쳐 보임(8차, 실기기 스크린샷 대응).
  drawOps.forEach(op => strokeOp(op, scalpUnderCol, 2.2, true)); // 언더코트 패스(가닥 추종 바탕)
  drawOps.forEach(op => strokeOp(op, op.color, 1, false));       // 실제 가닥 패스(섹션 스택 순서)

  // [진단용] 결 불연속 종결 비율 — 겹층 커트면 두 자릿수 %가 정상, 긴 생머리면 낮아야 함.
  // 매 렌더 랜덤으로 숫자가 흔들리므로 10% 버킷이 바뀔 때만 출력(스팸 방지).
  if(angle && _strandN > 0){
    const pct = Math.round(_flowCutN / _strandN * 100);
    window._lastDiscLog = window._lastDiscLog || {};
    // (8차) 각도당 최초 1회만 출력 — 버킷 방식(round→floor)은 어떤 경계값이든
    // 렌더마다 난수로 값이 튀면 뚫림(실기기에서 19↔20% 진동으로 40회 반복 확인).
    // 비율은 렌더 간 거의 안 변하므로 1회면 충분, 추가 확인은 DIAG_VERBOSE로.
    if(!(angle in window._lastDiscLog) || window.DIAG_VERBOSE){
      window._lastDiscLog[angle] = true;
      console.log('[진단·결단] '+angle+' 가닥 '+_strandN+'개 중 결불연속(겹 끝) 종결 '+_flowCutN+'개('+pct+'%)');
    }
  }

  // ── 2단계 합성 ──
  // [1] base: 실측 이탈점 이내 구간 → hairCanvas(실제 세그멘테이션 마스크)로 destination-in
  //     clip을 걸어서, 인식된 머리카락 영역 밖(얼굴·안경·배경)으로는 절대 안 나가게 함.
  // [2] ext: 실측 이탈점을 넘겨 슬라이더로 늘어난 구간 → clip 없이 그대로.
  //     (짧게 줄인 경우엔 애초에 ext 구간 자체가 안 그려지므로 자연히 문제 없음)
  function compositeLayers(){
    const maskAlpha = document.createElement('canvas');
    maskAlpha.width = cw; maskAlpha.height = ch;
    const mCtx = maskAlpha.getContext('2d');
    // 버그 수정: hairCanvas(destination-in 클리핑 마스크)가 scalpY와 동일한 원본 마스크에서
    // 나와서, 이마 중앙 notch 같은 국소 인식 실패 구간은 마스크 알파도 0이라 validCols를
    // 고쳐서 그 컬럼에 뿌리를 심어도 여기서 다시 지워지는 문제가 있었음. → 클리핑용
    // 마스크에 작은 블러를 걸어 알파를 살짝 번지게(dilate)한 뒤 임계치로 다시 불투명
    // 처리해서, 좁은 gap(노치)만 부드럽게 메워지고 배경처럼 넓은 미인식 영역은 여전히
    // 클리핑되도록 함. (블러만 걸면 전체가 반투명해져 머리카락이 옅게 비쳐 보이므로
    // 임계치로 다시 하드 마스크화)
    const blurPx = Math.max(3, fit.dw * 0.015);
    mCtx.filter = `blur(${blurPx}px)`;
    mCtx.drawImage(hairCanvas, fit.dx, fit.dy, fit.dw, fit.dh);
    mCtx.filter = 'none';
    const mImg = mCtx.getImageData(0,0,cw,ch);
    for(let i=3;i<mImg.data.length;i+=4){
      mImg.data[i] = mImg.data[i] > 25 ? 255 : 0;
    }
    mCtx.putImageData(mImg,0,0);

    baseCtx.save();
    baseCtx.globalCompositeOperation = 'destination-in';
    baseCtx.drawImage(maskAlpha, 0, 0);
    baseCtx.restore();

    ctx.save();
    ctx.globalAlpha = 1;
    ctx.drawImage(baseOffscreen, 0, 0);
    ctx.drawImage(extOffscreen, 0, 0);
    ctx.restore();
  }
  compositeLayers();

  // (옮기기 1단계) 이 각도의 최신 완성 경로를 저장 — 슬라이더 조정 등으로
  // 다시 그릴 때마다 덮어써서 항상 "지금 화면에 보이는 그 가닥들"이 유지됨.
  if(capturedStrands && angle){
    state.strandPaths = state.strandPaths || {};
    state.strandPaths[angle] = { strands: capturedStrands, maskW, maskH };
  }
}
function tintColor(hex, bright){
  // hex 또는 rgb() 문자열을 받아 밝기 조정
  let r=42,g=27,b=18;
  if(hex.startsWith('#')){
    const n=parseInt(hex.slice(1),16);
    r=(n>>16)&255; g=(n>>8)&255; b=n&255;
  } else {
    const m=hex.match(/\d+/g);
    if(m&&m.length>=3){r=+m[0];g=+m[1];b=+m[2];}
  }
  // 버그 수정: 기존엔 r*bright 처럼 순수 곱셈으로 밝기를 조정했는데, 이러면
  // 검정/짙은 갈색처럼 원래 값이 0에 가까운 색은 bright를 0.65~1.2로 바꿔도
  // 결과가 거의 그대로라 가닥끼리 색 차이가 안 생기고 다 뭉쳐 보였음
  // (예: 30*0.65=19.5, 30*1.2=36 — 육안으로 거의 차이 없음).
  // → 밝게 할 땐(bright>1) 흰색 쪽으로 섞어서(additive) 어두운 색에서도
  //   확실한 하이라이트가 생기게 하고, 어둡게 할 땐(bright<1) 기존처럼 곱셈 유지.
  const delta = bright - 1; // 대략 -0.35 ~ +0.2
  function mix(c){
    if(delta >= 0) return c + (255-c) * Math.min(1, delta*1.8);
    return c * bright;
  }
  return `rgb(${Math.min(255,Math.round(mix(r)))},${Math.min(255,Math.round(mix(g)))},${Math.min(255,Math.round(mix(b)))})`;
}

function drawCompare(){
  if(currentScreen!=='compare') return;
  const angle = state.currentViewAngle;
  const pane  = document.getElementById('comparePane');
  const baseC = document.getElementById('compareBaseCanvas');
  const topC  = document.getElementById('compareTopCanvas');
  const clip  = document.getElementById('compareClip');

  const pw = pane.clientWidth, ph = pane.clientHeight;
  if(pw===0||ph===0){ setTimeout(()=>drawCompare(),80); return; }
  // (2026-07-16) 비교 화면도 syncCanvasSize와 동일하게 가로 1200px 고정
  // 백킹스토어 — 조정 화면과 비교 화면의 그리기 해상도가 항상 같아짐.
  // 표시 크기는 style로 CSS 픽셀에 고정.
  const cscale = DRAW_RES/pw;
  baseC.width=DRAW_RES; baseC.height=Math.round(ph*cscale);
  baseC.style.width=pw+'px'; baseC.style.height=ph+'px';
  topC.width=DRAW_RES;  topC.height=Math.round(ph*cscale);
  topC.style.width=pw+'px'; topC.style.height=ph+'px';

  const div = document.getElementById('compareDivider');
  if(!div.style.left||div.style.left==='0px') div.style.left='50%';
  const pct = parseFloat(div.style.left)||50;
  clip.style.width = pct+'%';

  getCachedImg(angle,(img)=>{
    const ctx = baseC.getContext('2d');
    // dpr 배율 백킹스토어 기준으로 그려야 함(pw,ph는 CSS 픽셀) — 아니면 좌상단 1/dpr² 영역에만 그려짐
    ctx.clearRect(0,0,baseC.width,baseC.height);
    if(img) drawImgOnCanvas(ctx,img,baseC.width,baseC.height);
  });

  renderFrame(topC, angle);
}

// Claude API 호출(이미지 1장 + 프롬프트 → JSON 응답)의 공통부.
// analyzeWithClaude(스타일 분석)와 recommendOutfitWithAI(의상 추천)가 fetch
// 설정·응답 블록 조립·```json 펜스 제거·JSON.parse를 글자 그대로 복제하고
// 있던 것을 통합(2026-07-18). 다른 건 프롬프트와 max_tokens뿐이라 인자로 받음.
// 실패 시 예외를 그대로 던져서, 각 호출부가 이미 갖고 있는 catch가 자기
// 폴백(토스트 / 기본 의상)을 그대로 수행하게 함 — 동작 무변경.
async function callClaudeJSON({ base64, mediaType, prompt, maxTokens }){
  // (2026-07-25) 타임아웃 추가 — github.io에서 api.anthropic.com 직접 호출은 CORS/인증에
  // 막혀 fetch가 응답 없이 멈출 수 있고, 그러면 이 함수를 await하던 3D 화면 셋업이
  // 영영 대기했다("추천 AI에서 안 넘어감"). 8초 후 abort → 호출부 catch로 폴백 진행.
  const ctrl = new AbortController();
  const timer = setTimeout(()=>ctrl.abort(), 8000);
  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:maxTokens, messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:mediaType, data:base64 } },
        { type:'text', text:prompt }
      ]}]}),
      signal: ctrl.signal
    });
    const data = await res.json();
    const raw = data.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    return JSON.parse(raw);
  } finally {
    clearTimeout(timer);
  }
}

function toggleVoice(){
  if(listening){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('음성인식은 Chrome에서만 작동해요.');return;}
  recognition=new SR();
  recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=false;
  recognition.onresult=e=>{ const t=e.results[e.results.length-1][0].transcript.trim(); handleVoiceCmd(t); };
  recognition.onerror=()=>stopVoice();
  recognition.onend=()=>{if(listening){try{recognition.start();}catch(e){}}};
  recognition.start(); listening=true;
  document.getElementById('voiceBtn').classList.add('listening');
  document.getElementById('voiceBtnLabel').textContent='듣는 중… (탭하여 종료)';
}
function stopVoice(){
  listening=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  document.getElementById('voiceBtn').classList.remove('listening');
  document.getElementById('voiceBtnLabel').textContent='음성으로 조정하기';
}
function handleVoiceCmd(text){
  document.getElementById('voiceTranscript').innerHTML='인식됨: <b>"'+text+'"</b>';
  const t=text.replace(/\s/g,'');
  const STEP=15; let matched=false;

  // 섹션 선택
  const sectionMap = {
    '크라운':'crown','정수리':'crown',
    '프론트':'front','앞머리':'front',
    '템플':'temple','관자':'temple',
    '사이드':'side','옆머리':'side',
    '후두부':'occipital','뒤통수':'occipital',
    '네이프':'nape','목선':'nape',
  };
  let targetSection = state.activePanelSection==='styling' ? state.currentSection : state.activePanelSection;
  let sectionSpoken = false;
  Object.entries(sectionMap).forEach(([kw,sid])=>{ if(t.includes(kw)){ targetSection=sid; sectionSpoken=true; } });
  if(sectionSpoken){ state.activePanelSection = targetSection; state.currentSection = targetSection; }

  const adj=(param,delta,min=0,max=100)=>{
    const s=state.sections[targetSection];
    if(typeof s[param]!=='number') return;
    const prev=s[param];
    s[param]=Math.max(min,Math.min(max,s[param]+delta));
    // 델타 기반 연동(래칫 버그 수정과 동일 규약) — 클램프 후 실제 변화량을 전달
    if(param==='length') propagateSectionChange(targetSection,'length',s[param]-prev);
    matched=true;
  };
  // 전 섹션 컬 일괄 조정(펌은 per-section이지만 음성은 전체 조정으로 취급)
  const adjAllCurl=(delta)=>{ SECTION_ORDER.forEach(id=>{ state.sections[id].curl=Math.max(0,Math.min(100,state.sections[id].curl+delta)); }); state._globalCurl=Math.max(0,Math.min(100,state._globalCurl+delta)); matched=true; };
  const has=arr=>arr.some(kw=>t.includes(kw));

  if(has(['길게','늘려','길이늘','더길'])) adj('length',STEP);
  else if(has(['짧게','줄여','길이줄','더짧'])) adj('length',-STEP);
  else if(has(['볼륨추가','볼륨올','볼륨업','풍성'])){ state.styling.volume=Math.min(100,state.styling.volume+STEP); matched=true; }
  else if(has(['볼륨줄','볼륨내','납작'])){ state.styling.volume=Math.max(0,state.styling.volume-STEP); matched=true; }
  else if(has(['컬추가','웨이브추가','더컬'])) adjAllCurl(STEP);
  else if(has(['펴줘','컬줄','스트레이트','직모'])) adjAllCurl(-STEP);
  else if(t.includes('다음각도')||t.includes('다음앵글')){ cycleAngle(1); matched=true; }
  else if(t.includes('이전각도')||t.includes('이전앵글')){ cycleAngle(-1); matched=true; }
  else if(t.includes('비교')||t.includes('완료')){ navTo('compare'); matched=true; }
  else if(t.includes('초기화')||t.includes('리셋')){ resetSections(); matched=true; }
  else if(sectionSpoken){ matched=true; } // 섹션 이름만 말한 경우: 그 섹션으로 전환

  if(matched){ buildGyPanel(); drawAdjustPreview(); }
  else showToast('명령을 이해하지 못했어요: "'+text+'"');
}
function cycleAngle(dir){
  let idx=ANGLES.indexOf(state.currentViewAngle);
  idx=(idx+dir+4)%4; state.currentViewAngle=ANGLES[idx];
  renderAngleSwitches();
  drawAdjustPreview(); drawCompare();
}

/* ════════════════════════════════════════
   3D 두상 (2단계 프로토타입)
   ────────────────────────────────────────
   방향: 지금은 절차적(procedural) 도형으로 두상을 대충 근사해서 화면에
   띄우지만, 코드 구조는 처음부터 "진짜 3D 두상 파일(.glb)로 교체 가능"
   하게 짜둠 — HEAD_MESH_SOURCE.type을 'gltf'로 바꾸고 url만 넣으면
   loadHeadMesh()가 알아서 GLTFLoader 경로를 타도록 분기되어 있음.
   실제 진짜 메시가 생기기 전까지는 procedural 분기만 쓰임.
════════════════════════════════════════ */
const HEAD_MESH_SOURCE = {
  type: 'procedural', // 'procedural' | 'gltf' — 나중에 실제 두상 파일 생기면 'gltf'+url로 교체
  url: null,           // 예: '/assets/generic_head.glb'
};

let model3D = null; // { renderer, scene, camera, headGroup, hairMesh, animId, initialized, container }
// setupModel3DScreen()이 호출될 때마다 +1. 사진 데칼은 비동기로 로드되므로,
// 로드 도중 화면을 벗어났다 다시 들어와 headGroup이 통째로 재구성된 경우
// 오래된 데칼 Promise가 새 headGroup에 잘못 붙는 걸 이 번호로 막는다.
let model3DGeneration = 0;

function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

// state.landmarks.front + state.hairMasks.front(실제 캡처 픽셀 크기)로
// "이 사람 얼굴이 대략 얼마나 갸름한지/넓은지"를 실측해서 절차적 두상의
// 가로/세로 스케일 보정 계수를 뽑는다. 랜드마크 정규화좌표는 각각 이미지
// 가로/세로 기준이라 그대로 비율 비교하면 안 되고 실제 픽셀 폭/높이를
// 곱해줘야 진짜 종횡비가 나옴. 오검출로 두상이 그로테스크하게 찌그러지는
// 걸 막기 위해 배율 범위를 좁게 clamp.
function getFaceMetrics(){
  const lm = (state.landmarks && state.landmarks.front) || getEstimatedLandmarks('front');
  const imgW = (state.hairMasks && state.hairMasks.front && state.hairMasks.front.w) || 1;
  const imgH = (state.hairMasks && state.hairMasks.front && state.hairMasks.front.h) || 1;

  const faceHeightPx = Math.max(1, (lm.chinY - lm.browTopY) * imgH);
  const faceWidthPx  = Math.max(1, Math.abs(lm.rEarX - lm.lEarX) * imgW);
  const aspect = faceHeightPx / faceWidthPx; // 클수록 갸름한 얼굴, 작을수록 둥근/넓은 얼굴

  const BASELINE_ASPECT = 1.55; // 기존 고정 스케일(0.78/0.85)이 암묵적으로 가정하던 기준 비율
  const ratio = clamp(aspect / BASELINE_ASPECT, 0.72, 1.38);
  const widthFactor  = clamp(1/Math.sqrt(ratio), 0.85, 1.18);
  const heightFactor = clamp(Math.sqrt(ratio), 0.85, 1.18);

  const projector = makeFaceProjector(lm, widthFactor, heightFactor);
  return { lm, imgW, imgH, widthFactor, heightFactor, projector };
}

// 이미지 정규화좌표(0~1) → 두상 로컬(x,y) 근사 변환. "눈높이/턱높이" 두
// 기준점을 두상 로컬 y좌표 두 지점(EYE_MESH_Y/CHIN_MESH_Y)에 맞추는 아핀
// 변환 하나로 세로를, "좌/우 귀" 두 기준점을 ±EAR_MESH_X에 맞추는 아핀
// 변환 하나로 가로를 처리. 진짜 카메라 캘리브레이션이 아니라 "실측 비율에
// 대략 맞는 자리" 수준 근사 — 이 파이프라인 전체가 원래 이 수준(procedural
// placeholder)이라 과설계하지 않음. widthFactor/heightFactor는
// getFaceMetrics()가 이미 반영한 두상 스케일과 같은 값을 받아 기준점 자체가
// 두상 크기에 맞춰 같이 움직이게 한다.
function makeFaceProjector(lm, widthFactor, heightFactor){
  const EYE_MESH_Y = 0.15; // headMesh.position.y와 동일(구 적도 = 이 높이)
  const CHIN_MESH_Y = 0.15 - 0.70*heightFactor;
  const denomY = (lm.chinY - lm.eyeY) || 0.001;
  const bY = (EYE_MESH_Y - CHIN_MESH_Y) / denomY;
  const aY = EYE_MESH_Y + bY * lm.eyeY;
  const toMeshY = (v)=> aY - bY * v;

  const EAR_MESH_X = 0.78 * widthFactor * 0.82; // 적도 반경보다 살짝 안쪽(귀는 옆으로 살짝 들어간 위치)
  const lx = Math.min(lm.lEarX, lm.rEarX), rx = Math.max(lm.lEarX, lm.rEarX);
  const denomX = (rx - lx) || 0.001;
  const bX = (2*EAR_MESH_X) / denomX;
  const toMeshX = (u)=> (u - lx) * bX - EAR_MESH_X;

  return { toMeshX, toMeshY, EAR_MESH_X, bX, bY };
}

// 절차적 두상: 타원(스케일된 구)으로 두상 근사. 이전엔 비율·피부색·이목구비
// 위치가 전부 눈대중 고정값이었는데, 이제 getFaceMetrics()가 뽑아낸 실측
// 종횡비/좌표 변환(projector)과 실제 두피색(skinColorCss)을 반영해서 "이
// 사람 사진에서 뽑을 수 있는 정보는 최대한 쓴" 근사치로 만든다. 여전히
// 진짜 3D 스캔은 아니고 절차적 근사(placeholder)라는 성격 자체는 그대로.
// 두상 본체(실측 종횡비 반영한 타원). buildProceduralHead()에서 분리됨(로직 동일).
// ── 실측 단면 기반 두상 메쉬(2026-07-14, 타원체 완전 제거) ──
// 사용자 지시: "기존 타원체는 지워, 중간이 허공이어도 일단은 상관없어".
// 고정 타원체(SphereGeometry.scale)를 없애고, scalpPointToWorld(이미
// computeHeadCrossSections의 실측 단면 데이터를 쓰도록 교체됨)를 (phi,theta)
// 격자로 촘촘히 샘플링해서 실제 메쉬를 만든다. widthFactor/heightFactor
// 인자는 scalpPointToWorld 내부에서 getFaceMetrics()로 같은 값을 다시
// 가져오므로(호출부 buildProceduralHead도 같은 faceMetrics에서 뽑은 값이라
// 불일치 없음) 여기선 직접 안 씀 — 시그니처만 호환성 위해 유지.
// PHI_MAX는 HEAD_PHI_BANDS(실측 데이터가 있는 범위, 네이프 부근)까지만 —
// 그 아래(목)는 이번엔 안 채움(사용자: "중간이 허공이어도 상관없다").
// 2026-07-14 정리: buildHeadMesh(phi 링)와 buildRealNeckMesh(높이 링)가
// "row(위상/높이) × theta 격자를 사각형당 삼각형 2개로 잇는" 완전히 같은
// 인덱스 수식(권취 방향 포함)을 각자 만들고 있었음 — 정점 좌표 계산과는
// 무관한 순수 정수 인덱스 공식이라 동작 차이 없이 하나로 합침.
function buildRingGridIndices(rowSteps, thetaSteps){
  const indices = [];
  for(let ri=0; ri<rowSteps; ri++){
    for(let ti=0; ti<thetaSteps; ti++){
      const a = ri*(thetaSteps+1)+ti;
      const b = a + (thetaSteps+1);
      const c = a+1;
      const d = b+1;
      indices.push(a,b,c, b,d,c);
    }
  }
  return indices;
}

// ── 실측 단면 기반 목 메쉬 ──
// extractHairMask STEP 1.5의 personMask(사람 전체 실루엣) + computeNeckCrossSections
// 로 뽑은 그 사람 실측 목 단면(높이별 halfWidth/halfDepth)을 써서, 여러 높이
// 링을 쌓아 BufferGeometry로 연결해 짓는다.
// CylinderGeometry는 원형(가로=세로)만 가능해서 폐기 — 목은 보통 좌우 폭과
// 앞뒤 깊이가 다른데(원형이 아님) 이게 바로 실측으로 얻을 수 있는 정보라
// 커스텀 지오메트리로 바꿈.
// 상수의 출처로만 남겨두고(computeNeckCrossSections 최후 폴백 참고), 함수
// 자체는 나중 참고용으로 삭제하지 않음(이 파일의 기존 관례).
function buildRealNeckMesh(skinColor){
  const neckColor = skinColor.clone().multiplyScalar(0.94); // 살짝 어둡게(그림자 자리표시) — buildNeckMesh와 동일
  const neckMat = new THREE.MeshStandardMaterial({ color: neckColor, roughness: 0.85 });

  const RING_STEPS = 8, THETA_STEPS = 24; // THETA_STEPS=24는 예전 CylinderGeometry 세그먼트 수와 동일하게 유지
  const PHI_MAX = HEAD_PHI_BANDS[HEAD_PHI_BANDS.length-1];
  const neckTopY = headPhiToMeshY(PHI_MAX); // 두상 최하단 링과 같은 공식(공용 headPhiToMeshY) → 이음매 없음
  const neckBotY = -1.15; // neckAttachPoint 하단(3단계 의상 정렬 불변식)

  const positions = [];
  // (2026-07-17) "원뿔(전등갓) 목" 수정 — personMask 실측에 어깨/턱이 섞이면
  // 목 단면이 아래로 갈수록 어깨 폭까지 부풀어 원뿔이 됐음. 실측값을 쓰되
  // 두상 대비 해부학적 상한/하한으로 클램프: 폭은 두상 반폭의 22~55%,
  // 깊이는 두상 반깊이의 22~70% 범위 안에서만 허용.
  const headEll = getHeadEllipsoid();
  const headA = headEll.a, headC = headEll.c;
  const clamp = (v,lo,hi)=>Math.min(hi, Math.max(lo, v));
  // ── 이음매 보존 (2026-07-25) ──
  // 상한 0.55*headA / 0.70*headC는 personMask 오탐으로 목이 "챙"처럼 부푸는 걸
  // 막는 장치인데(교훈 D), 목 최상단 링은 정의상 두상 최하단 밴드와 같은 값이라
  // 여기에 상한이 걸리면 이음매가 통째로 잘려 단차가 생긴다.
  // 두상 폭 실측을 personMask로 바로잡으면서 최하단 밴드가 커졌고, 검증 하네스에서
  // 이 단차가 4% → 25%로 악화되는 게 확인됐다(같은 수정이 만든 회귀).
  // → 상한을 "두상 이음매 값보다는 아래로 내려가지 않게" 올린다. 오탐 방지라는
  //   원래 목적(아래쪽 링들이 제멋대로 부푸는 것)은 그대로 유지된다.
  const seam = interpolateHeadCrossSection(PHI_MAX);
  const hiW = Math.max(0.55*headA, seam.halfWidth);
  const hiD = Math.max(0.70*headC, seam.halfDepth);
  for(let ri=0; ri<=RING_STEPS; ri++){
    const t = ri/RING_STEPS;
    const y = neckTopY + t*(neckBotY-neckTopY);
    let { halfWidth, halfDepth } = interpolateNeckCrossSection(y);
    halfWidth = clamp(halfWidth, 0.22*headA, hiW);
    halfDepth = clamp(halfDepth, 0.22*headC, hiD);
    for(let ti=0; ti<=THETA_STEPS; ti++){
      const theta = -Math.PI + (2*Math.PI)*(ti/THETA_STEPS);
      // scalpPointToWorld와 동일한 관례: theta=0에서 z(깊이) 최대, theta=π/2에서 x(폭) 최대
      const x = Math.sin(theta) * halfWidth;
      const z = Math.cos(theta) * halfDepth;
      positions.push(x, y, z);
    }
  }
  const indices = buildRingGridIndices(RING_STEPS, THETA_STEPS); // buildHeadMesh와 동일한 인덱스 패턴(권취 방향도 동일) — 공용 함수로 정리
  // 바닥 캡: 두상 쪽(윗단)은 buildHeadMesh 최하단 링과 y가 같아 맞물리므로
  // 캡 불필요. 아랫단(어깨쪽, neckAttachPoint)은 지금 화면(두상+목 단독
  // 테스트 — 아직 의상이 안 붙음)에서 뻥 뚫린 구멍으로 보이는 것을 막기
  // 위해 중심점 하나를 추가해 부채꼴로 막는다. 3단계에서 의상이 이 위에
  // 씌워지면 이 캡은 안 보이게 됨(문제 없음).
  const bottomCenterIdx = positions.length/3;
  positions.push(0, neckBotY, 0);
  const bottomRingStart = RING_STEPS*(THETA_STEPS+1);
  for(let ti=0; ti<THETA_STEPS; ti++){
    indices.push(bottomRingStart+ti, bottomCenterIdx, bottomRingStart+ti+1);
  }

  const neckGeo = new THREE.BufferGeometry();
  neckGeo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  neckGeo.setIndex(indices);
  neckGeo.computeVertexNormals();
  const neckMesh = new THREE.Mesh(neckGeo, neckMat);
  neckMesh.name = 'neckAttachPoint'; // 3단계에서 의상 메시 정렬 기준점 — buildNeckMesh와 동일한 이름 유지
  return neckMesh;
}

// ── (2026-07-25) 밴드 실측 기반 두상 껍데기 ──
// 사용자 지시: 기준 타원(getHeadEllipsoid)은 헤어·얼굴을 앉힐 "중심 앵커"로만 두고,
// 실제 보이는 두상은 사진에서 실측한 표면을 쓴다. computeHeadCrossSections가 이미
// 높이(phi)별 실측 폭/깊이(넓은 두개골→좁은 턱)를 갖고 있는데, 지금까진 이를 적도
// 한 줄로 뭉쳐 타원 세 숫자(a·b·c)로만 쓰고 정작 그 실루엣으론 안 그렸음 → 그래서
// 좁고 긴 "타조알"이 됐다. 여기서 그 밴드를 높이별 링으로 쌓아 진짜 두상 실루엣을
// 짓는다. 목(buildRealNeckMesh)과 같은 theta 관례(x=sin·폭, z=cos·깊이, front=+Z)와
// 같은 headPhiToMeshY를 써서 최하단 링이 목 최상단(PHI_MAX)과 이음매 없이 맞물린다.
// 위쪽 밴드 폭은 헤어 실루엣이 섞여 넓게 나오지만 그 구역은 어차피 머리카락이 덮으므로
// 문제 없고, 노출되는 아래쪽(턱·목덜미)은 실측대로 좁게 좁혀진다.
function buildBandHeadMesh(headMat){
  const bands = computeHeadCrossSections();
  if(!bands || bands.length < 2 || typeof THREE === 'undefined') return null;
  const shellMat = headMat.clone(); shellMat.side = THREE.DoubleSide; // 권취 방향과 무관하게 보이도록
  const PHI_TOP = HEAD_PHI_BANDS[0];
  const PHI_MAX = HEAD_PHI_BANDS[HEAD_PHI_BANDS.length-1]; // 목 최상단과 동일 phi
  const ell = getHeadEllipsoid(); // 베레모 방지용 상한(헤어는 정의상 이 면 바깥) 기준
  const ROWS = 48, THETA_STEPS = 32;
  const positions = [];
  for(let ri=0; ri<=ROWS; ri++){
    const phi = PHI_TOP + (PHI_MAX - PHI_TOP) * (ri/ROWS);
    const cs = interpolateHeadCrossSection(phi); // {halfWidth, halfDepth} 실측(각도 역투영 복원)
    // 베레모 방지: 이 높이의 기준 타원 반경(a·sinφ, c·sinφ)을 상한으로. 상부(머리카락
    // 폭이 섞여 넓게 나오는 밴드)는 타원 안쪽으로 눌러 헤어 밖으로 못 나가게 하고,
    // 하부(턱·목덜미, 머리카락 거의 없어 실측이 깨끗)는 실측대로 좁게 좁아지게 둔다.
    const s = Math.sin(phi);
    const capW = Math.max(0.02, ell.a * s * 1.05);
    const capD = Math.max(0.02, ell.c * s * 1.05);
    const halfWidth = Math.min(Math.max(0.01, cs.halfWidth), capW);
    const halfDepth = Math.min(Math.max(0.01, cs.halfDepth), capD);
    const y = headPhiToMeshY(phi); // 목과 동일 공식 → 이음매 없음
    for(let ti=0; ti<=THETA_STEPS; ti++){
      const theta = -Math.PI + (2*Math.PI)*(ti/THETA_STEPS);
      positions.push(Math.sin(theta)*halfWidth, y, Math.cos(theta)*halfDepth);
    }
  }
  const indices = buildRingGridIndices(ROWS, THETA_STEPS);
  // 정수리 캡: 최상단 링(ri=0) 위에 apex 한 점(phi=0)으로 부채꼴 마감
  const apexIdx = positions.length/3;
  positions.push(0, headPhiToMeshY(0), 0);
  for(let ti=0; ti<THETA_STEPS; ti++){ indices.push(apexIdx, ti, ti+1); }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();
  const mesh = new THREE.Mesh(geo, shellMat);
  mesh.name = 'skullEllipsoid'; // 반환 headMesh 이름 유지(호출부 호환)
  return mesh;
}

// 절차적 두상: 타원(스케일된 구)으로 두상 근사. getFaceMetrics()가 뽑아낸 실측
// 종횡비/좌표 변환(projector)과 실제 두피색(skinColorCss)을 반영해서 "이 사람
// 사진에서 뽑을 수 있는 정보는 최대한 쓴" 근사치로 만든다. 여전히 진짜 3D
// 스캔은 아니고 절차적 근사(placeholder)라는 성격 자체는 그대로.
// (2026-07-12: 너무 길어서 다루기 힘들다는 지적으로 두상/목/귀/이목구비 4개
// 함수로 분리 — 각 부위 로직 자체는 한 글자도 안 바꾸고 그대로 옮김.)
function buildProceduralHead(faceMetrics, skinColorCss){
  const group = new THREE.Group();
  let skinColor = new THREE.Color(skinColorCss || '#E8C39E');
  // (2026-07-17) "검은 베레모"의 어두운 색 원인 방지: 샘플링된 두피색이
  // 지나치게 어두우면(머리카락 픽셀이 섞여 샘플된 경우) 살구톤으로 폴백 —
  // 두상이 헤어처럼 검게 칠해지는 것을 막음.
  if((skinColor.r + skinColor.g + skinColor.b) / 3 < 0.30) skinColor = new THREE.Color('#E0B294');
  const headMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.85, metalness: 0 });

  // (2026-07-17) "검은 베레모" 수정 — 기존 buildHeadMesh(실루엣 실측 단면
  // 스택)는 상부 단면 실측에 머리카락 실루엣이 섞여 두상 윗부분이 헤어
  // 폭만큼 옆으로 퍼졌음(베레모 모양의 진짜 원인). 두개골 표시는 헤어
  // 가닥·헐이 기준으로 쓰는 것과 동일한 실측 타원체(적도 반폭 a, 세로 b,
  // 반깊이 cD, 중심 y=0.15)로 교체 — 헤어 헐이 정의상 이 면 바깥에 있으므로
  // 두개골이 헤어 밖으로 삐져나올 수 없음. buildHeadMesh 함수 자체는
  // 이 파일 관례대로 참고용으로 남김(호출만 제거).
  // (2026-07-25) 보이는 두상 = 밴드 실측 실루엣(buildBandHeadMesh). 기준 타원은
  // 헤어·얼굴 앵커로만 남기고, 실제 살 껍데기는 높이별 실측 폭/깊이로 짓는다 →
  // 좁고 긴 "타조알"(대칭 타원의 하부 주둥이) 제거, 목과 이음매 없이 연결.
  // 실측 밴드가 없으면(옛 세션 등) 예전 타원 껍데기로 안전 폴백.
  let headMesh = buildBandHeadMesh(headMat);
  if(!headMesh){
    const skull = getHeadEllipsoid();
    headMesh = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), headMat);
    headMesh.scale.set(skull.a, skull.b, skull.c);
    headMesh.position.set(0, 0.15, 0);
    headMesh.name = 'skullEllipsoid';
  }
  group.add(headMesh);

  // 버그 수정(2026-07-14, 계속) → 재추가(같은 날, 실측 목 메쉬로 교체):
  // 실기기 피드백 "목이랑 그 위쪽으로 연결된 부위가 중간에 버티고 있어서
  // 걸린다, 저기에 의지하고 있는 게 없다"를 받고 한 번은 완전히 뺐었음
  // (buildNeckMesh가 고정 반지름 원통이라 "아무 근거 없이 뜬 막대"처럼
  // 보였던 게 진짜 원인 — neckAttachPoint 자체가 문제가 아니라 실측 없는
  // 임의 형태였던 게 문제). 이후 사용자 요청: "목과 잠깐 배제해놓은
  // 안면부위들 3D에 적용해줘" — extractHairMask STEP 1.5(personMask)로
  // 그 사람 실제 목/어깨 실루엣을 재서 buildRealNeckMesh(위, 실측 단면
  // 기반)로 교체 재추가. 이제는 "아무 근거 없이 뜬 막대"가 아니라 그 사람
  // 사진에서 실측한 폭/깊이를 반영한 형태라 다시 붙여도 된다는 판단.
  // buildOutfitPlaceholderMesh 등 나머지 코드는 neckMesh 객체를 직접
  // 참조하지 않고 고정 좌표(y=-1.15)만 쓰므로(코드 전수 확인 완료) 이
  // 교체는 3단계 의상 부착 로직에 영향 없음.
  // ⚠ 정직한 한계: 아직 실기기 재확인 전. personMask 실측이 실패한
  // 경우(bodySegmenter 로드 실패 등) computeNeckCrossSections의 최후
  // 폴백(예전 고정 반지름)으로 자동 전환되므로 최악의 경우에도 예전
  // 수준으로만 돌아갈 뿐 깨지지는 않지만, 실측이 잘 됐을 때와 폴백일 때
  // 시각적 차이가 있는지는 실기기에서 확인 필요.
  const neckMesh = buildRealNeckMesh(skinColor);
  group.add(neckMesh);

  // 버그 수정(2026-07-14): 귀 메쉬 제거 — "얼굴이랑 뒤통수 사이에 살구색
  // 덩어리가 붙어있다"는 실기기 피드백의 정체가 이거였음. buildEarMeshes는
  // 오늘/어제 작업(실측 두상 단면, 얼굴 랜드마크 메쉬)과 무관하게 훨씬 예전
  // (3D 처음 만들 때)부터 있던 코드로, 실측 귀 형태가 아니라 임의로 뭉갠
  // 작은 구 두 개일 뿐이고 Z좌표도 고정값(0.02, 앞뒤 거의 정중앙)이라
  // 위치도 부정확했음. 실측 기반이 아닌 임의 덩어리라 위치를 고치는 대신
  // 제거하는 쪽으로 결정(사용자 승인).
  // buildEarMeshes(widthFactor, heightFactor, projector, lm, headMat).forEach(ear=>group.add(ear));

  // (2026-07-17 정리) 절차적 이목구비(buildFaceDetailGroup)는 씬에 추가되지
  // 않는 그룹을 만들어 visible만 껐다 켜던 완전한 잔재라 함수째 삭제 —
  // 얼굴은 buildRealFaceMesh(실측 468 랜드마크)/buildFacePhotoDecal(폴백)이 담당.
  return { group, headMesh };
}

function loadImageAsync(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// 실측 촬영 사진(state.shots.front) 자체를 두상 앞면에 얇게 띄운 평면에
// 입혀서 "그 사람 얼굴처럼 보이는" 효과를 낸다. 구면에 직접 UV 투영하는
// 진짜 텍스처 매핑은 왜곡·이음새 위험이 커서 채택하지 않음 — 대신 캔버스
// 상에서 destination-in + radial gradient로 가장자리를 페더 처리해 두상
// 피부색과 하드엣지 없이 섞이게 함. 위치/크기는 makeFaceProjector와 동일한
// 실측 기준점(눈/귀/턱)으로 정렬하므로 촬영 각도·얼굴 크기가 달라도 자동
// 정렬됨. 알려진 한계: 평면이라 옆모습으로 회전하면 거의 안 보임(정면
// 전용 효과) — 나중에 진짜 두상 3D 스캔(.glb)으로 바뀌면 이 로직 자체가
// 통째로 필요 없어짐.
/* ── 진짜 3D 얼굴 메쉬(2026-07-13 착수, 같은 날 재작업) ──
   지적: "얼굴이 중요하지" — 지금까지 buildFacePhotoDecal()은 평면 사진 한
   장을 두상 표면에 살짝 띄운 것(그래서 옆에서 보면 거의 안 보임). 실제로는
   MediaPipe가 468개 랜드마크 전부에 x,y,z(깊이)를 주는데 그중 10여 개
   이름 붙은 점만 뽑아 쓰고 나머지는 버리고 있었음. 여기서부터 실제로
   468개 전부와, MediaPipe 공식 삼각형 연결정보(FACE_MESH_TRI_V, 위쪽에서
   canonical_face_model.obj를 직접 받아 파싱)를 써서 그 사람 실제 얼굴
   입체 형태를 반영한 진짜 3D 메쉬를 만든다.
   UV(텍스처 좌표)는 FACE_MESH_UV(캐노니컬 모델 자체의 uv — 표준 "얼굴 펼침"
   참조 텍스처용, 우리처럼 그 사람 실제 사진을 그대로 씌우는 경우엔 안 맞음)
   대신, 각 랜드마크 "자기 자신의 이미지 좌표"를 그대로 UV로 씀.

   ── 재작업(같은 날, 실기기 확인 후) ──
   1차 버전은 깊이(z)를 "고정 상수(Z_BASE) + 실측 굴곡"으로만 계산했는데,
   실기기에서 얼굴 전체가 두상(타원체)에서 한참 동떨어져 붕 뜬 채로 나옴
   — 미세 보정 문제가 아니라 애초에 "두상이 실제로 어디 있는지"와 무관한
   임의의 상수를 썼던 게 근본 원인("추정하지 말고 두상 좌표값을 직접
   비교해서 위치를 잡아라"는 지적).
   해결: buildHeadMesh가 두상을 만드는 실제 수식 — 단위구를
   (0.78·wf, 1·hf, 0.85·wf)로 스케일한 타원체, y로 0.15 이동 — 을 그대로
   가져와서, 각 랜드마크의 실측 (x,y) 위치에서 "그 타원체 표면이 실제로
   어디 있는지"(surfaceZ)를 역산(귀 배치 buildEarMeshes가 이미 같은
   방식으로 표면 반경을 역산하던 것과 동일한 원리, 다만 여기선 X,Y 둘 다
   고려한 완전한 버전). 그 다음 "얼굴을 두상 위에 별도로 얹는" 대신,
   "경계(귀·이마 언저리)에서는 두상 표면에 정확히 붙고, 중심(코 등)으로
   갈수록 실측 굴곡이 살아나게 이어붙이는" 방식으로 재설계 — 사용자 지시:
   "얼굴메쉬와 헤어입체이미지도 결국 조합할 거니, 지금의 타원형 두상
   한 덩어리처럼 취급되게 하라". 경계 필터링에 이미 쓰던 타원(0=중심,
   1=경계)의 거리 제곱을 그대로 블렌드 가중치로 재사용(경계에서 정확히
   0이 되어 두상 표면값과 매끄럽게 이어짐, 새 파라미터 추가 없음):
     surfaceZ(그 점의 실제 두상 표면 위치) + blendWeight(중심=1~경계=0) × reliefZ(실측 굴곡)
   ※ 그래도 남는 한계: reliefZ 자체의 부호/배율(Z_SIGN/Z_DEPTH_SCALE)은
   MediaPipe 공식 문서 기준으로 정한 것이라 브라우저에서 실제로 렌더링해
   봐야 최종 확인 가능. */
async function buildRealFaceMesh(faceMetrics){
  const lm = faceMetrics.lm;
  const src = state.shots && state.shots.front;
  // rawLandmarks가 없으면(폴백 추정 랜드마크 등, 예전 세션 캐시 데이터 포함)
  // 스킵 — 호출부에서 buildFacePhotoDecal로 자동 대체됨(신규 실패 모드 아님).
  if(!src || !lm.rawLandmarks || lm.rawLandmarks.length < 468) return null;

  let img;
  try{ img = await loadImageAsync(src); }
  catch(e){ console.warn('실제 얼굴 메쉬용 이미지 로드 실패:', e); return null; }

  const raw = lm.rawLandmarks;
  const vertCount = 468;
  const projector = faceMetrics.projector;
  const widthFactor = faceMetrics.widthFactor, heightFactor = faceMetrics.heightFactor;

  // 얼굴 메쉬 Z(깊이)는 두상 타원 방정식 ellipsoidZ로 구한다 — getHeadEllipsoid의
  // 반경(a,b,c)을 쓰므로 두상 돔·헤어 투영면과 정확히 같은 표면 위에 얹힌다
  // (얼굴-두피 경계가 어긋나지 않는 이유). 이 방정식은 머리카락 유무와 무관하게
  // 모든 (x,y)에서 정의되므로 턱처럼 실측이 없는 높이에서도 특이값이 안 생긴다.
  // ※ 교훈(좌표 규약 참고): front 얼굴 메쉬에는 실측 회전을 적용하지 않는다 —
  //   두상 시스템 전체가 front를 곧 월드 기준으로 취급하므로, 여기에 회전을
  //   또 걸면 이중 적용이 돼 "코가 목 위 막대기 끝에 매달린" 회귀가 났었다.
    const { a: ELL_A, b: ELL_B, c: ELL_C } = getHeadEllipsoid();
  // 얼굴 전용 타원 폭: 전역 ELL_A는 두상 적도(이 사람은 턱 높이라 좁게 잡힘)에서
  // 나오는데, 얼굴 메쉬는 관자놀이까지 그보다 넓게 퍼진다. ELL_A가 얼굴보다 좁으면
  // 얼굴 바깥 정점이 ellipsoidZ의 "타원 밖(inside>1)" 분기로 빠져 z≈0(평평한 옆벽)이
  // 돼 옆으로 펼쳐진다(실기기 증상). → 얼굴의 실제 최대 폭(아래 pre-pass에서 측정)까지
  // 폭을 넓혀 얼굴이 곡면을 타고 감기게 한다. 전역 두상/스컬/헤어 투영은 그대로 유지.
  let ellAForFace = ELL_A;
  function ellipsoidZ(localX, yLocal){
    const inside = (localX/ellAForFace)*(localX/ellAForFace) + (yLocal/ELL_B)*(yLocal/ELL_B);
    return ELL_C * Math.sqrt(Math.max(0.02, 1 - Math.min(1, inside))); // 완전히 벗어난 점도 살짝의 표면값은 갖게(0 방지)
  }

  // 깊이(z) 굴곡 부호: MediaPipe 공식 문서 기준 "z가 작을수록(더 음수) 카메라에
  // 가까움" — 우리 좌표계는 +Z가 보는 사람 쪽이라 이론상 -1이 맞음. 이전
  // 세션엔 옛 headSurfaceZ 기준 실기기 테스트에서 "코가 함몰돼 보인다"며 1로
  // 뒤집었었는데, 이번엔 그 자리를 ellipsoidZ로 교체한 뒤 실기기에서 정반대로
  // "코가 안으로 들어갔다"는 피드백 — 즉 부호가 맞는 함수가 바뀌었으므로
  // 이론값(-1)으로 되돌림.
  const Z_SIGN = -1;
  const Z_DEPTH_SCALE = 1.0; // 굴곡이 너무 약하거나 세면 조정

  // ── 경계 타원(얼굴 중심~바깥) — 필터링과 블렌드 가중치 둘 다에 재사용 ──
  // 귀·관자놀이처럼 정면 사진에서 옆으로 많이 꺾인 부분은 원근 때문에 아주
  // 좁은 픽셀 폭에 눌려 찍히므로, 잘 찍힌 얼굴 중심부만 메쉬로 살린다.
  const eyeCX = ((lm.features?.leftEye ? (lm.features.leftEye.minX+lm.features.leftEye.maxX)/2 : 0.5)
               + (lm.features?.rightEye ? (lm.features.rightEye.minX+lm.features.rightEye.maxX)/2 : 0.5)) / 2;
  const boundCX = lm.features ? eyeCX : 0.5;
  const boundTopY = (lm.browTopY ?? 0.28) * 0.90;
  const boundBotY = (lm.chinY ?? 0.60) * 1.10;
  const boundCY = (boundTopY + boundBotY) / 2;
  const boundRY = Math.max(0.05, (boundBotY - boundTopY) / 2 * 1.08);
  const boundRX = Math.max(0.05, Math.abs((lm.rEarX ?? 0.78) - (lm.lEarX ?? 0.22)) * 0.56 * 1.08);
  function distSqFromBound(idx){
    const p = raw[idx];
    const dx = (p.x - boundCX) / boundRX, dy = (p.y - boundCY) / boundRY;
    return dx*dx + dy*dy; // 0=정중앙, 1=경계선 위, 1보다 크면 경계 밖
  }
  function inFaceBound(idx){ return distSqFromBound(idx) <= 1; }

  // ── 얼굴 전용 타원 폭 확정 (splay 방지) ──
  // 실제 메쉬에 들어가는(경계 안) 정점들의 localX 최대치를 재서, ELL_A가 그보다
  // 좁으면 얼굴 폭(+3% 여유)까지 넓힌다. 이러면 모든 얼굴 정점이 타원 안(inside≤1)에
  // 들어와 곡면을 타고 감긴다. yLocal도 세로로 벗어나면 같은 옆벽이 생기므로 함께 반영.
  {
    let faceMaxX = 0, faceMaxY = 0;
    for(let i=0;i<vertCount;i++){
      if(!inFaceBound(i)) continue;
      const p = raw[i];
      const lx = Math.abs(projector.toMeshX(p.x));
      const ly = Math.abs(projector.toMeshY(p.y) - 0.15);
      if(lx > faceMaxX) faceMaxX = lx;
      if(ly > faceMaxY) faceMaxY = ly;
    }
    const widened = Math.max(ELL_A, faceMaxX * 1.03);
    console.log('[진단·얼굴폭] ELL_A(두상 적도폭)='+ELL_A.toFixed(3)
      +' | 얼굴 실제 최대폭='+faceMaxX.toFixed(3)
      +' → 얼굴 타원폭='+widened.toFixed(3)
      +(widened>ELL_A+1e-4 ? ' (넓혀서 splay 방지)' : ' (변화 없음)')
      +' | 얼굴 최대세로='+faceMaxY.toFixed(3)+' vs ELL_B='+ELL_B.toFixed(3));
    ellAForFace = widened;
  }

  // ── 좌/우 측면 사진 기반 코/턱/이마 깊이(Z) 실측 보정(2026-07-14 추가) ──
  // 사용자 요청: "측면 사진의 z값등의 정보를 이용해서 안면세부조정하는 기능을
  // 추가해봐" — 이전 세션에 "좌/우 사진으로 깊이 실측 보정(추천)"으로 골라
  // 뒀다가 목/정수리 버그가 우선순위에서 앞서 미뤄뒀던 바로 그 작업.
  // 배경: 위 reliefZLocal(=Z_SIGN*p.z*...)은 front 사진 한 장에서 MediaPipe가
  // 추정한 z값을 쓰는데, 이건 모노큘러(단안) 추정치라 "코가 실제로 얼마나
  // 튀어나왔는지" 같은 절대 돌출량은 원래 부정확하기로 알려져 있음(2D 이미지
  // 한 장만으로는 깊이가 근본적으로 모호함 — 이게 정면 얼굴 사진만으로 깊이를
  // 재는 것의 이론적 한계).
  // 반면 좌/우 측면 사진에서는 다름 — 카메라를 옆에서 보고 있으니 얼굴의
  // 앞뒤 깊이(코가 얼마나 앞으로 나왔는지)가 이미지의 좌우 위치로 "직접"
  // 나타남(정면에서는 안 보이던 정보가 옆에서는 보임). 이 원리는 이미
  // projectImagePointToHead(헤어 가닥 뿌리를 좌/우 실측 회전으로 투영하는,
  // 이미 실기기로 확인된 함수)가 쓰고 있는 것과 동일 — 그 함수를 그대로
  // 재사용해서 "코끝·턱끝·이마" 세 지점(이 파일이 이미 detectFaceLandmarks
  // 에서 nose/chin/forehead로 쓰는 바로 그 랜드마크 인덱스 1/152/10 — 새
  // 인덱스를 추측하지 않고 이미 검증된 것만 사용)의 좌/우 사진 속 실제
  // 위치를 실측 회전으로 월드 좌표까지 투영해서 "실측 Z"를 얻는다.
  // 이 실측 Z와, 지금 이 함수가 정면 사진만으로 그 같은 지점에 매기고 있는
  // Z(=ellipsoidZ+reliefZLocal) 사이의 차이(deltaZ)를 계산해서, 그 지점
  // 주변에만(가우시안 감쇠) 국소적으로 더해준다 — 코 하나만 실측이 어긋나도
  // 얼굴 전체가 아니라 코 주변만 밀리게.
  // ⚠ 정직한 한계: (1) 좌/우 사진 둘 다 없거나 포즈 신뢰도가 낮으면(옆모습이
  // 잘 안 찍혔거나 랜드마크 감지 실패) 그 지점은 조용히 보정을 건너뛰고
  // 기존 방식 그대로 씀 — 실패해도 깨지지 않음. (2) 그림자·안경·헤어 등으로
  // 측면 랜드마크 자체가 부정확할 수 있어, 위 목(neck) 버그 때와 같은
  // 이유로 deltaZ를 ±0.6*ELL_C로 clamp해서 오탐이 코를 스파이크처럼
  // 튀어나오게 만드는 것을 막음. (3) 아직 실기기 재확인 전.
  const PROFILE_DEPTH_ANCHORS = [
    { idx: 1,   label: '코끝' },   // detectFaceLandmarks의 nose=lm[1]과 동일 인덱스
    { idx: 152, label: '턱끝' },   // 〃 chin=lm[152]
    { idx: 10,  label: '이마' },   // 〃 forehead=lm[10]
  ];
  const PROFILE_DEPTH_FALLOFF_SIGMA = 0.18; // 보정 영향 반경(메쉬 로컬 단위) — ELL_A(대략 0.3~0.4)의 절반 수준

  // ── (2026-07-19) 측면 실측 깊이를 얼굴 "전체 정점"으로 확장 ──
  // 사용자 지적: outputFacialTransformationMatrix(실측 회전)를 헤어에는 4장
  // 전부 적용하면서 얼굴은 front 단안 z만 쓰고 측면 실측은 코·턱·이마 3점에만
  // 쓰고 있었음 — "안 쓸 거면 헤어처럼 전체를 같은 방식으로 통합하면 연결부위
  // 문제가 없다". 그 통합의 올바른 형태: front 자체엔 회전을 걸지 않되(막대기
  // 버그 방지 — front는 월드 기준 유지), 깊이(z)만은 465개 나머지 정점도
  // 좌/우 측면 실측(projectImagePointToHead, 헤어와 동일 경로)으로 받아온다.
  // 안전장치는 3앵커 버전과 동일하게 전 정점에 적용:
  //   · 측면 신뢰도<0.5(어림 각도)면 그 뷰 스킵
  //   · 측면 투영이 타원 밖(귀 너머 등)이면 그 정점 스킵(null 반환)
  //   · 좌/우가 크게 어긋나면(오탐) 그 정점 스킵
  //   · deltaZ는 ±0.6*ELL_C로 clamp(스파이크 방지)
  //   · 측면 실측이 없는 정점은 조용히 front 방식 유지(실패해도 안 깨짐)
  // 3앵커 방식(가우시안 확산)과 달리 정점별 직접 실측이라, 실측이 있는
  // 정점은 그 값을 직접 쓰고 없는 정점만 front로 폴백 — 확산 겹침이 없다.
  // 반환: 정점 idx → deltaZ 맵(Float32Array, NaN=측면 실측 없음→front 유지).
  const USE_FULL_PROFILE_DEPTH = true; // 문제 생기면 false로 → 기존 3앵커 방식
  let _fullProfileHitCount = 0; // [진단용] 측면 실측이 실제 적용된 정점 수
  function computeFullProfileDepthMap(){
    const map = new Float32Array(vertCount).fill(NaN);
    const sides = ['left','right'].map(angle=>{
      const lmSide = state.landmarks && state.landmarks[angle];
      if(!lmSide || !lmSide.rawLandmarks || lmSide.rawLandmarks.length < 468) return null;
      if(getViewPoseConfidence(angle) < 0.5) return null;
      return { angle, raw: lmSide.rawLandmarks, confidence: getViewPoseConfidence(angle) };
    }).filter(Boolean);
    if(!sides.length) return map; // 쓸 만한 측면 없음 → 전부 front 폴백

    for(let i=0;i<vertCount;i++){
      const p = raw[i];
      if(distSqFromBound(i) > 1) continue; // 얼굴 경계 밖(뺨 끝·귀)은 front 유지(측면서도 원근으로 뭉개짐)
      const localX = projector.toMeshX(p.x);
      const yLocal = projector.toMeshY(p.y) - 0.15;
      const dx = (p.x - boundCX) / boundRX, dy = (p.y - boundCY) / boundRY;
      const frontBlend = Math.max(0, 1 - (dx*dx+dy*dy));
      const frontEstimatedZ = ellipsoidZ(localX, yLocal) + frontBlend * (Z_SIGN * p.z * projector.bX * Z_DEPTH_SCALE);

      const perView = [];
      for(const s of sides){
        const sidePt = s.raw[i];
        if(!sidePt) continue;
        const world = projectImagePointToHead(s.angle, sidePt.x, sidePt.y, widthFactor, heightFactor);
        if(!world) continue; // 타원 밖 → 이 정점은 이 뷰서 실측 불가
        perView.push({ z: world.z, confidence: s.confidence });
      }
      if(!perView.length) continue; // 측면 실측 없음 → front 유지(NaN)

      if(perView.length === 2){
        const [a,b] = perView;
        const disagree = Math.abs(a.z - b.z) > 1.2*ELL_C || (a.z*b.z < 0 && Math.abs(a.z)>0.15*ELL_C && Math.abs(b.z)>0.15*ELL_C);
        if(disagree) continue; // 좌/우 모순 → 안 믿음
      }
      const wSum = perView.reduce((s,v)=>s+v.confidence, 0);
      const zSum = perView.reduce((s,v)=>s+v.z*v.confidence, 0);
      map[i] = clamp(zSum/wSum - frontEstimatedZ, -0.6*ELL_C, 0.6*ELL_C);
      _fullProfileHitCount++;
    }
    return map;
  }
  function computeProfileDepthCorrections(){
    const out = [];
    PROFILE_DEPTH_ANCHORS.forEach(anchor=>{
      const p = raw[anchor.idx];
      const localX = projector.toMeshX(p.x);
      const yLocal = projector.toMeshY(p.y) - 0.15;
      // 이 지점에 대해 "정면 사진만으로" 원래 매겼을 Z(위 메인 루프와 동일 공식) — 비교 기준.
      const dx = (p.x - boundCX) / boundRX, dy = (p.y - boundCY) / boundRY;
      const frontBlend = Math.max(0, 1 - (dx*dx+dy*dy));
      const frontEstimatedZ = ellipsoidZ(localX, yLocal) + frontBlend * (Z_SIGN * p.z * projector.bX * Z_DEPTH_SCALE);

      // 좌/우 각각의 실측치를 먼저 따로 구해둠(바로 합치지 않음) — 아래 "둘이
      // 서로 크게 어긋나면 신뢰 안 함" 검사를 위해.
      const perView = [];
      ['left','right'].forEach(angle=>{
        const lmSide = state.landmarks && state.landmarks[angle];
        if(!lmSide || !lmSide.rawLandmarks || lmSide.rawLandmarks.length < 468) return;
        const confidence = getViewPoseConfidence(angle);
        if(confidence < 0.5) return; // 실측 PnP 포즈가 확실한 뷰만(어림 각도로는 이 보정에 부적합)
        const sidePt = lmSide.rawLandmarks[anchor.idx];
        const world = projectImagePointToHead(angle, sidePt.x, sidePt.y, widthFactor, heightFactor);
        if(!world) return;
        perView.push({ angle, z: world.z, confidence });
      });
      if(!perView.length) return; // 좌/우 둘 다 없거나 신뢰도 낮음/타원 밖 — 이 지점은 보정 없이 기존 방식 유지

      // 좌/우 둘 다 있는데 서로 부호가 다르거나 크게 어긋나면(한쪽 랜드마크
      // 오탐 등으로 둘이 모순되는 경우) 평균을 내는 게 오히려 둘 다 못 믿는
      // 값을 만들 수 있음 — 이럴 땐 "둘 다 안 믿는다"가 "잘못 합친 값을
      // 믿는다"보다 안전하므로 보정을 건너뛴다(기존 방식 유지).
      if(perView.length === 2){
        const [a,b] = perView;
        const disagree = Math.abs(a.z - b.z) > 1.2*ELL_C || (a.z*b.z < 0 && Math.abs(a.z)>0.15*ELL_C && Math.abs(b.z)>0.15*ELL_C);
        if(disagree) return;
      }

      const wSum = perView.reduce((s,v)=>s+v.confidence, 0);
      const zSum = perView.reduce((s,v)=>s+v.z*v.confidence, 0);
      const realProfileZ = zSum / wSum;
      const deltaZ = clamp(realProfileZ - frontEstimatedZ, -0.6*ELL_C, 0.6*ELL_C);
      out.push({ idx: anchor.idx, localX, yLocal, deltaZ });
    });
    return out;
  }
  const profileDepthCorrections = computeProfileDepthCorrections();
  const fullProfileDepthMap = USE_FULL_PROFILE_DEPTH ? computeFullProfileDepthMap() : null;

  const positions = new Float32Array(vertCount*3);
  const uvs = new Float32Array(vertCount*2);
  for(let i=0;i<vertCount;i++){
    const p = raw[i];
    // localX/yLocal: 두상 중심(0, 0.15, 0) 기준 로컬 좌표(회전 전) — projectImagePointToHead
    // 와 동일하게 "그 뷰가 정면이라고 가정했을 때"의 평면좌표를 먼저 구한다.
    const localX = projector.toMeshX(p.x);
    const yLocal = projector.toMeshY(p.y) - 0.15;
    const surfaceZLocal = ellipsoidZ(localX, yLocal);
    const reliefZLocal = Z_SIGN * p.z * projector.bX * Z_DEPTH_SCALE;
    // 블렌드: 경계(distSq=1)에서 0(=타원 표면값 그대로, 이음새 없이 밀착),
    // 중심(distSq=0)에서 1(=실측 굴곡 전부 반영). 필터링에 쓰는 것과 같은
    // 타원이라 딱 경계선에서 자연스럽게 표면값과 일치함.
    const blendWeight = Math.max(0, 1 - distSqFromBound(i));
    // 좌/우 측면 실측 보정. 전체맵(USE_FULL_PROFILE_DEPTH)에 이 정점의 직접
    // 실측이 있으면 그 값을 그대로 쓰고(정점별 실측 우선), 없으면 기존 3앵커
    // 가우시안 확산으로 폴백 — 확산은 실측이 아예 없던 정점을 코/턱/이마
    // 실측의 "번짐"으로 근사하던 것이므로, 직접 실측이 있으면 확산보다 정확.
    let profileCorrectionZ = 0;
    if(fullProfileDepthMap && !Number.isNaN(fullProfileDepthMap[i])){
      profileCorrectionZ = fullProfileDepthMap[i];
    } else {
      for(let k=0;k<profileDepthCorrections.length;k++){
        const c = profileDepthCorrections[k];
        const ddx = localX - c.localX, ddy = yLocal - c.yLocal;
        const w = Math.exp(-(ddx*ddx+ddy*ddy) / (2*PROFILE_DEPTH_FALLOFF_SIGMA*PROFILE_DEPTH_FALLOFF_SIGMA));
        profileCorrectionZ += w * c.deltaZ;
      }
    }
    const localZ = surfaceZLocal + blendWeight * reliefZLocal + profileCorrectionZ;
    // front는 회전 없이 그대로 월드 좌표로 씀 — 위 되돌림 항목 참고(회전을
    // 걸면 코처럼 튀어나온 점이 지렛대처럼 크게 밀려서 "막대기에 매달린"
    // 모양이 됨. 나머지 두상 시스템도 front 자신의 실측 회전은 쓰지 않음).
    positions[i*3+0] = localX;
    positions[i*3+1] = yLocal + 0.15; // 중심 오프셋 복원
    positions[i*3+2] = localZ;
    uvs[i*2+0] = p.x;
    uvs[i*2+1] = 1 - p.y; // 이미지 y(아래로 증가) → UV v(위로 증가) 반전
  }
  const filteredTriV = [];
  for(let t=0; t<FACE_MESH_TRI_V.length; t+=3){
    const a=FACE_MESH_TRI_V[t], b=FACE_MESH_TRI_V[t+1], c=FACE_MESH_TRI_V[t+2];
    if(inFaceBound(a) && inFaceBound(b) && inFaceBound(c)){
      filteredTriV.push(a,b,c);
    }
  }

  // [진단용] 얼굴 입체감 수치 — 경계 안(inFaceBound) 정점들의 z 범위.
  // 평평하면 zRange가 작고, 입체적이면 큼. 코끝(1)·턱(152)·이마(10) 개별 z도.
  {
    let zMin=Infinity, zMax=-Infinity;
    for(let i=0;i<vertCount;i++){
      if(!inFaceBound(i)) continue;
      const z = positions[i*3+2];
      if(z<zMin) zMin=z; if(z>zMax) zMax=z;
    }
    const zAt = idx => positions[idx*3+2].toFixed(3);
    console.log(`[얼굴 입체감] z범위=${(zMax-zMin).toFixed(3)} (min${zMin.toFixed(3)}~max${zMax.toFixed(3)}) | 코끝=${zAt(1)} 턱=${zAt(152)} 이마=${zAt(10)}`);
    console.log(`[얼굴 측면보정] 전체정점 실측=${USE_FULL_PROFILE_DEPTH ? '켜짐' : '꺼짐(3앵커만)'} | 측면 실측 기여 정점=${_fullProfileHitCount||0}개`);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
  geo.setIndex(new THREE.BufferAttribute(new Uint32Array(filteredTriV), 1));
  geo.computeVertexNormals();

  const MAX_DIM = 1024;
  let dw=img.width, dh=img.height;
  if(Math.max(dw,dh) > MAX_DIM){ const s=MAX_DIM/Math.max(dw,dh); dw=Math.round(dw*s); dh=Math.round(dh*s); }
  const canvas = document.createElement('canvas');
  canvas.width=dw; canvas.height=dh;
  canvas.getContext('2d').drawImage(img,0,0,dw,dh);
  const texture = new THREE.CanvasTexture(canvas);
  texture.needsUpdate = true;

  const mat = new THREE.MeshStandardMaterial({ map: texture, roughness:0.8, metalness:0, side: THREE.DoubleSide });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.name = 'realFaceMesh';
  return mesh;
}

async function buildFacePhotoDecal(faceMetrics){
  const src = state.shots && state.shots.front;
  // 실측 랜드마크 없인 정렬 기준점이 없어 위치가 부정확해짐 — 추정치로
  // 억지로 배치하면 오히려 더 어색해서, 이 경우엔 스킵하고 절차적
  // 이목구비(faceDetailGroup)를 그대로 보여주는 쪽이 낫다고 판단.
  if(!src || !state.landmarks || !state.landmarks.front) return null;

  let img;
  try{ img = await loadImageAsync(src); }
  catch(e){ console.warn('데칼용 이미지 로드 실패:', e); return null; }

  const MAX_DECAL_DIM = 512; // 원본 캡처(최대 1024)보다 작게 — 데칼은 성능보다 정렬이 중요하지 해상도는 이 정도로 충분
  let dw = img.width, dh = img.height;
  if(Math.max(dw,dh) > MAX_DECAL_DIM){ const s = MAX_DECAL_DIM/Math.max(dw,dh); dw=Math.round(dw*s); dh=Math.round(dh*s); }

  const canvas = document.createElement('canvas');
  canvas.width = dw; canvas.height = dh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, dw, dh);

  const lm = faceMetrics.lm;
  if(!lm.features) return null; // features bbox 없으면(폴백 랜드마크) 페더 중심도 못 잡음

  const eyeCX = (
    (lm.features.leftEye.minX + lm.features.leftEye.maxX)/2 +
    (lm.features.rightEye.minX + lm.features.rightEye.maxX)/2
  ) / 2;
  const cx = eyeCX * dw;
  // 세로 범위는 일부러 browTopY(눈썹 위) 아래로만 잡는다 — 그 위(이마~헤어라인)는
  // 앞머리/잔머리가 걸쳐 있을 확률이 높은 영역이라, 거기까지 사진을 그대로 오려
  // 붙이면 실제 사용자 사진에서 이마에 어두운 머리카락 얼룩이 번져 보이는
  // 사고가 나기 쉬움(합성 테스트 이미지로 재현·확인함). 대신 눈썹선을 상단
  // 경계로 고정해 어떤 헤어스타일/앞머리 사진이 와도 항상 안전하게 동작.
  const topY = lm.browTopY * dh;
  const botY = lm.chinY * dh * 1.06; // 턱 아래 살짝 여유
  const cy = (topY + botY) / 2;
  const halfH = (botY - topY) / 2;
  const ry = Math.max(4, halfH * 0.92); // 상단이 browTopY보다 살짝 더 안쪽에 오도록 여유
  const rx = Math.max(4, Math.abs(lm.rEarX - lm.lEarX) * dw * 0.56);

  ctx.globalCompositeOperation = 'destination-in';
  const grad = ctx.createRadialGradient(cx, cy, Math.min(rx,ry)*0.35, cx, cy, Math.max(rx,ry));
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.7, 'rgba(255,255,255,0.9)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // 캔버스 전체(=사진 전체, 배경/어깨/여백 포함)를 그대로 평면 텍스처로 쓰면
  // 두상보다 훨씬 큰 평면이 나옴(사진 속 얼굴이 프레임의 일부만 차지하므로).
  // 페더 타원을 살짝 여유 있게 감싸는 만큼만 잘라내서, 평면 크기가 항상
  // "얼굴 크기"에 비례하게(=두상 크기와 같은 축척으로) 만든다.
  const cropHalfW = rx * 1.05, cropHalfH = ry * 1.15;
  const cropX0 = Math.max(0, cx - cropHalfW), cropY0 = Math.max(0, cy - cropHalfH);
  const cropX1 = Math.min(dw, cx + cropHalfW), cropY1 = Math.min(dh, cy + cropHalfH);
  const cropW = Math.max(1, Math.round(cropX1 - cropX0)), cropH = Math.max(1, Math.round(cropY1 - cropY0));

  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = cropW; faceCanvas.height = cropH;
  faceCanvas.getContext('2d').drawImage(canvas, cropX0, cropY0, cropW, cropH, 0, 0, cropW, cropH);

  const texture = new THREE.CanvasTexture(faceCanvas);
  texture.needsUpdate = true;

  // 두상 로컬 좌표계에서 픽셀당 월드유닛 크기 — 세로 기준점(눈~턱) 아핀변환의
  // 기울기(bY)를 그대로 재사용해 크롭된 얼굴 영역을 두상과 같은 축척으로 배치.
  const worldPerPixel = faceMetrics.projector.bY / dh;
  const planeW = cropW * worldPerPixel;
  const planeH = cropH * worldPerPixel;

  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
  plane.name = 'facePhotoDecal';
  plane.position.set(
    faceMetrics.projector.toMeshX((cropX0+cropX1)/2 / dw),
    faceMetrics.projector.toMeshY((cropY0+cropY1)/2 / dh),
    0.92 * faceMetrics.widthFactor // 두상 표면(최대 0.85*widthFactor)보다 확실히 앞
  );
  return plane;
}

   phi: 정수리(top)=0에서 목쪽으로 갈수록 커지는 극각(라디안). 0=정수리,
   π/2(1.57)=귀 높이(적도), π(3.14)=턱 밑. 대략 0~2.5 사용.
   theta: 정면(+Z 방향)=0 기준 방위각. +/- 로 좌우 대칭, π=정후면.

function measureRowHalfWidth(reasonMask, w, h, row){
  if(row < 0 || row >= h) return null;
  let minX=-1, maxX=-1;
  const base = row*w;

  }
  if(minX < 0) return null;
  return (maxX-minX) / 2 / w;
}

function fillBandsWithNearestNeighbor(bands, distKey, wKeys, dKeys){
  bands.forEach((band, i)=>{
    const hasWidth = band[wKeys.weight] > 0.1;
    const hasDepth = band[dKeys.weight] > 0.1;
    if(hasWidth){ band[wKeys.out] = band[wKeys.sum]/band[wKeys.weight]; }
    if(hasDepth){ band[dKeys.out] = band[dKeys.sum]/band[dKeys.weight]; }
    if(!hasWidth || !hasDepth){
      let nearest = null, nearestDist = Infinity;
      bands.forEach((other, j)=>{
        if(i===j) return;
        const otherHasWidth = other[wKeys.weight] > 0.1;
        const otherHasDepth = other[dKeys.weight] > 0.1;
        if((!hasWidth && !otherHasWidth) && (!hasDepth && !otherHasDepth)) return;
        const dist = Math.abs(other[distKey] - band[distKey]);
        if(dist < nearestDist){ nearestDist = dist; nearest = other; }
      });
      if(nearest){
        if(!hasWidth && nearest[wKeys.weight] > 0.1) band[wKeys.out] = nearest[wKeys.sum]/nearest[wKeys.weight];
        if(!hasDepth && nearest[dKeys.weight] > 0.1) band[dKeys.out] = nearest[dKeys.sum]/nearest[dKeys.weight];
      }
    }
  });
}

// ── 두상 세로 반지름 실측 (2026-07-14 추가) ──
// "기준면 보기" 실기기 확인으로 확정된 문제의 수정: 두상 돔의 세로
// 반지름이 지금까지 고정 상수 1.0이었음(scalpPointToWorld의
// y=cos(phi)*1.0+0.15 → 정수리 y=1.15). 그런데 안면 메쉬·헤어 투영
// 타원체는 둘 다 실측 랜드마크(눈높이 y=0.15, 눈-턱 0.70×hf) 기준이라
// 서로는 맞는데 두상 돔만 위로 솟아 있었음 — 사용자 판독: "헤어
// 기준좌표가 너무 높든지, 안면부가 낮든지 둘 중에 하나" → 실측해보니
// 셋 중 두상 돔(임의 상수 1.0)이 틀린 쪽. 이 상수가 바로 파일 최상단
// 원칙("실제 데이터가 있는데 그럴듯한 숫자를 지어 쓰지 않는다")이
// 금지하는 사례라, 사진에서 그 사람 정수리 높이를 직접 실측한다:
// 각 뷰의 scalpY(컬럼별 헤어 최상단, extractHairMask가 이미 계산해 둔
// 실측값) 중앙 1/3 구간에서 5퍼센타일(노이즈 스파이크 제외한 최상단)을
// 뽑아 그 뷰의 프로젝터로 메쉬 Y로 변환 → 두상 중심(y=0.15)에서의
// 거리 = 세로 반지름. 실측 포즈가 있는 뷰만(신뢰도≥0.5) 가중 평균.
// ⚠ 정직한 한계: scalpY는 "헤어 포함" 최상단이라 두피(두개골)보다 약간
// 높게 잡힘 — 돔이 헤어 두께만큼 커질 수 있지만, 헤어 뿌리가 돔 표면에
// 심기므로 시각적으로는 헤어가 돔을 덮어 자연스럽고, 기존 고정 1.0
// (실측 대비 ~0.3 초과)보다는 훨씬 정확함. 실측이 아예 불가능하면
// (랜드마크 있는 뷰가 하나도 없음) 기존 상수 1.0으로 폴백 — 예전과
// 동일하게 동작(신규 실패 모드 없음).
let _headVerticalRadiusCache = null;
function computeHeadVerticalRadius(){
  if(_headVerticalRadiusCache != null) return _headVerticalRadiusCache;
  const metrics = getFaceMetrics();
  let sum = 0, weight = 0;
  ['front','left','right','back'].forEach(angle=>{
    const maskInf = state.hairMasks && state.hairMasks[angle];
    const lm = state.landmarks && state.landmarks[angle];
    if(!maskInf || !maskInf.scalpY || !lm) return;
    const confidence = getViewPoseConfidence(angle);
    if(confidence < 0.5) return; // 폴백 추정 랜드마크(0.25) 뷰는 오염 방지 위해 제외
    const w = maskInf.w, h = maskInf.h;
    const vals = [];
    for(let x=Math.floor(w/3); x<Math.floor(w*2/3); x++){
      const sY = maskInf.scalpY[x];
      if(sY >= 0) vals.push(sY);
    }
    if(vals.length < 10) return; // 중앙 구간에 유효 실측이 거의 없으면 이 뷰는 스킵
    vals.sort((a,b)=>a-b);
    const topRow = vals[Math.floor(vals.length*0.05)]; // 5퍼센타일 — 한두 픽셀 노이즈 스파이크 배제
    const projector = makeFaceProjector(lm, metrics.widthFactor, metrics.heightFactor);
    const meshYTop = projector.toMeshY(topRow / h);
    const r = meshYTop - 0.15; // 두상 중심(y=0.15)→정수리 거리
    if(!(r > 0.3 && r < 1.6)) return; // 비상식 값(랜드마크 오염 등) 배제
    sum += r*confidence; weight += confidence;
  });
  _headVerticalRadiusCache = (weight > 0.1) ? clamp(sum/weight, 0.5, 1.3) : 1.0;
  return _headVerticalRadiusCache;
}

// ── 두상 기하 단일 출처(2026-07-18 통합) ──────────────────────────────
// 아래 두 함수는 새 로직이 아니라, 파일 곳곳에 글자 그대로 복제돼 있던 식을
// 한 곳으로 모은 것(값·클램프 전부 동일 — 동작 무변경).
//
// getHeadEllipsoid(): 두상 타원 반경(a=폭, b=세로, c=깊이).
//   실측 적도 단면(phi=π/2) + 실측 세로 반지름. 하한 클램프 0.2/0.15는
//   실측이 붕괴해도 지오메트리가 깨지지 않게 하는 안전장치.
//   통합 전 복제 지점 6곳: buildRealNeckMesh(a,c만), buildProceduralHead(두개골
//   타원체), buildRealFaceMesh(ELL_*), projectImagePointToHead,
//   buildStrandProjectionEllipsoidDebug(기준면), buildHairStrandsFromPaths(헐 기준면).
//   ※ 주석에 "projectImagePointToHead와 동일식"이라 적어두고 손으로 맞추던
//     상태였음 — 한 곳만 바뀌면 헤어/얼굴/두상이 서로 다른 두상을 기준으로
//     서게 되는 구조라 통합.
let _headEllipsoidLogged = false;
function getHeadEllipsoid(){
  const eq = interpolateHeadCrossSection(Math.PI/2);
  const a = Math.max(0.2, eq.halfWidth);
  let c = Math.max(0.15, eq.halfDepth);
  // 안전장치: 성인 두상은 앞뒤 깊이가 좌우 폭보다 항상 크다(두형지수 <100 → 깊이≥폭).
  // 측면 실측이 얕거나 없어 깊이가 폭보다 작게(=물리적으로 불가능한 원반) 잡히면
  // 자연스러운 두상 비율(깊이/폭≈1.12)로 복원해 넙덕한 안면부를 방지. 깊이가 이미
  // 폭 이상이면(정상 실측) 손대지 않는다.
  if(c < a){ c = a * 1.12; }
  const ell = { a, b: computeHeadVerticalRadius(), c };
  // [진단용] 두상 넙적도 수치 — 깊이/폭 비율이 핵심. 사람 머리통은 대략
  // 1.1~1.3(깊이가 폭보다 큼). 1.0 미만이면 원반(넙적). 1회만 출력.
  if(!_headEllipsoidLogged){
    _headEllipsoidLogged = true;
    const ratio = ell.c / ell.a;
    const verdict = ratio >= 1.05 ? '정상(깊이>폭)' : ratio >= 0.9 ? '약간 넙적' : '원반(넙적)';
    console.log(`[두상 기준면] 폭(a)=${ell.a.toFixed(3)} 세로(b)=${ell.b.toFixed(3)} 깊이(c)=${ell.c.toFixed(3)} | 깊이/폭=${ratio.toFixed(2)} → ${verdict}`);
    // 폭이 그럴듯한지 즉시 대조할 기준선 — makeFaceProjector가 귀를 ±EAR_MESH_X에
    // 놓고 그 자리가 "적도 반경보다 0.82배 안쪽"이라는 규약을 쓰므로, 적도 반경
    // 기대치는 EAR_MESH_X/0.82다. 이 값과 a가 크게 어긋나면 폭 실측이 틀린 것.
    {
      const expectA = getFaceMetrics().projector.EAR_MESH_X / 0.82;
      const off = ell.a / expectA;
      console.log(`[두상 폭 대조] a=${ell.a.toFixed(3)} vs 랜드마크 기대치=${expectA.toFixed(3)}`
        + ` → 비율 ${off.toFixed(2)}배 ${(off>0.75&&off<1.35)?'✓ 타당':'⚠ 어긋남(폭 실측 의심)'}`);
    }
    const bands = computeHeadCrossSections();
    // 밴드별 값 + 깊이 클램프가 발동했는지(*표시). 클램프가 광범위하게 걸려 있으면
    // 깊이는 실측이 아니라 1.3×폭이라는 뜻 — 폭이 아직 틀렸다는 신호다.
    let clampHit = 0;
    const src = bands.map(b2 => {
      const W = b2.halfWidth||0, D = b2.halfDepth||0;
      const hit = (b2._rawD != null) && (b2._rawD > 1.3*W + 1e-6 || b2._rawD < 0.95*W - 1e-6);
      if(hit) clampHit++;
      return `phi${b2.phi.toFixed(2)}:W${W.toFixed(2)}/D${D.toFixed(2)}${hit?'*':''}`;
    }).join(' ');
    console.log(`[두상 밴드별 실측] ${src}`);
    if(clampHit){
      console.warn(`[두상 깊이 클램프] ${clampHit}/${bands.length} 밴드에서 발동(* 표시)`
        + ` — 이 밴드들의 깊이는 실측이 아니라 폭×1.3 천장값입니다. 폭 실측을 의심하세요.`);
    }
    // 어느 뷰가 실측에 기여했는지 + 어떤 마스크로 쟀는지(제외된 뷰도 표시)
    const contrib = ['front','left','right','back'].map(a=>{
      const c2 = getViewPoseConfidence(a), y = getViewYawDeg(a), t = getViewPoseSource(a).tier;
      return `${a}(yaw${y.toFixed(0)}°,${t},신뢰${c2})`;
    }).join(' ');
    console.log(`[뷰 기여] ${contrib}`);
    if(bands._diag){
      console.log(`[뷰별 관측] ${bands._diag.viewDiag.join(' | ')}`);
      if(bands._diag.stepClamped) console.warn(`[두상 밴드 스파이크] 적도 아래 ${bands._diag.stepClamped}건 제한됨(personMask에 어깨/팔 혼입 의심)`);
    }
    // ── yaw 부호 규약 자가검증 ──
    // 라이브 가이드는 원본(비반전) 프레임을, 파이프라인은 반전 저장 이미지를 본다.
    // 그래서 라이브 yaw는 부호를 뒤집어 저장하는데(_lastLiveYaw), 그 가정이 맞는지
    // 둘 다 있는 뷰에서 직접 확인한다. 어긋나면 여기서 바로 드러난다.
    ['front','left','right','back'].forEach(a=>{
      const lmA = state.landmarks && state.landmarks[a];
      const lv = state.liveYaw && state.liveYaw[a];
      if(lmA && typeof lmA.poseYawDeg === 'number' && typeof lv === 'number' && Math.abs(lv) > 8 && Math.abs(lmA.poseYawDeg) > 8){
        const agree = (lv * lmA.poseYawDeg) > 0;
        console.log(`[진단·yaw부호] ${a}: 라이브(보정후)=${lv.toFixed(0)}° vs 실측=${lmA.poseYawDeg.toFixed(0)}° → ${agree?'부호 일치 ✓':'부호 불일치 ⚠ (라이브 저장 시 부호 반전 규약이 틀림)'}`);
      }
    });
  }
  return ell;
}

// headPhiToMeshY(): phi(두상 로컬 극각) → 메쉬 Y. 두상 돔 표면의 Y공식으로,
//   liftOut은 표면에서 살짝 띄우는 배율(기본 1.01 — 옛 scalpPointToWorld 관례).
//   통합 전 복제 3곳: computeHeadCrossSections(밴드 phi), computeNeckCrossSections
//   (이음매 neckTopY), buildRealNeckMesh(이음매). 개발로그 기록대로 이 공식이
//   서로 어긋나 두상/목 이음매가 벌어진 전례가 있어(2026-07-14) 단일화.
function headPhiToMeshY(phi, liftOut){
  return Math.cos(phi) * computeHeadVerticalRadius() * (liftOut ?? 1.01) + 0.15;
}

// ── 뷰 실측 공통부(2026-07-18 통합) ──────────────────────────────────
// computeHeadCrossSections(reasonMask)와 computeNeckCrossSections(personMask)의
// accumulate()가 글자 그대로 같은 전처리를 각자 갖고 있던 것을 하나로 모음.
// 스킵 조건(마스크/랜드마크 없음, 신뢰도 0.1 미만)까지 동일 — 동작 무변경.
// 반환 null = 이 뷰는 스킵. maskField로 어느 실측 마스크를 쓸지만 구분.
function prepareViewMeasurement(angle, maskField, metrics){
  const maskInf = state.hairMasks && state.hairMasks[angle];
  // (2026-07-25) 랜드마크 없는 뷰를 통째로 버리지 않는다.
  // 실기기 로그: 우측(완전 옆모습)·후면은 얼굴이 안 잡히는 게 정상인데, 여기서
  // lm이 null이라 return null → 두 뷰가 두상 실측에서 제외되고 폭은 front 하나,
  // 깊이는 left 하나로만 만들어지고 있었다. projectImagePointToHead는 이미
  // computeSilhouetteAnchors(그 사진에서 정수리·귀높이 폭을 직접 실측)로 같은
  // 상황을 처리하고 있었으므로, 같은 폴백을 여기에도 연결해 비대칭을 없앤다.
  // ※ getEstimatedLandmarks는 쓰지 않는다 — 사진과 무관한 고정 상수라 모든 사람이
  //   같은 두상이 되고, 파일 상단 anti-fabrication 원칙에 정면으로 어긋난다.
  const lm = (state.landmarks && state.landmarks[angle]) || computeSilhouetteAnchors(angle);
  if(!maskInf || !maskInf[maskField] || !lm) return null;
  const confidence = getViewPoseConfidence(angle);
  if(confidence < 0.1) return null;
  const projector = makeFaceProjector(lm, metrics.widthFactor, metrics.heightFactor);
  return {
    mask: maskInf[maskField], confidence, projector,
    w: maskInf.maskW, h: maskInf.maskH,
    aY: projector.toMeshY(0), // toMeshY(v)=aY-bY*v 이므로 v=0일 때 aY
  };
}

// 메쉬 Y → 이 뷰의 이미지 행(row). 위 prepareViewMeasurement의 결과를 받는다.
// (통합 전 3곳에서 같은 역변환식을 복제: 두상 밴드·목 기준행·목 밴드)
function meshYToRow(view, meshY){
  return Math.round(((view.aY - meshY) / view.projector.bY) * view.h);
}

// 4개 뷰 누적 순서 — 정면/후면은 폭(width), 좌/우측은 깊이(depth) 측정.
// 두 CrossSections 함수가 같은 4줄을 복제하던 것을 공용화(순서·인자 동일).
function accumulateAllViews(accumulate){
  accumulate('front', true);
  accumulate('back', true);
  accumulate('left', false);
  accumulate('right', false);
}

function computeHeadCrossSections(){
  if(_headCrossSectionCache) return _headCrossSectionCache;
  const metrics = getFaceMetrics();
  // 모든 뷰에 공통으로 쓸 "정규화폭→메쉬단위" 배율 — 정면 기준 하나로 통일.
  // (좌/우측 프로필 사진은 귀 간격 개념 자체가 불안정해서, 뷰마다 따로
  // 배율을 뽑으면 오히려 불안정해짐 — 정면 배율을 공통으로 재사용)
  const globalScaleX = metrics.projector.bX;

  // (2026-07-19) 각도 역투영으로 교체 — 넙적한 원반 두상의 근본 수정.
  // 기존: 정면/후면 실루엣 반폭을 halfWidth로, 좌/우 실루엣 반폭을 halfDepth로
  // "그대로" 기록했음. 그런데 측면 사진은 완전 옆모습(90°)이 아니라 실측
  // 25~31°(이 앱은 90°면 랜드마크 인식이 실패해 경사 촬영이 정상 — 교훈 E).
  // 이 각도에선 실루엣 반폭 E에 깊이(D)보다 폭(W) 성분이 더 많이 섞여 보여
  // (E²=W²cos²θ+D²sin²θ, 25°면 cos²≈0.82), E를 순수 깊이로 쓰면 실제 깊이가
  // 15~17% 얕게 나옴 → 폭은 정상·깊이만 과소 = 넙적한 원반.
  // 수정: 헤어 헐(buildHairStrandsFromPaths)이 이미 검증한 역투영을 그대로
  // 이식 — 각 밴드에서 관측(E, cos²θ, sin²θ)들을 모아 E²=W²cos²θ+D²sin²θ를
  // 풀어 실제 W·D를 복원한다. front(θ≈0)는 W를, 측면(θ≈25~31°)은 그 관측이
  // W·D 복원에 함께 기여.
  const bands = HEAD_PHI_BANDS.map(phi=>({ phi, obs:[] }));
  // 깊이/폭 비율 초기 가정(성인 두상 근사) — 1차 W 추정 및 측면 실측 없는 밴드의 폴백.
  // ※ 예전엔 0.82였는데 이는 두형지수(폭/깊이)를 깊이/폭 자리에 뒤집어 넣은 버그였다.
  //   사람 머리는 앞뒤 깊이가 좌우 폭보다 크다(깊이/폭 ≈ 1.2~1.28) → 폴백이 깊이를
  //   폭의 82%로 줄여 원반(넙덕한 안면부)이 됐음. 두형지수 82의 역수 1.22로 정정.
  const rHead = 1.22;

  // ── (2026-07-25) 측정 소스 교체: 헤어 실루엣 → 사람 실루엣 ──
  // 근본 원인이었던 부분. reasonMask는 "머리카락"이라 헤어라인 아래에서는 잴 게
  // 없고(extractHairMask가 얼굴 영역을 의도적으로 지우기까지 한다), 그 결과
  // 적도(눈높이) 밴드가 0에 수렴해 두상이 허리에서 잘록해졌다. 실기기 로그:
  // 적도 폭 0.305 vs 랜드마크로 잰 실제 얼굴 폭 0.768 — 2.5배 어긋남.
  // personMask(사람 전체 실루엣)는 눈높이에서 귀를 포함한 진짜 머리 폭을,
  // 측면에서는 뒤통수~코끝의 진짜 앞뒤 깊이를 준다.
  // ⚠ 정직한 한계: 귀·코가 실루엣에 포함돼 5~10% 부풀 수 있고, 긴 머리는
  //   여전히 과대측정된다(personMask는 머리카락도 "사람"으로 잡으므로).
  //   personMask가 없는 뷰(바디 세그멘터 실패)는 기존 reasonMask로 폴백한다.
  const viewDiag = [];
  function accumulate(angle){
    let view = prepareViewMeasurement(angle, 'personMask', metrics);
    let src = 'person';
    if(!view){ view = prepareViewMeasurement(angle, 'reasonMask', metrics); src = 'hair(폴백)'; }
    if(!view){ viewDiag.push(`${angle}:제외`); return; }
    const yaw = getViewYawDeg(angle) * Math.PI/180;
    const cos2 = Math.cos(yaw)**2, sin2 = Math.sin(yaw)**2;
    let n = 0, eqE = null;
    bands.forEach(band=>{
      const row = meshYToRow(view, headPhiToMeshY(band.phi));
      const halfWNorm = measureRowHalfWidth(view.mask, view.w, view.h, row);
      if(halfWNorm == null) return;
      const E = halfWNorm * globalScaleX;
      band.obs.push({ E, cos2, sin2, confidence: view.confidence, angle });
      n++;
      if(Math.abs(band.phi - Math.PI/2) < 0.12) eqE = E; // 적도 근처 관측(진단용)
    });
    viewDiag.push(`${angle}[${src}] yaw${(getViewYawDeg(angle)).toFixed(0)}° cos²${cos2.toFixed(2)}`
      + ` 신뢰${view.confidence} 밴드${n}개` + (eqE!=null?` 적도E=${eqE.toFixed(2)}`:''));
  }
  // 4개 뷰 전부 같은 방식으로 관측만 모음(폭/깊이 분리 안 함 — 각도가 결정)
  ['front','back','left','right'].forEach(a=>accumulate(a));

  // 관측(E,θ) → 단면(W,D) 역투영:
  //   W(폭)  — 정면성 높은 관측(cos²>0.9, front/back)은 E≈W이므로 직접 평균.
  //            (측면 관측까지 넣어 rHead 가정으로 W를 추정하면 그 가정 오차가
  //             W를 오염시키고, 그게 다시 D 역산에 전파됨 — 검증에서 확인.)
  //   D(깊이) — 그 정확한 W로 측면성 충분한 관측(sin²θ>0.06)에서
  //            D²=(E²−W²cos²θ)/sin²θ 역산. [0.5W,1.5W] 클램프(사람 두상 깊이가
  //            폭의 절반 밑/1.5배 위로는 잘 안 감 + 작은 sinθ 노이즈 억제).
  //   정면 관측이 없으면(측면만) rHead 가정으로 W 추정 폴백.
  //   측면 관측이 없으면 D=W×rHead 폴백.
  // 검증(합성, 정답 W0.72/D0.90을 front0.2°+좌31°+우-25°로 촬영→복원):
  //   복원 W0.720 D0.900 비율1.25 = 정답 정확히 일치.
  bands.forEach(band=>{
    if(!band.obs.length) return;
    const frontObs = band.obs.filter(o=>o.cos2 > 0.9);
    let W;
    if(frontObs.length){
      let wa=0, ww=0; frontObs.forEach(o=>{ wa+=o.E*o.confidence; ww+=o.confidence; });
      W = wa/ww;
    } else {
      let wa=0, ww=0; band.obs.forEach(o=>{ wa+=(o.E/Math.sqrt(o.cos2+rHead*rHead*o.sin2))*o.confidence; ww+=o.confidence; });
      W = wa/ww;
    }
    let dAcc=0, dW=0;
    band.obs.forEach(o=>{
      if(o.sin2 <= 0.06) return;
      const d2 = (o.E*o.E - W*W*o.cos2) / o.sin2;
      if(d2 > 0){ dAcc += Math.sqrt(d2)*o.confidence; dW += o.confidence; }
    });
    band.halfWidth = W;
    // [진단용] 깊이 클램프가 실제로 발동했는지. 실기기 로그에서 거의 전 밴드가
    // D/W=1.30(천장)에 붙어 있었는데, 그건 "깊이가 실측됐다"가 아니라 "폭이 틀려서
    // 역산이 폭발했고 클램프가 눌렀다"는 뜻이었다. 그걸 모르면 로그의
    // "정상(깊이>폭)" 판정에 계속 속는다.
    band._rawD = dW ? dAcc/dW : null;
    // 깊이 클램프: 얕은 측면 각도(이 앱은 25°가 정상)에서 D²=(E²−W²cos²)/sin²의
    // sin²로 나누는 항이 깊이를 폭발시킨다(실측 D가 폭의 1.5배까지 튐). 사람 두상
    // 깊이/폭은 두형지수상 대략 1.0~1.3 → 이 범위로 좁혀 얕은 각도발 과대평가를 억제.
    band.halfDepth = dW ? Math.max(0.95*W, Math.min(1.3*W, dAcc/dW)) : W * rHead;
  });

  // 실측 없는 밴드는 phi 최근접 실측 밴드에서 승계(기존 정책 유지 —
  // 임의 상수가 아니라 그 사람에게서 잰 가장 가까운 값).
  for(let i=0;i<bands.length;i++){
    if(typeof bands[i].halfWidth === 'number') continue;
    let nearest = null, nd = Infinity;
    for(let j=0;j<bands.length;j++){
      if(typeof bands[j].halfWidth !== 'number') continue;
      const d = Math.abs(bands[j].phi - bands[i].phi);
      if(d < nd){ nd = d; nearest = bands[j]; }
    }
    if(nearest){ bands[i].halfWidth = nearest.halfWidth; bands[i].halfDepth = nearest.halfDepth; }
  }
  // 그래도 못 채운 밴드(실측 전무)만 최후 안전장치로 직전 밴드 이어받음.
  for(let i=0;i<bands.length;i++){
    if(typeof bands[i].halfWidth !== 'number') bands[i].halfWidth = (i>0 ? bands[i-1].halfWidth : 0.7);
    if(typeof bands[i].halfDepth !== 'number') bands[i].halfDepth = (i>0 ? bands[i-1].halfDepth : 0.6);
  }
  // 밴드 간 이동평균 2회(마스크 노이즈 완화 — 헤어 헐과 동일)
  for(let pass=0; pass<2; pass++){
    for(let i=1;i<bands.length-1;i++){
      bands[i].halfWidth = (bands[i-1].halfWidth + 2*bands[i].halfWidth + bands[i+1].halfWidth)/4;
      bands[i].halfDepth = (bands[i-1].halfDepth + 2*bands[i].halfDepth + bands[i+1].halfDepth)/4;
    }
  }

  // ── 적도 아래 스파이크 방지 (2026-07-25, 교훈 D 재발 방지) ──
  // personMask는 사람 전체 실루엣이라 아래쪽 밴드에서 어깨·팔·옷이 섞여 들어오면
  // 폭이 갑자기 튄다. 목에서 이미 같은 함정을 밟아 "좁은 목 위 넓은 챙" 원반이
  // 나왔고(NECK_STEP_MAX로 대응), 두상엔 그 보호가 없었다.
  // 해부학적 근거: 머리 최대 폭은 귀 높이(적도) 근처이고 그 아래(턱·네이프)로는
  // 좁아진다 → 적도 아래 밴드는 바로 위 밴드보다 넓어질 수 없다. 귀가 살짝
  // 튀어나온 것만 허용하도록 5% 여유를 준다.
  // ※ 적도 위(정수리 쪽)에는 적용하지 않는다 — 극점에서 적도로 갈수록 폭이
  //   빠르게 커지는 게 정상이라, 같은 제한을 걸면 진짜 실측을 눌러버린다.
  const HEAD_STEP_DOWN_MAX = 1.05;
  let stepClamped = 0;
  for(let i=1;i<bands.length;i++){
    if(bands[i].phi <= Math.PI/2) continue; // 적도 위는 그대로
    const capW = bands[i-1].halfWidth * HEAD_STEP_DOWN_MAX;
    const capD = bands[i-1].halfDepth * HEAD_STEP_DOWN_MAX;
    if(bands[i].halfWidth > capW){ bands[i].halfWidth = capW; stepClamped++; }
    if(bands[i].halfDepth > capD){ bands[i].halfDepth = capD; stepClamped++; }
  }

  bands._diag = { viewDiag, stepClamped };
  _headCrossSectionCache = bands;
  return bands;
}

// 2026-07-14 정리: interpolateHeadCrossSection(phi, 오름차순)과
// interpolateNeckCrossSection(meshY, 내림차순)이 "밴드 배열에서 pos가
// 속하는 인접 두 밴드를 찾아 halfWidth/halfDepth를 선형보간, 범위 밖이면
// 양 끝단 clamp"라는 완전히 같은 로직을 정렬 방향만 다르게 반복하고
// 있었음. t=(pos-a)/(b-a) 공식은 a,b의 대소관계와 무관하게(오름차순이든
// 내림차순이든) 항상 올바른 보간 비율을 주므로 — 예전 목 버전의
// t=(yHi-meshY)/(yHi-yLo)와 대수적으로 동일(분자분모에 -1을 곱한 것과
// 같음, 손으로 검산 후 Node로도 재검증) — 방향 분기 없이 하나로 합침.
function interpolateBands(bands, posKey, pos){
  const first = bands[0], last = bands[bands.length-1];
  const ascending = first[posKey] <= last[posKey];
  if(ascending ? (pos <= first[posKey]) : (pos >= first[posKey])) return first;
  if(ascending ? (pos >= last[posKey]) : (pos <= last[posKey])) return last;
  for(let i=0; i<bands.length-1; i++){
    const a = bands[i][posKey], b = bands[i+1][posKey];
    if((pos - a) * (pos - b) <= 0){
      const t = (pos - a) / ((b - a) || 0.0001);
      return {
        halfWidth: bands[i].halfWidth*(1-t) + bands[i+1].halfWidth*t,
        halfDepth: bands[i].halfDepth*(1-t) + bands[i+1].halfDepth*t,
      };
    }
  }
  return last;
}

// phi가 측정 밴드 사이 값이면 인접 밴드끼리 선형보간
function interpolateHeadCrossSection(phi){
  return interpolateBands(computeHeadCrossSections(), 'phi', phi);
}

/* ── 목 실측 단면(2026-07-14 추가, 같은 날 스케일 버그로 재작업) ──
   사용자 지시: "목과 잠깐 배제해놓은 안면부위들 3D에 적용해줘" — 위
   extractHairMask STEP 1.5에서 헤어 마스크와 별개로 뽑아둔 personMask
   (사람 전체 실루엣)를 써서 목의 실측 단면을 만든다.
   두상은 SCALP_ZONES라는 기존 구역 경계가 있어서 그 phiRange 값을 그대로
   밴드로 재사용했지만, 목에는 그런 기존 구역이 없어서 0~1 균등 5분할을
   기본 선택으로 씀(임의 상수라기보단 "측정 지점을 어디로 할지"의 선택).

   ── 재작업: "정면과 측면헤어가 튀어나와있는데" 때와는 다른, 새로운 버그 ──
   실기기 스크린샷: 목이 두상보다 훨씬 넓은 납작한 원반(UFO 모자챙) 모양으로
   나옴. 원인: 처음 버전은 computeHeadCrossSections를 그대로 베껴서
   globalScaleX = metrics.projector.bX(귀 간격 기준 이미지→메쉬 배율)로
   personMask 반폭을 메쉬 단위로 변환했음 — 그런데 이 배율은 "얼굴 크기와
   비슷한 크기의 것(머리카락 실루엣)을 재는 경우"에만 유효함. 어깨는 얼굴보다
   훨씬 넓어서(카메라에 얼굴이 꽉 차게 찍히는 이 앱 촬영 습관까지 겹치면
   어깨가 이미지 폭의 상당 부분을 차지) 같은 배율을 그대로 곱하면 몇 배씩
   부풀려짐 — 실제로 그렇게 나왔음. "얼굴 스케일로 보정된 배율을 얼굴과
   전혀 다른 크기의 대상에 그대로 쓴 것"이 근본 원인.
   수정: 절대 스케일 변환(globalScaleX)을 완전히 버리고, "두상 최하단(목
   맨 위, neckTopY) 대비 이 높이가 몇 배 넓은가"라는 스케일 독립적 비율만
   personMask에서 뽑는다. 이 비율에 곱하는 기준값(anchor)은 이미 실측
   검증된 값 — interpolateHeadCrossSection(PHI_MAX)(두상 최하단 밴드의
   실측 halfWidth/halfDepth, buildHeadMesh가 실제로 쓰는 바로 그 값)를
   그대로 씀. 같은 이미지·같은 측정 방식으로 "기준점 대비 비율"만 뽑으면
   위에서 터진 것 같은 절대 배율 오차가 계산 자체에서 나타날 수 없음(비가
   같은 배율 오차를 분자분모에서 상쇄하므로) — 두상은 실측 그대로, 목은
   두상 대비 상대적으로 얼마나 넓어지는지만 personMask에서 가져오는 구조.
   추가 안전장치: 그래도 그림자·옷 등으로 personMask가 튈 수 있으니
   0.7~3.0배 범위로 clamp(성인 어깨 실측 통계상 두상 대비 3배를 넘는 경우는
   거의 없고, 0.7배 미만은 목이 두상보다 좁다는 뜻이라 명백한 오탐). */
const NECK_HEIGHT_FRACS = [0, 0.25, 0.5, 0.75, 1.0]; // 0=두상 최하단(이음매), 1=neckAttachPoint 하단(어깨선)
const NECK_RATIO_MIN = 0.7, NECK_RATIO_MAX = 3.0; // 두상 대비 목/어깨 폭·깊이 비율의 정직한 안전 범위

let _neckCrossSectionCache = null;
function computeNeckCrossSections(){
  if(_neckCrossSectionCache) return _neckCrossSectionCache;
  const metrics = getFaceMetrics();
  const PHI_MAX = HEAD_PHI_BANDS[HEAD_PHI_BANDS.length-1];
  const neckTopY = headPhiToMeshY(PHI_MAX); // 두상 최하단 링과 같은 공식(공용 headPhiToMeshY) → 이음매 없이 맞물림
  const neckBotY = -1.15; // neckAttachPoint 하단 — 3단계 의상 정렬 불변식(outfitTorsoPlaceholder 상단과 동일)

  // 이음매 기준값 — 두상 시스템이 이미 실측·검증해둔 값을 그대로 가져다 씀
  // (새로 측정하지 않음 — "데이터가 있는데 추측하지 말라" 원칙).
  const headEdge = interpolateHeadCrossSection(PHI_MAX);
  const anchorHalfWidth = headEdge.halfWidth;
  const anchorHalfDepth = headEdge.halfDepth;

  const bands = NECK_HEIGHT_FRACS.map(frac=>({
    frac,
    meshY: neckTopY + frac*(neckBotY-neckTopY),
    widthRatioSum:0, widthRatioWeight:0, depthRatioSum:0, depthRatioWeight:0
  }));

  function accumulate(angle, isWidthMeasurement){
    // personMask 없으면(바디 세그멘터 실패 등) prepareViewMeasurement가 null → 스킵
    const view = prepareViewMeasurement(angle, 'personMask', metrics);
    if(!view) return;

    // 이 뷰(angle)에서 "두상 최하단(neckTopY)" 위치의 사람 실루엣 반폭을
    // 기준(raw, 정규화 이미지 단위)으로 잡는다 — 절대 변환 없이, 아래
    // 각 밴드의 raw값과의 "비율"만 신뢰한다(같은 이미지·같은 측정
    // 방식이라 배율 오차가 분자분모에서 상쇄됨).
    const anchorRawNorm = measureRowHalfWidth(view.mask, view.w, view.h, meshYToRow(view, neckTopY));
    if(anchorRawNorm == null || anchorRawNorm < 0.01) return; // 기준점 자체가 없으면 이 뷰는 비율 계산 불가 → 스킵

    bands.forEach(band=>{
      const rawNorm = measureRowHalfWidth(view.mask, view.w, view.h, meshYToRow(view, band.meshY));
      if(rawNorm == null) return;
      const ratio = rawNorm / anchorRawNorm; // 두상 하단 대비 이 높이가 몇 배 넓은지(스케일 독립적)
      if(isWidthMeasurement){ band.widthRatioSum += ratio*view.confidence; band.widthRatioWeight += view.confidence; }
      else { band.depthRatioSum += ratio*view.confidence; band.depthRatioWeight += view.confidence; }
    });
  }
