function buildStyleGrid(){
  const grid=document.getElementById('styleGrid');
  grid.innerHTML='';

  // ── "스타일 미적용" 특수 카드 ──
  // 프리셋을 하나도 안 고르고, 실제 촬영된 결(원본)을 조정화면에서 바로
  // 직접 만지고 싶을 때. selectStyle()의 예전 ROADMAP 메모("스타일 미적용
  // 직접편집 정식 모드로 승격")를 실제로 구현한 것 — 각 섹션을 자기 기본값
  // (SECTIONS[id].defaults)으로, 전역 컬은 0(원본 결방향만 따라가도록)으로
  // 초기화하고 바로 조정화면으로 넘어갈 수 있게 함.
  const noneCard=document.createElement('div');
  noneCard.className='style-card style-card-none'; noneCard.id='style-none';
  noneCard.onclick=()=>selectNoStyle();
  noneCard.innerHTML=`
    <div class="style-icon-box" style="display:flex;align-items:center;justify-content:center;font-size:28px;opacity:0.6;">✂️</div>
    <div class="name">스타일 미적용</div>
    <div class="tags">결원본 직접 조정</div>`;
  grid.appendChild(noneCard);

  STYLES.forEach(st=>{
    const card=document.createElement('div');
    card.className='style-card'; card.id='style-'+st.id;
    card.onclick=()=>selectStyle(st.id);
    card.innerHTML=`
      <div class="style-icon-box">${styleIconSVG(st)}</div>
      <div class="name">${st.name}</div>
      <div class="tags">${st.tags}</div>
      <div class="ai-rec">★ AI 추천</div>`;
    grid.appendChild(card);
  });
}
function styleIconSVG(st){
  let s=''; const n=14;
  for(let i=0;i<n;i++){
    const t=i/(n-1), x=20+t*60;
    const amp=(st.curl/100)*14, len=16+(st.length/100)*50;
    const mx=x+Math.sin(t*6)*amp, ex=x+Math.sin(t*6+1)*amp*1.3;
    s+=`<path d="M ${x} 16 Q ${mx} ${16+len*0.5} ${ex} ${16+len}" stroke="${st.colorHex}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>`;
  }
  return `<svg viewBox="0 0 100 90" width="100%" height="100%"><circle cx="50" cy="12" r="9" fill="#3A332B"/>${s}</svg>`;
}
function selectStyle(id){
  state.selectedStyle=STYLES.find(s=>s.id===id);
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('style-'+id).classList.add('selected');
  document.getElementById('toAdjustBtn').disabled=false;
  const st = state.selectedStyle;

  if(st.sections){
    // ── 커스텀 등록 스타일("현재 모델을 스타일로 등록하기"로 만든 것) ──
    // length/curl/volume 대표값에서 섹션별로 역산하는 기존 방식 대신,
    // 등록 당시 실제 섹션별 조정값을 그대로 복원한다(그래서 등록한 그
    // 모습 그대로 다시 불러와짐).
    SECTION_ORDER.forEach(sid=>{
      if(st.sections[sid]){
        // 예전(gyeol 이식 전)에 저장된 커스텀 스타일 하위호환: 누락된 신규 필드는
        // 해당 섹션 기본값으로 채워서 UI/렌더가 깨지지 않게 함.
        state.sections[sid] = { ...SECTIONS[sid].defaults, ...st.sections[sid] };
      }
    });
    if(st.styling) state.styling = { ...neutralStyling(), ...st.styling };
    state._globalCurl = (typeof st.globalCurl === 'number') ? st.globalCurl : 30;
  } else {
    // ── 기본 프리셋: length/curl/volume 대표값에서 섹션별 값 파생 ──
    // volume(0~100, STYLES 프리셋 정의값) → elevation(0~90°) 환산해서 사용.
    const elevFromVolume = Math.round((st.volume/100) * 90);
    // gyeol 이식 후 컬은 섹션별 절대값(0~100) — 프리셋 대표 curl을 전 섹션에 균일 적용.
    const presetCurl = Math.max(0, Math.min(100, st.curl));
    state.sections.crown.length     = st.length;
    state.sections.crown.elevation  = elevFromVolume;
    state.sections.crown.curl       = presetCurl;
    state.sections.front.length     = Math.round(st.length * 0.85); // 앞머리는 약간 짧게
    state.sections.front.line       = 50;
    state.sections.front.curl       = presetCurl;
    state.sections.temple.length    = Math.round(st.length * 0.80);
    state.sections.temple.overdirection = 50;
    state.sections.temple.curl      = presetCurl;
    state.sections.side.length      = Math.round(st.length * 0.90);
    state.sections.side.elevation   = st.curl > 40 ? 35 : 18; // 컬 강한 스타일일수록 사이드도 시술각↑(레이어감)
    state.sections.side.curl        = presetCurl;
    state.sections.occipital.length = st.length;
    state.sections.occipital.elevation = elevFromVolume;
    state.sections.occipital.curl   = presetCurl;
    state.sections.nape.length      = Math.round(st.length * 0.60);
    state.sections.nape.line        = 50;
    state.sections.nape.curl        = presetCurl;
    state._globalCurl = st.curl;
  }
  syncSliderUI();
}

// "스타일 미적용" — 프리셋 없이 결원본을 바로 조정화면에서 직접 만짐.
// 각 섹션을 자기 기본값(SECTIONS[id].defaults)으로, 전역 컬은 0으로
// 초기화해서 실제 촬영된 결방향만 그대로 따라가는 상태에서 시작하게 함.
function selectNoStyle(){
  state.selectedStyle = null;
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('selected'));
  const noneCard = document.getElementById('style-none');
  if(noneCard) noneCard.classList.add('selected');
  document.getElementById('toAdjustBtn').disabled = false;
  resetSections();       // 섹션별 기본값으로 리셋
  state._globalCurl = 0; // 하위호환 플래그
  // "원본 결" 취지: 펌 없이 실측 결방향만 따라가도록 전 섹션 컬을 0으로.
  SECTION_ORDER.forEach(id=>{ state.sections[id].curl = 0; });
  syncSliderUI();
}
loadCustomStylesFromStorage(); // 이전 세션에 등록해둔 커스텀 스타일 복원 — 반드시 buildStyleGrid()보다 먼저 실행돼야 함
buildStyleGrid();

/* ════════════════════════════════════════
   SECTION UI
════════════════════════════════════════ */
const PARAM_LABELS = {
  length:'길이', line:'커팅라인', elevation:'엘리베이션(시술각)', overdirection:'크라운 연동비율',
  // 아래 3개는 새 파라미터로 교체되기 전 이름 — 예전에 저장된 커스텀 스타일
  // (localStorage)이 혹시 이 이름으로 된 섹션 데이터를 갖고 있어도 라벨이
  // 깨지지 않도록 유지(하위 호환, 화면에 나올 일은 거의 없음).
  volume:'볼륨', blend:'연결감', layer:'레이어',
};

// gyeol 패널의 특정 섹션 파라미터 UI(값 라벨 + 슬라이더 위치)를 state와 동기화.
// 연동(propagateSectionChange)으로 "지금 안 만지고 있는" 섹션 값이 바뀌었을 때 사용.
function syncGyParamUI(secId, key){
  const v = state.sections[secId][key];
  const unit = GY_UNIT[key] || '';
  const valEl = document.getElementById(`gyval-${secId}-${key}`);
  if(valEl) valEl.textContent = Math.round(v) + unit;
  const rangeEl = document.getElementById(`gyrange-${secId}-${key}`);
  if(rangeEl) rangeEl.value = v;
}

function propagateSectionChange(secId, param, delta){
  // ── 래칫(누적 수렴) 버그 수정(2026-07-22) ──
  // 예전엔 "절대값 가중평균"(temple = temple×(1-r) + crown×r)을 슬라이더 input
  // 이벤트마다 반복 적용했음. 드래그 한 번에 이벤트가 수십 번 발생하므로 매
  // 틱마다 블렌딩이 중첩돼, 드래그가 끝나면 연동 섹션이 원래 값과 무관하게
  // 크라운/사이드 값에 거의 수렴해버림 — "사이드만 조정했는데 뒤(후두부)까지
  // 전부 움직인다"의 두 번째 원인. → "변화량(delta)×연동비율"만 더하는 방식으로
  // 변경: 이벤트가 몇 번 쪼개져 오든 합산 결과는 (총 변화량×비율)로 동일해서
  // 드래그 속도/횟수에 영향을 받지 않는다. 값은 반올림 없이 실수로 누적하고
  // 표시할 때만 반올림(1틱 delta=1처럼 작은 변화가 반올림에 먹히지 않도록).
  if(typeof delta !== 'number' || delta === 0) return;
  if(secId==='crown' && param==='length'){
    // 크라운 연동비율(Overdirection): 0%=독립적 ~ 100%=크라운 변화를 그대로 따라감
    const linkRatio = state.sections.temple.overdirection / 100; // 0~1
    if(linkRatio > 0){
      state.sections.temple.length = Math.round(Math.max(0, Math.min(100,
        state.sections.temple.length + delta * linkRatio)) * 1000) / 1000; // FP 잔재만 제거(0.001 스냅)
      syncGyParamUI('temple', 'length');
      updateSectionSummary('temple');
    }
  }
  // side 길이 변경 시 occipital에 변화량의 30% 반영(측면↔후면 연결 자연스럽게)
  if(secId==='side' && param==='length'){
    state.sections.occipital.length = Math.round(Math.max(0, Math.min(100,
      state.sections.occipital.length + delta * 0.3)) * 1000) / 1000; // FP 잔재만 제거(0.001 스냅)
    syncGyParamUI('occipital', 'length');
    updateSectionSummary('occipital');
  }
}

function updateSectionSummary(id){
  const el = document.getElementById('sectab-summary-'+id);
  if(!el) return;
  const vals = state.sections[id];
  const sec = SECTIONS[id];
  el.textContent = sec.params.map(p=>{
    const unit = (sec.paramMeta && sec.paramMeta[p] && sec.paramMeta[p].unit) || '';
    // 연동값은 실수로 누적되므로 표시할 때만 반올림
    const v = (typeof vals[p]==='number') ? Math.round(vals[p]) : vals[p];
    return `${PARAM_LABELS[p]||p} ${v}${unit}`;
  }).join(' · ');
}

function resetSections(){
  SECTION_ORDER.forEach(id=>{ state.sections[id] = {...SECTIONS[id].defaults}; });
  state.styling = neutralStyling();
  state._globalCurl = 30;
  buildGyPanel();
  drawAdjustPreview();
}

// (10차) 3D 조정 엔진 토글 — 3D=원본, 2D=투영 구조의 표시 경로 on/off.
// ON 시 정규 3D 모델(state.hair3D)이 없으면 buildHairStrandsFromPaths로 1회 생성
// (현재 캡처된 가닥을 리프트). 이후 renderFrame이 그 모델을 현재 뷰로 되쏜다.
function toggle3DAdjust(){
  state.use3DAdjust = !state.use3DAdjust;
  const btn = document.getElementById('btn3dEngine');
  if(btn) btn.textContent = '3D 조정 엔진 β: ' + (state.use3DAdjust ? 'ON' : 'OFF');
  if(state.use3DAdjust){
    showDevMini3D(true);              // 미니뷰 패널 표시(초기화)
    // 중립 3D 모델 생성(1회) → 미니뷰 + 조정창 메인(투영) 갱신. 이미 있으면 재사용.
    if(state.hair3Dneutral){ refreshDevMini3D(); drawAdjustPreview(); }
    else buildNeutralHair3D(()=>{ refreshDevMini3D(); drawAdjustPreview(); }); // 준비되면 메인도 투영 전환
  } else {
    showDevMini3D(false);
    drawAdjustPreview();             // 2D 직접 렌더로 복귀
  }
}

/* ════════════════════════════════════════════════════════════════
   gyeol 2D 설계 패널 빌더 (조정 화면)
   섹션칩 → 커트/펌/컬러 공정그룹 + 스타일링 마무리 탭.
   상태는 index의 state.sections / state.styling 을 직접 읽고 쓴다.
   변경 시 drawAdjustPreview()로 실측 세그 렌더를 즉시 갱신.
   ════════════════════════════════════════════════════════════════ */
function buildGyPanel(){ buildGySectionBar(); buildGyControls(); }

function buildGySectionBar(){
  const bar = document.getElementById('gySectionBar');
  if(!bar) return;
  bar.innerHTML = '';
  SECTION_ORDER.forEach(id=>{
    const sec = SECTIONS[id];
    const b = document.createElement('button');
    b.className = 'gy-chip' + (state.activePanelSection===id ? ' active' : '');
    const visHere = sec.visibleIn.includes(state.currentViewAngle);
    const dim = visHere ? '' : ' style="opacity:.55"';
    b.innerHTML = `<span${dim}>${sec.label}</span><span class="en">${sec.labelEn}</span>`;
    b.onclick = ()=> selectGySection(id);
    bar.appendChild(b);
  });
  // 스타일링(마무리) 칩 — 섹션과 별개인 머리 전체 연출
  const sb = document.createElement('button');
  sb.className = 'gy-chip styling' + (state.activePanelSection==='styling' ? ' active' : '');
  sb.innerHTML = `스타일링<span class="en">FINISH</span>`;
  sb.onclick = ()=> selectGySection('styling');
  bar.appendChild(sb);
}

function selectGySection(id){
  state.activePanelSection = id;
  if(id !== 'styling'){
    state.currentSection = id; // 하위호환(음성 등에서 참조)
    // 해당 섹션이 안 보이는 뷰면, 잘 보이는 뷰로 자동 전환
    const visIn = SECTIONS[id].visibleIn;
    if(!visIn.includes(state.currentViewAngle)){
      state.currentViewAngle = visIn[0];
      renderAngleSwitches();
      updateSegStatus();
    }
  }
  buildGyPanel();
  drawAdjustPreview();
}

// 섹션 슬라이더 공통 핸들러 — length는 섹션/뷰 연동(propagate)까지 수행.
function onGySlider(secId, key, val){
  const num = parseInt(val, 10);
  // 연동(propagate)이 "변화량" 기반이 되도록 이전 값을 먼저 확보(래칫 버그 수정)
  const prev = (typeof state.sections[secId][key] === 'number') ? state.sections[secId][key] : num;
  state.sections[secId][key] = num;
  const valEl = document.getElementById(`gyval-${secId}-${key}`);
  if(valEl){
    const unit = GY_UNIT[key] || '';
    valEl.textContent = num + unit;
  }
  if(key === 'length'){
    propagateSectionChange(secId, 'length', num - prev); // 크라운→템플 등 flat 연동(렌더가 읽음) — 델타 기반
    // propagateSectionToViews(뷰별 값 블렌딩) 제거: state.sections[angle][sectionId](뷰별
    // 중첩)에 쓰던 값을 렌더러는 안 읽어(flat state.sections[secId]만 읽음) 사실상 죽은
    // 계산이었고, 섹션 값이 flat 하나라 모든 뷰의 해당 섹션 가닥에 자동 적용된다(=뷰 간
    // 일관성은 flat 모델이 이미 보장). 뒷단계 3D 조정도 "섹션 하나=값 하나"라 불필요.
  }
  // [진단용] 조정이 실제로 상태에 기록되고 렌더가 재요청되는지 추적. rawMode가 true면
  // 모든 섹션 값이 중립화돼 조정이 화면에 안 나타남 → 이 로그로 즉시 판별.
  // (2026-07-22) 슬라이더 틱마다 찍혀 콘솔이 넘치던 것 → 상세 모드에서만 출력.
  if(window.DIAG_VERBOSE) console.log('[진단·조정] '+secId+'.'+key+'='+num+' | 저장확인='+state.sections[secId][key]+' | rawMode='+state.debugShowRaw+' | 현재화면='+currentScreen);
  drawAdjustPreview();
}
const GY_UNIT = { length:'%', elevation:'°', texture:'%', curl:'%', wave:'%' };

// 커트기법 변경
function onGyTechnique(secId, tech){
  state.sections[secId].technique = tech;
  buildGyControls(); // hint 갱신
  drawAdjustPreview();
}

// 섹션별 컬러 토글/선택
function onGyColorToggle(secId){
  const cur = state.sections[secId].color;
  state.sections[secId].color = (cur === null || cur === undefined)
    ? (state.globalColor || '#6B4A2E') : null;
  buildGyControls();
  drawAdjustPreview();
}
function onGyColorPick(secId, hex){
  state.sections[secId].color = hex;
  buildGyControls();
  drawAdjustPreview();
}

// 공정그룹 접힘 토글
function toggleGyGroup(gid){
  state.panelCollapsed[gid] = !state.panelCollapsed[gid];
  buildGyControls();
}

// ── 페이드/테이퍼(클리퍼) — gyeol 구성에는 없지만 실 시술 기법이라 커트 계열
//    섹션(템플·사이드·후두부·네이프)에서 선택적 그룹으로 유지. state.fade는 전역. ──
const GY_FADE_SECTIONS = { temple:1, side:1, occipital:1, nape:1 };
function onGyFadeToggle(){
  state.fade.enabled = !state.fade.enabled;
  buildGyControls();
  drawAdjustPreview();
}
function onGyFadeSlider(param, val){
  const num = parseInt(val, 10);
  state.fade[param] = num;
  const el = document.getElementById('gyfade-'+param);
  if(el) el.textContent = num + (param==='guard' ? '' : '%');
  drawAdjustPreview();
}

// 스타일링(마무리) 슬라이더
function onGyStyling(key, val){
  const num = parseInt(val, 10);
  state.styling[key] = num;
  const el = document.getElementById(`gyst-${key}`);
  if(el){
    const pm = GYEOL_STYLING_PARAMS.find(p=>p.key===key);
    el.textContent = (num>0 && pm && pm.min<0 ? '+' : '') + num;
  }
  drawAdjustPreview();
}

// ── gyeol 컨트롤 하위 빌더들 ──
// buildGyControls가 너무 길어(스타일링탭+커트/펌/컬러 그룹+페이드+안내를 한 함수에서 다 처리)
// 재사용/가독성이 나빠, 각 조각을 "요소를 반환하는" 순수 빌더로 분리. 반환 요소를
// buildGyControls가 같은 순서로 append하므로 생성되는 DOM은 이전과 완전히 동일하다.

// 단일 슬라이더 컨트롤(.gy-ctrl) — 커트/펌 파라미터 공용.
function gyBuildRangeCtrl(secId, pm, hint){
  const sec = state.sections[secId];
  const cur = (typeof sec[pm.key] === 'number') ? sec[pm.key] : 0;
  const c = document.createElement('div'); c.className = 'gy-ctrl';
  // input에 id 부여(gyrange-…): 연동(propagateSectionChange)이 다른 섹션 값을
  // 바꿨을 때 syncGyParamUI가 슬라이더 위치까지 동기화할 수 있게 함.
  c.innerHTML = `<div class="gy-ctrl-top">
            <span><span class="gy-ctrl-label">${pm.label}</span><span class="gy-ctrl-hint">${hint}</span></span>
            <span class="gy-ctrl-val" id="gyval-${secId}-${pm.key}">${Math.round(cur)}${pm.unit}</span>
          </div>
          <input type="range" min="${pm.min}" max="${pm.max}" value="${cur}" id="gyrange-${secId}-${pm.key}"
            oninput="onGySlider('${secId}','${pm.key}',this.value)">`;
  return c;
}

// 커트 방식(기법) 선택 드롭다운 — 커트 그룹 맨 위.
function gyBuildTechniqueSelect(secId, sec){
  if(!sec.technique || !TECHNIQUES[sec.technique]) sec.technique = 'uniform';
  const tw = document.createElement('div'); tw.className = 'gy-ctrl';
  let opts = '';
  Object.keys(TECHNIQUES).forEach(k=>{
    opts += `<option value="${k}" ${sec.technique===k?'selected':''}>${TECHNIQUES[k].label}</option>`;
  });
  tw.innerHTML = `<div class="gy-ctrl-top">
            <span><span class="gy-ctrl-label">커트 방식</span><span class="gy-ctrl-hint">${TECHNIQUES[sec.technique].hint}</span></span>
          </div>
          <select class="gy-select">${opts}</select>`;
  const selEl = tw.querySelector('select');
  selEl.onchange = ()=> onGyTechnique(secId, selEl.value);
  return tw;
}

// 컬러 그룹 본문(발레아쥬 토글 + 스와치)을 body에 채운다.
function gyBuildColorBody(body, secId, sec){
  const on = sec.color !== null && sec.color !== undefined;
  const t = document.createElement('div'); t.className = 'gy-toggle-row';
  t.innerHTML = `<div class="gy-toggle ${on?'on':''}"></div>
        <span class="gy-ctrl-hint">이 섹션만 다른 색 적용 (발레아쥬 등)</span>`;
  t.querySelector('.gy-toggle').onclick = ()=> onGyColorToggle(secId);
  body.appendChild(t);
  if(on){
    const sw = document.createElement('div'); sw.className = 'gy-swatches';
    GYEOL_COLORS.forEach(c=>{
      const s = document.createElement('div');
      s.className = 'gy-sw' + (sec.color===c ? ' active' : '');
      s.style.background = c;
      s.onclick = ()=> onGyColorPick(secId, c);
      sw.appendChild(s);
    });
    body.appendChild(sw);
  }
}

// 공정 그룹(커트/펌/컬러) 하나를 통째로 만든다(헤드 + 본문).
function gyBuildProcessGroup(grp, secId, sec){
  const collapsed = !!state.panelCollapsed[grp.id];
  const g = document.createElement('div');
  g.className = 'gy-group' + (grp.optional ? ' optional' : '') + (collapsed ? ' collapsed' : '');

  const head = document.createElement('div');
  head.className = 'gy-group-head';
  head.innerHTML = `<span class="gy-dot" style="background:${grp.color}"></span>
      <span class="gy-group-title" style="color:${grp.color}">${grp.title}</span>
      <span class="gy-group-sub">${grp.sub}</span>
      <span class="gy-chevron">▼</span>`;
  head.onclick = ()=> toggleGyGroup(grp.id);
  g.appendChild(head);

  const body = document.createElement('div');
  body.className = 'gy-group-body';

  if(grp.id === 'color'){
    gyBuildColorBody(body, secId, sec);
  } else {
    if(grp.id === 'cut') body.appendChild(gyBuildTechniqueSelect(secId, sec));
    grp.params.forEach(pm=>{
      const hint = (grp.id==='cut' && pm.key==='elevation') ? '시술각(기법 강도 스케일)' : pm.hint;
      body.appendChild(gyBuildRangeCtrl(secId, pm, hint));
    });
  }
  g.appendChild(body);
  return g;
}

// 페이드/테이퍼(클리퍼) 그룹 — 커트 계열 섹션에서만 호출. 전역 state.fade 조작.
function gyBuildFadeGroup(secId){
  const on = !!state.fade.enabled;
  const fg = document.createElement('div');
  fg.className = 'gy-group optional';

/* ── 현재 조정 상태를 새 스타일로 등록 ──
   "조정을 다 마친 결과물이 그 자체로 하나의 스타일이 될 수도 있다"는 요청.
   기존 STYLES 프리셋은 length/curl/volume 대표값 하나로 6개 섹션 값을
   역산해서 만드는 구조라, 그 방식으로는 지금까지 세밀하게 만진 섹션별
   조정(예: 프론트만 짧게, 네이프는 테이퍼 등)이 다 뭉개짐. 그래서 커스텀
   등록 스타일은 st.sections(섹션별 값 전체 스냅샷)를 따로 갖고, selectStyle()
   이 st.sections 존재 여부로 두 방식을 분기해서 처리(위 selectStyle 참고).
   localStorage에 저장해서 새로고침/재방문해도 등록한 스타일이 남아있게 함
   (이 파일은 사용자가 직접 배포하는 정적 사이트라 클로드 아티팩트의
   localStorage 금지 규정과 무관 — 일반 웹사이트라 브라우저 저장소 사용 가능). */
function registerCurrentAsStyle(){
  const name = prompt('이 스타일 이름을 입력하세요 (예: "오늘 손님 스타일")', '');
  if(!name || !name.trim()) return; // 취소 또는 빈 입력이면 등록 안 함
  const newStyle = {
    id: 'custom-' + Date.now(),
    name: name.trim(),
    tags: '커스텀',
    isCustom: true,
    sections: JSON.parse(JSON.stringify(state.sections)), // 섹션별 값 전체 깊은 복사
    styling: JSON.parse(JSON.stringify(state.styling)),    // gyeol 스타일링(마무리) 스냅샷
    globalCurl: state._globalCurl,
    // 아래 3개는 스타일 카드 아이콘(styleIconSVG)이 참조하는 대표값 —
    // 실제 렌더링은 sections를 그대로 쓰지만, 그리드에서의 미리보기 아이콘용으로 채워둠.
    // volume은 이제 elevation(0~90°) 기반이라 0~100 스케일로 환산해서 채움.
    length: state.sections.crown.length,
    curl: state._globalCurl,
    volume: Math.round(((state.sections.crown.elevation ?? 45) / 90) * 100),
    colorHex: (state.selectedStyle && state.selectedStyle.colorHex)
      || (state.hairMasks.front && state.hairMasks.front.avgColor)
      || '#2A1B12',
  };
  STYLES.push(newStyle);
  saveCustomStylesToStorage();
  buildStyleGrid();
  showToast(`"${newStyle.name}" 스타일로 등록했어요`);
}

function saveCustomStylesToStorage(){
  try{
    const customs = STYLES.filter(s=>s.isCustom);
    localStorage.setItem('gyeol_customStyles', JSON.stringify(customs));
  }catch(e){ console.warn('커스텀 스타일 저장 실패(용량 초과 등):', e); }
}
function loadCustomStylesFromStorage(){
  try{
    const raw = localStorage.getItem('gyeol_customStyles');
    if(!raw) return;
    const customs = JSON.parse(raw);
    if(Array.isArray(customs)){
      customs.forEach(c=>{
        if(c && c.id && !STYLES.find(s=>s.id===c.id)) STYLES.push(c);
      });
    }
  }catch(e){ console.warn('커스텀 스타일 불러오기 실패:', e); }
}

/* ════════════════════════════════════════
   RENDER / CANVAS
   - 이미지 캐시로 매번 new Image() 방지
   - hairCanvas 없으면 SVG 선 오버레이로 폴백
════════════════════════════════════════ */
const imgCache = {}; // angle → HTMLImageElement (loaded)

function getCachedImg(angle, cb){
  const url = state.shots[angle];
  if(!url){ cb(null); return; }
  if(imgCache[angle] && imgCache[angle].src.endsWith(url.slice(-20))){
    cb(imgCache[angle]); return;
  }
  const img = new Image();
  img.onload = ()=>{ imgCache[angle]=img; cb(img); };
  img.onerror = ()=>cb(null);
  img.src = url;
}

function drawImgOnCanvas(ctx, img, w, h){
  const {dw,dh,dx,dy} = computeFit(img.width, img.height, w, h);
  ctx.drawImage(img,dx,dy,dw,dh);
  return {dw,dh,dx,dy};
}

// fit 계산만 하고 실제로 그리지는 않음 (베이스를 원본 대신 baseC로 바로 그릴 때 사용)
function computeFit(imgW, imgH, w, h){
  const ir=imgW/imgH, cr=w/h;
  let dw,dh,dx,dy;
  if(ir>cr){dh=h;dw=h*ir;dx=(w-dw)/2;dy=0;}
  else{dw=w;dh=w/ir;dx=0;dy=(h-dh)/2;}
  return {dw,dh,dx,dy};
}

// 2D 렌더 캔버스의 devicePixelRatio 배율(2026-07-14 추가).
// (2026-07-16 변경) 그리기 해상도를 기기 dpr에 따라 흔들리게 두지 않고
// 가로 1200px 고정으로 통일 — 사용자 결정: "입력 해상도랑 그리기 해상도
// 다 1200으로". 분석 입력 해상도(extractHairMask maxDim=1200)와 동일 값이라
// 읽기·그리기 해상도가 어떤 기기에서든 항상 1:1로 일치함.
// (이전엔 rect.width×dpr(상한 3)이라 데스크톱(dpr1)에선 CSS 폭 그대로,
// 폰(dpr3)에서만 ~1200이 되는 기기 의존 동작이었음.)
// 실기기에서 무거우면 DRAW_RES와 maxDim을 800으로 함께 내리는 것이 폴백.
const DRAW_RES = 1200; // 2D 렌더 캔버스 목표 가로 해상도(px) — 분석 maxDim과 반드시 함께 움직일 것

function syncCanvasSize(canvas){
  const rect=canvas.getBoundingClientRect();
  // 백킹스토어를 CSS 크기와 무관하게 가로 DRAW_RES(1200px) 고정, 세로는
  // 표시 종횡비 유지. 좌표·fit·resScale이 전부 canvas.width 기준이라
  // 자동으로 따라오고, 표시 크기는 CSS가 고정하므로 레이아웃 불변.
  if(rect.width>0&&rect.height>0){
    canvas.width=DRAW_RES;
    canvas.height=Math.round(rect.height*(DRAW_RES/rect.width));
  }
}

// 핵심 상태값을 화면에 텍스트로 그대로 찍어줌. 여기서 확인할 것:
// (1) faceLandmarkerReady가 false면 refineSectionBoundaries가 아예 안 돌고

// (2) 뷰 바꿔가며 눌러보면 currentViewAngle과 crown.yRange[1](두정선 y)이
//     실제로 그 뷰마다 다른 값으로 바뀌는지 바로 보임 — 안 바뀌면 그게 버그.
// (3) 이마 중앙(0.5, 0.30)과 귀 옆(0.1, 0.45) 두 지점을 resolveSectionId로

}
function toggleDiagInfo(){
  const box = document.getElementById('diagInfoBox');

  box.style.display = show ? 'block' : 'none';
  if(!show) return;
  const angle = state.currentViewAngle;

  // renderFrame과 동일하게 지금 보고 있는 뷰 기준으로 다시 계산 — 이 진단창에
  // 보이는 값이 실제 렌더링에 쓰이는 값과 항상 일치하게 함(스테일 값 방지).
  if(typeof faceLandmarkerReady !== 'undefined' && faceLandmarkerReady && lm){
    refineSectionBoundaries(angle);
  }
  let lines = [];
  lines.push('angle: ' + angle);

  lines.push('landmarks[' + angle + '] 존재: ' + (!!lm));
  if(lm){
    lines.push('  earY=' + lm.earY + ' foreheadY=' + lm.foreheadY + ' chinY=' + lm.chinY);
  }

  SECTION_ORDER.forEach(id=>{
    const s = SECTIONS[id];
    lines.push('  ' + id + ': y[' + s.yRange.map(v=>v.toFixed(3)).join(',') + '] x[' + s.xRange.map(v=>v.toFixed(3)).join(',') + ']');
  });
  lines.push('');
  lines.push('resolveSectionId 테스트:');
  lines.push('  이마중앙(0.50,0.30) -> ' + resolveSectionId(angle, 0.50, 0.30));
  lines.push('  귀옆(0.10,0.45) -> ' + resolveSectionId(angle, 0.10, 0.45));
  lines.push('  정수리(0.50,0.10) -> ' + resolveSectionId(angle, 0.50, 0.10));
  lines.push('  목선(0.50,0.90) -> ' + resolveSectionId(angle, 0.50, 0.90));
  box.textContent = lines.join('\n');
}

// 결필드 원본을 가공 없이 그리는 디버그 오버레이.
// maskInf.orientation은 buildColumnOrientationSamples가 만든 컬럼별 샘플
// (컬럼당 최대 12개, 마스크가 있는 y구간에 걸쳐 분포)이며 좌표계는
// maskInf.maskW × maskInf.maskH (결방향 계산 당시의 축소 해상도) 기준.
// coherence를 색상으로 매핑(빨강=낮음/신뢰 안 됨 → 초록=높음/뚜렷함)해서
// strand 시뮬레이션이 어떤 원본 데이터를 근거로 방향을 정하는지,
// 특히 낮은 coherence 구간이 실제로 어떻게 나오는지를 그대로 보여준다.
function drawOrientationFieldDebug(ctx, fit, maskInf){
  const colSamples = maskInf.orientation;
  if(!colSamples) return;
  const fw = maskInf.maskW, fh = maskInf.maskH;
  if(!fw || !fh) return;
  const toX = ix => fit.dx + (ix/fw) * fit.dw;
  const toY = iy => fit.dy + (iy/fh) * fit.dh;
  // 선분 길이: 컬럼 간격(스킵 간격 포함) 대비 살짝 겹치는 정도로 — 너무 길면
  // 이웃 컬럼끼리 뭉개지고, 너무 짧으면 방향이 안 보임.
  const colSkip = 2; // 컬럼 2개당 1개씩만 그려서 과밀 방지
  const halfLen = Math.max(2, (fit.dw / fw) * colSkip * 1.1);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, (fit.dw / fw) * 0.9);
  for(let x=0; x<fw; x += colSkip){
    const col = colSamples[x];
    if(!col || col.length===0) continue;
    for(const s of col){
      const cx = toX(x), cy = toY(s.y);
      const dx = Math.cos(s.angle) * halfLen;
      const dy = Math.sin(s.angle) * halfLen;
      const coh = Math.max(0, Math.min(1, s.coherence));
      // coherence 낮음(0)=빨강 ~ 높음(1)=초록. 숨기지 않고 그대로 다 그림 — 낮은
      // coherence 구간이 어떻게 생겼는지 확인하는 게 이 디버그 뷰의 목적이므로
      // 알파를 coherence에 비례시켜 흐릿하게 만들지 않는다.
      ctx.strokeStyle = `hsl(${coh*120}, 90%, 55%)`;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(cx-dx, cy-dy);
      ctx.lineTo(cx+dx, cy+dy);
      ctx.stroke();
    }
  }
  ctx.restore();
}

// 가닥 렌더 유효 컬럼 수(두피선이 잡힌 컬럼 개수) — 세그멘테이션 성공 여부 판정용.
// renderFrame과 captureStrandPathsFor 두 곳에서 동일하게 쓰이던 계산을 통합.
function countValidCols(scalpY){
  let n = 0;
  for(let i=0;i<scalpY.length;i++){ if(scalpY[i] >= 0) n++; }
  return n;
}

// drawHairStrands에 넘길 opts 객체 생성 — renderFrame(화면)과 captureStrandPathsFor(3D 캡처)
// 두 곳에서 색상/섹션/결방향/캡처 옵션 구성이 글자 그대로 중복돼 있던 것을 하나로 통합.
// rawMode(원본 결 보기)일 때만 컬·섹션·스타일링·색을 중립화. 비-raw면 두 호출부가 완전히
// 동일한 opts를 만든다(예전엔 capture가 styling을 생략하고 drawHairStrands 폴백에 의존했는데,
// 그 폴백값이 state.styling이라 결과가 같음 → 여기서 명시적으로 넘겨도 동작 동일).
function buildStrandOpts(maskInf, angle, rawMode){
  const { curl, volume, thickness } = rawMode
    ? { curl:0, volume:50, thickness:50 }
    : state.sliders[angle];
  const sections = rawMode
    // length뿐 아니라 line/layer도 중립값으로 덮어씀 — front.line/nape.line/side.layer 효과가
    // "원본 결 보기"(모든 스타일링 무력화가 목적)에 새어 들어가지 않도록. blend는 렌더링에
    // 직접 관여하지 않는 파라미터(propagateSectionChange 전용)라 안 건드려도 무방.
    // gyeol 신규 파라미터도 중립화: technique=uniform(층 분포 없음), curl0(스트레이트),
    // texture0(끝단 트림 없음). color는 raw 모드에서 무시(avgColor 사용)되도록 null.
    // (5차) 길이 중립값 변경: 배율 기준점이 "섹션 기본값=원본"으로 바뀌어서(lengthRatioFor
    // 참고), 원본 결 보기의 중립 길이도 50 고정이 아니라 각 섹션의 기본값이어야 ratio=1.
    ? Object.fromEntries(Object.entries(state.sections).map(([id,s])=>[id, {...s,
        length: (SECTIONS[id] && SECTIONS[id].defaults && typeof SECTIONS[id].defaults.length==='number') ? SECTIONS[id].defaults.length : 50,
        line:50, layer:0, technique:'uniform', curl:0, texture:0, color:null}]))
    : state.sections;
  return {
    curl, volume, thickness,
    // gyeol 스타일링(전역 마무리) — 원본 결 보기에서는 중립으로 넘김.
    styling: rawMode ? neutralStyling() : state.styling,
    angle, sections, // 컬럼별로 섹션을 판정해 길이를 다르게 적용하기 위함
    color: rawMode ? maskInf.avgColor : ((state.selectedStyle ? state.selectedStyle.colorHex : null) || maskInf.avgColor),
    // 섹션별 색상: 염색 스타일(state.selectedStyle)이 선택돼 있으면 그 염색 색을 두상 전체에
    // 균일하게 써야 하므로 섹션별 변화를 끔 — 스타일 미적용(프리셋 없이 실측 그대로)일 때만
    // 부위별로 실제 인식된 색을 각각 사용.
    avgColorsBySection: (!state.selectedStyle) ? maskInf.avgColorsBySection : null,
    colorPalette: (!state.selectedStyle) ? maskInf.colorPalette : null, // 원본 모드에서만 실측 색 분포 사용
    // (6차) 가닥 추종 언더코트용 두피색 — renderFrame의 통짜 실루엣 칠 제거 후
    // drawHairStrands가 가닥 경로 밑바탕에 사용(실패 시 표준 피부톤 폴백은 수신측).
    scalpColor: maskInf.scalpColor || null,
    orientation: maskInf.orientation,       // 결방향 컬럼 샘플 (축소해상도 좌표)
    orientMaskW: maskInf.maskW,              // 결방향 필드가 계산된 축소 해상도 폭
    orientMaskH: maskInf.maskH,              // 결방향 필드가 계산된 축소 해상도 높이
    capturePaths: true, // 완성된 가닥 경로를 저장 → 3D가 이 경로를 그대로 들어올림
  };
}

function renderFrame(canvas, angle){
  // ── 버그 수정(2026-07-13): SECTIONS 경계 미스매치 ──
  // refineSectionBoundaries(angle)는 원래 촬영 직후 파이프라인에서 4개 뷰를
  // 순서대로 한 번씩만 돌렸는데, SECTIONS가 뷰별로 안 나뉘고 전역 공유
  //객체라서 나중 뷰가 이전 뷰의 경계값을 덮어씀 — 그 뒤로 어느 뷰 탭을
  // 보든 "마지막으로 처리된 뷰 하나" 기준 경계에 고정된 채 안 바뀌고
  // 있었음(실기기 피드백: "크라운을 만졌는데 프론트/사이드가 늘어난다" 등
  // 전 섹션·전 뷰에 걸친 증상 전부 이걸로 설명됨). 렌더할 때마다 지금
  // 보고 있는 뷰(angle) 기준으로 매번 다시 계산해서 항상 일치하게 함.
  // (landmarks[angle]이 없으면 refineSectionBoundaries 자체가 안전하게
  // no-op — 새 실패 모드 추가 아님)
  if(typeof faceLandmarkerReady !== 'undefined' && faceLandmarkerReady){
    refineSectionBoundaries(angle);
  }
  syncCanvasSize(canvas);
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if(w===0||h===0){ setTimeout(()=>renderFrame(canvas,angle),50); return; }

  getCachedImg(angle, (img)=>{
    ctx.clearRect(0,0,w,h);

    const hairC   = state.hairCanvases[angle];
    const baseC   = state.baseCanvases[angle];
    const maskInf = state.hairMasks[angle];

    if(state.debugShowField && maskInf && maskInf.orientation){
      // ── 결필드 원본 디버그 뷰 ──
      // strand 시뮬레이션(뿌리 위치 제약·중력·clamp)을 전혀 거치지 않고
      // computeHairOrientationField가 뽑아낸 값을 그대로 표시. 원본 사진 위에
      // 얹어서, 저장된 결방향 데이터가 마스크 전체에 걸쳐 실제로 얼마나
      // 촘촘·신뢰할 만한지(coherence 색상)를 strand 렌더링과 분리해서 확인한다.
      const fit = computeFit(img.width, img.height, w, h);
      ctx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh);
      drawOrientationFieldDebug(ctx, fit, maskInf);
      return;
    }

    if(state.debugShowMask && hairC && maskInf){
      // ── 마스크 디버그 뷰 ──
      // 가닥 렌더링을 완전히 건너뛰고, 원본 사진 위에 최종 결과만 단색으로 보여주는 대신,
      // "왜 이렇게 됐는지"를 색으로 구분해서 보여준다: 빨강=최종 머리카락,
      // 회색=얼굴박스라서 제외, 파랑=눈썹/눈/입 가드라서 제외.
      const fit = computeFit(img.width, img.height, w, h);
      ctx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh); // 원본 사진 그대로

      ctx.save();
      ctx.globalAlpha = 0.6;
      if(maskInf.reasonCanvas){
        ctx.drawImage(maskInf.reasonCanvas, fit.dx, fit.dy, fit.dw, fit.dh);
      } else {
        // reasonCanvas가 없는 예전 캐시 데이터 대비 폴백: 기존 단색 방식
        const maskOverlay = document.createElement('canvas');
        maskOverlay.width = hairC.width; maskOverlay.height = hairC.height;
        const mCtx = maskOverlay.getContext('2d');
        mCtx.drawImage(hairC, 0, 0);
        mCtx.globalCompositeOperation = 'source-in';
        mCtx.fillStyle = '#ff2d55';
        mCtx.fillRect(0, 0, maskOverlay.width, maskOverlay.height);
        ctx.drawImage(maskOverlay, fit.dx, fit.dy, fit.dw, fit.dh);
      }
      ctx.restore();
      return;
    }

    if(hairC && baseC && maskInf && maskInf.scalpY){
      // ── 세그멘테이션 성공 ──
      // 레이어 순서:
      // [1] baseC (원본에서 머리카락 영역이 진짜로 지워진 베이스) → 얼굴·배경만
      // [2] 헤어컬러 언더코트 (마스크 실루엣을 평균 헤어컬러로 채움, 가닥 사이 빈틈 방지)
      // [3] 새 가닥 (scalpY 기반, 자유롭게 아래로 뻗음)
      // [4] 컬러 오버레이

      const fit = computeFit(img.width, img.height, w, h);

      // 이전 버그: 원본 img를 먼저 통째로 그린 뒤 baseC(머리 부분 투명)를
      // source-over로 덮었는데, 투명 픽셀은 source-over에서 아무 효과가 없어서
      // 원본 머리카락이 전혀 안 지워지고 그대로 남아있었음(가닥은 그 위에 얹히기만 함).
      // → baseC 자체를 베이스로 바로 그려서 머리카락 영역을 실제로 비운다.
      ctx.drawImage(baseC, fit.dx, fit.dy, fit.dw, fit.dh);

      // ── (6차) 통짜 언더코트 제거 ──
      // 예전엔 여기서 hairC 마스크 실루엣 전체를 두피색으로 통째로 칠했음 —
      // 사용자 지적("세그멘테이션 전체를 처음에 그려버리잖아") 그대로: 가닥을
      // 아무리 짧게 조정해도 이 통짜 실루엣이 뒤에 남아 조정이 안 먹히는 것처럼
      // 보이는 직접 원인이었다. 언더코트는 이제 drawHairStrands 내부에서
      // "실제 가닥 경로를 따라" 굵은 두피색 획으로 깔린다(가닥 사이 빈틈 메움은
      // 유지하면서, 조정된 헤어 모양을 바탕이 그대로 따라감).

      // 원본 결 보기(debugShowRaw): 실제 state.sections/selectedStyle은 그대로 두고,
      // 화면에 넘기는 값만 중립값으로 덮어씀 — 길이 50(=원본 인식 길이 그대로),
      // 볼륨 50, 컬 0(순수 결방향만 따라감), 색상은 스타일 틴트 대신 실제 인식된 평균 헤어컬러.
      const rawMode = state.debugShowRaw;
      const maskW = maskInf.w, maskH = maskInf.h;
      const scalpY   = maskInf.scalpY;
      const hairEndY = maskInf.hairEndY;

      const validCount = countValidCols(scalpY);

      if(validCount > maskW * 0.05){
        // (11차 3단계) 3D 조정 엔진 ON + 중립 모델 준비됨 → 조정창을 3D 모델의
        // 투영으로 그림(3D=원본, 2D=투영). "3D로 조정, 2D로 표현"의 완성 —
        // 장기적으로 비교 화면 제거하고 조정창이 곧 결과 화면. 실패/미준비 시
        // 기존 2D 직접 렌더로 폴백(안전).
        const canProject = state.use3DAdjust && !rawMode && state.hair3Dneutral
          && state.hair3Dneutral.viewCal && state.hair3Dneutral.viewCal[angle];
        if(!(canProject && projectHair3DToView(ctx, fit, angle, maskInf))){
          // 가닥 오버레이 — origLen 이내는 hairCanvas 마스크로 clip, 연장분은 clip 없음(drawHairStrands 내부에서 처리)
          drawHairStrands(ctx, fit, scalpY, hairEndY, maskW, maskH, hairC, buildStrandOpts(maskInf, angle, rawMode));
        }
      }

    } else if(img){
      // ── 세그멘테이션 없음: 원본만 표시 (SVG 폴백 제거) ──
      drawImgOnCanvas(ctx, img, w, h);
    } else {
      ctx.fillStyle='#211D19'; ctx.fillRect(0,0,w,h);
      const cssW = canvas.getBoundingClientRect().width || w; // 고정 1200 백킹스토어에서도 화면 표시 크기 유지
      ctx.fillStyle='#52483D'; ctx.font=`${Math.round(13*(w/Math.max(1,cssW)))}px Inter`; ctx.textAlign='center';
      ctx.fillText('이 각도의 사진이 없습니다', w/2, h/2);
    }
  });
}

// 조정 화면(#screen-adjust)의 캔버스를 현재 각도로 다시 그리는 짧은 헬퍼 —
// 디버그 토글 3곳에서 renderFrame(document.getElementById('adjustCanvas'), state.currentViewAngle)
// 호출이 그대로 반복되던 것을 하나로 합침 (drawAdjustPreview는 rAF로 감싸서 별도 유지)
function renderAdjustFrame(){
  // [진단용] 조정 렌더가 실제로 실행되는지 + 어떤 섹션 길이값으로 그리는지 추적.
  // onGySlider 로그의 값과 여기 값이 같으면 상태→렌더는 정상(문제는 길이→픽셀 매핑),
  // 여기 로그가 안 찍히면 렌더 자체가 재실행 안 됨(currentScreen/rAF 문제).
  // (2026-07-22) 슬라이더 틱마다 찍혀 콘솔이 넘치던 것 → 상세 모드에서만 출력.
  if(window.DIAG_VERBOSE) console.log('[진단·조정렌더] view='+state.currentViewAngle
    +' 활성섹션='+state.activePanelSection
    +' crown.len='+(state.sections.crown&&state.sections.crown.length)
    +' front.len='+(state.sections.front&&state.sections.front.length)
    +' rawMode='+state.debugShowRaw);
  renderFrame(document.getElementById('adjustCanvas'), state.currentViewAngle);
  logSectionColumnCounts(state.currentViewAngle);
  // (11차) 3D 조정 엔진 ON이면 미니뷰에 3D 조정 연산자 재적용(디바운스).
  // 중립 모델은 고정이라 재캡처·재리프트 불필요 — refreshDevMini3D가 연산자만
  // 다시 적용(가벼움). 중립 모델이 아직 없으면 1회 생성.
  if(state.use3DAdjust) scheduleHair3DRefresh();
}
let _hair3DRefreshTimer = null;
function scheduleHair3DRefresh(){
  if(_hair3DRefreshTimer) return;
  _hair3DRefreshTimer = setTimeout(()=>{
    _hair3DRefreshTimer = null;
    try {
      if(!state.hair3Dneutral) buildNeutralHair3D(()=>refreshDevMini3D());
      else refreshDevMini3D();
    } catch(e){ console.warn('3D 미니뷰 갱신 실패:', e); }
  }, 120);
}

// [진단용] 현재 뷰에서 각 섹션에 실제로 몇 개의 머리카락 컬럼이 배정되는지 집계.
// "크라운만 전체를 바꾸고 나머지는 안 먹힌다"의 원인 확인용 — 정면 뷰에서 대부분
// 컬럼이 crown으로 판정되면 crown 조정만 크게 보이고 나머지 섹션은 빈 영역이라
// 조정해도 화면에 나타날 컬럼이 없다. renderFrame이 refineSectionBoundaries로 경계를
// 갱신한 뒤 호출되므로 여기서 세면 현재 뷰 기준 정확.
function logSectionColumnCounts(angle){
  const mi = state.hairMasks && state.hairMasks[angle];
  if(!mi || !mi.scalpY) return;
  const counts = { crown:0, front:0, temple:0, side:0, occipital:0, nape:0 };
  const W = mi.w, H = mi.h;
  let valid = 0;
  // (2026-07-22, 4차) 미용 이론대로 "뿌리 위치" 기준으로 집계(사용자 교정: 기준은 뿌리).
  // 렌더도 뿌리를 준균등 분포(pow 1.1)로 심으므로 깊이 5지점 균등 샘플이 실분포에 근사.
  // 측면 crown 편중은 분류가 아니라 두정선 높이(뷰별 parietalFrac)+겹 스택 캡으로 해소.
  const DEPTHS = [0, 0.2, 0.4, 0.6, 0.8];
  for(let x=0; x<W; x++){
    const sy = mi.scalpY[x]; if(sy < 0) continue;
    const ey = (mi.hairEndY && mi.hairEndY[x] >= 0) ? mi.hairEndY[x] : sy;
    DEPTHS.forEach(f=>{
      const rootY = sy + (ey - sy) * f;
      valid++;
      const sec = resolveSectionId(angle, x/W, rootY/H);
      if(counts[sec] !== undefined) counts[sec]++;
    });
  }
  const line = '[진단·섹션분포] '+angle+' 뿌리기준(깊이5지점×컬럼)='+valid+' | '
    + Object.entries(counts).map(([k,v])=>k+'='+v+'('+(valid?Math.round(v/valid*100):0)+'%)').join(' ');
  // (2026-07-22) 렌더마다 같은 내용이 반복 출력되던 것 → 분포가 "바뀔 때만" 1회 출력
  // (섹션 경계 검증에 필요한 정보는 유지하면서 콘솔 스팸 제거).
  window._lastSecDistLog = window._lastSecDistLog || {};
  if(window._lastSecDistLog[angle] !== line || window.DIAG_VERBOSE){
    window._lastSecDistLog[angle] = line;
    console.log(line);
  }
}

/* ────────────────────────────────────────
   가닥 렌더링
   - 2단계 clip: 원본 인식 길이(origLen) 이내는 hairCanvas(마스크)로 clip해서
     마스크 밖으로 절대 안 나감 / 슬라이더로 늘어난 연장분만 clip 없이 자유롭게
   - 두피 라인(scalpY)에서 출발, 길이·컬·볼륨 슬라이더 반영
   - 미용 "섹션" 개념: 굵은 면 레이어 + 가는 가닥 레이어 혼합
──────────────────────────────────────── */
/* ════════════════════════════════════════════════════════════════
   drawHairStrands(...) 리팩토링(2026-07-14) — 역할별 분리
   원래 663줄짜리 함수 하나 안에 전부 중첩 정의돼 있었음. 이 함수는
   Canvas 2D API(ctx.stroke 등)를 직접 호출하는 부분이 대부분이라,
   Node 샌드박스엔 진짜 Canvas 구현체가 없어서 그 부분을 옮기면
   "동작 100% 보존"을 확신 있게 검증할 방법이 없음(과거 세션에서 이미
   이 이유로 "목차만 추가, 구조는 안 건드림"으로 결론 낸 적 있음).
   → 이번엔 그 중 "Canvas API를 전혀 안 쓰는 순수 계산" 부분만
   골라서 분리(=Node에서 무작위 입력으로 독립 검증 가능한 부분만):
     createColumnStyleResolvers(...) — 컬럼(ix)별 길이배율/색상/컬배율/
       프론트 방향바이어스 4종 계산(원래 lengthRatioFor 등 4개 중첩 함수)
     traceStrandPath(...)            — 결방향 필드를 따라 가닥 경로
       (좌표 배열)를 만드는 순수 함수(원래 traceStrand 중첩 함수)
   실제로 ctx.stroke()/getImageData() 등을 호출하는 setStyle/traceStrand
   (얇은 래퍼로 남음)/toCanvasPts/strokePolyline/drawStrand/
   drawStrandLayer/isRealHairAt/compositeLayers/레이어 실행 4단계는
   검증 불가능한 변경을 피하기 위해 원래처럼 drawHairStrands 안에
   그대로 남겨둠(⚠ 정직한 한계: 이 부분은 이번 리팩토링 대상에서
   의도적으로 제외 — 아래 dev-log 참고).
════════════════════════════════════════════════════════════════ */
// 컬럼별(ix 기준) 스타일 파라미터 계산 4종을 묶어서 만들어주는 팩토리.
// 4개 함수(lengthRatioFor/colorForSection/curlMultFor/frontDirBiasFor)
// 전부 원래 drawHairStrands 안의 중첩 함수였던 것을 그대로 옮긴 것 —
// 로직·주석·캐시 방식 전부 변경 없음, 감싸는 함수 경계만 바뀜.
// ── 공용 유틸(2026-07-22 중복 통합) ──
// 결정적 의사난수 fract(sin(x)·43758.5453) — 프레임마다 같은 값이 나와 화면
// 깜빡임(shimmer) 방지. pseudoRandForCol/결불연속 임계/슬라이스 스태거가 각자
// 인라인하던 동일 해시를 하나로. 인자를 그대로 넘기므로 산술 결과 완전 동일.
function hashFract(x){ const v = Math.sin(x) * 43758.5453; return v - Math.floor(v); }
// 마스크(이미지) 좌표 → 캔버스 좌표 매핑 팩토리 — drawHairStrands(toCanvasX/Y)와
// projectHair3DToView(toCX/toCY)가 글자 그대로 같던 두 클로저를 통합.
function makeImgToCanvas(fit, maskW, maskH){
  return {
    toX: (ix) => fit.dx + (ix / maskW) * fit.dw,
    toY: (iy) => fit.dy + (iy / maskH) * fit.dh,
  };
}
// 점 배열({x,y})을 quadratic 중간점 보간으로 부드럽게 스트로크(현재 ctx 스타일 사용).
// drawHairStrands의 strokePolyline과 projectHair3DToView의 인라인 루프가 글자
// 그대로 같던 것을 통합 — beginPath→moveTo→중간점 곡선→마지막 lineTo→stroke.
function strokeSmoothPolyline(ctx, pts){
  if(pts.length < 2) return;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for(let i=1;i<pts.length-1;i++){
    const mx = (pts[i].x + pts[i+1].x)/2;
    const my = (pts[i].y + pts[i+1].y)/2;
    ctx.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  const last = pts[pts.length-1];
  ctx.lineTo(last.x, last.y);
  ctx.stroke();
}

// gyeol 색 밝기 조정 유틸(hex 전용) — 섹션별 컬러/스타일링 광택(finish)에 사용.
// hex가 아니면(rgb() 실측색 등) 원본을 그대로 돌려줌.
function gyShade(hex, amt){
  if(typeof hex!=='string' || hex[0] !== '#' || hex.length < 7) return hex;
  const n=parseInt(hex.slice(1,7),16);
  if(Number.isNaN(n)) return hex;
  let r=(n>>16)+amt, g=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); g=Math.max(0,Math.min(255,g)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(g<<8)|b).toString(16).padStart(6,'0');
}

// 커트 겹 강도(끝점 수렴/확산 최대치를 rootSpan의 몇 배로 볼지) — 튜닝 지점.
const CUT_LAYER_GAIN = 0.5;
// 길이 슬라이더 1칸당 길이 배율 변화 — 2D 렌더(createColumnStyleResolvers)와
// 3D 조정 엔진(gy3d*)이 반드시 같은 감도를 써야 두 경로의 결과가 일치하므로
// 전역 단일 출처로 승격(2026-07-22). 값·의미는 기존 RATIO_PER_UNIT 그대로.
const LENGTH_RATIO_PER_UNIT = 0.018; // (9차) 0.012→0.018: 실기기 "길이 변화가 너무 조금" — 슬라이더 1칸당 변화 +50%
// 기법 → 커트 축(0=원랭스 … 1=유니폼 … 2=인크리스). 시술각(elevation)이 ±로 미세 조정.
const CUT_TECH_AXIS = { onelength:0, graduation:0.5, uniform:1, increase:1.6 };
// 뿌리 위치 → 겹 길이 델타(px). createColumnStyleResolvers의 cutLayerDeltaFor에서 쓰던
// 순수 계산을 분리 — 시술각/기법이 만드는 레이어(끝점 재분포)를 rootSpan 물리 스케일로 계산.
//   sec: 해당 섹션 파라미터(technique/elevation), rootY: 이 컬럼 뿌리의 세로 위치(px),
//   rootSpan: 뷰 전체 뿌리 세로 범위, maxRootY: 가장 낮은(아웃라인) 뿌리의 y.
// 반환: 양수=수렴(원랭스/무게선), 0=유니폼(무변화), 음수=확산(인크리스/롱레이어).
function computeCutLayerDelta(sec, rootY, rootSpan, maxRootY){
  if(!sec) return 0;
  const tech = sec.technique || 'uniform';
  const elev = (typeof sec.elevation === 'number') ? sec.elevation : 45;
  const techBase = (CUT_TECH_AXIS[tech] !== undefined) ? CUT_TECH_AXIS[tech] : 1;
  // 시술각 45°=중립. 높을수록 축을 유니폼/인크리스 쪽(레이어↑), 낮을수록 원랭스 쪽(무게↑).
  const axis = Math.max(0, Math.min(2, techBase + ((elev - 45) / 90) * 0.6));
  const w = 1 - axis; // +1(수렴/원랭스) … 0(유니폼) … -1(확산/인크리스)
  if(w === 0) return 0;
  // rootT: 뿌리 높이(1=정수리쪽 높은 뿌리, 0=아웃라인 낮은 뿌리).
  const rootT = Math.max(0, Math.min(1, (maxRootY - rootY) / rootSpan));
  // 원랭스(w>0): 높은 뿌리(rootT↑)를 더 길게 → 끝 수렴. 인크리스(w<0): 높은 뿌리를 짧게.
  return rootSpan * rootT * w * CUT_LAYER_GAIN;
}

function createColumnStyleResolvers({ maskW, maskH, iScalpY, sections, angle, color, avgColorsBySection, styling }){
  // 컬럼 인덱스 클램프 [0, maskW-1] — makeColumnResolver/colorForSection이 각자
  // 인라인하던 동일 식을 통합(중복 제거, 동작 동일).
  const clampCol = (ix) => Math.min(maskW-1, Math.max(0, Math.round(ix)));
  // ── 컬럼별 길이 배율: 슬라이더 50 = 원본 길이(origLen) 그대로(ratio=1).
  // 기존엔 "덧셈"(절대 px, origLen과 무관하게 항상 같은 양만큼 변화)이었으나,
  // 이 방식은 origLen이 작은 부위(사이드/네이프처럼 세그멘테이션이 짧게 잡힌 곳)에서
  // 같은 절대값이 상대적으로 훨씬 크게 작용해 그 부위만 원래 세그멘테이션 형태를
  // 벗어나 툭 튀어나오는 문제가 있었음. → "배율"로 바꿔서 origLen에 비례하게 늘리고
  // 줄여, 세그멘테이션이 잡은 원래 형태(비율)를 그대로 유지한 채 커지고 작아지게 함.
  // (짧은 부위는 짧은 만큼, 긴 부위는 긴 만큼 — 같은 비율로 변화)
  // TODO: 배율 방식으로 모양을 먼저 잡은 뒤, 조정 단계에서 슬라이더 감도(RATIO_PER_UNIT)를
  // 다시 튜닝할 예정 — 지금은 형태 검증이 우선.
  // ── 컬럼별 값 리졸버 공통 골격(2026-07-18 통합) ──
  // lengthRatioFor/curlMultFor/frontDirBiasFor가 "ix→컬럼 클램프 → Float32Array
  // +NaN 캐시 조회 → ny/nx 정규화 → resolveSectionId" 5줄을 각자 복제하고
  // 있던 것을 팩토리로 통합. compute(secId,cx,nx,ny)만 리졸버마다 다름.
  // 캐시 타입(Float32Array)과 "첫 호출은 계산값(float64), 이후는 캐시값
  // (float32)을 반환"하는 기존 특성까지 그대로 유지 — 동작 무변경.
  // ※ colorForSection은 제외: 모양은 같아 보여도 avgColorsBySection이 없으면
  //   섹션 해석 자체를 건너뛰고, 섹션 판정 조건도 (sections && angle)이 아니라
  //   (angle)이라 로직이 실제로 다름.
  function makeColumnResolver(compute){
    // ── 뿌리 실좌표 기반 판정(2026-07-22) ──
    // 예전엔 캐시가 "컬럼당 1값"(Float32Array)이었고 섹션 판정도 컬럼의 두피
    // 최상단선(iScalpY)만 사용 — 루트 확산 레이어가 귀 옆/목덜미 깊이에 심은
    // 뿌리조차 전부 "실루엣 꼭대기 기준 섹션"으로 먹혀서, 측면 뷰에서 사실상
    // 모든 가닥이 side 하나로 뭉쳤음("사이드만 조정하면 전체가 움직인다"의 원인).
    // 이제 호출부(drawStrandLayer)가 실제 뿌리 좌표로 판정한 secId/rootNy를
    // 넘겨주면 그대로 쓰고(캐시 키를 컬럼×섹션×뿌리깊이 1% 양자화로 확장),
    // 안 넘기는 기존 호출부는 예전과 동일하게 최상단선 판정으로 폴백한다.
    const cache = {};
    return function(ix, secIdOpt, rootNyOpt){
      const cx = clampCol(ix);
      const nx = cx/maskW;
      const ny = (typeof rootNyOpt === 'number')
        ? rootNyOpt
        : (iScalpY[cx] >= 0 ? iScalpY[cx]/maskH : 0.15);
      const secId = secIdOpt || ((sections && angle) ? resolveSectionId(angle, nx, ny) : 'crown');
      const key = secId + ':' + cx + ':' + ((ny*100)|0); // 깊이 의존 값(페이드/겹 델타) 때문에 ny도 키에 포함
      const hit = cache[key];
      if(hit !== undefined) return hit;
      const v = compute(secId, cx, nx, ny);
      cache[key] = v;
      return v;
    };
  }

  // 슬라이더 감도 재조정(2026-07-13): 이전엔 0.04였는데, 50 기준 ±1칸당
  // 4%씩 움직여서 슬라이더 0~25 구간 전체가 배율 0(완전히 클램프)으로
  // 뭉개지고, 반대쪽은 최대 3배까지 튀는 극단적인 감도였음(실기기 피드백:
  // "크라운 길이가 너무 훅훅 바뀐다"). 0~100 전체 범위가 고르게 반응하고
  // 극단값도 다루기 쉬운 폭(0.4배~1.6배)이 되도록 계수를 낮춤 — 죽은구간 없음.
  const RATIO_PER_UNIT = LENGTH_RATIO_PER_UNIT; // 전역 단일 출처(3D 엔진과 감도 공유)
  // 컬럼 위치(cx) 기반 결정적 의사난수 — Math.random() 대신 써서 매 프레임(재렌더) 마다
  // 같은 컬럼이 다른 값을 받아 화면이 깜빡이는(shimmer) 것을 방지. seed로 서로 다른
  // 패턴(네이프용/사이드용)을 만들어 두 효과가 같은 자리에서 안 겹치게 함.
  function pseudoRandForCol(cx, seed){ return hashFract(cx*seed); }
  const lengthRatioFor = makeColumnResolver((secId, cx, nx, ny)=>{
    const lenParam = (sections && sections[secId] && typeof sections[secId].length==='number')
      ? sections[secId].length : 50;
    // ── 배율 기준점 수정(2026-07-22 5차): "기본값 = 원본 커트" ──
    // 예전엔 50=원본(ratio 1) 고정이라, 섹션 기본값이 80(설계 의도: "커트지 새
    // 스타일이 아니니 원본에 가깝게")인 상태에서 기본 렌더가 이미 1.36×로 늘어나
    // 있었음 — 실기기 "머리가 내려와 있는 것 같다"의 원인. 기준점을 각 섹션의
    // 기본값(defaults.length)으로 바꿔서, 슬라이더가 기본 위치면 사진 그대로
    // (ratio=1), 내리면 원본보다 짧게, 올리면 길게 — 미용사 직관과 일치.
    // (프리셋 스타일의 length 절대값 해석도 이 기준으로 바뀜 — 프리셋 강도는
    // 추후 재튜닝 대상으로 기록)
    const baseLen = (SECTIONS[secId] && SECTIONS[secId].defaults && typeof SECTIONS[secId].defaults.length==='number')
      ? SECTIONS[secId].defaults.length : 50;
    let ratio = Math.max(0, 1 + (lenParam - baseLen) * RATIO_PER_UNIT);
    // 커트기법(원랭스/그라데이션/유니폼/인크리스)에 의한 "뿌리높이별 겹" 분포는
    // 여기(길이 슬라이더 배율)가 아니라 cutLayerDeltaFor(아래)에서 px 단위로 더한다.
    // 겹은 root 위치에 따른 끝점 재분포이므로, 단순 길이배율과 분리해야 지오메트리가
    // 정확하다(섹션 경계와 무관하게 뷰 전체 두피선 기준으로 연속적으로 계산).

    // ── ②nape.line(스퀘어/라운드/테이퍼): 컬럼별 길이 배율에 추가 변조 ──
    // 스퀘어(0)일수록 배율을 1(=원본 길이 그대로, 변화 없음)쪽으로 당겨서 끝이
    // 뭉툭하고 균일하게 보이게. 테이퍼(100)일수록 컬럼마다 배율을 크게 들쭉날쭉
    // 흔들어서 끝이 성글게 갈라지는(가늘어지는) 느낌을 냄. 50(라운드)이면 무변화.
    if(secId === 'nape' && sections.nape && typeof sections.nape.line === 'number'){
      const t = (sections.nape.line - 50) / 50; // -1(스퀘어) ~ 0(라운드) ~ +1(테이퍼)
      if(t > 0){
        const jitterRange = t * 0.5;
        const pr = pseudoRandForCol(cx, 12.9898);
        ratio *= (1 - jitterRange*0.5 + pr*jitterRange);
      } else if(t < 0){
        const flatten = -t; // 0~1
        ratio = ratio*(1-flatten) + 1*flatten;
      }
    }

    // ── ③엘리베이션(시술각, 크라운/사이드/후두부 공통): 컬럼별 길이 배율에 편차 추가 ──
    // 실제 기법: 시술각이 높을수록(90°에 가까울수록=레이어 강하게) 그라데이션이
    // 강해져서 인접 컬럼끼리 길이 편차가 커짐("짧은 가닥·긴 가닥이 섞인" 레이어드
    // 텍스처). 0°(원랭스)면 무변화 — 예전엔 이 효과가 side.layer 하나에만 있었는데,
    // 엘리베이션은 크라운/사이드/후두부 셋 다에 있는 파라미터라 셋 다 반영.
    const ELEV_SEED = { crown:31.719, side:78.233, occipital:55.123 };
    if(ELEV_SEED[secId] && sections[secId] && typeof sections[secId].elevation === 'number'){
      const elevT = Math.max(0, Math.min(1, sections[secId].elevation / 90)); // 0~1
      if(elevT > 0){
        const jitterRange = elevT * 0.55;
        const pr = pseudoRandForCol(cx, ELEV_SEED[secId]);
        ratio *= (1 - jitterRange*0.5 + pr*jitterRange);
      }
    }

    // ── 페이드/테이퍼(클리퍼, 길이 기준 — 엘리베이션과 완전히 별개) ──
    // 실제 기법: 가드 번호(0~8, 1단위=1/8인치)로 구레나룻/목선 쪽부터 점점
    // 짧아지게 블렌딩. 섹션의 세로 범위 안에서 "하단(구레나룻/목선 쪽)에
    // 얼마나 가까운가"를 진행률로 보고, 페이드 존 안이면 목표 비율을 가드
    // 길이 쪽으로 끌어당김. front/crown은 실제로도 클리퍼 페이드 대상이
    // 아니라서 적용 안 함(FADE_SECTIONS에 없는 섹션은 무조건 통과).
    const FADE_SECTIONS = { temple:1, side:1, occipital:1, nape:1 };
    if(state.fade && state.fade.enabled && FADE_SECTIONS[secId] && SECTIONS[secId]){
      const yr = SECTIONS[secId].yRange;
      const span = (yr[1]-yr[0]) || 0.001;
      // progressFromBottom: 0=섹션 맨 아래(구레나룻/목선에 가장 가까움), 1=섹션 맨 위
      const progressFromBottom = 1 - (ny - yr[0]) / span;
      const fadeHeightT = state.fade.height / 100;
      if(progressFromBottom < fadeHeightT){
        const guardRatio = state.fade.guard / 8; // 0(스킨)~1(가드8=거의 정상길이)
        const blendZone = Math.max(0.02, (state.fade.blendWidth/100) * fadeHeightT);
        const localT = Math.min(1, Math.max(0, progressFromBottom / blendZone)); // 0=완전 가드길이, 1=정상 복귀
        ratio = ratio*localT + guardRatio*(1-localT);
      }
    }

    ratio = Math.max(0, ratio);
    return ratio;
  });

  /* ════════════════════════════════════════════════════════════════
     커트 지오메트리 (겹의 밑바탕) — 뿌리 위치 → 모발 길이 → 끝점 재분포
     ────────────────────────────────────────────────────────────────
     실제 커트에서 "겹(레이어)"은 뿌리 높이가 다른 가닥들의 끝점이 어디에
     떨어지느냐로 생긴다. 미용사는 시술각(elevation)으로 이걸 조작한다:
       · 원랭스(시술각 0°)  : 높은 뿌리일수록 길어야 같은 바닥선에 떨어짐
                              → 끝점이 한 선으로 수렴 = 무게선(weight line)

                              평행하게 두상 따라감(레이어 균일, 무게선 없음)
       · 그라데이션(그 사이) : 부분 수렴 → 중간에 무게가 쌓임
       · 인크리스(오버디렉션): 낮은 뿌리일수록 길어짐 → 롱레이어(끝 확산)
     이를 뷰 전체 두피선(root)의 세로 범위 rootSpan을 물리 스케일로 삼아
     px 단위 길이 델타로 계산한다. 섹션 경계와 무관하게 연속적(실제 두상에서
     겹은 부위 경계에서 끊기지 않는다). 유니폼(w≈0)이면 델타 0 = 기존 렌더 유지.
     ════════════════════════════════════════════════════════════════ */
  // 뷰 전체 뿌리(두피선) 세로 범위 — 겹 지오메트리의 물리 스케일.
  let _minRootY = Infinity, _maxRootY = -Infinity;
  for(let x=0; x<maskW; x++){
    const y = iScalpY[x];
    if(y >= 0){ if(y < _minRootY) _minRootY = y; if(y > _maxRootY) _maxRootY = y; }

  const rootSpan = Math.max(1, _maxRootY - _minRootY);
  // 컬럼별 겹 길이 델타(px) — scaledLen에 더한다. 양수=수렴(끝을 아래로 늘려 무게선),
  // 음수=확산(끝을 위로 당겨 롱레이어). 실제 계산은 순수 함수 computeCutLayerDelta로
  // 분리(독립 테스트·재사용 가능). depthScale은 호출부(drawStrandLayer)에서 곱한다.
  const cutLayerDeltaFor = makeColumnResolver((secId, cx, nx, ny)=>
    computeCutLayerDelta(sections && sections[secId], ny * maskH, rootSpan, _maxRootY));

  // ── 섹션별 헤어 색상(avgColorsBySection) ──
  // 사용자 요청: "부위별로 인식되는 컬러 쓰는 거 가능하냐" — avgColorsBySection이
  // 있으면(스타일 미적용 모드) 뿌리 컬럼의 섹션에 맞는 실측 색을, 없으면
  // (염색 스타일 선택됨 등) 기존처럼 균일한 color를 그대로 반환.
  // ── gyeol 스타일링 광택(finish) — 전 가닥 색을 밝기 보정 ──
  // finish 50=무변화, 100=밝게(윤기), 0=어둡게(매트). hex 색에만 적용.
  const _glossAmt = (()=> {
    const f = (styling && typeof styling.finish==='number') ? styling.finish : 50;
    return Math.round(((f-50)/50) * 22); // ±22
  })();
  const colorForSectionCache = {};
  function colorForSection(ix, secIdOpt){
    // (2026-07-22) 뿌리 기반 섹션 판정 연동: 호출부가 실제 뿌리로 판정한 secId를
    // 넘기면 그걸 쓰고(캐시 키에 섹션 포함), 안 넘기면 기존 최상단선 판정 유지.
    const cx = clampCol(ix);
    const ny = iScalpY[cx] >= 0 ? iScalpY[cx]/maskH : 0.15;

    const secId = secIdOpt || ((angle) ? resolveSectionId(angle, nx, ny) : 'crown');
    const cKey = secId + ':' + cx;
    if(colorForSectionCache[cKey] !== undefined) return colorForSectionCache[cKey];
    let result = color;
    // ★ gyeol 섹션별 컬러(발레아쥬 등) — 섹션에 color가 지정돼 있으면 최우선.
    //   염색 스타일(selectedStyle) 미선택일 때만 avgColorsBySection가 오므로,
    //   섹션 컬러는 그와 무관하게 항상 우선 적용(미용사가 명시적으로 지정한 값).
    if(sections && sections[secId] && sections[secId].color){

    } else if(avgColorsBySection){
      result = avgColorsBySection[secId] || color;

  // 예전엔 "전역컬 대비 %배율"이었으나, gyeol UI는 섹션별 컬을 절대 진폭으로
  // 다루므로 여기서 절대값을 그대로 돌려줌(0=스트레이트, 100=최대 컬).
  // traceStrandPath가 (curlAmt/100)로 진폭을 직접 계산한다.
  const curlAmtFor = makeColumnResolver((secId)=>
    (sections && sections[secId] && typeof sections[secId].curl === 'number')
      ? sections[secId].curl : 30);
  // ── gyeol 섹션별 웨이브 폭(로드 사이즈 0~100, 기본 50=중립) ──
  // 파장(촘촘/느슨)만 조절. 전역 state.waveWidth를 섹션값으로 대체.
  const waveWidthFor = makeColumnResolver((secId)=>
    (sections && sections[secId] && typeof sections[secId].wave === 'number')
      ? sections[secId].wave
      : (typeof state.waveWidth==='number'? state.waveWidth : 50));
  // ── gyeol 섹션별 텍스처라이징(0~100) ── drawStrand 끝단 트림에 사용.
  // 하위호환: 전역 state.texturing과 섹션 texture 중 큰 값을 적용.
  const textureFor = makeColumnResolver((secId)=>{
    const secTex = (sections && sections[secId] && typeof sections[secId].texture==='number') ? sections[secId].texture : 0;
    const glob = (typeof state.texturing==='number') ? state.texturing : 0;
    return Math.max(secTex, glob);
  });


  // 뿌리가 심긴 컬럼(strand의 시작 ix)이 front 섹션이면, line 슬라이더 값에 따라
  // 진행방향(travelDir)에 지속적인 각도 바이어스를 더한다(curlComponent/wiggle과
  // 동일한 additive 방식 — traceStrand의 결방향 추종/중력 로직은 그대로 두고
  // "성향"만 얹는 것이라 결방향이 뚜렷한 구간에선 자연스럽게 실측 결이 우선함).
  // line<50: 아래로 더 라운드지게(양의 바이어스=아래쪽으로 더 꺾임)
  // line=50: 바이어스 없음(기존과 동일)
  // line>50: 위로 넘기는 느낌(음의 바이어스=위쪽으로 꺾임)
  const frontDirBiasFor = makeColumnResolver((secId)=>{
    if(secId === 'front' && sections.front && typeof sections.front.line === 'number'){
      const upness = (sections.front.line - 50) / 50; // -1(라운드) ~ 0(스트레이트) ~ +1(위로)
      return -upness * 0.55; // atan2 좌표계: 각도가 작아질수록(음수 방향) 위쪽(-y)에 가까워짐
    }
    return 0;
  });

  return { lengthRatioFor, cutLayerDeltaFor, colorForSection, curlAmtFor, waveWidthFor, textureFor, frontDirBiasFor };
}

  /**
   * traceStrand: 시작점(ix,sy_img)에서 목표 길이(targetLen)만큼
   * 결방향 필드를 따라 작은 스텝으로 전진하며 경로를 추적한다.
   * 결방향 데이터가 없거나 coherence가 낮은 구간에서는 자연스러운
   * 약한 흔들림(curlAmt 기반)으로 보강하여 완전히 끊기지 않게 한다.
   * @returns canvas 좌표계 점 배열 [{x,y}, ...] (길이 steps+1, steps는 목표 길이에 따라 가변)
   * Canvas API를 쓰지 않고 좌표 배열만 반환하는 순수 함수라(ctx 인자가
   * 아예 없음) drawHairStrands에서 분리해도 Node에서 독립 검증 가능함 —
   * env는 호출부(drawHairStrands)가 한 번만 만들어 넘겨주는 고정값 묶음.
   */
// ── (7차) 결 불연속 종결 튜닝 상수 ──
// 겹층 커트에서 "위 겹이 끝나는 선(헴)"은 사진의 결 필드에 방향 급변/신뢰도
// 급락으로 남는다. 추적 중 그 증거를 점수로 누적해 임계(가닥별 랜덤 스태거)를
// 넘으면 실측 겹 끝으로 종결 — 관통 가닥(꼭대기 뿌리→마스크 끝 한 가닥) 문제의
// 실측 기반 해법. 긴 생머리는 결이 연속이라 점수가 안 쌓여 안 끊김.
const FLOW_DISC = {
  dirJump: 0.7,   // 방향 급변 판정(rad, ≈40°) — 웨이브의 완만한 회전은 미달
  dipRatio: 0.45, // 신뢰도 급락 판정: 현재 신뢰도 < EMA×이 비율
  dipMin: 0.2,    // EMA가 이보다 강했을 때만 "급락"으로 침(원래 약한 결은 무시)
  // 하네스 튜닝(겹 헴 폭이 2~3스텝으로 짧은 케이스): 급락 2회면 대부분 임계 도달,

function traceStrandPath(ix, sy_img, targetLen_img, jitterSeed, env, rootSec, stopAtExit){
  const { hasOrientation, orientation, orientMaskW, ox, oy, STRAND_STEP_LEN, frontDirBiasFor, curlAmtFor, waveWidthFor, styling, maskW, maskAt } = env;
    const stepLen = STRAND_STEP_LEN; // 고정 보폭 — targetLen_img에서 역산하지 않음
    const steps = Math.max(2, Math.round(targetLen_img / stepLen));
    const pts = [{x:ix, y:sy_img}]; // 마스크 좌표계(maskW,maskH 기준)로 누적
    // ── (6차) 실측 길이: 마스크 이탈 지점 추적 ──

    // 영역을 벗어나는 지점(연속 3스텝 이탈 — 마스크 노이즈 관용)을 기록한다.
    // pts.maskExitIdx = "사진이 말하는 이 가닥의 실측 끝" 인덱스. stopAtExit이면

    // 뿌리(시작 컬럼) 기준으로 딱 한 번만 조회 — 가닥이 진행하며 컬럼이 옆으로
    // 흘러가도 "이 가닥이 어디서 자라났는지"는 뿌리 위치로 고정하는 게 맞음.
    // (2026-07-22) rootSec: 호출부(drawStrand)가 뿌리 실좌표로 판정한 섹션 —
    // 컬/웨이브/프론트 바이어스가 전부 "그 가닥이 심긴 섹션"의 값을 쓴다.
    const frontBias = frontDirBiasFor(ix, rootSec);
    const curlAmt = curlAmtFor(ix, rootSec);         // gyeol 섹션별 컬 세기(절대 0~100)
    const curlStrength = curlAmt / 100;              // 0~1 (9차: 결 추종 약화·진폭에 공용)
    const waveT   = (waveWidthFor(ix, rootSec)) / 100; // gyeol 섹션별 웨이브 폭(0~1)

    const side = (typeof maskW==='number' && ix < maskW/2) ? -1 : 1;
    const st = styling || {};
    const stSweep = (st.sweep||0)/100;               // 넘김(전역 한 방향)
    const stVol   = ((st.volume??50)-50)/50;         // 뿌리 볼륨(-1~1)
    const stFlow  = (st.flow||0)/100;                // 결 흐름(끝 말림)
    const stPart  = (st.part||0)/100;                // 가르마(뿌리 좌우 치우침)
    // baseDir: curl/wiggle을 얹기 전, "결방향만" 반영한 순수 진행방향.
    // 다음 스텝의 orientation 블렌딩 기준(연속성 유지)으로 이것만 이어받는다.
    // → curl 보정을 여기 포함시켜 이어받으면 매 스텝 같은 방향으로 계속
    //   꺾이는 게 누적되어(부호가 안 바뀌는 sideDir 특성상) 긴 가닥일수록
    //   결국 옆으로 거의 수평이 되어 뻗어나가는 문제가 있었음.
    let baseDir = Math.PI/2;

    for(let s=0; s<steps; s++){
      const cur = pts[pts.length-1];
      let dir = baseDir;

      // 처음 2스텝은 orientation 필드 참조를 건너뜀.
      // 이유: 모든 가닥이 scalpY(두피 경계선) 바로 위에서 출발하는데,
      // 그 경계 픽셀 자체가 "머리카락↔배경" 급격한 명암차 경계라
      // Structure Tensor가 이 경계선 자체를 결로 착각해서 가로 방향을
      // 결방향으로 잘못 계산함. 그 결과 모든 가닥이 시작하자마자
      // 옆으로 꺾여서, 뷰 각도와 무관하게 두피 경계 높이에 가로
      // "빗살 띠"가 생기는 근본 원인이었음.
      // → 경계에서 살짝 벗어난 뒤(2스텝, 자연스러운 아래방향 진행)부터
      //   결방향을 신뢰하고 따라가도록 함.
      if(hasOrientation && s >= 2){
        const sample = sampleOrientation(orientation, cur.x*ox, orientMaskW, cur.y*oy);
        // 임계값을 0.12→0.05로 낮춤 — 기존엔 애매하게 낮은 coherence도 전부
        // "못 믿는다"고 보고 중력으로 덮어버려서, 결이 약하게라도 있는 구간까지
        // 필드 정보를 버리고 있었음. 결필드 원본 디버그로 실측한 결과 낮은
        // coherence 지점도 완전 노이즈가 아니라 약하게나마 방향성이 있는
        // 경우가 많았으므로, 진짜 노이즈(0.05 미만)만 중력으로 넘김.
        if(sample.coherence > 0.05){
          // sample.angle은 atan2 좌표계(0=+x축/가로, ±PI/2=+y축 방향/세로)로 계산된
          // "결의 방향" 그 자체이며, cos/sin을 취하면 바로 진행 단위벡터가 된다.
          // 단, 결방향은 선분이라 180도 모호성이 있음(angle과 angle+PI가 동일한 결)
          // → 고정된 "아래쪽" 기준이 아니라 baseDir과 더 가까운 쪽을 선택해야
          //   수평에 가까운 결(0도 경계)에서 지그재그 튐이 생기지 않음
          let targetDir = sample.angle;
          let deltaCheck = targetDir - baseDir;
          while(deltaCheck > Math.PI) deltaCheck -= Math.PI*2;
          while(deltaCheck < -Math.PI) deltaCheck += Math.PI*2;
          if(Math.abs(deltaCheck) > Math.PI/2){
            // 반대 표현(targetDir+PI)이 baseDir에 더 가까움 → 그쪽 채택
            targetDir += Math.PI;
          }
          // coherence가 높을수록 결방향을 강하게 따름, 낮으면 이전 방향 유지 비중↑
          // (9차) 컬이 셀수록 실측 직모 결의 추종을 약화 — 안 그러면 컬을 얹어도
          // 사진의 직모 방향으로 계속 되돌아가 "직모 위 잔물결"에 그침. 컬 100%면
          // 결 추종을 최대 65%까지 낮춰 아래 curl 웨이브가 형태를 주도하게 함.
          const w = Math.min(1, sample.coherence * 1.3) * (1 - curlStrength * 0.65);
          // 각도를 보간 (최단 회전 방향으로)
          let delta = targetDir - baseDir;
          while(delta > Math.PI) delta -= Math.PI*2;
          while(delta < -Math.PI) delta += Math.PI*2;
          dir = baseDir + delta * w;
          // (7차) 결 불연속 점수 — 마스크 안(_exitIdx 미확정)에서만, 초반 4스텝 제외
          if(_flowEndIdx === null && _exitIdx === null && s >= 4){
            if(Math.abs(delta) > FLOW_DISC.dirJump && sample.coherence > 0.2) _discScore += FLOW_DISC.wDir;
            if(_cohEma !== null && _cohEma > FLOW_DISC.dipMin && sample.coherence < _cohEma * FLOW_DISC.dipRatio) _discScore += FLOW_DISC.wDip;
            if(_discScore >= _discThr) _flowEndIdx = pts.length - 1;
          }
          _cohEma = (_cohEma === null) ? sample.coherence : _cohEma * 0.7 + sample.coherence * 0.3;
        } else {
          // 결방향을 못 믿는 구간(coherence 낮음 — 대부분 마스크 밖 ext 구간에서 발생).
          // "중력"으로 명명: 실제 머리카락도 뿌리 쪽은 결방향(웨이브·컬)을 유지하지만
          // 끝으로 갈수록 자체 무게 때문에 점점 아래로 처짐. 그래서 이 복원력을
          // 상수로 고정하지 않고 진행할수록(s/steps↑) 커지게 해서, 마스크를 막
          // 벗어난 시점의 baseDir이 대각선이어도 끝에 가서는 결국 아래쪽으로
          // 붙잡히도록 함. (예전엔 0.15 고정이라 대각선 방향을 거의 그대로
          // 유지한 채 곧게 뻗어나가 눈썹을 가로지르는 등의 문제가 있었음)
          let restore = Math.PI/2 - baseDir;
          while(restore > Math.PI) restore -= Math.PI*2;
          while(restore < -Math.PI) restore += Math.PI*2;
          // TEST: 얼굴박스 사각 블록 원인 검증용 임시 스위치. true면 중력 복원력을 0으로 만들어
          // ext 구간이 baseDir(결방향)을 그대로 유지하게 함. 블록이 옅어지면 중력이 증폭 원인 확정.
          // → 검증 완료, 원인 아니었음. clamp만으로는 대각선 처짐을 못 막아 중력 복원.
          const DEBUG_DISABLE_GRAVITY = false;
          const gravityPull = DEBUG_DISABLE_GRAVITY ? 0 : (0.15 + (s/steps) * 0.35); // 시작 0.15 → 끝 0.5
          dir = baseDir + restore * gravityPull;
          // (7차) 강한 결이 갑자기 사라짐(신뢰도 붕괴)도 겹 끝 증거 — 마스크 안에서만
          if(_flowEndIdx === null && _exitIdx === null && s >= 4 && _cohEma !== null && _cohEma > 0.3){
            _discScore += FLOW_DISC.wDip;
            if(_discScore >= _discThr) _flowEndIdx = pts.length - 1;
          }
          if(_cohEma !== null) _cohEma *= 0.7; // 저신뢰 표본 → EMA 감쇠
        }
      }

      // 방향 상한(clamp) 제거됨 — 기존엔 진행 방향이 아래(PI/2) 기준 ±60도를
      // 못 넘게 강제해서, coherence가 높아 결방향이 뚜렷한 구간에서도 결이
      // 실제로 옆으로 흐르거나 위로 말리면 그 형태를 못 그리고 억지로
      // 아래쪽으로 눌러버리는 제한이었음. "결필드를 그대로 재현한다"는
      // 방향과 정면으로 충돌하는 규칙이라 제거. base(마스크 안) 구간은
      // destination-in clip이 최종적으로 실제 머리 모양 밖을 걸러주므로
      // 안전장치 역할은 clip이 대신한다.

      // ── (8차) 연장(마스크 이탈 후) 구간 방향 수렴 ──
      // 마스크 밖은 실측 결 데이터가 없는 구간 — 길이를 늘렸을 때 위/옆으로
      // 이탈한 가닥이 그 방향 그대로 뻗쳐 실루엣 밖 "삐죽 가닥"이 되던 문제
      // (실기기 스크린샷: 정수리 위 스파이크·관자놀이 낙수). 이탈 확정 후엔
      // 매 스텝 아래(중력) 방향으로 강하게 수렴시켜 자연스럽게 늘어지게 함.
      if(_exitIdx !== null){
        let _rest = Math.PI/2 - dir;
        while(_rest > Math.PI) _rest -= Math.PI*2;
        while(_rest < -Math.PI) _rest += Math.PI*2;
        dir += _rest * 0.45;
      }

      baseDir = dir; // 다음 스텝 기준은 curl 적용 전 방향으로 저장 (누적 방지)

      // curl 슬라이더 + 자연스러운 미세 흔들림 추가 (완전 직선 방지)
      // — 이번 스텝의 "이동"에만 적용하고 baseDir에는 반영하지 않으므로 누적되지 않음
      // wiggleGrowth: 진행할수록(s/steps) 흔들림 폭을 키운다. 가닥 개수(numSections/numMid/numFine)는
      // 길이와 무관하게 고정인데, 가닥이 길어질수록(scaledLen↑) 같은 개수가 더 넓은 영역에 퍼져서
      // 가닥 사이 간격이 벌어지고 "세로줄"처럼 분리되어 보이는 문제가 있었음. 시작 지점 근처는
      // 기존과 거의 동일하게 촘촘히 유지하고, 끝으로 갈수록 좌우로 더 크게 흔들리게 해서
      // 인접 가닥끼리 자연스럽게 겹치도록(overlap) 만들어 그 틈을 시각적으로 메운다.
      const wiggleGrowth = 1 + (s/steps) * 1.8;
      const wiggle = (Math.sin((s+jitterSeed)*0.9) * 0.12 + (Math.random()-0.5)*0.10) * wiggleGrowth;
      // curl: 기존엔 가닥 전체에 걸쳐 한 번만 크게 휘는 반원(sin 반 주기) 형태라, 결방향(orientation)과
      // 충돌하면 갑자기 옆으로 삐져나가는 모양이 생겼음. 파마머리/라면 면발처럼 일정한 파장으로
      // 완만하게 반복되는 웨이브로 변경 — curl 슬라이더는 진폭(구불거림 정도)만 조절.
      // 웨이브 폭(펌 로드 사이즈, state.waveWidth 0~100): 로드가 작을수록(값↓)
      // 파장이 짧아져 촘촘한 스파이럴, 클수록(값↑) 파장이 길어져 느슨한 웨이브.
      // 실제 기법 그대로 — 로드 사이즈가 진폭이 아니라 "몇 번 감기느냐(파장)"를 결정.
      const CURL_WAVELENGTH_STEPS = 3 + waveT * 15; // 3(촘촘)~18(느슨) — gyeol 섹션별 웨이브 폭
      const curlPhase = (s / CURL_WAVELENGTH_STEPS) * Math.PI * 2;
      // ── 펌 진폭/위상 보정(2026-07-22) — "펌 조정이 안 먹힌다" 수정 ──
      // ① 진폭 계수 0.07→0.45: 예전 값은 컬 100%여도 방향 흔들림이 최대 ±4°
      //    (횡편차로 환산하면 마스크폭 768px 기준 약 2px)라 화면에서 식별 자체가
      //    불가능했음. 0.45면 컬 100%에서 ±26° 스윙(횡편차 약 12px) — 확실히
      //    보이면서 기본값 30%에선 ±7.7°로 여전히 은은함.
      // ② 위상을 뿌리 컬럼(ix) 기준으로 정렬: 예전엔 jitterSeed(가닥 인덱스 기반,
      //    사실상 무작위)만 써서 이웃 가닥끼리 파형이 전부 어긋나 서로 상쇄돼
      //    보였음. 실제 펌은 이웃 모발이 같은 로드에 감겨 파형이 나란함 —
      //    인접 컬럼(Δix≈3)이면 위상차 0.15rad 수준으로 결이 맞고, jitterSeed는
      //    약하게만 섞어 완전히 기계적인 줄무늬는 피함.
      // (9차) 진폭 0.45→0.85: 실측 직모 추종을 위에서 약화한 만큼 웨이브가 실제
      // 형태를 만들도록 진폭을 키움(컬 100%면 ±49° 스윙). 컬 30%(기본)에선 ±14°.
      const curlComponent = Math.sin(curlPhase + ix*0.05 + jitterSeed*0.15) * curlStrength * 0.85;
      // front.line 바이어스: 뿌리 근처(s=0)에서 가장 강하고 끝으로 갈수록 약해짐
      // (실제로도 앞머리 스타일링은 뿌리 쪽 방향이 인상을 좌우하고, 끝쪽은 결방향·
      // 중력에 자연스럽게 맡기는 게 더 사실적) — frontBias가 0(front 섹션 아님/
      // line=50)이면 곱해도 0이라 기존 동작과 완전히 동일.
      const frontBiasDecay = 1 - (s/steps) * 0.6;
      // ── gyeol 스타일링(전역 마무리) 가산 바이어스 — 전부 중립(0)이면 무영향 ──
      const prog = s/steps;
      const sweepBias = stSweep * 0.45 * prog;                       // 넘김: 진행할수록 한 방향으로 눕힘
      const flowBias  = side * stFlow * 0.55 * prog * prog;          // 결 흐름: 끝으로 갈수록 안/바깥 말림
      const volBias   = (s < 4) ? side * stVol * 0.25 * (1 - s/4) : 0; // 뿌리 볼륨: 뿌리 근처 바깥으로 띄움
      const partBias  = stPart * 0.30 * Math.max(0, 1 - prog*2);     // 가르마: 뿌리 근처 좌우 치우침
      const travelDir = dir + curlComponent + wiggle + frontBias * frontBiasDecay
                        + sweepBias + flowBias + volBias + partBias;

      // 실제 전진: travelDir은 "이미지 평면에서의 각도"이며 y축 기준 아래가 양수
      const dx = Math.cos(travelDir) * stepLen;
      const dy = Math.sin(travelDir) * stepLen;
      pts.push({x: cur.x + dx, y: cur.y + dy});

      // (6차) 마스크 이탈 실측 — 시작 2스텝은 경계 노이즈라 검사 생략(orientation과 동일)
      if(maskAt && _exitIdx === null && s >= 2){
        const np = pts[pts.length-1];
        if(maskAt(np.x, np.y)){ _offRun = 0; }
        else {
          _offRun++;
          if(_offRun >= 3){
            _exitIdx = pts.length - 1 - _offRun; // 마지막으로 마스크 안이었던 점
            if(stopAtExit) break;
          }
        }
      }
      // (7차) 줄이는 조정에선 결 불연속(겹 끝) 확정 시에도 추적 조기 중단
      if(stopAtExit && _flowEndIdx !== null) break;
    }

    pts.maskExitIdx = (_exitIdx !== null) ? Math.max(1, _exitIdx) : (pts.length - 1);
    pts.flowEndIdx = (_flowEndIdx !== null) ? Math.max(1, _flowEndIdx) : null;
    return pts;
}

/* ════════════════════════════════════════
   LINE CLEANUP (정돈층) — 1D 라인 정돈 단일 출처 (설계문서 §6)
   대상: hairEndY/scalpY 처럼 "컬럼(x)별 y픽셀"인 1D 라인(-1 = 결측).
   기존에 STEP10(computeScalpAndEndLines)과 가닥뿌리 보간 두 곳에 forward/
   backward 보간이 복제돼 있던 것을 여기로 흡수(단일 출처, 복제 금지).
   ⚠ 좌표계 경계: 이 헬퍼는 1D 라인 전용이다. 목/두상 밴드(phi·frac별 반경
     배열: fillBandsWithNearestNeighbor / NECK_STEP_MAX)와 두상 세로반경
     5퍼센타일 픽은 좌표계·자료구조·목적이 달라 여기로 묶지 않는다. 겉보기만
     "라인 정돈"이라고 억지로 합치는 것은 colorForSection 통합 실수의 재현이다
     (2단계 클램프는 NECK_STEP_MAX의 "개념"만 계승하고 코드는 공유 안 함).
   4단계(설계문서): ①빈곳 보간 ②이상치 클램프 ③스무딩 ④(약)대칭.
════════════════════════════════════════ */
// ① 빈 곳 보간: -1 열을 인접 유효값으로 forward/backward 채움.
//    (기존 두 곳의 보간 loop과 값이 완전히 동일함을 Node 교차검증으로 확인.)
function fillLine1D(arr){
  const n = arr.length;
  let last = -1;
  for(let i=0;i<n;i++){ if(arr[i]>=0) last=arr[i]; else if(last>=0) arr[i]=last; }
  let first = -1;
  for(let i=n-1;i>=0;i--){ if(arr[i]>=0) first=arr[i]; else if(first>=0) arr[i]=first; }
  return arr;
}
// ② 이상치 클램프: 좌우 window 이웃 median 대비 maxDev 이상 튀면 눌러줌.
//    median 기반이라 스파이크 하나에 안 휩쓸림. maxDev는 유효값 (p90-p10)*k로
//    자동 스케일(해상도별 하드코딩 픽셀값 회피). 유효값<5면 손대지 않음(보수적).
function clampLineOutliers1D(arr, opts){
  const win = (opts&&opts.window)||3;
  const k   = (opts&&opts.k)||0.35;
  const n = arr.length;
  const valid = [];
  for(let i=0;i<n;i++) if(arr[i]>=0) valid.push(arr[i]);
  if(valid.length < 5) return arr;
  const sorted = valid.slice().sort((a,b)=>a-b);
  const p10 = sorted[Math.floor(sorted.length*0.10)];
  const p90 = sorted[Math.floor(sorted.length*0.90)];
  const maxDev = Math.max(1e-6, (p90 - p10) * k);
  const out = arr.slice();
  const w = [];
  for(let i=0;i<n;i++){
    if(arr[i]<0) continue;
    w.length=0;
    for(let j=Math.max(0,i-win); j<=Math.min(n-1,i+win); j++){
      if(j!==i && arr[j]>=0) w.push(arr[j]);
    }
    if(w.length<2) continue;
    w.sort((a,b)=>a-b);
    const med = w[Math.floor(w.length/2)];
    const dev = arr[i]-med;
    if(dev >  maxDev) out[i] = med + maxDev;
    else if(dev < -maxDev) out[i] = med - maxDev;
  }
  for(let i=0;i<n;i++) arr[i]=out[i];
  return arr;
}
// ③ 스무딩: 유효값 구간 가우시안 가중 이동평균(결측 -1은 제외해 경계로 안 끌어들임).
//    선형 구간은 편향 없이 보존됨(Node 검증).
function smoothLine1D(arr, opts){
  const radius = (opts&&opts.radius)||2;
  const n = arr.length;
  const sigma = Math.max(0.5, radius/2);
  const wts = [];
  for(let d=-radius; d<=radius; d++) wts.push(Math.exp(-(d*d)/(2*sigma*sigma)));
  const out = arr.slice();
  for(let i=0;i<n;i++){
    if(arr[i]<0) continue;
    let acc=0, wsum=0;
    for(let d=-radius; d<=radius; d++){
      const j=i+d; if(j<0||j>=n) continue;
      if(arr[j]<0) continue;
      const wt=wts[d+radius]; acc+=arr[j]*wt; wsum+=wt;
    }
    if(wsum>0) out[i]=acc/wsum;
  }
  for(let i=0;i<n;i++) arr[i]=out[i];
  return arr;
}
// ④ 좌우 대칭 보정(약): 대칭 뷰에서 한쪽만 튀면 반대쪽 미러값과 약하게 평균.
//    개성 뭉갤 위험 커서 기본 비활성(blend=0). MVP 단계 호출부에선 켜지 않는다.
function symmetrize1D(arr, opts){
  const blend = (opts&&opts.blend)||0;
  if(blend<=0) return arr;
  const n=arr.length;
  const out=arr.slice();
  for(let i=0;i<n;i++){
    const m=n-1-i;
    if(arr[i]>=0 && arr[m]>=0) out[i]=arr[i]*(1-blend)+arr[m]*blend;
  }
  for(let i=0;i<n;i++) arr[i]=out[i];
  return arr;
}
// 편의 래퍼: 4단계 파이프라인. opts로 단계 on/off(기본 fill+clamp+smooth, 대칭 off).
//   예) cleanupLine1D(arr)                       → 보간+클램프+스무딩
//       cleanupLine1D(arr,{clamp:false,smooth:false}) → 보간만(기존 동작과 동일)
function cleanupLine1D(arr, opts){
  opts = opts || {};
  if(opts.fill  !== false) fillLine1D(arr);
  if(opts.clamp !== false) clampLineOutliers1D(arr, opts.clampOpts);
  if(opts.smooth!== false) smoothLine1D(arr, opts.smoothOpts);
  if(opts.symmetryBlend) symmetrize1D(arr, {blend:opts.symmetryBlend});
  return arr;
}

function drawHairStrands(ctx, fit, scalpY, hairEndY, maskW, maskH, hairCanvas, opts){

  const stylingForRender = opts.styling || state.styling || neutralStyling();

  // 점들 + 최종 색)를 저장할 배열 — 3D가 "함수로 새로 만드는" 대신 이 완성된
  // 경로를 그대로 3D 좌표로 들어올리기 위함(사용자 설계: "2D 렌더링 완료되고
  // 나면 가상 3D 좌표에 점들을 다 옮겨서 가상 렌더링").

  // "평균색×틴트" 대신 실제 픽셀 색 분포에서 뽑음(원본과 색감 일치 목적).

                         // 섞여 회색빛으로 보임)

  // 해상도 비례 스케일: 아래 각 레이어의 lineWidth 기본값들은 "실제 렌더링되는 캔버스가
  // 705px 폭일 때" 눈으로 보고 튜닝됐음. ctx.lineWidth는 캔버스 픽셀 공간(=fit.dw 기준)
  // 에서 적용되는 값인데, 가닥 좌표 자체는 toCanvasX/Y가 (fit.dw/maskW) 비율로 이미
  // maskW(세그멘테이션 처리 해상도, 최대 768) → fit.dw(실제 화면 표시 폭, 폰 CSS 폭
  // 기준이라 보통 380~430px 수준)로 압축해서 그린다.
  // 버그 수정: 예전엔 resScale을 maskW/705로 계산했는데, 이건 "촬영 해상도"만 반영하고
  // "실제로 화면에 얼마나 작게 그려지는지"(fit.dw)는 전혀 반영을 안 함 — 그 결과 fit.dw가

  // 보였음(스크린샷에서 보인 마커펜 같은 뭉툭한 가닥의 직접 원인). → 실제 캔버스 렌더
  // 폭(fit.dw) 기준으로 스케일해야 좌표 압축 비율과 굵기가 항상 같이 움직인다.

  // 제약(1px 미만이면 브라우저가 알파를 낮춰 흐리게 그림)이라 resScale로 같이 줄어들면

  // 1200 고해상도에서 원본 머리카락과 나란히 놓고 보니 가닥이 여전히 굵음.

  // 빠져서 어떤 레이어도 거기 뿌리를 못 심었음 — "가닥이 부족한 게 아니라 아예 심을
  // 자리 자체가 없었던" 문제. → 양옆 유효 컬럼 사이 간격이 좁으면(=국소적 인식 실패로
  // 판단) 보간값으로 메워서 후보에 포함시킴. 단, 진짜로 머리가 없는 넓은 영역(배경,
  // 얼굴 등)까지 메워버리면 안 되므로 간격 상한(MAX_GAP_PX)을 둬서, 그보다 넓은 gap은
  // 기존처럼 그대로 배제.
  const leftValidX = new Int32Array(maskW).fill(-1);
  const rightValidX = new Int32Array(maskW).fill(-1);
  { let lv=-1; for(let x=0;x<maskW;x++){ if(scalpY[x]>=0) lv=x; leftValidX[x]=lv; } }
  { let rv=-1; for(let x=maskW-1;x>=0;x--){ if(scalpY[x]>=0) rv=x; rightValidX[x]=rv; } }

  const validCols = [];

  //   마스크)로 destination-in clip을 걸어서, 실제 인식된 머리카락 영역 밖(얼굴·안경·배경
  //   등)으로는 절대 못 나가게 함. "지금 이 사람의 실제 머리 모양"을 그대로 보여주는 단계.
  // extOffscreen: 슬라이더로 origLen을 넘겨서 늘어난 구간(연장분)만 → clip 없이 자유롭게
  //   그림. "스타일링 시뮬레이션으로 늘려본" 부분이라 원본 마스크 밖으로 나가는 게 정상.
  // 보폭(한 스텝의 물리적 이동 거리)을 고정값으로 둔다 — 더 이상 목표 길이(targetLen)에
  // 비례해서 커지지 않는다. 이렇게 해야 origLen까지 가는 구간이 delta(슬라이더로 늘린 양)와

  }

  // 이제 각 가닥은: ① 실측 결 필드를 따라 추적하며 사진의 헤어 마스크를 벗어나는
  // 지점(maskExitIdx)을 실측 → 그 호장이 이 가닥의 "실측 중립 길이" ② 섹션 조정
