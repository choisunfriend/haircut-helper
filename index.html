function toggleVoice(){
  if(listening){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('음성인식은 Chrome에서만 작동해요.');return;}
  recognition=new SR();
  recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=false;
  recognition.onresult=e=>{ const t=e.results[e.results.length-1][0].transcript.trim(); handleVoiceCmd(t); };
  recognition.onerror=()=>stopVoice();
  recognition.onend=()=>{if(listening){try{recognition.start();}catch(e){}}};
  recognition.start(); listening=true;
  document.getElementById('voiceBtn').classList.add('listening');
  document.getElementById('voiceBtnLabel').textContent='듣는 중… (탭하여 종료)';
}
function stopVoice(){
  listening=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  document.getElementById('voiceBtn').classList.remove('listening');
  document.getElementById('voiceBtnLabel').textContent='음성으로 조정하기';
}
function handleVoiceCmd(text){
  document.getElementById('voiceTranscript').innerHTML='인식됨: <b>"'+text+'"</b>';
  const t=text.replace(/\s/g,'');
  const STEP=15; let matched=false;

  // 섹션 선택
  const sectionMap = {
    '크라운':'crown','정수리':'crown',
    '프론트':'front','앞머리':'front',
    '템플':'temple','관자':'temple',
    '사이드':'side','옆머리':'side',
    '후두부':'occipital','뒤통수':'occipital',
    '네이프':'nape','목선':'nape',
  };
  let targetSection = state.currentSection;
  Object.entries(sectionMap).forEach(([kw,sid])=>{ if(t.includes(kw)) targetSection=sid; });

  const adj=(param,delta)=>{
    const s=state.sections[targetSection];
    if(s[param]===undefined) return;
    s[param]=Math.max(0,Math.min(100,s[param]+delta));
    propagateSectionChange(targetSection,param);
    buildSectionTabs(); matched=true;
  };
  const has=arr=>arr.some(kw=>t.includes(kw));

  if(has(['길게','늘려','길이늘','더길'])) adj('length',STEP);
  else if(has(['짧게','줄여','길이줄','더짧'])) adj('length',-STEP);
  else if(has(['볼륨추가','볼륨올','볼륨업','풍성'])) adj('volume',STEP);
  else if(has(['볼륨줄','볼륨내','납작'])) adj('volume',-STEP);
  else if(has(['컬추가','웨이브추가','더컬'])){state._globalCurl=Math.min(100,state._globalCurl+STEP);matched=true;}
  else if(has(['펴줘','컬줄','스트레이트','직모'])){state._globalCurl=Math.max(0,state._globalCurl-STEP);matched=true;}
  else if(t.includes('다음각도')||t.includes('다음앵글')){ cycleAngle(1); matched=true; }
  else if(t.includes('이전각도')||t.includes('이전앵글')){ cycleAngle(-1); matched=true; }
  else if(t.includes('비교')||t.includes('완료')){ navTo('compare'); matched=true; }
  else if(t.includes('초기화')||t.includes('리셋')){ resetSections(); matched=true; }

  if(matched){ document.getElementById('slider-globalCurl').value=state._globalCurl; document.getElementById('val-globalCurl').textContent=state._globalCurl; drawAdjustPreview(); }
  else showToast('명령을 이해하지 못했어요: "'+text+'"');
}
function cycleAngle(dir){
  let idx=ANGLES.indexOf(state.currentViewAngle);
  idx=(idx+dir+4)%4; state.currentViewAngle=ANGLES[idx];
  renderAngleSwitches();
  drawAdjustPreview(); drawCompare();
}

/* ════════════════════════════════════════
   3D 두상 (2단계 프로토타입)
   ────────────────────────────────────────
   방향: 지금은 절차적(procedural) 도형으로 두상을 대충 근사해서 화면에
   띄우지만, 코드 구조는 처음부터 "진짜 3D 두상 파일(.glb)로 교체 가능"
   하게 짜둠 — HEAD_MESH_SOURCE.type을 'gltf'로 바꾸고 url만 넣으면
   loadHeadMesh()가 알아서 GLTFLoader 경로를 타도록 분기되어 있음.
   실제 진짜 메시가 생기기 전까지는 procedural 분기만 쓰임.
════════════════════════════════════════ */
const HEAD_MESH_SOURCE = {
  type: 'procedural', // 'procedural' | 'gltf' — 나중에 실제 두상 파일 생기면 'gltf'+url로 교체
  url: null,           // 예: '/assets/generic_head.glb'
};

let model3D = null; // { renderer, scene, camera, headGroup, hairMesh, animId, initialized, container }
// setupModel3DScreen()이 호출될 때마다 +1. 사진 데칼은 비동기로 로드되므로,
// 로드 도중 화면을 벗어났다 다시 들어와 headGroup이 통째로 재구성된 경우
// 오래된 데칼 Promise가 새 headGroup에 잘못 붙는 걸 이 번호로 막는다.
let model3DGeneration = 0;

function clamp(v,lo,hi){ return Math.max(lo, Math.min(hi, v)); }

// bbox({minX,maxX,minY,maxY}, 전부 이미지 정규화좌표 0~1) → 중심점 + 가로폭.
function featureCenter(bbox){
  return { x:(bbox.minX+bbox.maxX)/2, y:(bbox.minY+bbox.maxY)/2, w:(bbox.maxX-bbox.minX) };
}

// state.landmarks.front + state.hairMasks.front(실제 캡처 픽셀 크기)로
// "이 사람 얼굴이 대략 얼마나 갸름한지/넓은지"를 실측해서 절차적 두상의
// 가로/세로 스케일 보정 계수를 뽑는다. 랜드마크 정규화좌표는 각각 이미지
// 가로/세로 기준이라 그대로 비율 비교하면 안 되고 실제 픽셀 폭/높이를
// 곱해줘야 진짜 종횡비가 나옴. 오검출로 두상이 그로테스크하게 찌그러지는
// 걸 막기 위해 배율 범위를 좁게 clamp.
function getFaceMetrics(){
  const lm = (state.landmarks && state.landmarks.front) || getEstimatedLandmarks('front');
  const imgW = (state.hairMasks && state.hairMasks.front && state.hairMasks.front.w) || 1;
  const imgH = (state.hairMasks && state.hairMasks.front && state.hairMasks.front.h) || 1;

  const faceHeightPx = Math.max(1, (lm.chinY - lm.browTopY) * imgH);
  const faceWidthPx  = Math.max(1, Math.abs(lm.rEarX - lm.lEarX) * imgW);
  const aspect = faceHeightPx / faceWidthPx; // 클수록 갸름한 얼굴, 작을수록 둥근/넓은 얼굴

  const BASELINE_ASPECT = 1.55; // 기존 고정 스케일(0.78/0.85)이 암묵적으로 가정하던 기준 비율
  const ratio = clamp(aspect / BASELINE_ASPECT, 0.72, 1.38);
  const widthFactor  = clamp(1/Math.sqrt(ratio), 0.85, 1.18);
  const heightFactor = clamp(Math.sqrt(ratio), 0.85, 1.18);

  const projector = makeFaceProjector(lm, widthFactor, heightFactor);
  return { lm, imgW, imgH, widthFactor, heightFactor, projector };
}

// 이미지 정규화좌표(0~1) → 두상 로컬(x,y) 근사 변환. "눈높이/턱높이" 두
// 기준점을 두상 로컬 y좌표 두 지점(EYE_MESH_Y/CHIN_MESH_Y)에 맞추는 아핀
// 변환 하나로 세로를, "좌/우 귀" 두 기준점을 ±EAR_MESH_X에 맞추는 아핀
// 변환 하나로 가로를 처리. 진짜 카메라 캘리브레이션이 아니라 "실측 비율에
// 대략 맞는 자리" 수준 근사 — 이 파이프라인 전체가 원래 이 수준(procedural
// placeholder)이라 과설계하지 않음. widthFactor/heightFactor는
// getFaceMetrics()가 이미 반영한 두상 스케일과 같은 값을 받아 기준점 자체가
// 두상 크기에 맞춰 같이 움직이게 한다.
function makeFaceProjector(lm, widthFactor, heightFactor){
  const EYE_MESH_Y = 0.15; // headMesh.position.y와 동일(구 적도 = 이 높이)
  const CHIN_MESH_Y = 0.15 - 0.70*heightFactor;
  const denomY = (lm.chinY - lm.eyeY) || 0.001;
  const bY = (EYE_MESH_Y - CHIN_MESH_Y) / denomY;
  const aY = EYE_MESH_Y + bY * lm.eyeY;
  const toMeshY = (v)=> aY - bY * v;

  const EAR_MESH_X = 0.78 * widthFactor * 0.82; // 적도 반경보다 살짝 안쪽(귀는 옆으로 살짝 들어간 위치)
  const lx = Math.min(lm.lEarX, lm.rEarX), rx = Math.max(lm.lEarX, lm.rEarX);
  const denomX = (rx - lx) || 0.001;
  const bX = (2*EAR_MESH_X) / denomX;
  const toMeshX = (u)=> (u - lx) * bX - EAR_MESH_X;

  return { toMeshX, toMeshY, EAR_MESH_X, bX, bY };
}

// 절차적 두상: 타원(스케일된 구)으로 두상 근사. 이전엔 비율·피부색·이목구비
// 위치가 전부 눈대중 고정값이었는데, 이제 getFaceMetrics()가 뽑아낸 실측
// 종횡비/좌표 변환(projector)과 실제 두피색(skinColorCss)을 반영해서 "이
// 사람 사진에서 뽑을 수 있는 정보는 최대한 쓴" 근사치로 만든다. 여전히
// 진짜 3D 스캔은 아니고 절차적 근사(placeholder)라는 성격 자체는 그대로.
// 두상 본체(실측 종횡비 반영한 타원). buildProceduralHead()에서 분리됨(로직 동일).
function buildHeadMesh(widthFactor, heightFactor, headMat){
  const headGeo = new THREE.SphereGeometry(1, 32, 32);
  headGeo.scale(0.78*widthFactor, 1*heightFactor, 0.85*widthFactor);
  const headMesh = new THREE.Mesh(headGeo, headMat);
  headMesh.position.y = 0.15;
  return headMesh;
}

// 목(스타일 확정 후 3단계에서 의상 3D를 붙일 연결점 — 지금은 단순 원통).
// buildProceduralHead()에서 분리됨(로직 동일).
function buildNeckMesh(widthFactor, skinColor){
  const neckColor = skinColor.clone().multiplyScalar(0.94); // 살짝 어둡게(그림자 자리표시)
  const neckGeo = new THREE.CylinderGeometry(0.42*widthFactor, 0.5*widthFactor, 0.6, 24);
  const neckMat = new THREE.MeshStandardMaterial({ color: neckColor, roughness: 0.85 });
  const neckMesh = new THREE.Mesh(neckGeo, neckMat);
  neckMesh.position.y = -0.85;
  neckMesh.name = 'neckAttachPoint'; // 3단계에서 의상 메시 정렬 기준점으로 재사용 예정
  return neckMesh;
}

// 귀 — 실측 귀 x좌표(lEarX/rEarX)·귀 높이(earY)로 배치.
// 주의: projector.EAR_MESH_X는 "사진 좌표 보정용 기준점"이라 두상 적도 반경보다
// 일부러 안쪽 값 — 그걸 귀 자체의 위치로 그대로 쓰면 귀가 두상 구체 표면보다
// 안쪽에 파묻혀 렌더링에서 아예 안 보이는 버그가 남(실측 확인함). 귀는 그
// 높이(y)에서의 실제 두상 표면 반경을 구해서 그 바로 바깥쪽에 반쯤 걸치도록
// 따로 계산. buildProceduralHead()에서 분리됨(로직 동일).
function buildEarMeshes(widthFactor, heightFactor, projector, lm, headMat){
  const earGeo = new THREE.SphereGeometry(0.09*widthFactor, 10, 10);
  earGeo.scale(0.55, 1, 0.75);
  const earHalfW = 0.09*widthFactor*0.55;
  const earY = projector.toMeshY(lm.earY);
  const earLocalY0 = (earY - 0.15) / heightFactor; // headMesh.position.y·y스케일 역산
  const earSurfaceX = 0.78*widthFactor * Math.sqrt(Math.max(0.05, 1 - earLocalY0*earLocalY0));
  const ears = [];
  [-1, 1].forEach(side=>{
    const ear = new THREE.Mesh(earGeo, headMat);
    ear.position.set(side*(earSurfaceX + earHalfW*0.55), earY, 0.02);
    ears.push(ear);
  });
  return ears;
}

// 이목구비(눈/눈썹/입/코) — 사진 데칼(buildFacePhotoDecal)이 나중에 붙으면 이
// 그룹은 숨겨짐(이중 렌더 방지). 데칼이 없거나 아직 로드 전이면 이게 유일한
// 얼굴 표현이므로 항상 먼저 그려서 화면이 비지 않게 함.
// buildProceduralHead()에서 분리됨(로직 동일).
function buildFaceDetailGroup(widthFactor, projector, lm, headMat){
  const faceDetailGroup = new THREE.Group();
  faceDetailGroup.name = 'proceduralFaceDetail';
  const eyeZ = 0.72*widthFactor, browZ = 0.75*widthFactor, mouthZ = 0.70*widthFactor, noseZ = 0.80*widthFactor;
  const eyeGeo = new THREE.SphereGeometry(0.055, 12, 12);
  const eyeMat = new THREE.MeshStandardMaterial({ color: 0x2A2118 });

  if(lm.features){
    // 실측 랜드마크 bbox로 눈/눈썹/입/코(근사) 배치.
    const leC = featureCenter(lm.features.leftEye), reC = featureCenter(lm.features.rightEye);
    const lbC = featureCenter(lm.features.leftBrow), rbC = featureCenter(lm.features.rightBrow);
    const moC = featureCenter(lm.features.mouth);

    [leC, reC].forEach(c=>{
      const eye = new THREE.Mesh(eyeGeo, eyeMat);
      eye.position.set(projector.toMeshX(c.x), projector.toMeshY(c.y), eyeZ);
      faceDetailGroup.add(eye);
    });

    const browMat = new THREE.MeshStandardMaterial({ color: 0x1E1712, roughness:0.9 });
    [lbC, rbC].forEach(c=>{
      const browW = Math.max(0.05, c.w * projector.bX);
      const browGeo = new THREE.SphereGeometry(1, 8, 6);
      browGeo.scale(browW*0.5, 0.02, 0.02);
      const brow = new THREE.Mesh(browGeo, browMat);
      brow.position.set(projector.toMeshX(c.x), projector.toMeshY(c.y), browZ);
      faceDetailGroup.add(brow);
    });

    const mouthW = Math.max(0.06, moC.w * projector.bX);
    const mouthGeo = new THREE.SphereGeometry(1, 10, 6);
    mouthGeo.scale(mouthW*0.5, 0.025, 0.02);
    const mouthMat = new THREE.MeshStandardMaterial({ color: 0x7A4640, roughness:0.7 });
    const mouth = new THREE.Mesh(mouthGeo, mouthMat);
    mouth.position.set(projector.toMeshX(moC.x), projector.toMeshY(moC.y), mouthZ);
    faceDetailGroup.add(mouth);

    // 코: 전용 랜드마크가 없어 눈 중심 x·눈-입 중간 y로 근사.
    const noseGeo = new THREE.ConeGeometry(0.045*widthFactor, 0.10, 10);
    const nose = new THREE.Mesh(noseGeo, headMat);
    const noseX = (projector.toMeshX(leC.x)+projector.toMeshX(reC.x))/2;
    const noseY = (projector.toMeshY(leC.y)+projector.toMeshY(moC.y))/2;
    nose.position.set(noseX, noseY, noseZ);
    nose.rotation.x = Math.PI/2; // 콘 끝(+y)이 얼굴 앞(+z)을 향하도록
    faceDetailGroup.add(nose);
  } else {
    // 랜드마크 감지 실패(추정치 폴백): 기존과 동일하게 대략적인 고정 위치에 눈만 배치.
    [-0.28, 0.28].forEach(x=>{
      const eye = new THREE.Mesh(eyeGeo, eyeMat);
      eye.position.set(x*widthFactor, projector.toMeshY(lm.eyeY), eyeZ);
      faceDetailGroup.add(eye);
    });
  }
  return faceDetailGroup;
}

// 절차적 두상: 타원(스케일된 구)으로 두상 근사. getFaceMetrics()가 뽑아낸 실측
// 종횡비/좌표 변환(projector)과 실제 두피색(skinColorCss)을 반영해서 "이 사람
// 사진에서 뽑을 수 있는 정보는 최대한 쓴" 근사치로 만든다. 여전히 진짜 3D
// 스캔은 아니고 절차적 근사(placeholder)라는 성격 자체는 그대로.
// (2026-07-12: 너무 길어서 다루기 힘들다는 지적으로 두상/목/귀/이목구비 4개
// 함수로 분리 — 각 부위 로직 자체는 한 글자도 안 바꾸고 그대로 옮김.)
function buildProceduralHead(faceMetrics, skinColorCss){
  const group = new THREE.Group();
  const { lm, widthFactor, heightFactor, projector } = faceMetrics;
  const skinColor = new THREE.Color(skinColorCss || '#E8C39E');
  const headMat = new THREE.MeshStandardMaterial({ color: skinColor, roughness: 0.85, metalness: 0 });

  const headMesh = buildHeadMesh(widthFactor, heightFactor, headMat);
  group.add(headMesh);

  const neckMesh = buildNeckMesh(widthFactor, skinColor);
  group.add(neckMesh);

  buildEarMeshes(widthFactor, heightFactor, projector, lm, headMat).forEach(ear=>group.add(ear));

  const faceDetailGroup = buildFaceDetailGroup(widthFactor, projector, lm, headMat);
  group.add(faceDetailGroup);

  return { group, headMesh, faceDetailGroup };
}

function loadImageAsync(src){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    img.onload = ()=>resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

// 실측 촬영 사진(state.shots.front) 자체를 두상 앞면에 얇게 띄운 평면에
// 입혀서 "그 사람 얼굴처럼 보이는" 효과를 낸다. 구면에 직접 UV 투영하는
// 진짜 텍스처 매핑은 왜곡·이음새 위험이 커서 채택하지 않음 — 대신 캔버스
// 상에서 destination-in + radial gradient로 가장자리를 페더 처리해 두상
// 피부색과 하드엣지 없이 섞이게 함. 위치/크기는 makeFaceProjector와 동일한
// 실측 기준점(눈/귀/턱)으로 정렬하므로 촬영 각도·얼굴 크기가 달라도 자동
// 정렬됨. 알려진 한계: 평면이라 옆모습으로 회전하면 거의 안 보임(정면
// 전용 효과) — 나중에 진짜 두상 3D 스캔(.glb)으로 바뀌면 이 로직 자체가
// 통째로 필요 없어짐.
async function buildFacePhotoDecal(faceMetrics){
  const src = state.shots && state.shots.front;
  // 실측 랜드마크 없인 정렬 기준점이 없어 위치가 부정확해짐 — 추정치로
  // 억지로 배치하면 오히려 더 어색해서, 이 경우엔 스킵하고 절차적
  // 이목구비(faceDetailGroup)를 그대로 보여주는 쪽이 낫다고 판단.
  if(!src || !state.landmarks || !state.landmarks.front) return null;

  let img;
  try{ img = await loadImageAsync(src); }
  catch(e){ console.warn('데칼용 이미지 로드 실패:', e); return null; }

  const MAX_DECAL_DIM = 512; // 원본 캡처(최대 1024)보다 작게 — 데칼은 성능보다 정렬이 중요하지 해상도는 이 정도로 충분
  let dw = img.width, dh = img.height;
  if(Math.max(dw,dh) > MAX_DECAL_DIM){ const s = MAX_DECAL_DIM/Math.max(dw,dh); dw=Math.round(dw*s); dh=Math.round(dh*s); }

  const canvas = document.createElement('canvas');
  canvas.width = dw; canvas.height = dh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, 0, 0, dw, dh);

  const lm = faceMetrics.lm;
  if(!lm.features) return null; // features bbox 없으면(폴백 랜드마크) 페더 중심도 못 잡음

  const eyeCX = (
    (lm.features.leftEye.minX + lm.features.leftEye.maxX)/2 +
    (lm.features.rightEye.minX + lm.features.rightEye.maxX)/2
  ) / 2;
  const cx = eyeCX * dw;
  // 세로 범위는 일부러 browTopY(눈썹 위) 아래로만 잡는다 — 그 위(이마~헤어라인)는
  // 앞머리/잔머리가 걸쳐 있을 확률이 높은 영역이라, 거기까지 사진을 그대로 오려
  // 붙이면 실제 사용자 사진에서 이마에 어두운 머리카락 얼룩이 번져 보이는
  // 사고가 나기 쉬움(합성 테스트 이미지로 재현·확인함). 대신 눈썹선을 상단
  // 경계로 고정해 어떤 헤어스타일/앞머리 사진이 와도 항상 안전하게 동작.
  const topY = lm.browTopY * dh;
  const botY = lm.chinY * dh * 1.06; // 턱 아래 살짝 여유
  const cy = (topY + botY) / 2;
  const halfH = (botY - topY) / 2;
  const ry = Math.max(4, halfH * 0.92); // 상단이 browTopY보다 살짝 더 안쪽에 오도록 여유
  const rx = Math.max(4, Math.abs(lm.rEarX - lm.lEarX) * dw * 0.56);

  ctx.globalCompositeOperation = 'destination-in';
  const grad = ctx.createRadialGradient(cx, cy, Math.min(rx,ry)*0.35, cx, cy, Math.max(rx,ry));
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.7, 'rgba(255,255,255,0.9)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  ctx.fillStyle = grad;
  ctx.beginPath(); ctx.ellipse(cx, cy, rx, ry, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = 'source-over';

  // 캔버스 전체(=사진 전체, 배경/어깨/여백 포함)를 그대로 평면 텍스처로 쓰면
  // 두상보다 훨씬 큰 평면이 나옴(사진 속 얼굴이 프레임의 일부만 차지하므로).
  // 페더 타원을 살짝 여유 있게 감싸는 만큼만 잘라내서, 평면 크기가 항상
  // "얼굴 크기"에 비례하게(=두상 크기와 같은 축척으로) 만든다.
  const cropHalfW = rx * 1.05, cropHalfH = ry * 1.15;
  const cropX0 = Math.max(0, cx - cropHalfW), cropY0 = Math.max(0, cy - cropHalfH);
  const cropX1 = Math.min(dw, cx + cropHalfW), cropY1 = Math.min(dh, cy + cropHalfH);
  const cropW = Math.max(1, Math.round(cropX1 - cropX0)), cropH = Math.max(1, Math.round(cropY1 - cropY0));

  const faceCanvas = document.createElement('canvas');
  faceCanvas.width = cropW; faceCanvas.height = cropH;
  faceCanvas.getContext('2d').drawImage(canvas, cropX0, cropY0, cropW, cropH, 0, 0, cropW, cropH);

  const texture = new THREE.CanvasTexture(faceCanvas);
  texture.needsUpdate = true;

  // 두상 로컬 좌표계에서 픽셀당 월드유닛 크기 — 세로 기준점(눈~턱) 아핀변환의
  // 기울기(bY)를 그대로 재사용해 크롭된 얼굴 영역을 두상과 같은 축척으로 배치.
  const worldPerPixel = faceMetrics.projector.bY / dh;
  const planeW = cropW * worldPerPixel;
  const planeH = cropH * worldPerPixel;

  const mat = new THREE.MeshBasicMaterial({ map: texture, transparent: true, depthWrite: false });
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(planeW, planeH), mat);
  plane.name = 'facePhotoDecal';
  plane.position.set(
    faceMetrics.projector.toMeshX((cropX0+cropX1)/2 / dw),
    faceMetrics.projector.toMeshY((cropY0+cropY1)/2 / dh),
    0.92 * faceMetrics.widthFactor // 두상 표면(최대 0.85*widthFactor)보다 확실히 앞
  );
  return plane;
}

/* ── 스캘프(두피) 좌표계 ──
   phi: 정수리(top)=0에서 목쪽으로 갈수록 커지는 극각(라디안). 0=정수리,
   π/2(1.57)=귀 높이(적도), π(3.14)=턱 밑. 대략 0~2.5 사용.
   theta: 정면(+Z 방향)=0 기준 방위각. +/- 로 좌우 대칭, π=정후면.
   실측 헤어라인 데이터가 아니라 "6개 섹션이 두상 어디쯤 위치하는지"를
   대략적으로 근사한 배치표 — 진짜 헤어라인 인식 데이터가 3D에도 연동되면
   교체될 자리표시자. (가닥 "개수"는 더 이상 여기 없음 — 아래 STRAND_COUNT_*
   참고, computeStrandCount()가 계산.)
   ※ 버그 수정 이력(theta): center±spread를 섹션마다 눈대중으로 잡다 보니
   side(최대 약 78°)와 occipital/nape(최소 약 120°) 사이 약 42° 구간에
   어느 섹션도 안 걸치는 빈 틈이 있었음 — 실기기 스크린샷에서 "귀 뒤쪽
   대각선으로 대머리 띠"가 그대로 보임. 아래 값은 각 섹션 경계가 서로
   살짝씩 겹치도록(빈틈 없이) 다시 계산한 것 — 오른쪽 반원(0~180°) 기준
   front 0~39°, temple 26~60°, side 51~103°, occipital/nape 94~180°로
   이어지게 함(왼쪽은 자동 대칭). */
const SCALP_ZONES = {
  crown:     { phiRange:[0.05, 0.60], thetas:'full',         thetaSpread:0    },
  front:     { phiRange:[0.55, 0.95], thetas:[0],             thetaSpread:0.68 },
  temple:    { phiRange:[0.60, 1.05], thetas:[0.75,-0.75],    thetaSpread:0.30 },
  side:      { phiRange:[0.95, 1.75], thetas:[1.35,-1.35],    thetaSpread:0.45 },
  occipital: { phiRange:[0.70, 1.65], thetas:[Math.PI],       thetaSpread:1.40 },
  nape:      { phiRange:[1.55, 2.35], thetas:[Math.PI],       thetaSpread:1.50 },
};

/* ── 가닥 개수: "실제 헤어 숫자"가 나오게 ──
   기존엔 섹션당 개수가 눈대중 고정값(정수리40/사이드34/...)이었음 — "왜 168개냐"는
   지적에 정직한 답은 "근거 없이 지어낸 값"이었음. 2D 조정화면(drawStrandLayer)은
   이미 실측 튜닝을 거친 진짜 가닥 개수를 쓰고 있으므로(레이어 4개: 루트확산
   460~790 + 굵은섹션 61~96 + 중간가닥 256~528 + 잔가닥 330~660 = 뷰 하나당
   합계 약 1100~2100개, volume 0~100에 따라 스케일), 그 총량을 그대로 가져와
   기존 SCALP_ZONES 상대 비율(정수리:프론트:템플:사이드:후두부:네이프=
   40:20:16:34:30:28, 합계 168)로 섹션별 배분한다. 3D는 섹션마다 자기 volume류
   파라미터(volume/blend/layer)가 따로 있으므로, 2D처럼 뷰 전체 슬라이더 하나가
   아니라 섹션별로 독립적으로 늘고 줄게 했다.
   ⚠ 성능 트레이드오프: 2D는 캔버스에 선 하나 긋는 것(거의 공짜)이지만 3D는
   가닥 하나가 TubeGeometry Mesh 하나(=드로우콜 하나)라, 168→최대 2100개면
   드로우콜도 그만큼 늘어남. 일단 "진짜 개수"부터 반영하고, 저사양 기기에서
   버벅이면 그때 BufferGeometryUtils.mergeGeometries로 섹션당 1개 지오메트리로
   합치는 걸 다음 최적화로 처리(먼저 만들고 문제 생기면 고치는 순서로 진행). */
const STRAND_COUNT_BASE  = { crown:262, front:131, temple:105, side:222, occipital:197, nape:184 };
const STRAND_COUNT_SCALE = { crown:238, front:119, temple:95,  side:202, occipital:179, nape:167 };
function computeStrandCount(sectionId, volumeParam){
  const base = STRAND_COUNT_BASE[sectionId] ?? 100;
  const scale = STRAND_COUNT_SCALE[sectionId] ?? 100;
  const v = Math.max(0, Math.min(100, volumeParam ?? 50));
  return Math.round(base + (v/100) * scale);
}

// 두피 위 한 점(phi,theta)을 headMesh 로컬 좌표로 변환.
// headMesh가 SphereGeometry(1).scale(0.78,1,0.85) + position.y=0.15 이므로
// 그 스케일/오프셋을 그대로 따라간다. liftOut은 두상 표면보다 살짝 띄우는
// 배율(뿌리가 표면에 파묻혀 z-fighting 나지 않도록).
function scalpPointToWorld(phi, theta, liftOut){
  const r = liftOut ?? 1.01;
  const x = Math.sin(phi) * Math.sin(theta) * 0.78 * r;
  const y = Math.cos(phi) * r + 0.15;
  const z = Math.sin(phi) * Math.cos(theta) * 0.85 * r;
  return new THREE.Vector3(x, y, z);
}

/* ── (a) 실측 사진 기반 3D 형태 보정 ──
   기존엔 3D 가닥의 길이/부풀기가 오직 조정화면 슬라이더(length/volume) 값에서만
   나왔음 — 정작 4장이나 찍은 실제 사진의 실루엣(hairMasks.scalpY/hairEndY)은
   avgColor(색상) 말고는 전혀 안 쓰이고 있었음("가닥이 다 랜덤 아니야?" 지적).
   여기서부터는 각 섹션이 실제로 어느 뷰에서 어떤 신뢰도로 촬영됐는지
   (state.viewMapping·getViewPoseConfidence)와 그 뷰의 실측 헤어 실루엣 길이를
   결합해서 "이 섹션은 실제 사진에서 얼마나 뻗어나와 보였는지" 배율(factor)을
   뽑고, 사진 커버리지가 부족한 섹션만 그 부족분(1-confidence)만큼 AI 추정치로
   보완한다. 진짜 포토그래메트리(SfM)는 4장(90°가 아니라 실측 임의각)으로는
   성립 자체가 안 돼서 제외 — 대신 이미 갖고 있던 실측 포즈+실루엣 데이터를
   최대한 활용하는 절충안. */

// 뷰(angle)의 포즈 추정이 얼마나 신뢰할 만한지 0~1로. getViewYawDeg()의 우선순위
// 체인(실측 PnP > 근사 비율 > 슬롯 기본값)과 동일한 기준을 신뢰도 점수로 환산.
function getViewPoseConfidence(angle){
  const lm = state.landmarks && state.landmarks[angle];
  if(lm && typeof lm.poseYawDeg === 'number' && !Number.isNaN(lm.poseYawDeg)) return 1.0; // 실측 PnP 포즈(가장 정확)
  if(lm && typeof lm.yaw === 'number') return 0.6; // 랜드마크는 있지만 포즈 행렬 분해 실패 → 귀 간격 비율 근사
  return 0.25; // 랜드마크 감지 자체 실패("[우측] 랜드마크 없음" 같은 경우) → 촬영 슬롯 기본 각도로 폴백
}

// 섹션 하나에 대해 특정 뷰(angle)가 얼마나 신뢰할 만한 실측 데이터를 주는지.
// = state.viewMapping[sectionId][angle](실측 yaw 기반 각도 근접도, 2D 섹션
// 블렌딩과 동일 로직) × getViewPoseConfidence(angle)(그 뷰 포즈 자체의 신뢰도).
// computeSectionRealExtent()·pickBestRealView() 둘 다 이 식을 따로 갖고
// 있었던 걸 여기로 합침(동작 동일, 계산식만 한 곳으로).
function getViewWeight(sectionId, angle){
  const mapping = (state.viewMapping && state.viewMapping[sectionId]) || {};
  return (mapping[angle] ?? 0) * getViewPoseConfidence(angle);
}

// 섹션의 실측 x범위(SECTIONS[id].xRange, 0~1 정규화)를 특정 이미지 폭(w) 기준
// 픽셀 컬럼 구간으로 변환. computeSectionRealExtent()·buildRealColumnSamples()
// 둘 다 이 계산을 따로 갖고 있었던 걸 여기로 합침(동작 동일).
function getSectionColumnRange(sec, w){
  return {
    xS: Math.round(Math.max(0, sec.xRange[0]) * w),
    xE: Math.round(Math.min(1, sec.xRange[1]) * w),
  };
}

// 섹션 하나(예: 'side')의 실측 형태 보정 배율을 계산.
// - sec.visibleIn에 속한 뷰들 중 실제로 사진·마스크가 있는 뷰만 사용
// - 뷰별 가중치 = state.viewMapping[sectionId][angle](실측 yaw 기반 각도 근접도, 2D
//   섹션 블렌딩에서 쓰는 것과 동일) × getViewPoseConfidence(angle)(그 뷰 포즈의 신뢰도)
// - 그 가중치로 실제 사진의 컬럼별 헤어 실루엣 길이(hairEndY-scalpY, 이미지 높이 대비
//   비율)를 평균 → BASELINE_EXTENT_FRAC(경험적 "평균 볼륨" 기준치) 대비 배율로 변환
// - 가중치 합(confidence)이 낮으면(사진에 잘 안 보이거나 그 뷰 포즈 인식이 실패한
//   섹션) 부족분만큼 aiEstimate(있다면)로 블렌딩
function computeSectionRealExtent(sectionId, aiEstimate){
  const sec = SECTIONS[sectionId];
  const BASELINE_EXTENT_FRAC = 0.30; // 컬럼당 헤어 실루엣이 이미지 높이의 30% 정도면 "평균 볼륨"으로 가정(경험적 근사치, 튜닝 대상)

  let weightedSum = 0, weightTotal = 0;
  sec.visibleIn.forEach(angle=>{
    const maskInf = state.hairMasks && state.hairMasks[angle];
    if(!maskInf) return; // 이 뷰는 아직 촬영/마스크 추출이 안 됨
    const weight = getViewWeight(sectionId, angle);
    if(weight < 0.03) return; // 영향 무시할 수준

    const w = maskInf.w, h = maskInf.h;
    const { xS, xE } = getSectionColumnRange(sec, w);
    let sum = 0, cnt = 0;
    for(let x = xS; x < xE; x += 2){ // 2px 간격 샘플링(속도, 컬럼당 정밀도는 불필요)
      const sY = maskInf.scalpY[x], eY = maskInf.hairEndY[x];
      if(sY < 0 || eY < 0) continue; // 이 컬럼엔 인식된 머리카락 없음
      sum += (eY - sY) / h;
      cnt++;
    }
    if(cnt < 5) return; // 유효 컬럼이 너무 적으면(대부분 얼굴제거박스 등으로 지워짐) 이 뷰는 스킵
    const avgExtentFrac = sum / cnt;
    weightedSum += avgExtentFrac * weight;
    weightTotal += weight;
  });

  const confidence = Math.min(1, weightTotal);
  let factor = 1.0;
  if(weightTotal > 0){
    factor = clamp((weightedSum / weightTotal) / BASELINE_EXTENT_FRAC, 0.55, 1.8);
  }

  if(confidence < 0.9 && aiEstimate && typeof aiEstimate[sectionId] === 'number'){
    const aiFactor = clamp(aiEstimate[sectionId] / 50, 0.55, 1.8); // AI가 준 0~100(50=평균)을 같은 배율 스케일로 환산
    factor = factor * confidence + aiFactor * (1 - confidence);
  }

  return { factor, confidence };
}

// 6개 섹션 중 사진 커버리지(confidence)가 부족한 게 있는지 빠르게 체크.
// (AI 호출 여부를 결정하기 위한 용도라 aiEstimate 없이 실측치만으로 판단)
function anySectionNeedsAIFallback(){
  return SECTION_ORDER.some(id => computeSectionRealExtent(id, null).confidence < 0.9);
}

// (a)의 AI 보완 단계: 실측 사진 커버리지가 부족한 섹션을 위해, 촬영된 사진들을
// (front만 보내던 기존 analyzeWithClaude와 달리) 전부 함께 보내서 "사진에 잘
// 안 보이는 구역도 보이는 구역들의 대칭성/연결성으로 추정"해달라고 요청.
// 사진 세트당 1회만 호출(캐싱) — 3D 화면 재진입마다 다시 부르면 낭비.
async function estimateHairVolumeWithAI(){
  if(state.aiSectionEstimate) return state.aiSectionEstimate;
  const shotAngles = ANGLES.filter(a=>state.shots[a]);
  if(shotAngles.length===0) return null;

  const content = [];
  shotAngles.forEach(angle=>{
    const dataUrl = state.shots[angle];
    const base64 = dataUrl.split(',')[1];
    const mediaType = dataUrl.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
    content.push({ type:'image', source:{ type:'base64', media_type:mediaType, data:base64 } });
    content.push({ type:'text', text:`위 사진은 "${ANGLE_LABELS[angle]}" 각도입니다.` });
  });
  content.push({ type:'text', text:
`위 사진들은 한 사람의 머리를 서로 다른 각도에서 찍은 것입니다(전부 다 없을 수 있음).
아래 6개 구역 각각에 대해 "머리카락이 두상 표면에서 얼마나 뻗어나온 상태인지"를 0~100 상대값으로 추정하세요
(50=평균적인 볼륨/길이, 100=매우 풍성하거나 김, 0=매우 짧거나 거의 없음).
사진에 명확히 보이지 않는 구역은, 보이는 구역들과의 자연스러운 연결성(좌우 대칭, 전체 스타일 흐름)을
근거로 추정하세요. JSON만 응답하세요, 다른 텍스트 없이.
{"crown":0-100,"front":0-100,"temple":0-100,"side":0-100,"occipital":0-100,"nape":0-100}` });

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:300, messages:[{ role:'user', content }] })
    });
    const data = await res.json();
    const raw = data.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(raw);
    state.aiSectionEstimate = parsed;
    return parsed;
  }catch(e){
    console.warn('AI 형태 추정 실패(실측치만으로 진행):', e);
    return null;
  }
}

/* ── (3단계) 헤어스타일 기반 의상 추천 AI ──
   비즈니스 로드맵 3번(파일 상단 주석) 착수. 확정된 헤어스타일(색상·길이·
   볼륨 느낌)과 정면 사진을 함께 보내서, OUTFIT_CATALOG(지금은 목업, 나중에
   진짜 제휴 상품 DB로 교체될 자리) 중 가장 잘 어울리는 항목을 고르게 한다.
   analyzeWithClaude()/estimateHairVolumeWithAI()와 동일한 호출 패턴 재사용.
   세션당 1회만 호출(캐싱), 새 고객 시작 시 초기화(startNewCustomer 참고). */
async function recommendOutfitWithAI(){
  if(state.aiOutfitRecommendation) return state.aiOutfitRecommendation;
  const frontImg = state.shots.front;
  const style = state.selectedStyle;
  if(!frontImg || !style) return null;

  const catalogList = OUTFIT_CATALOG.map(o=>`- ${o.id}: ${o.name} (${o.category}, 태그: ${o.tags.join('/')})`).join('\n');
  const base64 = frontImg.split(',')[1];
  const mediaType = frontImg.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
  const prompt = `미용실 고객 정면 사진과 확정된 헤어스타일 정보입니다.
헤어스타일: ${style.name} (${style.tags}), 헤어컬러: ${style.colorHex}
아래 의상 목록 중 이 헤어스타일·이미지와 가장 잘 어울리는 것 하나를 고르세요.
{"outfitId":"목록의 id 중 하나","reason":"한국어 1문장 추천 이유"}
JSON만 응답하세요, 다른 텍스트 없이.
의상 목록:
${catalogList}`;

  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body: JSON.stringify({ model:'claude-sonnet-4-6', max_tokens:200, messages:[{ role:'user', content:[
        { type:'image', source:{ type:'base64', media_type:mediaType, data:base64 } },
        { type:'text', text:prompt }
      ]}]})
    });
    const data = await res.json();
    const raw = data.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    const parsed = JSON.parse(raw);
    const item = OUTFIT_CATALOG.find(o=>o.id===parsed.outfitId) || OUTFIT_CATALOG[0];
    const result = { item, reason: parsed.reason || '' };
    state.aiOutfitRecommendation = result;
    return result;
  }catch(e){
    console.warn('의상 추천 AI 실패(기본 항목으로 대체):', e);
    const result = { item: OUTFIT_CATALOG[0], reason: '' };
    state.aiOutfitRecommendation = result;
    return result;
  }
}

/* ── 의상 3D 부착 — 지금은 절차적 플레이스홀더, 나중에 제휴사 3D 에셋으로 교체 ──
   ※ neckAttachPoint 연결 규격(외부 에셋 제작/연동 시 이 기준을 따르면 됨):
   - 좌표계: 두상과 동일한 로컬 원점(headGroup 기준), Y-up · Z-forward(+Z가
     캐릭터 정면) · X-right. 두상 자체와 완전히 같은 좌표계라 별도 변환 불필요.
   - 목 원통(neckAttachPoint) 실제 치수: position.y=-0.85, height=0.6,
     radiusTop=0.42*widthFactor(위쪽, y=-0.55) → radiusBottom=0.5*widthFactor
     (아래쪽, y=-1.15). 외부 의상 에셋은 목선(collar) 반지름이 y=-0.55에서
     약 0.42*widthFactor와 맞아떨어지도록 정렬하면 이음매가 자연스러움.
   - 스케일: widthFactor/heightFactor(getFaceMetrics() 참고)는 그 사람 실측
     비율이라, 외부 에셋도 이 값을 곱해서 스케일하면 두상 크기와 비례가 맞음
     (buildOutfitPlaceholderMesh가 실제로 이렇게 함 — 참고용 구현 예시).
   - 원점 기준 y=-1.15 아래로 어깨/몸통이 이어진다고 가정.
   지금은 OUTFIT_MESH_SOURCE.type이 'gltf'인 경우를 대비한 분기만 준비해두고
   실제 로더는 미구현(HEAD_MESH_SOURCE와 동일한 진행 방식) — 진짜 파일 생기면
   loadHeadMeshFromGLTF()를 참고해서 채우면 됨. */
function buildOutfitPlaceholderMesh(item, widthFactor){
  const group = new THREE.Group();
  group.name = 'outfitPlaceholder';
  const color = new THREE.Color(item.colorHex || '#888888');

  // 어깨~가슴 상단부를 대충 근사하는 원뿔대(목에서 어깨로 벌어지는 형태).
  // 실제 의상 3D가 아니라 "여기에 붙는다"는 걸 보여주는 자리표시자.
  const torsoGeo = new THREE.CylinderGeometry(0.50*widthFactor, 0.92*widthFactor, 1.15, 24);
  const torsoMat = new THREE.MeshStandardMaterial({ color, roughness: 0.75 });
  const torso = new THREE.Mesh(torsoGeo, torsoMat);
  torso.position.y = -1.15 - 1.15/2; // neckAttachPoint 하단(y=-1.15)에서 바로 이어짐
  torso.name = 'outfitTorsoPlaceholder';
  group.add(torso);

  return group;
}

// HEAD_MESH_SOURCE와 동일한 스위치 패턴 — 나중에 실제 제휴사 3D 파일(.glb)이
// 생기면 OUTFIT_MESH_SOURCE.type='gltf'+url만 넣으면 이 함수 안 분기만 타고
// 호출부(setupModel3DScreen)는 그대로 재사용됨.
async function loadOutfitMesh(item, widthFactor){
  if(OUTFIT_MESH_SOURCE.type === 'gltf' && OUTFIT_MESH_SOURCE.url){
    // TODO: 실제 제휴사 에셋 생기면 loadHeadMeshFromGLTF() 참고해서 구현.
    console.warn('OUTFIT_MESH_SOURCE.type=gltf 이지만 로더 미구현 — 절차적 플레이스홀더로 폴백');
  }
  return buildOutfitPlaceholderMesh(item, widthFactor);
}

function randRange(a,b){ return a + Math.random()*(b-a); }

// 진짜 2D→3D 투영 경로: 시작점(root3D)·끝점(tip3D)을 실측 사진에서 그대로
// 가져와서 쓴다. "길이를 따로 재서 곱하는" 게 아니라, 두 점의 실제 방향
// (growDir)을 그대로 성장 방향으로 삼고 슬라이더 길이만큼 뻗음.
// buildStrandsForSection()에서 분리됨(로직 동일, randRange 호출 순서도 동일).
function buildStrandCurveFromProjection(col, actualLen, puffOut, swayAmt){
  const root = col.root3D.clone();
  const rawDir = col.tip3D.clone().sub(col.root3D);
  const growDir = rawDir.length() > 0.001 ? rawDir.normalize() : new THREE.Vector3(0,-1,0);
  const outward = root.clone().normalize();
  let perp = new THREE.Vector3().crossVectors(growDir, outward);
  if(perp.length() < 0.001) perp = new THREE.Vector3().crossVectors(growDir, new THREE.Vector3(0,1,0));
  perp.normalize();

  const mid = root.clone()
    .add(growDir.clone().multiplyScalar(actualLen*0.45))
    .add(outward.clone().multiplyScalar(puffOut*0.6))
    .add(perp.clone().multiplyScalar(randRange(-swayAmt, swayAmt)));
  const tip = root.clone()
    .add(growDir.clone().multiplyScalar(actualLen))
    .add(outward.clone().multiplyScalar(puffOut*0.25))
    .add(perp.clone().multiplyScalar(randRange(-swayAmt, swayAmt) * 1.3));
  return { root, mid, tip };
}

// 합성 폴백: 실측 투영이 없는 컬럼/섹션(예: 그 섹션을 잘 보여주는 사진이
// 없거나 포즈 인식이 실패한 경우)은 기존처럼 두피 좌표(phi,theta) 범위 안에서
// 무작위로 채움. buildStrandsForSection()에서 분리됨(로직 동일).
function buildStrandCurveFallback(zone, strandIndex, actualLen, puffOut, swayAmt, approxHeadRadius, maxPhi){
  const phi0 = randRange(zone.phiRange[0], zone.phiRange[1]);
  const theta0 = zone.thetas === 'full'
    ? randRange(0, Math.PI*2)
    : zone.thetas[strandIndex % zone.thetas.length] + randRange(-zone.thetaSpread, zone.thetaSpread);
  let dPhi = Math.max(actualLen / approxHeadRadius, 0.02);
  const phiMid = Math.min(phi0 + dPhi*0.45, maxPhi);
  const phiTip = Math.min(phi0 + dPhi, maxPhi);
  const waveTheta = ()=> randRange(-swayAmt, swayAmt);
  const root = scalpPointToWorld(phi0, theta0, 1.01);
  const mid  = scalpPointToWorld(phiMid, theta0 + waveTheta(), 1.01 + puffOut*0.55);
  const tip  = scalpPointToWorld(phiTip, theta0 + waveTheta(), 1.01 + puffOut*0.20);
  return { root, mid, tip };
}

// 섹션 하나(예: 'side')에 해당하는 가닥 묶음을 만든다.
// params는 state.sections[sectionId] 그대로 — 섹션마다 파라미터 이름이
// 달라서(length는 공통, 그 외는 volume/blend/layer/line 등 제각각) 폴백
// 체인으로 흡수한다. shapeSignal({factor,confidence})은 computeSectionRealExtent()가
// 뽑은 "실제 사진에서 이 섹션이 얼마나 뻗어나와 보였는지" 배율 — 슬라이더 값에
// 곱해서 실측 사진 정보가 3D에도 반영되게 한다.
// (2026-07-12: 너무 길어서 다루기 힘들다는 지적으로 실측/폴백 두 경로를
// buildStrandCurveFromProjection()/buildStrandCurveFallback()으로 분리 —
// 로직 자체와 randRange() 호출 순서는 한 글자도 안 바꾸고 그대로 옮김.)
function buildStrandsForSection(sectionId, params, colorHex, globalCurl, shapeSignal, realCols){
  const zone = SCALP_ZONES[sectionId];
  const group = new THREE.Group();
  if(!zone) return group;

  const length   = params.length ?? 50;
  // volume류 파라미터가 섹션마다 다른 이름이라 있는 것부터 순서대로 사용
  const volume   = params.volume ?? params.blend ?? params.layer ?? 50;
  const lineVal  = params.line;   // front/nape에만 존재
  const layerVal = params.layer;  // side에만 존재
  const realFactor = (shapeSignal && shapeSignal.factor) || 1.0; // 실측 사진(+AI 보완) 기반 보정 배율

  const strandLen    = (0.16 + (length/100) * 0.95) * realFactor;
  const puffOut       = (0.05 + (volume/100) * 0.22) * realFactor;
  const curlAmt        = ((globalCurl ?? 30)/100) * 0.18;
  const lengthJitter  = layerVal!=null ? (layerVal/100)*0.35 : 0.12; // 레이어감 있는 섹션일수록 가닥 길이 편차 커짐

  const mat = new THREE.MeshStandardMaterial({
    color: new THREE.Color(colorHex || '#2A1B12'),
    roughness: 0.55, metalness: 0.05,
  });

  const realColsSafe = Array.isArray(realCols) ? realCols : [];
  const avgLenFrac = realColsSafe.length
    ? realColsSafe.reduce((s,c)=>s+c.lenFrac,0) / realColsSafe.length
    : 0;

  const strandCount = computeStrandCount(sectionId, volume);
  // 가닥 길이(월드 유닛)를 phi 증가량(라디안)으로 환산 — 실측 투영이 없어서
  // 합성 폴백으로 갈 때만 쓰는 근사 반경.
  const APPROX_HEAD_RADIUS = 0.85;
  const REAL_ORIENT_STRENGTH = 0.55; // 실측 결방향이 흔들림 크기에 미치는 영향력(0~1)
  const MAX_PHI = 2.75; // 합성 폴백에서 phi가 턱 밑을 넘어가지 않도록

  for(let i=0;i<strandCount;i++){
    // 이 가닥이 참고할 실측 컬럼(있으면). 같은 컬럼을 여러 가닥이 나눠 쓸 수
    // 있음(실측 컬럼 수 < 가닥 수인 게 보통이라 자연스러운 중복).
    const col = realColsSafe.length ? realColsSafe[Math.floor(Math.random()*realColsSafe.length)] : null;

    // front.line/nape.line에 따른 길이 배율(뱅 방향/네이프 테이퍼) — 실측/합성
    // 두 경로 모두에 동일하게 적용.
    let lenScale = 1;
    if(sectionId === 'front' && lineVal != null){
      const upness = (lineVal - 50) / 50; // -1(아래) ~ +1(위로 넘김)
      lenScale *= (1 - Math.max(0, upness) * 0.7);
    }
    if(sectionId === 'nape' && lineVal != null){
      lenScale *= 0.6 + (lineVal/100) * 0.6;
    }
    const realLenRatio = (col && avgLenFrac > 0.001)
      ? Math.max(0.55, Math.min(1.8, col.lenFrac / avgLenFrac))
      : 1;
    const actualLen = strandLen * realLenRatio * lenScale * (1 + randRange(-lengthJitter, lengthJitter));

    // 결방향(orientAngle): "가로 성분이 얼마나 센가"(|cos|)만 방향과 분리해서
    // 흔들림 크기로 사용 — 부호는 아래 각 경로에서 기하학적으로 자연스럽게 정해짐.
    const swayAmt = (col && col.orientAngle != null)
      ? curlAmt + Math.abs(Math.cos(col.orientAngle)) * REAL_ORIENT_STRENGTH * 0.5
      : curlAmt;

    const { root, mid, tip } = (col && col.root3D && col.tip3D)
      ? buildStrandCurveFromProjection(col, actualLen, puffOut, swayAmt)
      : buildStrandCurveFallback(zone, i, actualLen, puffOut, swayAmt, APPROX_HEAD_RADIUS, MAX_PHI);

    const curve = new THREE.CatmullRomCurve3([root, mid, tip]);
    // 세그먼트를 낮게 잡아 저사양 기기 대비(가닥당 폴리곤 최소화)
    const tubeGeo = new THREE.TubeGeometry(curve, 6, 0.010 + Math.random()*0.006, 4, false);
    const strand = new THREE.Mesh(tubeGeo, mat);
    group.add(strand);
  }

  return group;
}

/* ── 뿌리 위치·길이·결방향을 진짜로 3D에 반영 ──
   지적: "computeSectionRealExtent가 만드는 건 섹션 전체에 곱하는 배율 하나뿐이고,
   뿌리가 어디 심기는지(phi/theta)·어느 방향으로 흐르는지(결방향)는 여전히 랜덤
   아니냐" — 정확한 지적. state.hairMasks[angle].orientation(실측 결방향 필드,
   2D에서 이미 쓰고 있는 그 데이터)이 3D 쪽에서는 한 번도 안 읽히고 있었음.
   여기서부터 실제로 연결한다.
   좌우 대칭(temple/side)은 어느 실측 뷰가 물리적으로 어느 쪽(왼/오)에
   대응하는지 좌표계 관례가 코드 어디에도 확정돼 있지 않아서, 잘못 매핑하면
   "왼쪽 결이 오른쪽에 심긴다" 같은 검증하기 어려운 좌우反전 버그가 생길 위험이
   있음. 그래서:
   - phi(위아래 뿌리 위치)·길이비율·결 강도(방향의 크기, 부호 아님)는 모든
     섹션에 안전하게 적용(좌우 모호성이 없는 값들).
   - theta(좌우 뿌리 위치)의 "실측 위치 매핑"은 중심이 하나뿐인 섹션(front/
     occipital/nape)에만 적용 — 그 사진 한 장 안에서 좌/우가 자체적으로
     일관되므로 좌우反전 위험이 없음. temple/side(거울대칭 2중심)는 기존처럼
     무작위 배치를 유지하되, 실측 길이·결 강도는 그대로 반영. */

/* ── 진짜 2D→3D 투영: outputFacialTransformationMatrixes를 실제로 활용 ──
   지적: "makeFaceProjector 말고, 랜드마크 연결할 때 쓰던 AR용 진짜 캘리브레이션
   행렬(outputFacialTransformationMatrixes)이 있었잖아, 그건 왜 안 써?" — 정확한
   지적. 이 매트릭스는 MediaPipe가 "캐노니컬 얼굴을 실제 감지된 얼굴 위치/각도에
   맞춰 정렬하는" 진짜 AR 캘리브레이션 결과인데, decomposePoseMatrix()가 여기서
   yaw/pitch/roll "각도 3개"만 뽑고 나머지(그 각도로 실제 회전을 재구성하는 데
   필요한 나머지 정보)는 버리고 있었음. 심지어 파일 상단 개발 로그에 "이 방향
   재활용 가능"이라고 이미 적어뒀던 걸 놓쳤음.
   여기서부터: 저장된 yaw/pitch/roll(비손실 분해값, 실측 행렬과 100% 동일한
   회전 정보)로 회전행렬을 다시 조립해서, 사진 픽셀 하나하나를 실제 두상 표면
   3D 좌표로 진짜 투영한다 — "시작점·끝점 좌표를 그대로 찍어서 쓴다"는 원래
   말씀하신 방식. */

// decomposePoseMatrix가 어떤 합성순서를 가정한 건지 몰라서(그 함수엔 각도를
// 다시 행렬로 되돌리는 대응 함수가 없었음), Node로 300개 랜덤 각도 왕복
// 테스트를 돌려 정확히 일치하는 합성순서를 수치로 찾아냄: R = Rz(roll)·Ry(yaw)·Rx(pitch)
// (row-major 3x3, 왕복 오차 0.000000 확인됨).
function composeRotationZYX(yawRad, pitchRad, rollRad){
  const cy=Math.cos(yawRad), sy=Math.sin(yawRad);
  const cx=Math.cos(pitchRad), sx=Math.sin(pitchRad);
  const cz=Math.cos(rollRad), sz=Math.sin(rollRad);
  function matMul(a,b){ const r=new Array(9); for(let i=0;i<3;i++)for(let j=0;j<3;j++){ let s=0; for(let k=0;k<3;k++) s+=a[i*3+k]*b[k*3+j]; r[i*3+j]=s; } return r; }
  const Rz=[cz,-sz,0, sz,cz,0, 0,0,1];
  const Ry=[cy,0,sy, 0,1,0, -sy,0,cy];
  const Rx=[1,0,0, 0,cx,-sx, 0,sx,cx];
  return matMul(matMul(Rz,Ry),Rx);
}
function applyRotation3(mat9, v){
  return new THREE.Vector3(
    mat9[0]*v.x + mat9[1]*v.y + mat9[2]*v.z,
    mat9[3]*v.x + mat9[4]*v.y + mat9[5]*v.z,
    mat9[6]*v.x + mat9[7]*v.y + mat9[8]*v.z,
  );
}

// 사진 한 장의 정규화 좌표(nx,ny 0~1)를 실제 두상 표면 3D 좌표로 투영.
// 1) makeFaceProjector로 "그 뷰가 정면을 보고 있다고 가정했을 때"의 로컬
//    평면 좌표(localX,localY)를 구함(뷰마다 자기 랜드마크 기준이라 재사용 가능).
// 2) 로컬 좌표가 두상 타원면 위에 있다고 보고 localZ를 방정식으로 풀어냄
//    (카메라를 향한 쪽 = +Z해를 선택).
// 3) 그 뷰의 실측 회전(yaw/pitch/roll, PnP 결과)을 로컬 좌표에 실제로 적용해서
//    월드(두상 전체 기준) 좌표로 회전 — 이 부분이 기존엔 없었음(yaw 각도를
//    "어느 섹션이 이 뷰에 가까운가" 가중치 계산에만 쓰고, 실제 좌표 회전에는
//    한 번도 안 썼음). 왼쪽/오른쪽 사진이 실측으로 서로 다른 부호의 회전을
//    갖게 되므로, 예전에 걱정했던 "좌우反전 위험"이 추측이 아니라 실측값으로
//    해소됨.
function projectImagePointToHead(angle, nx, ny, widthFactor, heightFactor){
  const lm = (state.landmarks && state.landmarks[angle]) || getEstimatedLandmarks(angle);
  if(!lm) return null;
  const wf = widthFactor || 1, hf = heightFactor || 1;
  const proj = makeFaceProjector(lm, wf, hf);
  const localX = proj.toMeshX(nx);
  const localY = proj.toMeshY(ny);

  const a = 0.78*wf, b = 1*hf, c = 0.85*wf; // 두상 타원 반경(x,y,z)
  const yLocal = localY - 0.15; // 타원 중심(0,0.15,0) 기준으로 이동
  const inside = (localX/a)*(localX/a) + (yLocal/b)*(yLocal/b);
  if(inside > 0.98) return null; // 타원 밖(귀/윤곽 밖 극단치) — 이 픽셀은 투영 포기
  const localZ = c * Math.sqrt(Math.max(0, 1 - inside)); // 카메라를 향한 쪽(+Z) 해

  const yawRad   = (lm.poseYawDeg   ?? getViewYawDeg(angle)) * Math.PI/180;
  const pitchRad = (lm.posePitchDeg ?? 0) * Math.PI/180;
  const rollRad  = (lm.poseRollDeg  ?? 0) * Math.PI/180;
  const rot = composeRotationZYX(yawRad, pitchRad, rollRad);

  const rotated = applyRotation3(rot, new THREE.Vector3(localX, yLocal, localZ));
  rotated.y += 0.15; // 중심 오프셋 복원
  return rotated;
}

// 섹션 하나에 실측 데이터를 제공할 "가장 신뢰할 만한 뷰"를 고른다.
// state.viewMapping(실측 yaw 기반 각도 근접도) × getViewPoseConfidence(그 뷰
// 포즈의 신뢰도)가 임계값 이상인 것 중 최댓값 — 둘 다 낮으면(사진에 잘 안
// 보이거나 포즈 인식 자체가 실패) null 반환하고 호출 쪽에서 기존 랜덤 배치로 폴백.
function pickBestRealView(sectionId){
  const sec = SECTIONS[sectionId];
  let best = null, bestW = 0;
  sec.visibleIn.forEach(angle=>{
    if(!state.hairMasks || !state.hairMasks[angle]) return;
    const w = getViewWeight(sectionId, angle);
    if(w > bestW){ bestW = w; best = angle; }
  });
  return bestW >= 0.15 ? best : null;
}

// 실제 뷰 하나의 실측 컬럼 데이터를 섹션의 실측 x/y 범위(SECTIONS[id].xRange/
// yRange, 2D 조정화면과 동일 정의) 안에서 뽑아온다.
// 반환 배열의 각 항목: nx(그 뷰 안에서 좌우 상대위치 0~1), ny(그 뷰 안에서
// 위아래 상대위치 0~1, scalpY 기준), lenFrac(그 컬럼의 실측 헤어 길이 ÷
// 이미지 높이), orientAngle(결방향 필드 각도, atan2 좌표계 — 없으면 null).
function buildRealColumnSamples(sectionId, angle, widthFactor, heightFactor){
  const sec = SECTIONS[sectionId];
  const maskInf = state.hairMasks && state.hairMasks[angle];
  if(!maskInf) return [];
  const w = maskInf.w, h = maskInf.h; // scalpY/hairEndY는 원본(풀) 해상도 좌표계
  const { xS, xE } = getSectionColumnRange(sec, w);
  const hasOrient = Array.isArray(maskInf.orientation) && maskInf.maskW && maskInf.maskH;

  const cols = [];
  for(let x = xS; x < xE; x += 3){ // 투영 계산이 추가돼서 3px 간격으로(속도)
    const sY = maskInf.scalpY[x], eY = maskInf.hairEndY[x];
    if(sY < 0 || eY < 0) continue; // 이 컬럼엔 인식된 머리카락 없음
    const nx = x / w, syN = sY / h, eyN = eY / h;
    const lenFrac = eyN - syN;

    // 진짜 2D→3D 투영: 이 컬럼의 두피 시작점(scalpY)과 끝점(hairEndY)을
    // 실제 좌표로 각각 투영 — "길이를 따로 재는" 게 아니라 두 점의 실제
    // 3D 거리가 곧 길이가 됨.
    const root3D = projectImagePointToHead(angle, nx, syN, widthFactor, heightFactor);
    const tip3D  = projectImagePointToHead(angle, nx, eyN, widthFactor, heightFactor);
    if(!root3D || !tip3D) continue; // 타원 밖으로 나가 투영 실패한 컬럼은 스킵(폴백 컬럼 취급)

    let orientAngle = null;
    if(hasOrient){
      const sx = x / w * maskInf.maskW;
      const sy = sY / h * maskInf.maskH;
      const s = sampleOrientation(maskInf.orientation, sx, maskInf.maskW, sy);
      if(s && s.coherence > 0.12) orientAngle = s.angle;
    }
    cols.push({ nx: (xE>xS)?(x-xS)/(xE-xS):0.5, lenFrac, orientAngle, root3D, tip3D });
  }
  return cols;
}


// 진짜 헤어카드/스트랜드 시스템: 돔 하나로 뭉뚱그린 자리표시자를 대체.
// 6개 섹션(state.sections) 각각을 서로 다른 두피 위치·개수·길이로 심어서,
// 2D 조정화면에서 섹션별로 만진 값이 3D에도 바로 반영되게 한다(별도 매핑
// 단계 없이 같은 state.sections를 그대로 소스로 사용).
// + (a) 각 섹션마다 computeSectionRealExtent()로 실측 사진(+커버리지 부족분은
// AI 보완) 기반 형태 배율을 뽑아서 슬라이더 값과 함께 반영한다.
// + (b) pickBestRealView()/buildRealColumnSamples()로 그 섹션을 가장 잘 보여주는
// 실측 사진의 실제 뿌리 위치·길이·결방향을 뽑아서 buildStrandsForSection에 전달.
function buildHairStrands(styleParams){
  const { colorHex, sections, globalCurl, aiEstimate, widthFactor, heightFactor } = styleParams;
  const group = new THREE.Group();
  group.name = 'hairStrands';
  SECTION_ORDER.forEach(id=>{
    const params = sections[id] || SECTIONS[id].defaults;
    const shapeSignal = computeSectionRealExtent(id, aiEstimate);
    const bestAngle = pickBestRealView(id);
    const realCols = bestAngle ? buildRealColumnSamples(id, bestAngle, widthFactor, heightFactor) : [];
    const sectionGroup = buildStrandsForSection(id, params, colorHex, globalCurl, shapeSignal, realCols);
    sectionGroup.name = 'strands-'+id;
    sectionGroup.userData.shapeSignal = shapeSignal; // [진단용] 이 섹션이 실측/AI 중 무엇에 얼마나 의존했는지
    sectionGroup.userData.realView = bestAngle; // [진단용] 뿌리/결방향 실측 출처 뷰
    sectionGroup.userData.realColCount = realCols.length; // [진단용] 실제 투영 성공한 컬럼 수
    group.add(sectionGroup);
  });
  return group;
}

// headGroup 재구성 시(스타일이 바뀌어 이전 가닥/두상을 지울 때) geometry/material을
// 같이 dispose. 자리표시자 돔 1개일 땐 신경 안 써도 됐지만, 가닥이 수십~백여
// 개로 늘면서 재구성마다 누적되는 GPU 메모리가 무시할 수준이 아니게 됨.
function disposeObject3D(obj){
  obj.traverse(node=>{
    if(node.geometry) node.geometry.dispose();
    if(node.material){
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      // map(=사진 데칼의 CanvasTexture) dispose 추가 — 데칼은 재구성마다 새
      // 캔버스 텍스처를 새로 만들므로, 안 지우면 스트랜드 늘어날 때와 같은
      // 부류의 GPU 메모리 누수가 남는다.
      mats.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

// 나중에 진짜 두상 파일(.glb)이 생기면 이 분기가 실행됨.
// GLTFLoader는 THREE 코어에 안 딸려있어서 실제 사용 시 별도 CDN 스크립트
// (three@0.128.0용 GLTFLoader.js) 추가가 필요 — procedural 단계에선 로드 안 함.
function loadHeadMeshFromGLTF(url){
  return new Promise((resolve, reject)=>{
    if(typeof THREE.GLTFLoader !== 'function'){
      reject(new Error('GLTFLoader 스크립트가 로드되지 않았습니다 — gltf 모드로 전환 시 CDN 스크립트 추가 필요'));
      return;
    }
    const loader = new THREE.GLTFLoader();
    loader.load(url, gltf=>resolve(gltf.scene), undefined, reject);
  });
}

async function loadHeadMesh(faceMetrics, skinColorCss){
  if(HEAD_MESH_SOURCE.type === 'gltf' && HEAD_MESH_SOURCE.url){
    const scene = await loadHeadMeshFromGLTF(HEAD_MESH_SOURCE.url);
    return { group: scene, headMesh: scene, faceDetailGroup: null };
  }
  return buildProceduralHead(faceMetrics, skinColorCss);
}

// 현재 확정 상태(state.selectedStyle / state.sections / state.hairMasks)에서
// 3D에 반영할 파라미터를 추출. buildHairStrands()가 6개 섹션을 각각 따로
// 읽으므로 여기서는 크라운 대표값으로 뭉뚱그리지 않고 state.sections
// 전체를 그대로 넘긴다(2D 조정화면과 동일 소스). aiEstimate는 setupModel3DScreen이
// 필요시 미리 estimateHairVolumeWithAI()로 받아온 결과를 그대로 전달.
function extractStyleParamsFor3D(aiEstimate){
  const colorHex =
    (state.selectedStyle && state.selectedStyle.colorHex) ||
    (state.hairMasks && state.hairMasks.front && state.hairMasks.front.avgColor) ||
    '#2A1B12';
  return { colorHex, sections: state.sections || {}, globalCurl: state._globalCurl, aiEstimate };
}

function initModel3DRenderer(container){
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  container.innerHTML='';
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, container.clientWidth/container.clientHeight, 0.1, 100);
  // 초기 위치는 임시값 — 실제 프레이밍은 모델을 다 구성한 뒤 frameCameraToHead()가
  // 바운딩 박스 기준으로 다시 계산해서 덮어씀 (아래 버그 수정 참고).
  camera.position.set(0, 0, 5);

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(1.5, 2, 2);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
  fillLight.position.set(-2, 0.5, 1);
  scene.add(fillLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));

  const headGroup = new THREE.Group();
  scene.add(headGroup);

  // 드래그 회전 (OrbitControls 없이 직접 구현 — 가벼움 유지)
  let dragging=false, lastX=0, autoRotate=true;
  const dom = renderer.domElement;
  dom.style.touchAction='none';
  dom.addEventListener('pointerdown', e=>{ dragging=true; autoRotate=false; lastX=e.clientX; });
  window.addEventListener('pointerup', ()=>{ dragging=false; });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    headGroup.rotation.y += dx * 0.01;
  });

  const state3D = { renderer, scene, camera, headGroup, container, autoRotateRef:()=>autoRotate };

  function animate(){
    if(autoRotate) headGroup.rotation.y += 0.004;
    renderer.render(scene, camera);
    model3D.animId = requestAnimationFrame(animate);
  }
  model3D = { ...state3D, animId:null, initialized:true };
  animate();
  return model3D;
}

function resizeModel3D(){
  if(!model3D || !model3D.initialized) return;
  const { renderer, camera, container } = model3D;
  const w = container.clientWidth, h = container.clientHeight;
  if(w<=0||h<=0) return;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  frameCameraToHead(); // 화면 크기(aspect)가 바뀌면 프레이밍도 다시 계산
}
window.addEventListener('resize', resizeModel3D);

// 버그 수정: 예전엔 camera.position을 (0,0.1,3.4) 같은 눈대중 값으로 고정해뒀는데,
// 실기기 스크린샷을 보니 두상이 화면을 꽉 채우고 눈·헤어·목이 전부 프레임 밖으로
// 잘려나가는 심한 줌인 버그였음(회전 자체는 되고 있었는데 특징 없는 곡면만 보여서
// "안 움직인다"고 느껴진 것). 원인은 카메라 거리/화각을 모델 실제 크기와 무관하게
// 손으로 대충 잡았던 것 — 화면 세로/가로 비율(aspect)에 따라 필요한 거리가 다른데
// 그걸 반영 안 함.
// → 모델의 바운딩 박스를 실측해서 세로 기준/가로 기준 두 필요거리 중 더 큰 쪽으로
// 카메라를 배치하도록 수정. 이렇게 하면 나중에 진짜 두상 3D 파일(다른 크기·비율)로
// 바꿔도 다시 눈대중으로 튜닝할 필요 없이 항상 알맞게 잡힘.
function frameCameraToHead(){
  if(!model3D || !model3D.initialized) return;
  const { camera, headGroup } = model3D;
  const box = new THREE.Box3().setFromObject(headGroup);
  if(box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const vFov = camera.fov * Math.PI/180;
  const MARGIN = 1.45; // 프레임 가장자리에 여백을 두기 위한 배율
  const distForHeight = (size.y/2) / Math.tan(vFov/2);
  const distForWidth  = (size.x/2) / (Math.tan(vFov/2) * camera.aspect);
  const dist = Math.max(distForHeight, distForWidth) * MARGIN;

  camera.position.set(center.x, center.y, center.z + dist);
  camera.near = Math.max(0.01, dist/100);
  camera.far  = dist*100;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
}

// 'model3d' 화면 진입 시 셋업: 렌더러 최초 1회 생성(이후엔 재사용), 확정된
// 스타일 파라미터로 두상+헤어캡 다시 그림.
async function setupModel3DScreen(){
  const container = document.getElementById('model3dViewport');
  if(!container) return;

  if(!model3D || !model3D.initialized){
    initModel3DRenderer(container);
  } else {
    resizeModel3D();
  }

  // 이전에 그려둔 두상/헤어 제거 후 새로 구성 (스타일이 바뀌었을 수 있으므로).
  // 가닥이 수십~백여 개로 늘면서 dispose 없이 remove만 하면 GPU 메모리가
  // 재구성마다 누적되므로 disposeObject3D()로 geometry/material까지 정리.
  while(model3D.headGroup.children.length){
    const obj = model3D.headGroup.children[0];
    disposeObject3D(obj);
    model3D.headGroup.remove(obj);
  }
  model3D.headGroup.rotation.y = 0; // 프레이밍 계산이 항상 같은 기준(정면)에서 이뤄지도록 리셋

  model3DGeneration++;
  const myGen = model3DGeneration;

  // 실측 얼굴 비율(getFaceMetrics)과 실제 두피색(scalpColor — extractHairMask가
  // 이미 얼굴 피부에서 샘플링해뒀던 값, 지금까진 언더코트 색으로만 쓰이고 3D엔
  // 전혀 반영 안 되고 있었음)을 뽑아서 두상 생성에 넘긴다.
  const faceMetrics = getFaceMetrics();
  const skinColorCss = (state.hairMasks && state.hairMasks.front && state.hairMasks.front.scalpColor) || '#E8C39E';

  const { group, faceDetailGroup } = await loadHeadMesh(faceMetrics, skinColorCss);
  model3D.headGroup.add(group);

  // (a) 실측 사진 기반 형태 보정: 섹션별 가중치(state.viewMapping)가 아직 없으면
  // (예: 랜드마크 파이프라인이 어떤 이유로 buildViewMapping을 못 거친 경우) 방어적으로 생성.
  if(!state.viewMapping) buildViewMapping();
  // 6개 섹션 중 사진 커버리지가 부족한 게 하나라도 있으면(사진에 잘 안 보이거나
  // 그 뷰 포즈 인식이 실패한 섹션) AI로 보완 추정 — 세션당 1회만(캐싱됨).
  let aiEstimate = state.aiSectionEstimate || null;
  if(!aiEstimate && anySectionNeedsAIFallback()){
    showAI('AI가 사진에 잘 안 보이는 부분을 추정하고 있어요…','전체 스타일 흐름 기반 보완');
    aiEstimate = await estimateHairVolumeWithAI();
    hideAI();
  }

  const styleParams = extractStyleParamsFor3D(aiEstimate);
  styleParams.widthFactor = faceMetrics.widthFactor;
  styleParams.heightFactor = faceMetrics.heightFactor;
  const hairStrands = buildHairStrands(styleParams);
  model3D.headGroup.add(hairStrands);

  // (3단계) 헤어스타일 기반 의상 추천 + 플레이스홀더 부착.
  // 확정 스타일이 있어야 추천할 수 있으므로(색상·태그 정보 필요) 없으면 스킵.
  let outfitTag = '';
  if(state.selectedStyle){
    showAI('AI가 어울리는 의상을 고르고 있어요…','헤어스타일 기반 추천 (데모)');
    const outfitRec = await recommendOutfitWithAI();
    hideAI();
    if(outfitRec && myGen === model3DGeneration){
      const outfitMesh = await loadOutfitMesh(outfitRec.item, faceMetrics.widthFactor);
      model3D.headGroup.add(outfitMesh);
      outfitTag = ` · 의상 추천: ${outfitRec.item.name}(${outfitRec.item.category}, 데모)`;
    }
  }

  frameCameraToHead(); // 버그 수정: 모델 크기 기준으로 카메라 거리 자동 계산 (이전엔 눈대중 고정값이라 심하게 줌인됐었음)

  // 실측 정면 사진 데칼은 비동기(이미지 로드)라 두상·헤어부터 먼저 그려서
  // 화면이 비지 않게 한 뒤 나중에 얹는다. myGen이 그 사이 바뀌었으면(화면을
  // 벗어났다 다시 들어와 headGroup이 재구성된 경우) 오래된 결과를 버린다.
  buildFacePhotoDecal(faceMetrics).then(decal=>{
    if(!decal || myGen !== model3DGeneration || !model3D || !model3D.initialized) return;
    model3D.headGroup.add(decal);
    if(faceDetailGroup) faceDetailGroup.visible = false; // 사진이 이목구비를 대신하므로 절차적 이목구비는 숨김(이중 렌더 방지)
  }).catch(e=>console.warn('얼굴 사진 데칼 첨부 실패(절차적 이목구비 유지):', e));

  const tag = document.getElementById('model3dTag');
  if(tag){
    const name = state.selectedStyle ? state.selectedStyle.name : '커스텀 스타일';
    tag.textContent = `범용 3D 두상 · ${name} 적용 (프로토타입)${outfitTag}`;
  }
}

/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
function showAI(text,sub){
  document.getElementById('aiOverlayText').textContent=text;
  document.getElementById('aiOverlaySub').textContent=sub;
  document.getElementById('aiOverlay').classList.remove('hidden');
}
function hideAI(){ document.getElementById('aiOverlay').classList.add('hidden'); }

let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

function startNewCustomer(){
  aiAnalysis=null;
  state.aiSectionEstimate=null; state.viewMapping=null; // (a) 실측 사진 기반 3D 보정 캐시도 새 고객마다 초기화
  state.aiOutfitRecommendation=null; // (3단계) 의상 추천 캐시도 초기화
  ANGLES.forEach(a=>{state.shots[a]=null;state.hairCanvases[a]=null;state.hairMasks[a]=null;state.baseCanvases[a]=null;});
  state.landmarks = {};
  state.selectedStyle=null; state.currentCaptureIndex=0; state.currentSection='crown';
  // 섹션 초기화
  SECTION_ORDER.forEach(id=>{
    state.sections[id] = {...SECTIONS[id].defaults};
  });
  state._globalCurl = 30;
  document.getElementById('aiAnalysisCard').style.display='none';
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('ai-recommended','selected'));
  document.getElementById('toAdjustBtn').disabled=true;
  ['style','adjust','compare','model3d'].forEach(id=>{ const t=document.getElementById('nav-'+id); if(t) t.disabled=true; });
  updateAngleUI();
  navTo('capture');
}
