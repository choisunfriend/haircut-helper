/* ════════════════════════════════════════
   HAIR SEGMENTATION
   1차: MediaPipe ImageSegmenter (hair_segmentation 모델)
   2차 폴백: TF.js SelfieSegmentation + HSV hair 필터
════════════════════════════════════════ */
let segmenterReady = false;
let segmenterError = false;
let mpImageSegmenter = null; // MediaPipe Tasks Vision segmenter

async function initSegmenter(){
  // ── 1차: MediaPipe Tasks Vision (hair segmentation) ──
  try{
    const { FilesetResolver: FR, ImageSegmenter: IS } = await loadVisionModule();
    const vision = await FR.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm'
    );
    mpImageSegmenter = await IS.createFromOptions(vision, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/1/hair_segmenter.tflite',
        // GPU delegate가 특정 기기/브라우저 조합에서 카테고리 인덱스를 뒤섞는
        // 알려진 버그가 있음(google-ai-edge/mediapipe#6142, iOS Safari 사례지만
        // 같은 계열). hair_segmenter는 background=0/hair=1 2클래스라 이 버그에
        // 걸리면 hair 픽셀이 전부 0px로 나옴 — 실제로 겪은 증상과 일치.
        // CPU delegate가 느리지만 훨씬 안정적이라 정확도 우선으로 전환.
        delegate:'CPU',
      },
      // categoryMask는 0.5 argmax로 배경/머리카락을 딱 잘라 판정해서, 새치처럼
      // 저채도인 경계 픽셀이 배경 쪽으로 떨어져 커버리지가 낮게 나오는 문제가 있었음
      // (실측: 전체의 6%만 머리카락으로 판정). confidenceMask(0~1 확률값)를 받아서
      // 임계값을 직접 조정할 수 있게 변경.
      outputCategoryMask: false,
      outputConfidenceMasks: true,
      runningMode: 'IMAGE',
    });
    segmenter = mpImageSegmenter;
    segmenterReady = true;
    state.segmenterType = 'MediaPipe';
    console.log('MediaPipe Hair Segmenter 준비 완료');
    return;
  } catch(e){
    window.__segDiag = (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e));
    console.warn('MediaPipe Hair Segmenter 실패, TF.js 폴백:', e);
  }

  // ── 2차 폴백: TF.js SelfieSegmentation ──
  try{
    await tf.ready();
    await tf.setBackend('webgl');
    segmenter = await bodySegmentation.createSegmenter(
      bodySegmentation.SupportedModels.MediaPipeSelfieSegmentation,
      { runtime:'tfjs', modelType:'general' }
    );
    segmenterReady = true;
    state.segmenterType = 'TF.js';
    console.log('TF.js SelfieSegmentation 폴백 준비 완료');
  } catch(e){
    console.warn('모든 Segmenter 로드 실패:', e);
    segmenter = null;
    segmenterError = true;
    state.segmenterType = '실패';
  }
}
initSegmenter();

/* ────────────────────────────────────────
   헤어 마스크 추출
   - MediaPipe hair_segmenter: category mask에서 hair(=1) 픽셀 추출
   - TF.js fallback: 사람 마스크 + HSV 색상 필터로 hair 근사
──────────────────────────────────────── */
// ── 개발 스위치: 랜드마크 기반 후처리(얼굴제거박스/어깨컷오프/귀·프론트 보강) ──
// MediaPipe가 window.FilesetResolver 버그로 계속 TF.js로 폴백되던 동안 쌓인 패치들이라,
// 실제 MediaPipe hair_segmenter 마스크 특성에 맞춰 검증된 적이 없음.
// 테스트 결과: MediaPipe 마스크에서 결이 살아있는 것을 확인 — 이 패치들은 TF.js 마스크
// 기준으로 튜닝된 것이라 MediaPipe에는 불필요/역효과였음.
// → MediaPipe가 정상 동작 중일 때는 이 후처리를 끄고, TF.js 폴백으로 떨어졌을 때만 켠다.
const ENABLE_LANDMARK_POSTPROCESS = true;

// 픽셀 RGB 합계(sumR/sumG/sumB)와 샘플 개수(cnt)로부터 평균 rgb() 문자열을 만든다.
// 두피/피부색 샘플링 3곳(이마 밴드 직접 샘플, reason=2 기반, 헤어라인 위 컬럼 샘플)에서
// "합산 후 rgb(...) 문자열로 변환" 로직이 그대로 반복되던 것을 하나로 합침.
// minCount 이하 샘플이면(신뢰할 수 없는 소수 샘플) null 반환 — 호출부는 그대로 폴백으로 넘어감.
function avgRGBString(sumR, sumG, sumB, cnt, minCount){
  if(cnt <= (minCount||0)) return null;
  return `rgb(${Math.round(sumR/cnt)},${Math.round(sumG/cnt)},${Math.round(sumB/cnt)})`;
}

/* ════════════════════════════════════════════════════════════════
   extractHairMask(angle) — 목차 (642줄, Canvas/픽셀 API 직접 사용이라
   Node 샌드박스에서 실행 검증이 안 돼서 구조는 안 건드리고 목차만 추가함.
   내부에 이미 STEP별 중첩 함수로 나뉘어 있음 — 아래 줄번호는 대략적 위치.)
   STEP 1  (~1313) 세그멘테이션 — MediaPipe 우선, 실패 시 TF.js 폴백
   STEP 2  (~1374) 배경 오탐 제거 — 사람 머리 영역 바깥 무조건 제외
   STEP 3  (~1428) 얼굴 영역 제거 — 랜드마크 기반 동적 박스
   STEP 4  (~1463) 얼굴 부위별 정밀 가드(눈썹·눈·입)
   STEP 5  (~1501) 목·어깨 제거 — chinY 기반 동적 컷오프
   STEP 6  (~1513) 옆머리·앞머리 빈 부분 보강(귀/프론트 밴드 완화 색상 필터)
   STEP 7  (~1644) 마스크 후처리 — 컬럼 내 작은 구멍만 채움
   STEP 8  (~1656) 진단 로그 문자열 조립
   STEP 9  (~1671) 결방향 인식(Structure Tensor)
   STEP 10 (~1697) 두피(scalpY)·모발끝(hairEndY) 라인 추출 + 원본 해상도 스케일업
   STEP 11 (~1752) 결과 캔버스 합성(마스크/진단/hair/base + 평균 헤어컬러)
════════════════════════════════════════════════════════════════ */
async function extractHairMask(angle){
  const dataUrl = state.shots[angle];
  if(!dataUrl || !segmenter) return false;

  return new Promise(resolve=>{
    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = async()=>{
      try{
        // 512 → 640 → 768 → 1024: 세그멘터(MediaPipe) 실제 입력 해상도이자 scalpY/hairEndY를
        // 뽑아내는 원본 해상도(w,h). 512였을 때는 세로로 긴 사진에서 축소된 w가
        // 200~300대 컬럼밖에 안 나와서, 화면 폭(750px 등)으로 업샘플할 때 여러 화면
        // 컬럼이 같은 소스 값을 복사해 쓰는 계단식 확대가 두피선이 성긴 원인이었음.
        // 640(면적 1.56배) → 768(면적 2.25배)까지 올렸었고, 실측 결과 저사양 기기에서도
        // 1024(원본 512 대비 면적 4배)가 768 대비 체감 지연이 크지 않았고, 오히려
        // 구레나룻처럼 이전엔 못 잡던 디테일까지 세그멘테이션이 잡아내기 시작해서 1024로 고정.
        // 더 밀어붙일 경우 저사양 기기 기준으로 반드시 체감 지연 재확인할 것.
        const maxDim = 1024;
        const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale);
        const h = Math.round(img.height * scale);

        const srcC = document.createElement('canvas');
        srcC.width=w; srcC.height=h;
        const srcCtx = srcC.getContext('2d');
        srcCtx.drawImage(img, 0, 0, w, h);
        const srcPixels = srcCtx.getImageData(0,0,w,h).data;

        // 마스크 버퍼 (0=background, 255=hair) — 축소 해상도에서 작업
        let hairMaskBuf = new Uint8Array(w * h);
        // 디버그용 "왜 이렇게 됐는지" 코드 — 0:미해당, 1:최종 머리카락, 2:얼굴박스로 제외,
        // 3:눈썹/눈/입 가드로 제외. "마스크 보기"에서 색을 다르게 표시하기 위함.
        const reasonMask = new Uint8Array(w * h);

        // ── STEP 1: 세그멘테이션 — MediaPipe 우선, 실패 시 TF.js 폴백 ──
        // hairMaskBuf를 채우는 역할만 담당 (이후 단계에서 후처리)
        async function runSegmentation(){
        if(mpImageSegmenter){
          // ── MediaPipe hair_segmenter path (confidenceMask 기반) ──
          // categoryMask(0.5 argmax)보다 관대한 기준으로 저채도 경계 픽셀(새치 등)을
          // 더 살리기 위해, index 1(hair) 확률맵을 직접 임계값 비교로 판정한다.
          // 기준치를 낮출수록 더 많이 잡히지만 배경 오탐도 늘어날 수 있음 — 실측
          // 데이터 보면서 조정할 예정.
          const HAIR_CONFIDENCE_THRESHOLD = 0.5; // 원상복구: 관대했던 0.3 → categoryMask argmax와 동등한 0.5로 되돌림
          const result = mpImageSegmenter.segment(srcC);
          const hairConf = result.confidenceMasks[1]; // 0=background, 1=hair
          const confArr = hairConf.getAsFloat32Array();
          // 진단: 확률 분포 요약 (평균/최대값) — 전체적으로 확률이 낮게 나오면
          // 임계값을 더 낮춰야 한다는 신호
          let confSum=0, confMax=0, aboveCount=0;
          for(let i=0;i<confArr.length;i++){
            const c = confArr[i];
            confSum += c; if(c>confMax) confMax=c;
            const isHair = c >= HAIR_CONFIDENCE_THRESHOLD;
            if(isHair) aboveCount++;
            hairMaskBuf[i] = isHair ? 255 : 0;
          }
          window.__maskValueDiag = `avg:${(confSum/confArr.length).toFixed(3)},max:${confMax.toFixed(3)},≥${HAIR_CONFIDENCE_THRESHOLD}:${aboveCount}`;
          hairConf.close();
        } else {
          // ── TF.js SelfieSegmentation 폴백 ──
          const segs = await segmenter.segmentPeople(srcC, {
            multiSegmentation: false,
            segmentBodyParts: false,
          });
          // TF.js 사람 마스크 + HSV hair 색상 필터 (마스크 실패시 상단 영역 HSV만 사용)
          let personMaskData = null;
          if(segs && segs.length>0){
            try{
              const binaryMask = await bodySegmentation.toBinaryMask(
                segs,
                {r:255,g:255,b:255,a:255},
                {r:0,g:0,b:0,a:0},
                false, 0.5
              );
              personMaskData = binaryMask.data;
            } catch(e){ personMaskData = null; }
          }

          // 사람 마스크가 있으면 마스크 내에서, 없으면 상단 60% 전체에서 HSV 필터
          const topLimit = Math.round(h * 0.60);
          for(let i=0;i<w*h;i++){
            const iy = Math.floor(i/w);
            const inRegion = personMaskData
              ? personMaskData[i*4+3] > 128
              : iy < topLimit;
            if(inRegion){
              const r=srcPixels[i*4], g=srcPixels[i*4+1], b=srcPixels[i*4+2];
              if(isHairColor(r,g,b)) hairMaskBuf[i]=255;
            }
          }
        }
        } // runSegmentation
        await runSegmentation();

        // ── STEP 2: 배경 오탐 제거 — 사람 머리 영역 바깥은 무조건 제외 ──
        // confidenceMask 임계값을 관대하게 낮췄더니(0.3), 벽/천장 경계선처럼
        // 배경의 강한 선형 경계가 낮은 확신도로 "머리카락"으로 오탐되어 화면
        // 전체 폭에 걸쳐 일직선 가닥이 뻗어나가는 문제가 실제로 확인됨.
        // 이건 "얼굴을 정교하게 지운다"는 세밀한 보정이 아니라 "사람이 있을 리
        // 없는 먼 배경만 제외한다"는 훨씬 느슨한 가드라서, ENABLE_LANDMARK_POSTPROCESS
        // 플래그(세밀한 재구성 로직들)와 별개로 항상 켜둔다.
        function applyBackgroundGuard(){
          const lmGuard = state.landmarks && state.landmarks[angle];
          if(lmGuard){
            const beforeCount = hairMaskBuf.reduce((a,v)=>a+(v>0?1:0),0);
            const earSpan = Math.abs(lmGuard.rEarX - lmGuard.lEarX);
            const cx = (lmGuard.lEarX + lmGuard.rEarX) / 2;
            const marginX = Math.max(earSpan * 2.2, 0.28); // 측면 등 earSpan이 작을 때 최소 마진 보장
            const xLeft  = Math.max(0, cx - marginX);
            const xRight = Math.min(1, cx + marginX);
            const yTop    = Math.max(0, lmGuard.foreheadY - 0.25);
            const yBottom = Math.min(1, lmGuard.chinY + 0.55); // 목·어깨까지 여유
            const xS = Math.round(xLeft*w), xE = Math.round(xRight*w);
            const yS = Math.round(yTop*h), yE = Math.round(yBottom*h);
            for(let y=0;y<h;y++){
              for(let x=0;x<w;x++){
                if(x<xS || x>=xE || y<yS || y>=yE) hairMaskBuf[y*w+x]=0;
              }
            }
            const afterCount = hairMaskBuf.reduce((a,v)=>a+(v>0?1:0),0);
            window.__bgGuardDiag = `${beforeCount}→${afterCount}(-${beforeCount-afterCount})`;
          }
        } // applyBackgroundGuard
        applyBackgroundGuard();

        // ── 이하 랜드마크 기반 후처리는 세그멘터 종류(MediaPipe/TF.js)와
        // 무관하게 항상 적용한다. (이전엔 TF.js 폴백 분기 안에만 있어서,
        // MediaPipe 1차 세그멘터가 성공하면 얼굴제거박스·어깨컷오프·
        // 귀/프론트 보강이 전부 스킵되는 구조적 버그가 있었음)

        // ── 얼굴 영역 제거: 랜드마크 기반 동적 박스 ──
        // 기존 고정 좌표(가로 25~75%) 박스는 "얼굴이 항상 화면 중앙"이라고 가정해서
        // 측면(좌/우) 사진에서는 얼굴이 한쪽으로 치우쳐 있어 반대쪽 옆머리까지 같이 지워버렸음.
        // Face Landmarker로 실제 눈/귀/턱 위치를 알면 그 범위에 맞춰서만 지운다.
        // 실측 랜드마크가 있으면 그대로, 없으면 비율 기반 추정치로 대체
        // (이전엔 랜드마크 실패 시 이 블록 전체가 꺼지고 보수적 고정 박스로만
        // 폴백했는데, 그러면 아래의 귀/프론트 보강·동적 어깨컷오프까지
        // 전부 같이 무효화됨 → 항상 lm이 존재하도록 바꿔서 그 문제를 없앰)
        const lmReal = state.landmarks && state.landmarks[angle];
        const lm = lmReal || getEstimatedLandmarks(angle);
        const lmEstimated = !lmReal;
        // 얼굴제거박스가 실제로 지운 픽셀을 별도 기록 — 아래 귀/프론트 보강 단계에서
        // "원래부터 머리카락이 아니었던 곳"과 절대 혼동하지 않고 재채움을 막기 위함
        const faceExcludeMask = new Uint8Array(w*h);

        // ── STEP 2.5: 하이라이트로 날아간 부분 보강(색과 무관한 구멍 채우기) ──
        // applyBackgroundGuard 직후, 얼굴 제거박스(STEP 3~4, TF.js 경로에서만
        // 실행됨)가 아직 안 지워진 시점에 실행 — 얼굴 영역도 지금은 배경(0)으로
        // 잡혀있어서 자칫 "둘러싸인 구멍"으로 오인될 수 있지만, 얼굴+목 영역은
        // boundBox 대비 면적이 하이라이트 패치보다 훨씬 커서 maxHoleAreaFrac
        // 상한에 걸려 자동으로 제외됨(실측 없이 잡은 값이라 필요시 재조정).
        function reinforceHighlightHoles(){
          const lmH = state.landmarks && state.landmarks[angle];
          if(!lmH) return;
          const earSpanH = Math.abs(lmH.rEarX - lmH.lEarX);
          const cxH = (lmH.lEarX + lmH.rEarX) / 2;
          const marginXH = Math.max(earSpanH * 2.2, 0.28);
          const boundBox = {
            xS: Math.round(Math.max(0, cxH - marginXH) * w),
            xE: Math.round(Math.min(1, cxH + marginXH) * w),
            yS: Math.round(Math.max(0, lmH.foreheadY - 0.25) * h),
            yE: Math.round(Math.min(1, lmH.chinY + 0.55) * h),
          };
          const before = hairMaskBuf.reduce((a,v)=>a+(v>0?1:0),0);
          hairMaskBuf = fillEnclosedHighlightHoles(hairMaskBuf, w, h, boundBox, 0.06);
          const after = hairMaskBuf.reduce((a,v)=>a+(v>0?1:0),0);
          window.__highlightHoleDiag = `${before}→${after}(+${after-before})`;
        } // reinforceHighlightHoles
        reinforceHighlightHoles();

        // [진단용] 얼굴제거박스의 실제 좌표(0~1 비율)와 사용된 랜드마크 값을 기록.
        // 화면의 각진 블록 아티팩트가 이 박스와 일치하는지 "얼굴박스 보기" 토글로 확인하기 위함.
        let faceBoxDiag = null;

        // ── STEP 3: 얼굴 영역 제거 — 랜드마크 기반 동적 박스 ──
        function applyFaceBoxRemoval(){
          const yTop    = Math.max(0, lm.foreheadY * 0.95);
          const yBottom = Math.min(1, lm.chinY * 1.05); // 턱 끝을 넘어서까지 (기존 0.92는 턱 라인이 박스 밖에 남는 문제)
          const earSpan = Math.abs(lm.rEarX - lm.lEarX);
          let xLeft, xRight;
          if(earSpan > 0.08){
            // 양쪽 귀가 충분히 떨어져 보이는 경우 (정면~약한 측면): 귀 안쪽만 지움
            xLeft  = Math.min(lm.lEarX, lm.rEarX) + earSpan*0.18; // 옆(턱 모서리·관자놀이) 여유 확대 (기존 0.12)
            xRight = Math.max(lm.lEarX, lm.rEarX) - earSpan*0.18;
          } else {
            // 거의 완전 측면(반대쪽 귀가 가려져 earSpan이 비정상적으로 작음):
            // 화면 폭 35%의 좁은 범위만 안전하게 제거 (얼굴 중심부 추정, 옆머리는 보존)
            const cx = (lm.lEarX + lm.rEarX) / 2;
            xLeft  = cx - 0.20; // 측면 턱 라인까지 포함하도록 확대 (기존 0.175)
            xRight = cx + 0.20;
          }
          const yS = Math.round(yTop*h), yE = Math.round(yBottom*h);
          const xS = Math.round(Math.max(0,xLeft)*w), xE = Math.round(Math.min(1,xRight)*w);
          for(let y=yS; y<yE; y++){
            for(let x=xS; x<xE; x++){
              if(x>=0&&x<w&&y>=0&&y<h){
                const idx=y*w+x;
                if(hairMaskBuf[idx]===255) reasonMask[idx]=2;
                hairMaskBuf[idx]=0; faceExcludeMask[idx]=1;
              }
            }
          }
          faceBoxDiag = {
            xLeft: Math.max(0,xLeft), xRight: Math.min(1,xRight), yTop, yBottom,
            lmEstimated,
            foreheadY: lm.foreheadY, chinY: lm.chinY, lEarX: lm.lEarX, rEarX: lm.rEarX, earSpan
          };
        } // applyFaceBoxRemoval

        // ── STEP 4: 얼굴 부위별 정밀 가드 (눈썹·눈·입) ──
        // 위 얼굴제거박스의 x범위(관자놀이 쪽 여유 때문에 좁게 잡힘) 밖으로
        // 삐져나온 부위(특히 측면 사진에서 관자놀이 쪽 눈썹 꼬리)도 좌표 기반으로
        // 별도 제외한다. "이 사람은 앞머리가 짧다/길다" 같은 헤어스타일 가정과
        // 무관하게, 실제 그 부위 랜드마크만 갖고 판단하므로 모든 헤어스타일에 동일 적용됨.
        // 랜드마크 추정 폴백(getEstimatedLandmarks)에는 features가 없으므로 자동 스킵됨
        // — 대략적 비율 추정치로 눈썹 위치까지 지어내는 건 오히려 부정확할 수 있어서.
        function applyFeatureGuard(){
        if(lm.features){
          for(const key of Object.keys(lm.features)){
            const f = lm.features[key];
            const fw = f.maxX - f.minX, fh = f.maxY - f.minY;
            const mx = fw * 0.35 + 0.006, my = fh * 0.5 + 0.006; // 랜드마크가 실제 부위보다 살짝 안쪽으로 잡히는 오차 보정 여유
            const xS = Math.round(Math.max(0, f.minX - mx) * w);
            const xE = Math.round(Math.min(1, f.maxX + mx) * w);
            const yS = Math.round(Math.max(0, f.minY - my) * h);
            const yE = Math.round(Math.min(1, f.maxY + my) * h);
            // 사각형이 아니라 타원으로 — 눈썹/눈/입은 실제로 길쭉한 타원에 가까운
            // 모양이라, 각진 사각형으로 자르면 결과물(특히 원본 결 디버그 뷰)에서
            // 눈에 띄게 인위적인 홈처럼 보였음. 중심·반지름 기준 타원 판정으로 교체.
            const cx = (xS+xE)/2, cy = (yS+yE)/2;
            const rx = Math.max(1,(xE-xS)/2), ry = Math.max(1,(yE-yS)/2);
            for(let y=yS; y<yE; y++){
              const ny = (y-cy)/ry;
              for(let x=xS; x<xE; x++){
                const nx = (x-cx)/rx;
                if(nx*nx + ny*ny > 1) continue; // 타원 밖은 건드리지 않음
                if(x>=0&&x<w&&y>=0&&y<h){
                  const idx=y*w+x;
                  if(hairMaskBuf[idx]===255) reasonMask[idx]=3;
                  hairMaskBuf[idx]=0; faceExcludeMask[idx]=1;
                }
              }
            }
          }
        }
        } // applyFeatureGuard

        // ── STEP 5: 목·어깨 제거 — 랜드마크(chinY) 기반 동적 컷오프 ──
        // 기존 고정 70% 라인은 턱이 그보다 위/아래로 짧게 잡히는 얼굴에서
        // 어깨선(옷)이 70% 안쪽에 들어와 회색 티셔츠 그림자가 머리카락으로 오인됨.
        // 턱 끝(chinY)에서 목 길이만큼(약 1.35배) 아래를 컷오프 라인으로 잡아
        // 얼굴 크기에 비례해서 어깨선을 더 정확히 배제한다.
        function applyShoulderCutoff(){
          const shoulderCutoffY = Math.max(Math.round(h*0.45), Math.min(Math.round(h*0.85), Math.round(lm.chinY * 1.35 * h)));
          for(let y=shoulderCutoffY; y<h; y++){
            for(let x=0;x<w;x++) hairMaskBuf[y*w+x]=0;
          }
        } // applyShoulderCutoff

        // ── STEP 6: 옆머리·앞머리 빈 부분 보강 (귀/프론트 밴드 완화 색상 필터) ──
        // 밝은 조명을 받은 잔머리(v>=0.55, 저채도)는 기존 isHairColor 3번 조건 경계에
        // 걸려 누락되는 경우가 있음. 화면 전체가 아니라 "귀 주변 영역"에서만
        // 완화된 기준을 추가 적용해서, 과확장(옷/목까지 번지는 문제) 재발 없이
        // 옆머리(관자놀이~귀 주변) 빈 구간만 보강한다.
        // (이전: 밴드가 너무 넓어서(가로 14%, 아래로 귀높이*1.55) 뺨·턱선 피부가
        // isHairColorRelaxed에 걸려 같이 채워지는 문제가 실사진에서 계속 발생.
        // 밴드를 귀 바로 옆·바로 아래로만 좁혀서 보수적으로 만듦)
        function reinforceEarAndFrontBands(){
          // 연결성 제약: 색만 머리카락과 비슷한 "고립된" 뺨/턱 피부(그늘 등)가
          // 기존에 검출된 머리카락과 붙어있지 않은데도 그냥 채워지는 문제가
          // 실사진(측면)에서 계속 발생함 — 턱선까지 갈색으로 이어짐.
          // 보강 시작 전 시점의 마스크를 넉넉히 dilate해서 "실제 머리카락과
          // 인접한 범위"만 성장 허용 영역으로 만들고, 이 영역 밖은 색이 맞아도
          // 채우지 않는다. (진짜 잔머리는 기존 머리카락 경계에 붙어있으므로 안전)
          const growAllowEar = dilate(hairMaskBuf, w, h, 4);
          // 안경다리가 지나가는 바로 이 귀 밴드 영역에서, 색 조건(isHairColorRelaxed)만으로
          // 채우면 안경테의 저채도·중간밝기가 잔머리 색과 같은 조건을 통과해버리는 문제가
          // 있었음(가능성2). 색이 맞아도 국소 밝기 분산(hasHairTexture)이 낮으면 —
          // 즉 안경처럼 매끈한 재질이면 — 채우지 않도록 텍스처 조건을 추가로 요구한다.
          const grayForTexture = toGrayscale(srcPixels, w, h);
          let earBandTextureRejected = 0;

          const earXs = [lm.lEarX, lm.rEarX].filter(v=>typeof v==='number');
          const bandHalfW = 0.09; // 14% → 9%: 뺨 쪽으로 번지지 않는 귀 바로 옆 폭만
          const yTopBand = Math.max(0, lm.eyeY - 0.08) * h;  // 관자놀이 위쪽까지 포함
          const yBotBand = Math.min(1, lm.earY * 1.22) * h;  // 1.55 → 1.22: 턱선까지 안 내려가게 귀 바로 아래까지만
          for(const ex of earXs){
            const xS = Math.round(Math.max(0, ex - bandHalfW) * w);
            const xE = Math.round(Math.min(1, ex + bandHalfW) * w);
            for(let y=Math.round(yTopBand); y<Math.round(yBotBand); y++){
              for(let x=xS; x<xE; x++){
                if(x<0||x>=w||y<0||y>=h) continue;
                const i = y*w+x;
                if(hairMaskBuf[i]>0) continue; // 이미 잡힌 픽셀은 스킵
                if(faceExcludeMask[i]) continue; // 얼굴로 판정해 지운 픽셀은 재채움 금지
                if(!growAllowEar[i]) continue; // 기존 머리카락과 붙어있지 않은 고립 영역은 스킵
                const r=srcPixels[i*4], g=srcPixels[i*4+1], b=srcPixels[i*4+2];
                if(!isHairColorRelaxed(r,g,b)) continue;
                if(!hasHairTexture(grayForTexture, w, h, x, y, 2)){ earBandTextureRejected++; continue; }
                hairMaskBuf[i]=255;
              }
            }
          }
          window.__earBandTextureDiag = earBandTextureRejected;
          // 귀 밴드 안에서만 국소 dilate+closing으로 드문드문 잡힌 픽셀을 면으로 연결
          // (화면 전체에 적용하면 과확장 재발 위험 → 밴드 영역에만 한정)
          const bandMask = new Uint8Array(w*h);
          for(const ex of earXs){
            const xS = Math.round(Math.max(0, ex - bandHalfW) * w);
            const xE = Math.round(Math.min(1, ex + bandHalfW) * w);
            for(let y=Math.round(yTopBand); y<Math.round(yBotBand); y++){
              for(let x=xS; x<xE; x++){
                if(x>=0&&x<w&&y>=0&&y<h) bandMask[y*w+x]=hairMaskBuf[y*w+x];
              }
            }
          }
          const bandClosed = morphClose(dilate(bandMask, w, h, 1), w, h, 1); // 2 → 1: 좁은 밴드 밖(뺨)으로 번지는 것 방지
          // 프론트와 동일한 이유로, closing이 새로 채운 픽셀만 텍스처 재검증
          // (안경다리처럼 매끈한 재질이 인접 잔머리에 붙어 다시 이어지는 것 방지)
          let bandClosedTextureRejected = 0;
          for(let i=0;i<w*h;i++){
            if(bandClosed[i]>0 && !faceExcludeMask[i]){
              if(bandMask[i]>0){ hairMaskBuf[i]=255; continue; }
              const x = i % w, y = (i / w) | 0;
              if(hasHairTexture(grayForTexture, w, h, x, y, 2)) hairMaskBuf[i]=255;
              else bandClosedTextureRejected++;
            }
          }
          window.__bandClosedTextureDiag = bandClosedTextureRejected;

          // ── 프론트(앞머리) 라인 보강: 이마 경계 쪽 잔머리도 같은 방식으로 ──
          // 여기도 동일하게, 귀 밴드 보강까지 끝난 시점의 마스크를 기준으로
          // "기존 머리카락과 인접한 곳만" 성장 허용 (고립된 이마 피부 오탐 방지)
          // 실측 결과 귀 밴드 쪽 텍스처 제외는 거의 작동하지 않았고(8px),
          // 실제 눈썹~안경 위쪽 렌즈 영역이 덮이는 문제는 이 프론트 밴드 범위와 겹쳤음.
          // 눈썹도 안경 상단 프레임과 마찬가지로 이 밴드 y범위에 걸리므로, 같은 텍스처
          // 조건을 여기에도 동일하게 적용한다. 하단 경계는 "눈 위 몇 %" 식 고정 비율이
          // 아니라 실제 눈썹 랜드마크(browTopY) 바로 위에서 멈추게 한다 — 앞머리가 짧아서
          // 눈썹 위에서 끝나는 사람을 기준으로 고정 비율을 잡으면, 앞머리가 길어 눈썹을
          // 덮는 사람은 그 아래 실제 머리카락 보강까지 막히게 됨. 눈썹 좌표를 직접 쓰면
          // 헤어스타일에 대한 가정 없이 눈썹만 정확히 피해간다.
          const growAllowFront = dilate(hairMaskBuf, w, h, 4);
          const fxS = Math.round(Math.max(0, Math.min(lm.lEarX, lm.rEarX) + Math.abs(lm.rEarX-lm.lEarX)*0.15) * w);
          const fxE = Math.round(Math.min(1, Math.max(lm.lEarX, lm.rEarX) - Math.abs(lm.rEarX-lm.lEarX)*0.15) * w);
          const fyTop = Math.max(0, lm.foreheadY * 0.85) * h;
          const fyBot = Math.min(1, lm.browTopY != null ? lm.browTopY : lm.eyeY * 0.92) * h;
          const frontBandMask = new Uint8Array(w*h);
          let frontBandTextureRejected = 0;
          for(let y=Math.round(fyTop); y<Math.round(fyBot); y++){
            for(let x=fxS; x<fxE; x++){
              if(x<0||x>=w||y<0||y>=h) continue;
              const i = y*w+x;
              if(hairMaskBuf[i]===0 && !faceExcludeMask[i] && growAllowFront[i]){
                const r=srcPixels[i*4], g=srcPixels[i*4+1], b=srcPixels[i*4+2];
                if(isHairColorRelaxed(r,g,b)){
                  if(hasHairTexture(grayForTexture, w, h, x, y, 2)) hairMaskBuf[i]=255;
                  else frontBandTextureRejected++;
                }
              }
              frontBandMask[i] = faceExcludeMask[i] ? 0 : hairMaskBuf[i];
            }
          }
          window.__frontBandTextureDiag = frontBandTextureRejected;
          const frontClosed = morphClose(dilate(frontBandMask, w, h, 2), w, h, 2);
          // closing(dilate+erode)은 순수 형태 연산이라 텍스처 검사를 다시 하지 않음 —
          // 그래서 눈썹(정당하게 통과)과 붙어있던 안경테 픽셀(텍스처로 걸러졌던 것)이
          // 틈 메우기 과정에서 다시 이어붙는 문제가 있었음. closing이 "새로 추가한" 픽셀만
          // (원래 frontBandMask에는 없던 픽셀) 텍스처를 한 번 더 검증해서 재유입을 막는다.
          let frontClosedTextureRejected = 0;
          for(let i=0;i<w*h;i++){
            if(frontClosed[i]>0 && !faceExcludeMask[i]){
              if(frontBandMask[i]>0){ hairMaskBuf[i]=255; continue; } // 이미 검증된 픽셀
              const x = i % w, y = (i / w) | 0;
              if(hasHairTexture(grayForTexture, w, h, x, y, 2)) hairMaskBuf[i]=255;
              else frontClosedTextureRejected++;
            }
          }
          window.__frontClosedTextureDiag = frontClosedTextureRejected;
        } // reinforceEarAndFrontBands

        // ── STEP 3~6 실행: 랜드마크 기반 후처리 (플래그로 일괄 on/off) ──
        // MediaPipe가 정상 동작 중일 때는 이 보강 로직을 끄고(마스크 자체가 이미 정교함),
        // TF.js 폴백으로 떨어졌을 때만 켠다 (TF.js 마스크 기준으로 튜닝된 패치들이라서).
        if(ENABLE_LANDMARK_POSTPROCESS && state.segmenterType !== 'MediaPipe'){
          applyFaceBoxRemoval();
          applyFeatureGuard();
          applyShoulderCutoff();
          reinforceEarAndFrontBands();
        }

        // ── STEP 7: 마스크 후처리 — 컬럼 내 작은 구멍만 채움 (과확장 없이 노이즈 정리만) ──
        // 이전: earY 기반 하단 dilate + HSV 보강이 머리카락을 옷/목까지 과도하게 확장시켜 되돌림
        // 사이드 하단 인식 문제는 결방향 인식(structure tensor) 작업 이후 별도로 재검토
        function cleanupMask(){
          hairMaskBuf = fillColumnGaps(hairMaskBuf, w, h, 6);
          hairMaskBuf = morphClose(hairMaskBuf, w, h, 3);
          // 본체 머리카락과 이어지지 않은 고립된 작은 오탐 덩어리(안경테, 눈썹, 옷깃 등)
          // 제거 — 가장 큰 덩어리 면적의 3% 미만인 컴포넌트는 버림
          hairMaskBuf = keepLargestComponents(hairMaskBuf, w, h, 0.03);
        }
        cleanupMask();

        // ── STEP 8: 진단 로그 문자열 조립 ──
        function buildDiagLog(){
          const pixelCount = hairMaskBuf.filter(v=>v>0).length;
          const lmDiagPart = lmEstimated ? `추정${window.__lmDiag ? '('+window.__lmDiag+')' : ''}` : '실측';
          const segFailPart = (state.segmenterType !== 'MediaPipe' && window.__segDiag) ? ` | MP실패:${window.__segDiag}` : '';
          const maskValPart = (state.segmenterType === 'MediaPipe' && window.__maskValueDiag) ? ` | 마스크값:${window.__maskValueDiag}` : '';
          const bgGuardPart = window.__bgGuardDiag ? ` | 배경가드:${window.__bgGuardDiag}` : '';
          const texRejPart = window.__earBandTextureDiag ? ` | 귀밴드질감제외:${window.__earBandTextureDiag}px` : '';
          const frontTexRejPart = window.__frontBandTextureDiag ? ` | 프론트밴드질감제외:${window.__frontBandTextureDiag}px` : '';
          const frontClosedTexRejPart = window.__frontClosedTextureDiag ? ` | 프론트닫기질감제외:${window.__frontClosedTextureDiag}px` : '';
          const bandClosedTexRejPart = window.__bandClosedTextureDiag ? ` | 귀닫기질감제외:${window.__bandClosedTextureDiag}px` : '';
          state._diagLog = `세그멘터:${state.segmenterType||'?'} | 마스크픽셀:${pixelCount}px | 랜드마크:${lmDiagPart}${segFailPart}${maskValPart}${bgGuardPart}${texRejPart}${frontTexRejPart}${frontClosedTexRejPart}${bandClosedTexRejPart}`;
        }
        buildDiagLog();

        // ── STEP 9: 결방향 인식 (Structure Tensor) ──
        // 축소 해상도(w,h)에서 계산 → 컬럼별 샘플로 다운샘플해 저장
        // (가닥 렌더링 시 매번 풀 계산하지 않고 가벼운 보간만 하도록)
        let orientationColSamples = null;
        function computeOrientation(){
          try{
            // Structure Tensor는 강한 명암 경계(edge)를 만나면 그 edge의 접선 방향을
            // "결방향"으로 오인하는 특성이 있음. hairMaskBuf 그대로 넘기면 머리카락↔
            // 배경/얼굴 경계(마스크 테두리) 자체가 그렇게 오인식되어, 그 경계 근처를
            // 지나가는 가닥들이 전부 그 경계 방향(주로 거의 수평)으로 꺾여버리고,
            // 그 뒤로는 (마스크 밖이라 결방향 데이터가 없으니) 그 방향을 그대로 유지한 채
            // 계속 뻗어나가서 옆으로 뻗은 "빗살" 형태가 됨 — 렌더링 쪽에서 시작점만
            // 2스텝 건너뛰는 것으로는 못 막았던, 경로 중간에 재발하는 동일한 문제.
            // → 경계에서 안쪽으로 살짝 침식(erode)한 마스크로만 결방향을 계산해서
            //   경계 픽셀 자체가 결방향 계산에 아예 들어가지 않게 함.
            const orientErodeR = Math.max(3, Math.round(w*0.004));
            const orientMaskBuf = erode(hairMaskBuf, w, h, orientErodeR);
            const {angle: angleField, coherence: coherenceField} = computeHairOrientationField(srcPixels, orientMaskBuf, w, h);
            orientationColSamples = buildColumnOrientationSamples(angleField, coherenceField, orientMaskBuf, w, h, 12);
          }catch(e){
            console.warn('결방향 인식 실패, 기본 직선 모드로 폴백:', e);
            orientationColSamples = null;
          }
        }
        computeOrientation();

        // ── STEP 10: 두피(scalpY)·모발끝(hairEndY) 라인 추출 후 원본 해상도로 스케일업 ──
        function computeScalpAndEndLines(){
          // 축소 해상도에서 (blur 없는 clean mask에서 column별 최상단 픽셀)
          const scalpY_small   = new Float32Array(w).fill(-1);
          const hairEndY_small = new Float32Array(w).fill(-1);
          for(let x=0;x<w;x++){
            for(let y=0;y<h;y++){
              if(hairMaskBuf[y*w+x] > 0){
                if(scalpY_small[x]<0) scalpY_small[x]=y;
                hairEndY_small[x]=y;
              }
            }
          }

          // ── hairEndY_small: 양끝 -1 열을 인접 유효값으로 보간 채우기 ──
          // (forward pass)
          let lastValidEnd = -1;
          for(let x=0;x<w;x++){
            if(hairEndY_small[x]>=0) lastValidEnd=hairEndY_small[x];
            else if(lastValidEnd>=0) hairEndY_small[x]=lastValidEnd;
          }
          // (backward pass — 앞쪽 -1 채우기)
          let firstValidEnd = -1;
          for(let x=w-1;x>=0;x--){
            if(hairEndY_small[x]>=0) firstValidEnd=hairEndY_small[x];
            else if(firstValidEnd>=0) hairEndY_small[x]=firstValidEnd;
          }
          // scalpY_small은 보간하지 않음 — 두피 "시작점"은 실제 세그멘테이션 마스크가
          // 있는 컬럼에서만 나와야 함(옆 컬럼 값을 복사해 배경/천장 컬럼까지 가짜
          // 시작점을 만들면 그 자리에 가닥이 심어지는 문제가 있었음). hairEndY만
          // 보간(끝점은 추정용이라 허용)하고, scalpY는 마스크 없는 컬럼에서 -1 그대로 둔다.

          // ── earY 기반 hairEndY 강제 연장 로직 제거 ──
          // (실제 마스크에 없는 영역까지 끌어올려 옷/목까지 머리카락이 그려지는 원인이었음)
          // 사이드 하단 인식 개선은 결방향 인식 도입 후 별도로 재검토

          // 원본 해상도로 스케일업
          const invScale = 1/scale;
          const scalpY   = new Float32Array(img.width).fill(-1);
          const hairEndY = new Float32Array(img.width).fill(-1);
          for(let X=0;X<img.width;X++){
            const xSmall = Math.min(w-1, Math.round(X*scale));
            // scalpY와 hairEndY를 독립적으로 대입 — scalpY_small이 -1(마스크 없는 컬럼)이어도
            // hairEndY_small은 보간되어 유효할 수 있으므로, 하나의 조건으로 묶지 않는다.
            if(scalpY_small[xSmall]>=0){
              scalpY[X] = scalpY_small[xSmall] * invScale;
            }
            if(hairEndY_small[xSmall]>=0){
              hairEndY[X] = hairEndY_small[xSmall] * invScale;
            }
          }
          return {scalpY, hairEndY};
        }
        const {scalpY, hairEndY} = computeScalpAndEndLines();

        // ── STEP 11: 결과 캔버스 합성 (마스크/진단/hair/base 캔버스 + 평균 헤어컬러) ──
        function buildOutputCanvases(){
          const maskC = document.createElement('canvas');
          maskC.width=w; maskC.height=h;
          const mCtx = maskC.getContext('2d');
          const mImg = mCtx.createImageData(w,h);
          for(let i=0;i<w*h;i++){
            mImg.data[i*4]=mImg.data[i*4+1]=mImg.data[i*4+2]=255;
            mImg.data[i*4+3]=hairMaskBuf[i];
          }
          mCtx.putImageData(mImg,0,0);

          // ── 진단용 색상코드 마스크 캔버스 (reasonMask → RGBA) ──
          // 1:최종 머리카락(빨강) 2:얼굴박스로 제외(회색) 3:눈썹/눈/입 가드로 제외(파랑) 0:투명
          const reasonC = document.createElement('canvas');
          reasonC.width=w; reasonC.height=h;
          const rCtx = reasonC.getContext('2d');
          const rImg = rCtx.createImageData(w,h);
          const REASON_COLORS = { 1:[255,45,85], 2:[136,136,136], 3:[51,136,255] };
          for(let i=0;i<w*h;i++){
            const code = reasonMask[i];
            const col = REASON_COLORS[code];
            if(col){
              rImg.data[i*4]=col[0]; rImg.data[i*4+1]=col[1]; rImg.data[i*4+2]=col[2];
              rImg.data[i*4+3]=255;
            } // code 0이면 알파 0으로 남음(투명, 초기값 그대로)
          }
          rCtx.putImageData(rImg,0,0);

          const fullMaskC = document.createElement('canvas');
          fullMaskC.width=img.width; fullMaskC.height=img.height;
          fullMaskC.getContext('2d').drawImage(maskC,0,0,img.width,img.height);

          // ── hairCanvas: 원본에서 hair 마스크 영역만 ──
          // (2배 슈퍼샘플링을 시도했었지만 실제 "굵기" 문제의 원인이 아니었고 — 원인은
          // drawHairStrands의 lineWidth 스케일 계산 쪽이었음 — 속도만 느려져서 원복함)
          const hairC = document.createElement('canvas');
          hairC.width=img.width; hairC.height=img.height;
          const hCtx = hairC.getContext('2d');
          hCtx.drawImage(img,0,0);
          hCtx.save();
          hCtx.globalCompositeOperation='destination-in';
          hCtx.drawImage(fullMaskC,0,0);
          hCtx.restore();

          // ── baseCanvas: 원본에서 hair 영역 제거 ──
          const baseC = document.createElement('canvas');
          baseC.width=img.width; baseC.height=img.height;
          const bCtx = baseC.getContext('2d');
          bCtx.drawImage(img,0,0);
          bCtx.save();
          bCtx.globalCompositeOperation='destination-out';
          bCtx.drawImage(fullMaskC,0,0);
          bCtx.restore();

          // ── 헤어 색상 샘플링 ──
          const hairPixelData = hCtx.getImageData(0,0,img.width,img.height).data;
          let rSum=0,gSum=0,bSum=0,cnt=0;
          for(let i=0;i<img.width*img.height;i++){
            if(hairPixelData[i*4+3]>128){
              rSum+=hairPixelData[i*4]; gSum+=hairPixelData[i*4+1]; bSum+=hairPixelData[i*4+2]; cnt++;
            }
          }
          const avgHairColor = avgRGBString(rSum, gSum, bSum, cnt, 0) || '#2A1B12';

          return {hairC, baseC, reasonC, avgHairColor};
        }

        // 최종 확정: 지금 시점에 hairMaskBuf===255인 픽셀은 전부 "최종 머리카락"(1)으로
        // 표시 — 귀/프론트 밴드 보강으로 나중에 다시 채워진 픽셀도 여기서 포함됨.
        // (버그 수정: 예전엔 이 대입이 buildOutputCanvases() 호출 "다음"에 실행돼서,
        // reasonC 캔버스가 이미 다 그려진 뒤였음 — 그래서 마스크 보기에서 빨강(최종
        // 머리카락)이 절대 보이지 않고 회색/파랑 제외 표시만 보이는 문제가 있었음.
        // reasonC를 만들기 "전"에 최종 확정을 끝내야 마스크 보기에 빨강이 정상적으로 나옴.)
        for(let i=0;i<w*h;i++){ if(hairMaskBuf[i]===255) reasonMask[i]=1; }

        const {hairC, baseC, reasonC, avgHairColor} = buildOutputCanvases();

        // ── 두피/피부색 샘플링 ──
        // 얼굴제거박스·눈썹가드로 "피부"라고 판정해서 머리카락에서 제외한 픽셀들의
        // 평균 색상 = 이 사람의 실제 피부/두피에 가까운 색. 가르마나 정수리가
        // 벗어진 부분처럼 마스크 실루엣 안인데 실제 머리카락은 아닌 곳을
        // (기존처럼) 진한 평균 헤어컬러 단색으로 덮어버리면 밋밋한 덩어리로
        // 보이는데, 대신 이 두피색을 써서 "머리카락 사이로 두피가 비치는"
        // 자연스러운 느낌을 내기 위함.
        let scalpColor = null;
        // 최우선: 이마 중앙 밴드 직접 샘플링 — 마스크 분류 결과와 무관하게 "여기는
        // 무조건 피부"라고 확신할 수 있는 좁은 영역(눈썹 위, 헤어라인 아래, 관자놀이
        // 피해서 중앙 40%만)을 그냥 원본에서 바로 평균낸다. 아래 두 폴백(reason=2 기반,
        // 헤어라인 바로 위 컬럼 샘플)은 마스크 경계 픽셀 몇 개에 의존해서 안티앨리어싱·
        // 그림자가 섞이기 쉬운데, 이 방식은 그런 잡음 없이 실제 보이는 얼굴색과 가장
        // 가깝게 나옴 — "바탕이 얼굴색과 비슷해야 한다"는 요건에 직접 대응.
        {
          const bandYTop = Math.max(0, lm.foreheadY * 0.92);
          const bandYBot = Math.min(1, lm.browTopY != null ? lm.browTopY * 0.96 : lm.eyeY * 0.85);
          const earSpan  = Math.abs(lm.rEarX - lm.lEarX);
          const cx = (lm.lEarX + lm.rEarX) / 2;
          const halfW = Math.max(earSpan * 0.16, 0.05); // 눈썹 꼬리·관자놀이 잔머리 피해서 중앙만
          const xS = Math.round(Math.max(0, cx - halfW) * w);
          const xE = Math.round(Math.min(1, cx + halfW) * w);
          const yS = Math.round(bandYTop * h);
          const yE = Math.round(bandYBot * h);
          let srSum=0, sgSum=0, sbSum=0, scnt=0;
          for(let y=yS; y<yE; y++){
            for(let x=xS; x<xE; x++){
              if(x<0||x>=w||y<0||y>=h) continue;
              const i = y*w+x;
              srSum+=srcPixels[i*4]; sgSum+=srcPixels[i*4+1]; sbSum+=srcPixels[i*4+2]; scnt++;
            }
          }
          if(scnt>20){
            scalpColor = avgRGBString(srSum, sgSum, sbSum, scnt, 20);
          }
        }
        if(!scalpColor){
          // 버그 수정: faceExcludeMask===1은 얼굴박스(reason=2, 순수 피부) 뿐 아니라
          // 눈썹/눈/입 가드(reason=3)까지 같은 값으로 묶여있어서, 어둡고 채도 높은
          // 눈썹·눈동자·입술 픽셀이 피부색 평균에 섞여 들어가 전체가 어둡게 계산되던 문제.
          // → reasonMask===2(순수 얼굴박스 피부)만 샘플링하도록 좁힘.
          let srSum=0, sgSum=0, sbSum=0, scnt=0;
          for(let i=0;i<w*h;i++){
            if(reasonMask[i]===2){
              srSum+=srcPixels[i*4]; sgSum+=srcPixels[i*4+1]; sbSum+=srcPixels[i*4+2]; scnt++;
            }
          }
          scalpColor = avgRGBString(srSum, sgSum, sbSum, scnt, 0);
        }
        // 폴백: ENABLE_LANDMARK_POSTPROCESS가 꺼져있으면 faceExcludeMask가 항상
        // 텅 비어있어서(랜드마크 기반 제외 자체를 안 하니) 위 샘플링이 0건이 됨.
        // 이 경우 랜드마크와 무관하게, 각 컬럼의 "머리카락 시작 지점 바로 위" 픽셀
        // (머리카락으로 판정 안 된 곳 = 대체로 이마 피부)을 대신 샘플링한다.
        if(!scalpColor){
          let srSum=0, sgSum=0, sbSum=0, scnt=0;
          for(let x=0;x<w;x++){
            let topY=-1;
            for(let y=0;y<h;y++){ if(hairMaskBuf[y*w+x]>0){ topY=y; break; } }
            if(topY<=0) continue;
            const sampleY = Math.max(0, topY-3);
            const si = sampleY*w+x;
            if(hairMaskBuf[si]>0) continue; // 혹시 그 지점도 머리카락이면 스킵
            if(reasonMask[si]===3) continue; // 눈썹/눈/입 가드 픽셀이면 스킵 (어두운 색 오염 방지)
            const i = si;
            srSum+=srcPixels[i*4]; sgSum+=srcPixels[i*4+1]; sbSum+=srcPixels[i*4+2]; scnt++;
          }
          scalpColor = avgRGBString(srSum, sgSum, sbSum, scnt, 0);
        }

        state.hairCanvases[angle] = hairC;
        state.baseCanvases[angle] = baseC;
        state.hairMasks[angle]    = {
          scalpY, hairEndY, w:img.width, h:img.height, avgColor:avgHairColor,
          scalpColor, // 얼굴 피부에서 샘플링한 두피/피부 톤 — 가닥 사이 언더코트에 사용
          // 결방향 필드는 축소 해상도(maskW,maskH) 좌표계로 저장됨 — 사용 시 비율 변환 필요
          orientation: orientationColSamples,
          maskW: w, maskH: h,
          reasonMask, // [진단용] 0:미해당 1:최종 머리카락 2:얼굴박스로 제외 3:눈썹/눈/입 가드로 제외
          reasonCanvas: reasonC, // [진단용] 위 코드를 색으로 미리 구운 작은 캔버스(w×h, 축소 해상도)
          faceBoxDiag // [진단용] 얼굴제거박스 좌표/사용 랜드마크 — "얼굴박스 보기" 토글에서 사용
        };
        console.log('[진단] extractHairMask 완료', angle, 'faceBoxDiag=', faceBoxDiag);
        resolve(true);
      }catch(e){
        console.warn('extractHairMask 실패:', angle, e);
        resolve(false);
      }
    };
    img.src = dataUrl;
  });
}

/* ────────────────────────────────────────
   유틸: HSV hair 색상 판별 (어두운 갈색~흑색 계열)
──────────────────────────────────────── */
// hueDegrees: RGB에서 hue(0~360)만 계산하는 공용 헬퍼.
// isHairColor / isHairColorRelaxed 양쪽에서 동일하게 쓰던 공식을 하나로 통합.
function hueDegrees(r,g,b,maxC,minC){
  const hRaw=maxC>0?( maxC===r?((g-b)/(maxC-minC+0.001))%6
                    : maxC===g?((b-r)/(maxC-minC+0.001))+2
                    :           ((r-g)/(maxC-minC+0.001))+4 )*60 : 0;
  return (hRaw+360)%360;
}
function isHairColor(r,g,b){
  // 흑발·갈색·금발·회색·백발(새치) 모두 인식
  const maxC=Math.max(r,g,b), minC=Math.min(r,g,b);
  const v=maxC/255;
  const s=maxC>0?(maxC-minC)/maxC:0;

  // 1) 흑발·어두운 색
  if(v<0.55) return true;

  // 2) 채도 있는 갈색/적갈색/금발 (hue 0~50 또는 300~360)
  if(s>0.15 && v<0.80){
    const hh=hueDegrees(r,g,b,maxC,minC);
    if(hh<50||hh>300) return true;
  }

  // 3) 회색·새치·백발: 저채도이면서 밝기 0.55~0.90 구간
  //    (순수 흰색 v>0.90 및 밝은 피부색 제외)
  if(s<0.18 && v>=0.55 && v<0.90) return true;

  return false;
}

// isHairColorRelaxed: isHairColor보다 완화된 기준.
// 화면 전체가 아니라 귀 주변(옆머리) 좁은 영역에서만 보조로 사용.
// 밝은 조명을 받은 잔머리(하이라이트 진 가는 머리카락)는 채도가 낮으면서도
// 밝기가 0.90 근처까지 올라가 기존 조건(v<0.90)에서 누락되는 경우가 많아
// 밝기 상한을 완화하되, 순수 배경/피부와 헷갈리지 않도록 채도 조건은 더 좁게 유지.
function isHairColorRelaxed(r,g,b){
  const maxC=Math.max(r,g,b), minC=Math.min(r,g,b);
  const v=maxC/255;
  const s=maxC>0?(maxC-minC)/maxC:0;

  // 저채도 밝은 잔머리 (기존보다 밝기 상한 확장, 흰 배경과 구분 위해 채도 하한 살짝 요구)
  if(s<0.15 && v>=0.55 && v<0.94) return true;

  // 채도 있는 갈색/적갈색 계열, 밝기 상한 확장
  if(s>0.12 && v<0.88){
    const hh=hueDegrees(r,g,b,maxC,minC);
    if(hh<55||hh>295) return true;
  }

  return false;
}

// hasHairTexture: 국소(5x5 기본) 밝기 분산으로 "결이 있는 재질(머리카락)" vs
// "매끈한 재질(안경테 등)"을 구분한다.
// 안경다리/렌즈테는 통짜 플라스틱·금속이라 작은 창 안에서 밝기가 거의 균일(분산 낮음).
// 반대로 실제 머리카락은 가는 결 하나하나가 서로 다른 밝기를 가져 국소 분산이 큼
// (흑발이든 백발이든 색과 무관하게 성립하는 재질 특성).
// isHairColorRelaxed는 색만 보므로, 색이 맞아도 이 텍스처 조건을 통과 못하면
// 안경/매끈한 표면으로 간주해 제외한다.
// TEXTURE_VAR_THRESHOLD는 실측 없이 잡은 초기값 — 조명이 아주 평평한 사진에서
// 진짜 머리카락까지 걸러질 위험이 있어 추후 실측 데이터로 재조정 필요.
const TEXTURE_VAR_THRESHOLD = 30; // 밝기(0~255) 분산 기준, 표준편차로는 약 5.5
function hasHairTexture(gray, w, h, x, y, radius){
  radius = radius || 2; // 기본 5x5 윈도우
  const xs=Math.max(0,x-radius), xe=Math.min(w-1,x+radius);
  const ys=Math.max(0,y-radius), ye=Math.min(h-1,y+radius);
  let sum=0, sumSq=0, count=0;
  for(let ny=ys; ny<=ye; ny++){
    const row=ny*w;
    for(let nx=xs; nx<=xe; nx++){
      const v=gray[row+nx];
      sum+=v; sumSq+=v*v; count++;
    }
  }
  if(count===0) return true; // 창을 못 만들면(경계) 보수적으로 통과시킴
  const mean = sum/count;
  const variance = sumSq/count - mean*mean;
  return variance >= TEXTURE_VAR_THRESHOLD;
}

/* ────────────────────────────────────────
   유틸: 모폴로지 연산 (마스크 품질 향상)
──────────────────────────────────────── */
// separable 모폴로지 연산 공용 헬퍼 (dilate/erode가 공유)
// 저사양 기기 성능을 위해 brute-force 대신 가로→세로 1차원 패스로 처리
// 연산량 O(w*h*r^2) → O(w*h*r) 로 대폭 감소
// dilating=true: 팽창(경계 밖은 클램프, 하나라도 켜지면 255)
// dilating=false: 침식(경계 밖은 배경으로 취급, 하나라도 꺼지면 0)
function morphSeparable(buf, w, h, radius, dilating){
  if(radius<=0) return new Uint8Array(buf);
  const tmp = new Uint8Array(w*h);
  for(let y=0;y<h;y++){
    const row=y*w;
    for(let x=0;x<w;x++){
      let v = dilating?0:255;
      if(dilating){
        const xs=Math.max(0,x-radius), xe=Math.min(w-1,x+radius);
        for(let nx=xs;nx<=xe;nx++){ if(buf[row+nx]>0){ v=255; break; } }
      } else {
        const xs=x-radius, xe=x+radius;
        for(let nx=xs;nx<=xe;nx++){ if(nx<0||nx>=w||buf[row+nx]===0){ v=0; break; } }
      }
      tmp[row+x]=v;
    }
  }
  const out = new Uint8Array(w*h);
  for(let x=0;x<w;x++){
    for(let y=0;y<h;y++){
      let v = dilating?0:255;
      if(dilating){
        const ys=Math.max(0,y-radius), ye=Math.min(h-1,y+radius);
        for(let ny=ys;ny<=ye;ny++){ if(tmp[ny*w+x]>0){ v=255; break; } }
      } else {
        const ys=y-radius, ye=y+radius;
        for(let ny=ys;ny<=ye;ny++){ if(ny<0||ny>=h||tmp[ny*w+x]===0){ v=0; break; } }
      }
      out[y*w+x]=v;
    }
  }
  return out;
}

// dilate: 마스크를 radius 픽셀만큼 팽창 (사이드 하단 경계 확장)
function dilate(buf, w, h, radius){
  return morphSeparable(buf, w, h, radius, true);
}

// erode: 마스크를 radius 픽셀만큼 침식 (노이즈 제거)
function erode(buf, w, h, radius){
  return morphSeparable(buf, w, h, radius, false);
}

// closing = dilate → erode: 구멍 채우기 (사이드 하단 단절 구간 연결)
function morphClose(buf, w, h, radius){
  return erode(dilate(buf, w, h, radius), w, h, radius);
}

// fillColumnGaps: 각 열에서 마스크 픽셀 사이 빈 구간을 채움
// (머리카락이 희박하게 감지된 열에서 위아래 사이 구멍 메우기)
function fillColumnGaps(buf, w, h, maxGap){
  const out = new Uint8Array(buf);
  for(let x=0;x<w;x++){
    let lastOn=-1;
    for(let y=0;y<h;y++){
      if(buf[y*w+x]>0){
        if(lastOn>=0 && (y-lastOn-1)<=maxGap){
          for(let fy=lastOn+1;fy<y;fy++) out[fy*w+x]=255;
        }
        lastOn=y;
      }
    }
  }
  return out;
}

// ── 하이라이트로 날아간 부분 보강: 색과 무관한 "둘러싸인 구멍" 채우기 ──
// 완전히 하얗게 날아간(RGB≈255,255,255) 픽셀은 원래 색 정보 자체가 사라져서,
// 색 기반 필터(isHairColor 등)로는 원리적으로 "머리카락이었는지 벽/옷이었는지"
// 구분이 불가능함 — 밝기 임계값을 억지로 올리면 흰 벽·흰 옷깃까지 오탐할
// 위험이 커짐(실측 확인 필요 없이 원리적으로 그럼).
// 그래서 색을 전혀 안 보고 keepLargestComponents()와 반대 방향으로 접근한다:
// 배경(0)쪽 연결요소를 찾아서, (a) 이미지 테두리와 안 이어져 있고(=진짜 배경이
// 아니라 머리카락에 둘러싸인 구멍) (b) boundBox 면적 대비 충분히 작은(=벽처럼
// 큰 영역이 아니라 국소 하이라이트로 보이는) 것만 채운다. 진짜 배경은 항상
// 이미지 테두리와 연결돼 있어 (a)에서 걸러지고, 얼굴 같은 큰 미분류 영역은
// (b) 크기 상한에서 걸러지므로 색 기반 방식과 달리 오탐 위험이 구조적으로 낮음.
// maxHoleAreaFrac은 실측 없이 잡은 초기값 — 하이라이트 패치가 이보다 크면
// 여전히 안 채워질 수 있음, 실사진으로 재조정 필요.
function fillEnclosedHighlightHoles(buf, w, h, boundBox, maxHoleAreaFrac){
  const n = w*h;
  const labels = new Int32Array(n).fill(-1);
  const areas = [];
  const touchesBorder = [];
  const stack = new Int32Array(n);
  let nextLabel = 0;
  for(let start=0; start<n; start++){
    if(buf[start]>0 || labels[start]>=0) continue; // 배경(0) 픽셀만 대상
    let sp=0; stack[sp++]=start; labels[start]=nextLabel;
    let area=0, border=false;
    while(sp>0){
      const p = stack[--sp];
      area++;
      const px = p % w, py = (p - px) / w;
      if(px===0 || px===w-1 || py===0 || py===h-1) border = true;
      for(let dy=-1; dy<=1; dy++){
        for(let dx=-1; dx<=1; dx++){
          if(dx===0 && dy===0) continue;
          const nx=px+dx, ny=py+dy;
          if(nx<0||nx>=w||ny<0||ny>=h) continue;
          const np = ny*w+nx;
          if(buf[np]===0 && labels[np]<0){ labels[np]=nextLabel; stack[sp++]=np; }
        }
      }
    }
    areas.push(area); touchesBorder.push(border);
    nextLabel++;
  }
  const boundArea = Math.max(1, (boundBox.xE-boundBox.xS) * (boundBox.yE-boundBox.yS));
  const maxHoleArea = boundArea * maxHoleAreaFrac;
  const out = new Uint8Array(buf);
  for(let i=0;i<n;i++){
    if(buf[i]>0) continue;
    const lbl = labels[i];
    if(lbl<0) continue;
    const px = i % w, py = (i - px) / w;
    if(px<boundBox.xS || px>=boundBox.xE || py<boundBox.yS || py>=boundBox.yE) continue; // boundBox 밖은 안전하게 스킵
    if(!touchesBorder[lbl] && areas[lbl] <= maxHoleArea) out[i] = 255;
  }
  return out;
}

// keepLargestComponents: 마스크를 8방향 연결 요소로 분리하고, 가장 큰 덩어리(주로
// "실제 머리") 대비 일정 비율보다 작은 고립된 섬은 지워버린다.
// 배경/옷깃/안경테 등을 얇게 오탐한 작은 덩어리가 본체 머리카락과 이어지지 않은 채
// 따로 떠 있는 경우, scalpY는 "마스크만 있으면 유효 컬럼"으로 인정하기 때문에
// 그 위에도 정상적으로 가닥이 심어져 "머리에서 떨어진 덩어리"로 보이는 문제가 있었음.
// minRatio: 최대 덩어리 면적 대비 이 비율보다 작은 컴포넌트는 제거 (기본 3%)
function keepLargestComponents(buf, w, h, minRatio){
  const n = w*h;
  const labels = new Int32Array(n).fill(-1);
  const areas = [];
  const stack = new Int32Array(n); // BFS/DFS용 스택 (최악의 경우 전체 픽셀)
  let nextLabel = 0;
  for(let start=0; start<n; start++){
    if(buf[start]===0 || labels[start]>=0) continue;
    let sp = 0;
    stack[sp++] = start;
    labels[start] = nextLabel;
    let area = 0;
    while(sp>0){
      const p = stack[--sp];
      area++;
      const px = p % w, py = (p - px) / w;
      // 8방향 이웃
      for(let dy=-1; dy<=1; dy++){
        for(let dx=-1; dx<=1; dx++){
          if(dx===0 && dy===0) continue;
          const nx = px+dx, ny = py+dy;
          if(nx<0||nx>=w||ny<0||ny>=h) continue;
          const np = ny*w+nx;
          if(buf[np]>0 && labels[np]<0){
            labels[np] = nextLabel;
            stack[sp++] = np;
          }
        }
      }
    }
    areas.push(area);
    nextLabel++;
  }
  if(areas.length <= 1) return buf; // 덩어리가 하나뿐이면(또는 없으면) 그대로
  const maxArea = Math.max(...areas);
  const threshold = maxArea * minRatio;
  const out = new Uint8Array(n);
  for(let i=0;i<n;i++){
    const lbl = labels[i];
    if(lbl>=0 && areas[lbl] >= threshold) out[i] = buf[i];
  }
  return out;
}

/* ════════════════════════════════════════
   STRUCTURE TENSOR: 머리카락 결방향 인식
   ────────────────────────────────────────
   원리: 각 픽셀에서 Sobel 그래디언트(Ix, Iy)를 구하고,
   구조텐서 J = [[Ix², IxIy], [IxIy, Iy²]] 를 박스블러로 평균낸 뒤
   고유벡터 분석으로 "결 방향"(가장 변화가 적은 방향)을 추출한다.
   머리카락은 가는 선이 한 방향으로 나란히 흐르는 텍스처라
   그래디언트가 결방향에 수직으로 강하게 나타나므로,
   그 그래디언트의 수직 방향 = 머리카락이 흐르는 방향이 된다.
════════════════════════════════════════ */

// 그레이스케일 변환 (luma)
function toGrayscale(pixels, w, h){
  const gray = new Float32Array(w*h);
  for(let i=0;i<w*h;i++){
    const pi=i*4;
    gray[i] = 0.299*pixels[pi] + 0.587*pixels[pi+1] + 0.114*pixels[pi+2];
  }
  return gray;
}

// Sobel 그래디언트 (가로 Ix, 세로 Iy)
function sobelGradients(gray, w, h){
  const Ix = new Float32Array(w*h);
  const Iy = new Float32Array(w*h);
  for(let y=1;y<h-1;y++){
    for(let x=1;x<w-1;x++){
      const i = y*w+x;
      // Sobel X 커널
      const gx =
        -1*gray[(y-1)*w+(x-1)] + 1*gray[(y-1)*w+(x+1)] +
        -2*gray[y*w+(x-1)]     + 2*gray[y*w+(x+1)] +
        -1*gray[(y+1)*w+(x-1)] + 1*gray[(y+1)*w+(x+1)];
      // Sobel Y 커널
      const gy =
        -1*gray[(y-1)*w+(x-1)] - 2*gray[(y-1)*w+x] - 1*gray[(y-1)*w+(x+1)] +
         1*gray[(y+1)*w+(x-1)] + 2*gray[(y+1)*w+x] + 1*gray[(y+1)*w+(x+1)];
      Ix[i]=gx; Iy[i]=gy;
    }
  }
  return {Ix, Iy};
}

// 박스 블러 (구조텐서 성분 평균화용, separable)
function boxBlur(buf, w, h, radius){
  if(radius<=0) return new Float32Array(buf);
  const tmp = new Float32Array(w*h);
  const out = new Float32Array(w*h);
  const norm = 1/(radius*2+1);
  // 가로
  for(let y=0;y<h;y++){
    const row=y*w;
    let sum=0;
    for(let x=-radius;x<=radius;x++){ sum += buf[row + Math.min(w-1,Math.max(0,x))]; }
    for(let x=0;x<w;x++){
      tmp[row+x] = sum*norm;
      const xOut = x-radius, xIn = x+radius+1;
      sum += buf[row + Math.min(w-1,Math.max(0,xIn))] - buf[row + Math.min(w-1,Math.max(0,xOut))];
    }
  }
  // 세로
  for(let x=0;x<w;x++){
    let sum=0;
    for(let y=-radius;y<=radius;y++){ sum += tmp[Math.min(h-1,Math.max(0,y))*w+x]; }
    for(let y=0;y<h;y++){
      out[y*w+x] = sum*norm;
      const yOut=y-radius, yIn=y+radius+1;
      sum += tmp[Math.min(h-1,Math.max(0,yIn))*w+x] - tmp[Math.min(h-1,Math.max(0,yOut))*w+x];
    }
  }
  return out;
}

/**
 * computeHairOrientationField
 * 머리카락 마스크 영역에서 결방향 필드를 계산한다.
 * @param pixels  원본 이미지 RGBA Uint8ClampedArray (w*h*4)
 * @param maskBuf 머리카락 마스크 (0 또는 255, w*h)
 * @param w,h     이미지 크기
 * @returns {angle: Float32Array, coherence: Float32Array}
 *   angle[i]: 해당 픽셀에서 머리카락이 흐르는 방향 (라디안, -PI/2~PI/2 범위, 0=수직 아래방향 기준)
 *   coherence[i]: 0~1, 방향성이 얼마나 뚜렷한지 (1=결이 또렷, 0=무방향/노이즈)
 */
function computeHairOrientationField(pixels, maskBuf, w, h){
  const gray = toGrayscale(pixels, w, h);
  const {Ix, Iy} = sobelGradients(gray, w, h);

  // 구조텐서 성분: Jxx=Ix², Jyy=Iy², Jxy=IxIy
  const n = w*h;
  const Jxx = new Float32Array(n);
  const Jyy = new Float32Array(n);
  const Jxy = new Float32Array(n);
  for(let i=0;i<n;i++){
    Jxx[i] = Ix[i]*Ix[i];
    Jyy[i] = Iy[i]*Iy[i];
    Jxy[i] = Ix[i]*Iy[i];
  }

  // 박스블러로 국소 평균 (윈도우 반경 3 ≈ 머리카락 다발 굵기 정도)
  const blurR = 3;
  const JxxB = boxBlur(Jxx, w, h, blurR);
  const JyyB = boxBlur(Jyy, w, h, blurR);
  const JxyB = boxBlur(Jxy, w, h, blurR);

  const angle = new Float32Array(n);
  const coherence = new Float32Array(n);

  for(let i=0;i<n;i++){
    if(maskBuf[i]===0) continue; // 머리카락 영역만 계산
    const jxx=JxxB[i], jyy=JyyB[i], jxy=JxyB[i];

    // 구조텐서의 고유값으로 coherence 계산
    const trace = jxx+jyy;
    const diff  = jxx-jyy;
    const disc  = Math.sqrt(diff*diff + 4*jxy*jxy);
    const lambda1 = (trace+disc)/2; // 큰 고유값 (그래디언트가 가장 강한 방향)
    const lambda2 = (trace-disc)/2; // 작은 고유값 (결방향, 변화가 가장 적은 방향)

    coherence[i] = (lambda1+lambda2) > 1e-6 ? (lambda1-lambda2)/(lambda1+lambda2) : 0;

    // 그래디언트가 가장 강한 방향(고유벡터, 결에 수직)을 구한 뒤 90도 회전 → 결방향
    // 2*theta = atan2(2*Jxy, Jxx-Jyy)  (구조텐서 표준 공식)
    const gradDir = 0.5 * Math.atan2(2*jxy, diff);
    let hairDir = gradDir + Math.PI/2; // 결방향 = 그래디언트 방향 + 90도

    // -PI/2 ~ PI/2 범위로 정규화 (선분이라 180도 주기성을 가짐)
    while(hairDir > Math.PI/2)  hairDir -= Math.PI;
    while(hairDir < -Math.PI/2) hairDir += Math.PI;

    angle[i] = hairDir;
  }

  return {angle, coherence};
}

// 결방향 필드를 컬럼별 대표값으로 다운샘플 (가닥 렌더링에서 빠르게 참조하기 위함)
// 각 컬럼(x)에서 머리카락 마스크가 있는 y구간을 일정 간격으로 샘플링해 평균 방향 산출
function buildColumnOrientationSamples(angleField, coherenceField, maskBuf, w, h, samplesPerCol){
  // colSamples[x] = [{y, angle, coherence}, ...]  (y 오름차순)
  const colSamples = new Array(w);
  for(let x=0;x<w;x++){
    const samples=[];
    let ys=[];
    for(let y=0;y<h;y++){ if(maskBuf[y*w+x]>0) ys.push(y); }
    if(ys.length===0){ colSamples[x]=samples; continue; }
    const step = Math.max(1, Math.floor(ys.length/samplesPerCol));
    for(let k=0;k<ys.length;k+=step){
      const y=ys[k], i=y*w+x;
      samples.push({y, angle:angleField[i], coherence:coherenceField[i]});
    }
    colSamples[x]=samples;
  }
  return colSamples;
}

// 특정 (x,y) 근방의 결방향을 컬럼 샘플에서 보간해서 반환 (가닥 그릴 때 사용)
function sampleOrientation(colSamples, x, w, y){
  const col = colSamples[Math.max(0,Math.min(w-1,Math.round(x)))];
  if(!col || col.length===0) return {angle:0, coherence:0};
  // y에 가장 가까운 두 샘플을 찾아 선형보간
  let lo=null, hi=null;
  for(let s of col){
    if(s.y<=y) lo=s;
    if(s.y>=y && !hi) hi=s;
  }
  if(lo && hi && lo!==hi){
    const t=(y-lo.y)/(hi.y-lo.y || 1);
    // 결방향은 "선분"이라 180도 주기성을 가짐 (+89도와 -89도는 사실상 같은 결).
    // hi.angle을 그대로 선형보간하면 -PI/2/+PI/2 경계를 넘나들 때 값이
    // 엉뚱하게 0(수평)으로 꺾여서, 뷰와 무관하게 고정된 높이에 가로 빗살
    // 아티팩트가 생김. hi.angle을 lo.angle과 가장 가까운 표현으로 맞춘 뒤 보간한다.
    let hiAngle = hi.angle;
    let diff = hiAngle - lo.angle;
    while(diff > Math.PI/2)  { hiAngle -= Math.PI; diff = hiAngle - lo.angle; }
    while(diff < -Math.PI/2) { hiAngle += Math.PI; diff = hiAngle - lo.angle; }
    return {
      angle: lo.angle + diff*t,
      coherence: lo.coherence + (hi.coherence-lo.coherence)*t
    };
  }
  return lo || hi || {angle:0, coherence:0};
}

const STAGE_NAMES={capture:'1/5 · 촬영',style:'2/5 · 스타일',adjust:'3/5 · 조정',compare:'4/5 · 비교',model3d:'5/5 · 3D두상'};

// nav-* 탭의 disabled를 해제 (진행 단계에 따라 잠금 해제)
function unlockTab(id){ const t=document.getElementById('nav-'+id); if(t) t.disabled=false; }

// 'style' 화면 최초 진입 시 실행되는 AI 분석 파이프라인
// (세그멘터 대기 → 각도별 랜드마크/헤어마스크 추출 → 뷰 매핑 → Claude 분석 요청)
async function runStyleAnalysisPipeline(){
  // segmenter가 아직 로딩 중이면 잠깐 대기 (최대 6초)
  if(!segmenterReady && !segmenterError){
    showAI('모델 로딩 중…', 'Hair Segmentation 준비 중');
    let waited = 0;
    while(!segmenterReady && !segmenterError && waited < 6000){
      await new Promise(r=>setTimeout(r,300)); waited+=300;
    }
  }
  if(segmenter){
    const validAngles = ANGLES.filter(a=>state.shots[a]);
    let done = 0;
    for(const a of validAngles){
      showAI(
        `머리카락 추출 중… ${done+1}/${validAngles.length}`,
        `${ANGLE_LABELS[a]} 처리 중`
      );
      // Face Landmarker: 랜드마크를 먼저 감지해야 extractHairMask에서
      // 얼굴 위치 기반으로 정확한 제거 영역을 잡을 수 있음 (정면/측면 모두 대응)
      if(faceLandmarkerReady){
        showAI(`얼굴 분석 중… ${done+1}/${validAngles.length}`, `${ANGLE_LABELS[a]} 랜드마크 감지`);
        await detectFaceLandmarks(a);
      }
      await extractHairMask(a);
      if(faceLandmarkerReady){
        refineSectionBoundaries(a);
      }
      done++;
    }
    hideAI();
    // 모든 뷰 랜드마크 추출 완료 → 매핑 테이블 생성
    buildViewMapping();
  }
  await analyzeWithClaude();
}

// 화면 전환의 순수 DOM 작업만 담당: .screen/.nav-tab active 토글, 단계 라벨, currentScreen 갱신
function activateScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById('nav-'+name);
  if(tab) tab.classList.add('active');
  document.getElementById('stageLabel').innerHTML='단계 <b>'+STAGE_NAMES[name]+'</b>';
  currentScreen = name; // 먼저 업데이트
}

// 상태텍스트: 현재 진단 중인 항목(각도 탭 vs 실측 3D 포즈)만 남김.
// 마스크픽셀/랜드마크진단/배경가드 등 세그멘테이션 관련 긴 로그(state._diagLog)는
// 지금 확인 대상이 아니라서 제거 — 필요해지면 그때 다시 노출.
// 버그 수정: 예전엔 이 로직이 setupAdjustScreen() 안에 인라인으로 있어서 조정 화면
// "최초 진입" 시점에만 계산됐음 — 각도 탭(정면/좌측/우측/후면) 전환 핸들러는 이 함수를
// 다시 호출하지 않아서, 탭을 바꿔도 화면엔 항상 최초 진입 당시의 각도(front) 값이
// 그대로 남아있었음(실제 계산은 각도별로 맞게 되고 있었는데 "표시"만 고정된 버그).
// → 독립 함수로 분리해서 화면 진입 시점과 탭 전환 시점 둘 다에서 호출되게 함.
function updateSegStatus(){
  const angle = state.currentViewAngle;
  const el = document.getElementById('segStatus');
  if(!el) return;
  const lm = state.landmarks && state.landmarks[angle];
  if(lm && typeof lm.poseYawDeg === 'number'){
    el.textContent = `[${ANGLE_LABELS[angle]}] poseYaw:${lm.poseYawDeg.toFixed(1)}° pitch:${(lm.posePitchDeg??0).toFixed(1)}° roll:${(lm.poseRollDeg??0).toFixed(1)}° (근사yaw:${lm.yaw.toFixed(2)})`;
  } else if(lm){
    el.textContent = `[${ANGLE_LABELS[angle]}] 포즈행렬 없음 — 근사yaw:${lm.yaw.toFixed(2)}만 사용`;
  } else {
    el.textContent = `[${ANGLE_LABELS[angle]}] 랜드마크 없음`;
  }
}

// 'adjust' 화면 진입 시 셋업: 디버그 토글 상태 동기화, 세그멘테이션 상태 표시,
// 섹션 탭 구성, globalCurl 슬라이더 동기화, 프리뷰 렌더
function setupAdjustScreen(){
  unlockTab('adjust'); renderAngleSwitch('angleSwitch');
  const maskBtn = document.getElementById('maskDebugToggle');
  if(maskBtn){
    maskBtn.classList.toggle('on', state.debugShowMask);
    maskBtn.textContent = state.debugShowMask ? '마스크 보기' : '가닥 보기';
  }
  const rawBtn = document.getElementById('rawDebugToggle');
  if(rawBtn){
    rawBtn.classList.toggle('on', state.debugShowRaw);
    rawBtn.textContent = state.debugShowRaw ? '스타일 보기' : '원본 결 보기';
  }
  const styleTag = document.getElementById('adjustStyleTag');
  if(styleTag && state.debugShowRaw){
    styleTag.textContent = '원본 결 (스타일 미적용)';

  const gcVal = document.getElementById('val-globalCurl');

  if(gcVal) gcVal.textContent = state._globalCurl;
  setTimeout(()=>drawAdjustPreview(),80);

async function navTo(name){
  if(name==='style'){
    unlockTab('style');
    if(!aiAnalysis){ await runStyleAnalysisPipeline(); }
  }
  if(name==='capture'){ stopVoice(); }

  activateScreen(name);

  // currentScreen 업데이트 후 렌더 (블랭크 수정)
  if(name==='adjust'){ setupAdjustScreen(); }
  if(name==='compare'){ unlockTab('compare'); renderAngleSwitch('angleSwitchCompare'); setTimeout(()=>drawCompare(),80); }
  if(name==='model3d'){ unlockTab('model3d'); setTimeout(()=>setupModel3DScreen(),80); }
}

const video = document.getElementById('video');

async function initCamera(){

function updateAngleUI(){
  ANGLES.forEach((a,i)=>{
    const card=document.getElementById('card-'+a);
    const seg=document.getElementById('seg'+i);
    const thumb=document.getElementById('thumb-'+a);
    const chk=document.getElementById('chk-'+a);
    const isCurrent = i===state.currentCaptureIndex;
    const hasShot = !!state.shots[a];
    card.className='angle-item'+(isCurrent?' current':'');
    chk.textContent = hasShot?'✓':'';
    thumb.innerHTML = hasShot?`<img src="${state.shots[a]}">`:'';
    // dial
    const okColor='#8FA888', activeColor='#C98A4B', lineColor='#3A332B';
    seg.style.stroke = hasShot?okColor:(isCurrent?activeColor:lineColor);
  });
  const doneCount=ANGLES.filter(a=>state.shots[a]).length;
  document.getElementById('dialCenter').textContent=doneCount+'/4';
  const curAngle=ANGLES[state.currentCaptureIndex];
  document.getElementById('captureHint').textContent=HINTS[curAngle];
  document.getElementById('capHintSmall').textContent=ANGLE_LABELS[curAngle]+ ' 촬영';
  document.getElementById('toStyleBtn').disabled=doneCount<1;
  // show/hide preview
  const shot=state.shots[curAngle];
  const sp=document.getElementById('shotPreview');
  if(shot){sp.src=shot;sp.style.display='block';video.style.display='none';}
  else{sp.style.display='none';if(cameraStream)video.style.display='block';}
}
updateAngleUI();

function jumpToAngle(i){ state.currentCaptureIndex=i; updateAngleUI(); }

function captureCurrentAngle(){
  const angle=ANGLES[state.currentCaptureIndex];
  if(state.shots[angle]){ retakeCurrent(); return; }
  if(video.style.display!=='none' && video.videoWidth){
    const c=document.createElement('canvas');
    c.width=video.videoWidth; c.height=video.videoHeight;
    const ctx=c.getContext('2d');
    ctx.translate(c.width,0); ctx.scale(-1,1); // mirror
    ctx.drawImage(video,0,0);
    state.shots[angle]=c.toDataURL('image/jpeg',0.85);
    // auto advance
    if(state.currentCaptureIndex<3) state.currentCaptureIndex++;
    updateAngleUI();
  } else { showToast('카메라가 준비되지 않았어요.'); }
}

function retakeCurrent(){
  const angle=ANGLES[state.currentCaptureIndex];
  state.shots[angle]=null; state.hairCanvases[angle]=null; state.hairMasks[angle]=null; state.baseCanvases[angle]=null;
  aiAnalysis=null;
  updateAngleUI();
}

function handleFileUpload(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    state.shots[ANGLES[state.currentCaptureIndex]]=ev.target.result;
    if(state.currentCaptureIndex<3) state.currentCaptureIndex++;
    updateAngleUI();
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function styleIconSVG(st){
  let s=''; const n=14;
  for(let i=0;i<n;i++){
    const t=i/(n-1), x=20+t*60;
    const amp=(st.curl/100)*14, len=16+(st.length/100)*50;
    const mx=x+Math.sin(t*6)*amp, ex=x+Math.sin(t*6+1)*amp*1.3;
    s+=`<path d="M ${x} 16 Q ${mx} ${16+len*0.5} ${ex} ${16+len}" stroke="${st.colorHex}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>`;
  }
  return `<svg viewBox="0 0 100 90" width="100%" height="100%"><circle cx="50" cy="12" r="9" fill="#3A332B"/>${s}</svg>`;
}
function selectStyle(id){
  // ROADMAP(raw-edit): 스타일 적용 직후 각 섹션 length/volume을 50으로 리셋해서
  // 올림/내림 조정이 대칭이 되게 할 예정 (지금은 st.length/volume 그대로 대입).
  // 동시에 debugShowRaw를 진단토글이 아니라 "스타일 미적용 직접편집" 정식 모드로
  // 승격 — 진입 버튼/UI 문구만 바꾸면 로직은 재사용 가능.
  state.selectedStyle=STYLES.find(s=>s.id===id);
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('style-'+id).classList.add('selected');
  document.getElementById('toAdjustBtn').disabled=false;
  // 스타일 파라미터를 섹션 기본값으로 변환
  const st = state.selectedStyle;
  state.sections.crown.length    = st.length;
  state.sections.crown.volume    = st.volume;
  state.sections.front.length    = Math.round(st.length * 0.85); // 앞머리는 약간 짧게
  state.sections.front.line      = 50;
  state.sections.temple.length   = Math.round(st.length * 0.80);
  state.sections.temple.blend    = 50;
  state.sections.side.length     = Math.round(st.length * 0.90);
  state.sections.side.layer      = st.curl > 40 ? 40 : 20;
  state.sections.occipital.length= st.length;
  state.sections.occipital.volume= st.volume;
  state.sections.nape.length     = Math.round(st.length * 0.60);
  state.sections.nape.line       = 50;
  state._globalCurl = st.curl;
  syncSliderUI();
}

const PARAM_LABELS = {
  length:'길이', volume:'볼륨', line:'라인', blend:'연결감', layer:'레이어',
};

function buildSectionTabs(){
  const container = document.getElementById('sectionTabs');
  container.innerHTML = '';
  SECTION_ORDER.forEach(id=>{
    const sec = SECTIONS[id];
    const div = document.createElement('div');
    div.className = 'section-tab' + (state.currentSection===id?' active':'');
    div.id = 'sectab-'+id;

    // 이 섹션이 현재 뷰에 보이는지 표시
    const visHere = sec.visibleIn.includes(state.currentViewAngle);
    const viewNote = visHere ? '' : `<span style="color:var(--warn);font-size:10px;">현재 뷰에서 안 보임</span>`;

    div.innerHTML = `
      <div class="section-tab-header" onclick="selectSection('${id}')">
        <div class="section-tab-left">
          <span class="section-badge">${sec.labelEn}</span>
          <div>
            <div class="section-tab-name">${sec.label} ${viewNote}</div>
            <div class="section-tab-desc">${sec.desc}</div>
          </div>
        </div>
        <div class="section-tab-summary" id="sectab-summary-${id}"></div>
      </div>
      <div class="section-tab-body" id="sectab-body-${id}">
        ${sec.params.map(p=>`
          <div class="slider-block">
            <div class="param-label-row">
              <span class="param-label">${PARAM_LABELS[p]||p}</span>
              <span class="param-val" id="secval-${id}-${p}">${state.sections[id][p]}</span>
            </div>
            <input type="range" id="secslider-${id}-${p}" min="0" max="100"
              value="${state.sections[id][p]}"
              oninput="onSectionSlider('${id}','${p}',this.value)">
          </div>
        `).join('')}
        <div class="section-affects">영향: ${sec.visibleIn.map(v=>ANGLE_LABELS[v]).join(' · ')}</div>
      </div>`;
    container.appendChild(div);
    updateSectionSummary(id);
  });
}

function selectSection(id){
  state.currentSection = id;
  // 탭 active 토글
  SECTION_ORDER.forEach(sid=>{
    document.getElementById('sectab-'+sid)?.classList.toggle('active', sid===id);
  });
  // 해당 섹션이 보이는 뷰로 자동 전환
  const visIn = SECTIONS[id].visibleIn;
  if(!visIn.includes(state.currentViewAngle)){
    state.currentViewAngle = visIn[0];
    renderAngleSwitches();
    drawAdjustPreview();
  }
}

function onSectionSlider(secId, param, val){
  const intVal = parseInt(val);
  // 현재 뷰에 직접 적용
  state.sections[secId][param] = intVal;
  document.getElementById(`secval-${secId}-${param}`).textContent = val;
  updateSectionSummary(secId);
  // 섹션 간 연동 (같은 뷰 안에서)
  propagateSectionChange(secId, param);
  // 뷰 간 연동 (랜드마크 매핑 기반으로 인접 뷰에 반영)
  const curAngle = state._adjustAngle || 'front';
  propagateSectionToViews(curAngle, secId, param, intVal);
  drawAdjustPreview();
}

function onGlobalCurl(val){
  state._globalCurl = parseInt(val);
  document.getElementById('val-globalCurl').textContent = val;
  drawAdjustPreview();
}

function propagateSectionChange(secId, param){
  // crown 길이 → temple 길이에 50% 반영 (연결감 유지)
  if(secId==='crown' && param==='length'){
    const crownLen = state.sections.crown.length;
    const templeBlend = state.sections.temple.blend / 100;
    const newTemple = Math.round(crownLen * (1 - templeBlend*0.4));
    state.sections.temple.length = Math.max(0, Math.min(100, newTemple));
    const tSlider = document.getElementById('secslider-temple-length');
    if(tSlider) tSlider.value = state.sections.temple.length;
    const _tv = document.getElementById('secval-temple-length'); if(_tv) _tv.textContent = state.sections.temple.length;
    updateSectionSummary('temple');
  }
  // side 길이 변경 시 occipital에 30% 반영
  if(secId==='side' && param==='length'){
    const blend = 0.3;
    state.sections.occipital.length = Math.round(
      state.sections.occipital.length * (1-blend) + state.sections.side.length * blend
    );
    const oSlider = document.getElementById('secslider-occipital-length');
    if(oSlider) oSlider.value = state.sections.occipital.length;
    const _ov = document.getElementById('secval-occipital-length'); if(_ov) _ov.textContent = state.sections.occipital.length;
    updateSectionSummary('occipital');
  }
}

/* ════════════════════════════════════════
   RENDER / CANVAS
   - 이미지 캐시로 매번 new Image() 방지
   - hairCanvas 없으면 SVG 선 오버레이로 폴백
════════════════════════════════════════ */
const imgCache = {}; // angle → HTMLImageElement (loaded)

function getCachedImg(angle, cb){
  const url = state.shots[angle];
  if(!url){ cb(null); return; }
  if(imgCache[angle] && imgCache[angle].src.endsWith(url.slice(-20))){
    cb(imgCache[angle]); return;
  }
  const img = new Image();
  img.onload = ()=>{ imgCache[angle]=img; cb(img); };
  img.onerror = ()=>cb(null);
  img.src = url;
}

function drawImgOnCanvas(ctx, img, w, h){
  const {dw,dh,dx,dy} = computeFit(img.width, img.height, w, h);
  ctx.drawImage(img,dx,dy,dw,dh);
  return {dw,dh,dx,dy};
}

// fit 계산만 하고 실제로 그리지는 않음 (베이스를 원본 대신 baseC로 바로 그릴 때 사용)
function computeFit(imgW, imgH, w, h){
  const ir=imgW/imgH, cr=w/h;
  let dw,dh,dx,dy;
  if(ir>cr){dh=h;dw=h*ir;dx=(w-dw)/2;dy=0;}
  else{dw=w;dh=w/ir;dx=0;dy=(h-dh)/2;}
  return {dw,dh,dx,dy};
}

function syncCanvasSize(canvas){
  const rect=canvas.getBoundingClientRect();
  if(rect.width>0&&rect.height>0){canvas.width=rect.width;canvas.height=rect.height;}
}

// 핵심 렌더 함수
// 마스크 디버그 버튼 상태 동기화 (toggleMaskDebug/toggleRawDebug 양쪽에서 공용으로 사용)

// 원본 결 보기 토글: 스타일/슬라이더 값을 무시하고 전 섹션을 중립값
