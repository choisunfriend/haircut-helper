const STAGE_NAMES={capture:'1/4 · 촬영',style:'2/4 · 스타일',adjust:'3/4 · 조정',compare:'4/4 · 비교'};

// nav-* 탭의 disabled를 해제 (진행 단계에 따라 잠금 해제)
function unlockTab(id){ const t=document.getElementById('nav-'+id); if(t) t.disabled=false; }

// 'style' 화면 최초 진입 시 실행되는 AI 분석 파이프라인
// (세그멘터 대기 → 각도별 랜드마크/헤어마스크 추출 → 뷰 매핑 → Claude 분석 요청)
async function runStyleAnalysisPipeline(){
  // segmenter가 아직 로딩 중이면 잠깐 대기 (최대 6초)
  if(!segmenterReady && !segmenterError){
    showAI('모델 로딩 중…', 'Hair Segmentation 준비 중');
    let waited = 0;
    while(!segmenterReady && !segmenterError && waited < 6000){
      await new Promise(r=>setTimeout(r,300)); waited+=300;
    }
  }
  if(segmenter){
    const validAngles = ANGLES.filter(a=>state.shots[a]);
    let done = 0;
    for(const a of validAngles){
      showAI(
        `머리카락 추출 중… ${done+1}/${validAngles.length}`,
        `${ANGLE_LABELS[a]} 처리 중`
      );
      // Face Landmarker: 랜드마크를 먼저 감지해야 extractHairMask에서
      // 얼굴 위치 기반으로 정확한 제거 영역을 잡을 수 있음 (정면/측면 모두 대응)
      if(faceLandmarkerReady){
        showAI(`얼굴 분석 중… ${done+1}/${validAngles.length}`, `${ANGLE_LABELS[a]} 랜드마크 감지`);
        await detectFaceLandmarks(a);
      }
      await extractHairMask(a);
      if(faceLandmarkerReady){
        refineSectionBoundaries(a);
      }
      done++;
    }
    hideAI();
    // 모든 뷰 랜드마크 추출 완료 → 매핑 테이블 생성
    buildViewMapping();
  }
  await analyzeWithClaude();
}

// 화면 전환의 순수 DOM 작업만 담당: .screen/.nav-tab active 토글, 단계 라벨, currentScreen 갱신
function activateScreen(name){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+name).classList.add('active');
  document.querySelectorAll('.nav-tab').forEach(t=>t.classList.remove('active'));
  const tab = document.getElementById('nav-'+name);
  if(tab) tab.classList.add('active');
  document.getElementById('stageLabel').innerHTML='단계 <b>'+STAGE_NAMES[name]+'</b>';
  currentScreen = name; // 먼저 업데이트
}

// 상태텍스트: 현재 진단 중인 항목(각도 탭 vs 실측 3D 포즈)만 남김.
// 마스크픽셀/랜드마크진단/배경가드 등 세그멘테이션 관련 긴 로그(state._diagLog)는
// 지금 확인 대상이 아니라서 제거 — 필요해지면 그때 다시 노출.
// 버그 수정: 예전엔 이 로직이 setupAdjustScreen() 안에 인라인으로 있어서 조정 화면
// "최초 진입" 시점에만 계산됐음 — 각도 탭(정면/좌측/우측/후면) 전환 핸들러는 이 함수를
// 다시 호출하지 않아서, 탭을 바꿔도 화면엔 항상 최초 진입 당시의 각도(front) 값이
// 그대로 남아있었음(실제 계산은 각도별로 맞게 되고 있었는데 "표시"만 고정된 버그).
// → 독립 함수로 분리해서 화면 진입 시점과 탭 전환 시점 둘 다에서 호출되게 함.
function updateSegStatus(){
  const angle = state.currentViewAngle;
  const el = document.getElementById('segStatus');
  if(!el) return;
  const lm = state.landmarks && state.landmarks[angle];
  if(lm && typeof lm.poseYawDeg === 'number'){
    el.textContent = `[${ANGLE_LABELS[angle]}] poseYaw:${lm.poseYawDeg.toFixed(1)}° pitch:${(lm.posePitchDeg??0).toFixed(1)}° roll:${(lm.poseRollDeg??0).toFixed(1)}° (근사yaw:${lm.yaw.toFixed(2)})`;
  } else if(lm){
    el.textContent = `[${ANGLE_LABELS[angle]}] 포즈행렬 없음 — 근사yaw:${lm.yaw.toFixed(2)}만 사용`;
  } else {
    el.textContent = `[${ANGLE_LABELS[angle]}] 랜드마크 없음`;
  }
}

// 'adjust' 화면 진입 시 셋업: 디버그 토글 상태 동기화, 세그멘테이션 상태 표시,
// 섹션 탭 구성, globalCurl 슬라이더 동기화, 프리뷰 렌더
function setupAdjustScreen(){
  unlockTab('adjust'); renderAngleSwitch('angleSwitch');
  const maskBtn = document.getElementById('maskDebugToggle');
  if(maskBtn){
    maskBtn.classList.toggle('on', state.debugShowMask);
    maskBtn.textContent = state.debugShowMask ? '마스크 보기' : '가닥 보기';
  }
  const rawBtn = document.getElementById('rawDebugToggle');
  if(rawBtn){
    rawBtn.classList.toggle('on', state.debugShowRaw);
    rawBtn.textContent = state.debugShowRaw ? '스타일 보기' : '원본 결 보기';
  }
  const styleTag = document.getElementById('adjustStyleTag');
  if(styleTag && state.debugShowRaw){
    styleTag.textContent = '원본 결 (스타일 미적용)';
  }
  updateSegStatus();
  buildSectionTabs();
  // globalCurl 슬라이더 동기화
  const gcSlider = document.getElementById('slider-globalCurl');
  const gcVal = document.getElementById('val-globalCurl');
  if(gcSlider) gcSlider.value = state._globalCurl;
  if(gcVal) gcVal.textContent = state._globalCurl;
  setTimeout(()=>drawAdjustPreview(),80);
}

async function navTo(name){
  if(name==='style'){
    unlockTab('style');
    if(!aiAnalysis){ await runStyleAnalysisPipeline(); }
  }
  if(name==='capture'){ stopVoice(); }

  activateScreen(name);

  // currentScreen 업데이트 후 렌더 (블랭크 수정)
  if(name==='adjust'){ setupAdjustScreen(); }
  if(name==='compare'){ unlockTab('compare'); renderAngleSwitch('angleSwitchCompare'); setTimeout(()=>drawCompare(),80); }
}

const video = document.getElementById('video');
const camOffMsg = document.getElementById('camOffMsg');
let cameraStream = null;

async function initCamera(){
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1920},height:{ideal:2560}},audio:false});
    video.srcObject=cameraStream;

  }catch(e){
    camOffMsg.innerHTML='카메라에 접근할 수 없습니다.<br><span style="font-size:11px;">아래 "업로드" 버튼을 이용해주세요.</span>';
    camOffMsg.style.display='';
  }
}
initCamera();

function updateAngleUI(){
  ANGLES.forEach((a,i)=>{
    const card=document.getElementById('card-'+a);
    const seg=document.getElementById('seg'+i);
    const thumb=document.getElementById('thumb-'+a);
    const chk=document.getElementById('chk-'+a);
    const isCurrent = i===state.currentCaptureIndex;
    const hasShot = !!state.shots[a];
    card.className='angle-item'+(isCurrent?' current':'');
    chk.textContent = hasShot?'✓':'';
    thumb.innerHTML = hasShot?`<img src="${state.shots[a]}">`:'';
    // dial
    const okColor='#8FA888', activeColor='#C98A4B', lineColor='#3A332B';
    seg.style.stroke = hasShot?okColor:(isCurrent?activeColor:lineColor);
  });
  const doneCount=ANGLES.filter(a=>state.shots[a]).length;
  document.getElementById('dialCenter').textContent=doneCount+'/4';
  const curAngle=ANGLES[state.currentCaptureIndex];
  document.getElementById('captureHint').textContent=HINTS[curAngle];
  document.getElementById('capHintSmall').textContent=ANGLE_LABELS[curAngle]+ ' 촬영';
  document.getElementById('toStyleBtn').disabled=doneCount<1;
  // show/hide preview
  const shot=state.shots[curAngle];
  const sp=document.getElementById('shotPreview');
  if(shot){sp.src=shot;sp.style.display='block';video.style.display='none';}
  else{sp.style.display='none';if(cameraStream)video.style.display='block';}
}
updateAngleUI();

function jumpToAngle(i){ state.currentCaptureIndex=i; updateAngleUI(); }

function captureCurrentAngle(){
  const angle=ANGLES[state.currentCaptureIndex];
  if(state.shots[angle]){ retakeCurrent(); return; }
  if(video.style.display!=='none' && video.videoWidth){
    const c=document.createElement('canvas');
    c.width=video.videoWidth; c.height=video.videoHeight;
    const ctx=c.getContext('2d');
    ctx.translate(c.width,0); ctx.scale(-1,1); // mirror
    ctx.drawImage(video,0,0);
    state.shots[angle]=c.toDataURL('image/jpeg',0.85);
    // auto advance
    if(state.currentCaptureIndex<3) state.currentCaptureIndex++;
    updateAngleUI();
  } else { showToast('카메라가 준비되지 않았어요.'); }
}

function retakeCurrent(){
  const angle=ANGLES[state.currentCaptureIndex];
  state.shots[angle]=null; state.hairCanvases[angle]=null; state.hairMasks[angle]=null; state.baseCanvases[angle]=null;
  aiAnalysis=null;
  updateAngleUI();
}

function handleFileUpload(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=ev=>{
    state.shots[ANGLES[state.currentCaptureIndex]]=ev.target.result;
    if(state.currentCaptureIndex<3) state.currentCaptureIndex++;
    updateAngleUI();
  };
  reader.readAsDataURL(file);
  e.target.value='';
}

function styleIconSVG(st){
  let s=''; const n=14;
  for(let i=0;i<n;i++){
    const t=i/(n-1), x=20+t*60;
    const amp=(st.curl/100)*14, len=16+(st.length/100)*50;
    const mx=x+Math.sin(t*6)*amp, ex=x+Math.sin(t*6+1)*amp*1.3;
    s+=`<path d="M ${x} 16 Q ${mx} ${16+len*0.5} ${ex} ${16+len}" stroke="${st.colorHex}" stroke-width="2.5" fill="none" stroke-linecap="round" opacity="0.9"/>`;
  }
  return `<svg viewBox="0 0 100 90" width="100%" height="100%"><circle cx="50" cy="12" r="9" fill="#3A332B"/>${s}</svg>`;
}
function selectStyle(id){
  // ROADMAP(raw-edit): 스타일 적용 직후 각 섹션 length/volume을 50으로 리셋해서
  // 올림/내림 조정이 대칭이 되게 할 예정 (지금은 st.length/volume 그대로 대입).
  // 동시에 debugShowRaw를 진단토글이 아니라 "스타일 미적용 직접편집" 정식 모드로
  // 승격 — 진입 버튼/UI 문구만 바꾸면 로직은 재사용 가능.
  state.selectedStyle=STYLES.find(s=>s.id===id);
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('selected'));
  document.getElementById('style-'+id).classList.add('selected');
  document.getElementById('toAdjustBtn').disabled=false;
  // 스타일 파라미터를 섹션 기본값으로 변환
  const st = state.selectedStyle;
  state.sections.crown.length    = st.length;
  state.sections.crown.volume    = st.volume;
  state.sections.front.length    = Math.round(st.length * 0.85); // 앞머리는 약간 짧게
  state.sections.front.line      = 50;
  state.sections.temple.length   = Math.round(st.length * 0.80);
  state.sections.temple.blend    = 50;
  state.sections.side.length     = Math.round(st.length * 0.90);
  state.sections.side.layer      = st.curl > 40 ? 40 : 20;
  state.sections.occipital.length= st.length;
  state.sections.occipital.volume= st.volume;
  state.sections.nape.length     = Math.round(st.length * 0.60);
  state.sections.nape.line       = 50;
  state._globalCurl = st.curl;
  syncSliderUI();
}

const PARAM_LABELS = {
  length:'길이', volume:'볼륨', line:'라인', blend:'연결감', layer:'레이어',
};

function buildSectionTabs(){
  const container = document.getElementById('sectionTabs');
  container.innerHTML = '';
  SECTION_ORDER.forEach(id=>{
    const sec = SECTIONS[id];
    const div = document.createElement('div');
    div.className = 'section-tab' + (state.currentSection===id?' active':'');
    div.id = 'sectab-'+id;

    // 이 섹션이 현재 뷰에 보이는지 표시
    const visHere = sec.visibleIn.includes(state.currentViewAngle);
    const viewNote = visHere ? '' : `<span style="color:var(--warn);font-size:10px;">현재 뷰에서 안 보임</span>`;

    div.innerHTML = `
      <div class="section-tab-header" onclick="selectSection('${id}')">
        <div class="section-tab-left">
          <span class="section-badge">${sec.labelEn}</span>
          <div>
            <div class="section-tab-name">${sec.label} ${viewNote}</div>
            <div class="section-tab-desc">${sec.desc}</div>
          </div>
        </div>
        <div class="section-tab-summary" id="sectab-summary-${id}"></div>
      </div>
      <div class="section-tab-body" id="sectab-body-${id}">
        ${sec.params.map(p=>`
          <div class="slider-block">
            <div class="param-label-row">
              <span class="param-label">${PARAM_LABELS[p]||p}</span>
              <span class="param-val" id="secval-${id}-${p}">${state.sections[id][p]}</span>
            </div>
            <input type="range" id="secslider-${id}-${p}" min="0" max="100"
              value="${state.sections[id][p]}"
              oninput="onSectionSlider('${id}','${p}',this.value)">
          </div>
        `).join('')}
        <div class="section-affects">영향: ${sec.visibleIn.map(v=>ANGLE_LABELS[v]).join(' · ')}</div>
      </div>`;
    container.appendChild(div);
    updateSectionSummary(id);
  });
}

function selectSection(id){
  state.currentSection = id;
  // 탭 active 토글
  SECTION_ORDER.forEach(sid=>{
    document.getElementById('sectab-'+sid)?.classList.toggle('active', sid===id);
  });
  // 해당 섹션이 보이는 뷰로 자동 전환
  const visIn = SECTIONS[id].visibleIn;
  if(!visIn.includes(state.currentViewAngle)){
    state.currentViewAngle = visIn[0];
    renderAngleSwitches();
    drawAdjustPreview();
  }
}

function onSectionSlider(secId, param, val){
  const intVal = parseInt(val);
  // 현재 뷰에 직접 적용
  state.sections[secId][param] = intVal;
  document.getElementById(`secval-${secId}-${param}`).textContent = val;
  updateSectionSummary(secId);
  // 섹션 간 연동 (같은 뷰 안에서)
  propagateSectionChange(secId, param);
  // 뷰 간 연동 (랜드마크 매핑 기반으로 인접 뷰에 반영)
  const curAngle = state._adjustAngle || 'front';
  propagateSectionToViews(curAngle, secId, param, intVal);
  drawAdjustPreview();
}

function onGlobalCurl(val){
  state._globalCurl = parseInt(val);
  document.getElementById('val-globalCurl').textContent = val;
  drawAdjustPreview();
}

function propagateSectionChange(secId, param){
  // crown 길이 → temple 길이에 50% 반영 (연결감 유지)
  if(secId==='crown' && param==='length'){
    const crownLen = state.sections.crown.length;
    const templeBlend = state.sections.temple.blend / 100;
    const newTemple = Math.round(crownLen * (1 - templeBlend*0.4));
    state.sections.temple.length = Math.max(0, Math.min(100, newTemple));
    const tSlider = document.getElementById('secslider-temple-length');
    if(tSlider) tSlider.value = state.sections.temple.length;
    const _tv = document.getElementById('secval-temple-length'); if(_tv) _tv.textContent = state.sections.temple.length;
    updateSectionSummary('temple');
  }
  // side 길이 변경 시 occipital에 30% 반영
  if(secId==='side' && param==='length'){
    const blend = 0.3;
    state.sections.occipital.length = Math.round(
      state.sections.occipital.length * (1-blend) + state.sections.side.length * blend
    );
    const oSlider = document.getElementById('secslider-occipital-length');
    if(oSlider) oSlider.value = state.sections.occipital.length;
    const _ov = document.getElementById('secval-occipital-length'); if(_ov) _ov.textContent = state.sections.occipital.length;
    updateSectionSummary('occipital');
  }
}

function updateSectionSummary(id){
  const el = document.getElementById('sectab-summary-'+id);
  if(!el) return;
  const vals = state.sections[id];
  const sec = SECTIONS[id];
  el.textContent = sec.params.map(p=>`${PARAM_LABELS[p]||p} ${vals[p]}`).join(' · ');
}

function resetSections(){
  SECTION_ORDER.forEach(id=>{
    const sec = SECTIONS[id];
    state.sections[id] = {...sec.defaults};
    sec.params.forEach(p=>{
      const s = document.getElementById(`secslider-${id}-${p}`);
      const v = document.getElementById(`secval-${id}-${p}`);
      if(s) s.value = sec.defaults[p];
      if(v) v.textContent = sec.defaults[p];
    });
    updateSectionSummary(id);
  });
  state._globalCurl = 30;
  document.getElementById('slider-globalCurl').value = 30;
  document.getElementById('val-globalCurl').textContent = 30;
  drawAdjustPreview();
}

/* ════════════════════════════════════════
   RENDER / CANVAS
   - 이미지 캐시로 매번 new Image() 방지
   - hairCanvas 없으면 SVG 선 오버레이로 폴백
════════════════════════════════════════ */
const imgCache = {}; // angle → HTMLImageElement (loaded)

function getCachedImg(angle, cb){
  const url = state.shots[angle];
  if(!url){ cb(null); return; }
  if(imgCache[angle] && imgCache[angle].src.endsWith(url.slice(-20))){
    cb(imgCache[angle]); return;
  }
  const img = new Image();
  img.onload = ()=>{ imgCache[angle]=img; cb(img); };
  img.onerror = ()=>cb(null);
  img.src = url;
}

function drawImgOnCanvas(ctx, img, w, h){
  const {dw,dh,dx,dy} = computeFit(img.width, img.height, w, h);
  ctx.drawImage(img,dx,dy,dw,dh);
  return {dw,dh,dx,dy};
}

// fit 계산만 하고 실제로 그리지는 않음 (베이스를 원본 대신 baseC로 바로 그릴 때 사용)
function computeFit(imgW, imgH, w, h){
  const ir=imgW/imgH, cr=w/h;
  let dw,dh,dx,dy;
  if(ir>cr){dh=h;dw=h*ir;dx=(w-dw)/2;dy=0;}
  else{dw=w;dh=w/ir;dx=0;dy=(h-dh)/2;}
  return {dw,dh,dx,dy};
}

function syncCanvasSize(canvas){
  const rect=canvas.getBoundingClientRect();
  if(rect.width>0&&rect.height>0){canvas.width=rect.width;canvas.height=rect.height;}
}

// 핵심 렌더 함수
// 마스크 디버그 버튼 상태 동기화 (toggleMaskDebug/toggleRawDebug 양쪽에서 공용으로 사용)

// 원본 결 보기 토글: 스타일/슬라이더 값을 무시하고 전 섹션을 중립값

// 결필드 원본 디버그 토글: strand 시뮬레이션(뿌리 위치·중력·clamp 등) 전혀 거치지 않고
// computeHairOrientationField가 실제로 뽑아낸 angle/coherence 컬럼 샘플을 가공 없이
// 그대로 화면에 짧은 선분으로 표시 — 결이 마스크 중간·아래쪽에서 실제로 얼마나
// 촘촘하고 신뢰할 만한지(coherence), 낮은 coherence 구간은 실제로 어떻게 나오는지를
// strand 렌더링 로직(scalpY 시작 제약, 중력 대체 등)과 분리해서 눈으로 검증하기 위함.
function toggleFieldDebug(){
  state.debugShowField = !state.debugShowField;
  if(state.debugShowField){ state.debugShowMask = false; state.debugShowRaw = false; } // 세 디버그 뷰는 동시에 켤 수 없음
  const btn = document.getElementById('fieldDebugToggle');
  if(btn) btn.classList.toggle('on', state.debugShowField);
  syncMaskDebugBtn();
  const rawBtn = document.getElementById('rawDebugToggle');
  if(rawBtn) rawBtn.classList.toggle('on', state.debugShowRaw);
  renderAdjustFrame();
}

// 결필드 원본을 가공 없이 그리는 디버그 오버레이.
// maskInf.orientation은 buildColumnOrientationSamples가 만든 컬럼별 샘플
// (컬럼당 최대 12개, 마스크가 있는 y구간에 걸쳐 분포)이며 좌표계는
// maskInf.maskW × maskInf.maskH (결방향 계산 당시의 축소 해상도) 기준.
// coherence를 색상으로 매핑(빨강=낮음/신뢰 안 됨 → 초록=높음/뚜렷함)해서
// strand 시뮬레이션이 어떤 원본 데이터를 근거로 방향을 정하는지,
// 특히 낮은 coherence 구간이 실제로 어떻게 나오는지를 그대로 보여준다.
function drawOrientationFieldDebug(ctx, fit, maskInf){
  const colSamples = maskInf.orientation;
  if(!colSamples) return;
  const fw = maskInf.maskW, fh = maskInf.maskH;
  if(!fw || !fh) return;
  const toX = ix => fit.dx + (ix/fw) * fit.dw;
  const toY = iy => fit.dy + (iy/fh) * fit.dh;
  // 선분 길이: 컬럼 간격(스킵 간격 포함) 대비 살짝 겹치는 정도로 — 너무 길면
  // 이웃 컬럼끼리 뭉개지고, 너무 짧으면 방향이 안 보임.
  const colSkip = 2; // 컬럼 2개당 1개씩만 그려서 과밀 방지
  const halfLen = Math.max(2, (fit.dw / fw) * colSkip * 1.1);
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(1, (fit.dw / fw) * 0.9);
  for(let x=0; x<fw; x += colSkip){
    const col = colSamples[x];
    if(!col || col.length===0) continue;
    for(const s of col){
      const cx = toX(x), cy = toY(s.y);
      const dx = Math.cos(s.angle) * halfLen;
      const dy = Math.sin(s.angle) * halfLen;
      const coh = Math.max(0, Math.min(1, s.coherence));
      // coherence 낮음(0)=빨강 ~ 높음(1)=초록. 숨기지 않고 그대로 다 그림 — 낮은
      // coherence 구간이 어떻게 생겼는지 확인하는 게 이 디버그 뷰의 목적이므로
      // 알파를 coherence에 비례시켜 흐릿하게 만들지 않는다.
      ctx.strokeStyle = `hsl(${coh*120}, 90%, 55%)`;
      ctx.globalAlpha = 0.85;
      ctx.beginPath();
      ctx.moveTo(cx-dx, cy-dy);
      ctx.lineTo(cx+dx, cy+dy);
      ctx.stroke();
    }
  }
  ctx.restore();
}

function renderFrame(canvas, angle){
  syncCanvasSize(canvas);
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if(w===0||h===0){ setTimeout(()=>renderFrame(canvas,angle),50); return; }

  getCachedImg(angle, (img)=>{
    ctx.clearRect(0,0,w,h);

    const hairC   = state.hairCanvases[angle];
    const baseC   = state.baseCanvases[angle];
    const maskInf = state.hairMasks[angle];

    if(state.debugShowField && maskInf && maskInf.orientation){
      // ── 결필드 원본 디버그 뷰 ──
      // strand 시뮬레이션(뿌리 위치 제약·중력·clamp)을 전혀 거치지 않고
      // computeHairOrientationField가 뽑아낸 값을 그대로 표시. 원본 사진 위에
      // 얹어서, 저장된 결방향 데이터가 마스크 전체에 걸쳐 실제로 얼마나
      // 촘촘·신뢰할 만한지(coherence 색상)를 strand 렌더링과 분리해서 확인한다.
      const fit = computeFit(img.width, img.height, w, h);
      ctx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh);
      drawOrientationFieldDebug(ctx, fit, maskInf);
      return;
    }

    if(state.debugShowMask && hairC && maskInf){
      // ── 마스크 디버그 뷰 ──
      // 가닥 렌더링을 완전히 건너뛰고, 원본 사진 위에 최종 결과만 단색으로 보여주는 대신,
      // "왜 이렇게 됐는지"를 색으로 구분해서 보여준다: 빨강=최종 머리카락,
      // 회색=얼굴박스라서 제외, 파랑=눈썹/눈/입 가드라서 제외.
      const fit = computeFit(img.width, img.height, w, h);
      ctx.drawImage(img, fit.dx, fit.dy, fit.dw, fit.dh); // 원본 사진 그대로

      ctx.save();
      ctx.globalAlpha = 0.6;
      if(maskInf.reasonCanvas){
        ctx.drawImage(maskInf.reasonCanvas, fit.dx, fit.dy, fit.dw, fit.dh);
      } else {
        // reasonCanvas가 없는 예전 캐시 데이터 대비 폴백: 기존 단색 방식
        const maskOverlay = document.createElement('canvas');
        maskOverlay.width = hairC.width; maskOverlay.height = hairC.height;
        const mCtx = maskOverlay.getContext('2d');
        mCtx.drawImage(hairC, 0, 0);
        mCtx.globalCompositeOperation = 'source-in';
        mCtx.fillStyle = '#ff2d55';
        mCtx.fillRect(0, 0, maskOverlay.width, maskOverlay.height);
        ctx.drawImage(maskOverlay, fit.dx, fit.dy, fit.dw, fit.dh);
      }
      ctx.restore();
      return;
    }

    if(hairC && baseC && maskInf && maskInf.scalpY){
      // ── 세그멘테이션 성공 ──
      // 레이어 순서:
      // [1] baseC (원본에서 머리카락 영역이 진짜로 지워진 베이스) → 얼굴·배경만
      // [2] 헤어컬러 언더코트 (마스크 실루엣을 평균 헤어컬러로 채움, 가닥 사이 빈틈 방지)
      // [3] 새 가닥 (scalpY 기반, 자유롭게 아래로 뻗음)
      // [4] 컬러 오버레이

      const fit = computeFit(img.width, img.height, w, h);

      // 이전 버그: 원본 img를 먼저 통째로 그린 뒤 baseC(머리 부분 투명)를
      // source-over로 덮었는데, 투명 픽셀은 source-over에서 아무 효과가 없어서
      // 원본 머리카락이 전혀 안 지워지고 그대로 남아있었음(가닥은 그 위에 얹히기만 함).
      // → baseC 자체를 베이스로 바로 그려서 머리카락 영역을 실제로 비운다.
      ctx.drawImage(baseC, fit.dx, fit.dy, fit.dw, fit.dh);

      // 언더코트: hairC(원본 머리카락 픽셀, 마스크 실루엣 alpha)를 source-in으로
      // 채워서 마스크 실루엣 모양만 가져온 뒤, 그 안을 "두피/피부색"으로 채움.
      // (이전엔 평균 헤어컬러의 진한 단색으로 채웠는데, 그러면 가닥 사이 빈틈이
      // 그냥 진한 색 덩어리로 보여서 "머리카락"이 아니라 밋밋한 실루엣처럼 보였음.
      // 실제 얼굴 피부에서 샘플링한 톤으로 바꾸면, 가닥 사이로 두피가 비치는
      // 자연스러운 느낌이 나고, 어두운 가닥과 밝은 두피색 사이 명암 대비가 생겨서
      // 결(가닥의 흐름)도 훨씬 잘 보임.)
      // 테스트: 언더코트가 배경이 아니라 새로 그려지는 머리카락 가닥 위를 덮어서
      // 가닥이 실제 머리카락처럼 안 보이는 문제 — 일단 알파 0으로 꺼서 확인.
      // 버그 수정: scalpColor 계산이 실패하면(드물게 reason=2 샘플이 0건인 각도/사진)
      // avgColor(머리카락 평균색)로 폴백했었는데, raw 모드에서는 가닥 색도 똑같이
      // avgColor를 쓰기 때문에 언더코트=가닥 색이 겹쳐서 대비가 사라지고 가닥이
      // 안 보이는 문제가 있었음. → 원래 계획대로 "얼굴 피부색의 중간톤" 고정값으로 폴백.
      const FALLBACK_SKIN_TONE = 'rgb(224,178,148)';
      const scalpColor = maskInf.scalpColor || FALLBACK_SKIN_TONE;
      const undercoat = document.createElement('canvas');
      undercoat.width = hairC.width; undercoat.height = hairC.height;
      const uCtx = undercoat.getContext('2d');
      uCtx.drawImage(hairC, 0, 0);
      uCtx.globalCompositeOperation = 'source-in';
      uCtx.fillStyle = scalpColor;
      uCtx.fillRect(0, 0, undercoat.width, undercoat.height);
      ctx.save();
      ctx.globalAlpha = 1; // 실제 두피는 반투명하지 않음 — 언더코트는 불투명하게 깔고,
                           // 그 위 가닥도 불투명하게 그려서 살색이 과하게 비치지 않도록 함
      ctx.drawImage(undercoat, fit.dx, fit.dy, fit.dw, fit.dh);
      ctx.restore();

      // 원본 결 보기(debugShowRaw): 실제 state.sections/selectedStyle은 그대로 두고,
      // 화면에 넘기는 값만 중립값으로 덮어씀 — 길이 50(=원본 인식 길이 그대로),
      // 볼륨 50, 컬 0(순수 결방향만 따라감), 색상은 스타일 틴트 대신 실제 인식된 평균 헤어컬러.
      const rawMode = state.debugShowRaw;
      const {curl,volume,thickness} = rawMode
        ? {curl:0, volume:50, thickness:50}
        : state.sliders[angle];
      const sectionsForRender = rawMode
        ? Object.fromEntries(Object.entries(state.sections).map(([id,s])=>[id, {...s, length:50}]))
        : state.sections;
      const maskW = maskInf.w, maskH = maskInf.h;
      const scalpY   = maskInf.scalpY;
      const hairEndY = maskInf.hairEndY;

      const validCount = Array.from(scalpY).filter(y=>y>=0).length;

      if(validCount > maskW * 0.05){
        // 가닥 오버레이 — origLen 이내는 hairCanvas 마스크로 clip, 연장분은 clip 없음(drawHairStrands 내부에서 처리)
        drawHairStrands(ctx, fit, scalpY, hairEndY, maskW, maskH, hairC, {
          curl, volume, thickness,
          angle, sections: sectionsForRender, // 컬럼별로 섹션을 판정해 길이를 다르게 적용하기 위함
          color: rawMode ? maskInf.avgColor : ((state.selectedStyle ? state.selectedStyle.colorHex : null) || maskInf.avgColor),
          orientation: maskInf.orientation,       // 결방향 컬럼 샘플 (축소해상도 좌표)
          orientMaskW: maskInf.maskW,              // 결방향 필드가 계산된 축소 해상도 폭
          orientMaskH: maskInf.maskH,              // 결방향 필드가 계산된 축소 해상도 높이
        });

        // 컬러 오버레이는 현재 사용하지 않음(가닥 자체 색상으로 스타일 컬러를 표현) — 관련 죽은 코드 제거됨
      }

    } else if(img){
      // ── 세그멘테이션 없음: 원본만 표시 (SVG 폴백 제거) ──
      drawImgOnCanvas(ctx, img, w, h);
    } else {
      ctx.fillStyle='#211D19'; ctx.fillRect(0,0,w,h);
      ctx.fillStyle='#52483D'; ctx.font='13px Inter'; ctx.textAlign='center';
      ctx.fillText('이 각도의 사진이 없습니다', w/2, h/2);
    }
  });
}

// 조정 화면(#screen-adjust)의 캔버스를 현재 각도로 다시 그리는 짧은 헬퍼 —
// 디버그 토글 3곳에서 renderFrame(document.getElementById('adjustCanvas'), state.currentViewAngle)
// 호출이 그대로 반복되던 것을 하나로 합침 (drawAdjustPreview는 rAF로 감싸서 별도 유지)
function renderAdjustFrame(){
  renderFrame(document.getElementById('adjustCanvas'), state.currentViewAngle);
}

/* ────────────────────────────────────────
   가닥 렌더링
   - 2단계 clip: 원본 인식 길이(origLen) 이내는 hairCanvas(마스크)로 clip해서
     마스크 밖으로 절대 안 나감 / 슬라이더로 늘어난 연장분만 clip 없이 자유롭게
   - 두피 라인(scalpY)에서 출발, 길이·컬·볼륨 슬라이더 반영
   - 미용 "섹션" 개념: 굵은 면 레이어 + 가는 가닥 레이어 혼합
──────────────────────────────────────── */
function drawHairStrands(ctx, fit, scalpY, hairEndY, maskW, maskH, hairCanvas, opts){
  const {curl, volume, thickness, color, orientation, orientMaskW, orientMaskH, angle, sections} = opts;

  const alpha       = 1; // 가닥은 완전 불투명 — 굵기 효과는 lineWidth로만 반영하고
                         // 투명도로는 절대 조절하지 않음 (반투명이면 살색 언더코트와
                         // 섞여 회색빛으로 보임)

  // 해상도 비례 스케일: 아래 각 레이어의 lineWidth 기본값들은 "실제 렌더링되는 캔버스가
  // 705px 폭일 때" 눈으로 보고 튜닝됐음. ctx.lineWidth는 캔버스 픽셀 공간(=fit.dw 기준)
  // 에서 적용되는 값인데, 가닥 좌표 자체는 toCanvasX/Y가 (fit.dw/maskW) 비율로 이미
  // maskW(세그멘테이션 처리 해상도, 최대 768) → fit.dw(실제 화면 표시 폭, 폰 CSS 폭
  // 기준이라 보통 380~430px 수준)로 압축해서 그린다.
  // 버그 수정: 예전엔 resScale을 maskW/705로 계산했는데, 이건 "촬영 해상도"만 반영하고
  // "실제로 화면에 얼마나 작게 그려지는지"(fit.dw)는 전혀 반영을 안 함 — 그 결과 fit.dw가
  // maskW보다 훨씬 작은 실기기(예: fit.dw≈400, maskW≈768)에서는 좌표는 절반 이하로
  // 압축되는데 선 굵기는 거의 그대로(resScale≈768/705≈1.09)라 상대적으로 훨씬 굵어
  // 보였음(스크린샷에서 보인 마커펜 같은 뭉툭한 가닥의 직접 원인). → 실제 캔버스 렌더
  // 폭(fit.dw) 기준으로 스케일해야 좌표 압축 비율과 굵기가 항상 같이 움직인다.
  const RES_BASE = 705;
  const resScale = fit.dw / RES_BASE;
  // sub-pixel 방지용 최소굵기(0.9px)는 해상도와 무관한 캔버스 렌더링 자체의 물리적
  // 제약(1px 미만이면 브라우저가 알파를 낮춰 흐리게 그림)이라 resScale로 같이 줄어들면
  // 안 됨 — 스케일 적용 "후"에 하한선으로 별도 고정.
  const MIN_SAFE_WIDTH = 0.9;

  // 길이 슬라이더가 높을 때(특히 정면 프론트) 가닥이 이마 라인을 넘어
  // 눈·안경·턱까지 뚫고 내려가는 과확장을 막기 위한 상한.
  // maskH(축소 해상도 이미지 전체 높이)의 1.15배까지만 허용 — 화면 밖까지
  // 늘어나는 극단적인 경우를 방지하면서도 "길게" 설정한 효과는 유지.
  const maxStrandLen = maskH * 1.15;

  // 버그 수정: validCols(가닥 뿌리를 심을 수 있는 후보 컬럼)가 "보간 전" 원본 scalpY만
  // 기준으로 만들어져 있었음. 세그멘테이션이 국소적으로 실패한 좁은 구간(예: 이마 중앙에
  // 생기는 V자 notch, 안경다리에 가려진 관자놀이 등)은 scalpY[x]=-1이라 애초에 후보에서
  // 빠져서 어떤 레이어도 거기 뿌리를 못 심었음 — "가닥이 부족한 게 아니라 아예 심을
  // 자리 자체가 없었던" 문제. → 양옆 유효 컬럼 사이 간격이 좁으면(=국소적 인식 실패로
  // 판단) 보간값으로 메워서 후보에 포함시킴. 단, 진짜로 머리가 없는 넓은 영역(배경,
  // 얼굴 등)까지 메워버리면 안 되므로 간격 상한(MAX_GAP_PX)을 둬서, 그보다 넓은 gap은
  // 기존처럼 그대로 배제.
  const leftValidX = new Int32Array(maskW).fill(-1);
  const rightValidX = new Int32Array(maskW).fill(-1);
  { let lv=-1; for(let x=0;x<maskW;x++){ if(scalpY[x]>=0) lv=x; leftValidX[x]=lv; } }
  { let rv=-1; for(let x=maskW-1;x>=0;x--){ if(scalpY[x]>=0) rv=x; rightValidX[x]=rv; } }
  const MAX_GAP_PX = maskW * 0.08; // 마스크 폭의 8% 이내 gap만 "국소 인식 실패"로 보고 메움
  const validCols = [];
  for(let x=0; x<maskW; x++){
    if(scalpY[x] >= 0){ validCols.push(x); continue; }
    const lx = leftValidX[x], rx = rightValidX[x];
    if(lx>=0 && rx>=0 && (rx-lx) <= MAX_GAP_PX) validCols.push(x);
  }
  if(validCols.length === 0) return;

  // ── 보간: validCols 안에서 hairEndY/scalpY -1인 열을 인접 유효값으로 채움 ──
  const iScalpY   = new Float32Array(maskW).fill(-1);
  const iHairEndY = new Float32Array(maskW).fill(-1);
  for(let x=0;x<maskW;x++){ iScalpY[x]=scalpY[x]; iHairEndY[x]=hairEndY[x]; }
  // forward pass
  let lS=-1, lE=-1;
  for(let x=0;x<maskW;x++){
    if(iScalpY[x]>=0)   lS=iScalpY[x];   else if(lS>=0) iScalpY[x]=lS;
    if(iHairEndY[x]>=0) lE=iHairEndY[x]; else if(lE>=0) iHairEndY[x]=lE;
  }
  // backward pass
  let fS=-1, fE=-1;
  for(let x=maskW-1;x>=0;x--){
    if(iScalpY[x]>=0)   fS=iScalpY[x];   else if(fS>=0) iScalpY[x]=fS;
    if(iHairEndY[x]>=0) fE=iHairEndY[x]; else if(fE>=0) iHairEndY[x]=fE;
  }

  // curl 방향 기준으로 쓰이던 마스크 수평 중심(maskCX) 계산은 더 이상 사용되지 않아 제거됨

  // ── 컬럼별 길이 배율: 슬라이더 50 = 원본 길이(origLen) 그대로(ratio=1).
  // 기존엔 "덧셈"(절대 px, origLen과 무관하게 항상 같은 양만큼 변화)이었으나,
  // 이 방식은 origLen이 작은 부위(사이드/네이프처럼 세그멘테이션이 짧게 잡힌 곳)에서
  // 같은 절대값이 상대적으로 훨씬 크게 작용해 그 부위만 원래 세그멘테이션 형태를
  // 벗어나 툭 튀어나오는 문제가 있었음. → "배율"로 바꿔서 origLen에 비례하게 늘리고
  // 줄여, 세그멘테이션이 잡은 원래 형태(비율)를 그대로 유지한 채 커지고 작아지게 함.
  // (짧은 부위는 짧은 만큼, 긴 부위는 긴 만큼 — 같은 비율로 변화)
  // TODO: 배율 방식으로 모양을 먼저 잡은 뒤, 조정 단계에서 슬라이더 감도(RATIO_PER_UNIT)를
  // 다시 튜닝할 예정 — 지금은 형태 검증이 우선.
  const lenRatioCache = new Float32Array(maskW).fill(NaN);
  // 슬라이더 1칸(0~100)당 배율 변화 — 50에서 ±1칸당 얼마나 배율이 움직이는지.
  // 0~100 전체 범위에서 0배(완전히 짧게)~3배까지 변화하도록 설정.
  const RATIO_PER_UNIT = 0.04;
  function lengthRatioFor(ix){
    const cx = Math.min(maskW-1, Math.max(0, Math.round(ix)));
    if(!Number.isNaN(lenRatioCache[cx])) return lenRatioCache[cx];
    const ny = iScalpY[cx] >= 0 ? iScalpY[cx]/maskH : 0.15;
    const nx = cx/maskW;
    const secId = (sections && angle) ? resolveSectionId(angle, nx, ny) : 'crown';
    const lenParam = (sections && sections[secId] && typeof sections[secId].length==='number')
      ? sections[secId].length : 50;
    const ratio = Math.max(0, 1 + (lenParam - 50) * RATIO_PER_UNIT);
    lenRatioCache[cx] = ratio;
    return ratio;
  }

  const toCanvasX = (ix) => fit.dx + (ix / maskW) * fit.dw;
  const toCanvasY = (iy) => fit.dy + (iy / maskH) * fit.dh;

  // scalpY 좌표계(maskW,maskH) → orientation 필드 좌표계(orientMaskW,orientMaskH) 변환 비율
  const hasOrientation = !!(orientation && orientMaskW && orientMaskH);
  const ox = hasOrientation ? orientMaskW / maskW : 1;
  const oy = hasOrientation ? orientMaskH / maskH : 1;

  const cw = ctx.canvas.width, ch = ctx.canvas.height;

  // ── 2단계 clip 구조 ──
  // baseOffscreen: 원본 인식 길이(origLen) 구간 → 나중에 hairCanvas(실제 세그멘테이션
  //   마스크)로 destination-in clip을 걸어서, 실제 인식된 머리카락 영역 밖(얼굴·안경·배경
  //   등)으로는 절대 못 나가게 함. "지금 이 사람의 실제 머리 모양"을 그대로 보여주는 단계.
  // extOffscreen: 슬라이더로 origLen을 넘겨서 늘어난 구간(연장분)만 → clip 없이 자유롭게
  //   그림. "스타일링 시뮬레이션으로 늘려본" 부분이라 원본 마스크 밖으로 나가는 게 정상.
  // 보폭(한 스텝의 물리적 이동 거리)을 고정값으로 둔다 — 더 이상 목표 길이(targetLen)에
  // 비례해서 커지지 않는다. 이렇게 해야 origLen까지 가는 구간이 delta(슬라이더로 늘린 양)와
  // 무관하게 항상 "같은 지점에서, 같은 보폭으로, 같은 물리적 위치의 결방향을 샘플링"하게 되어
  // 원본 결 보기 때와 스타일 적용 때의 base 구간 경로가 완전히 일치한다.
  // (기존엔 STEPS=14로 고정하고 stepLen=targetLen/14로 역산해서, delta가 커질수록 보폭 자체가
  //  커져 origLen 구간마저 원본과 다른 경로로 재계산되는 문제가 있었음)
  const STRAND_STEP_LEN = maskH * 0.025;

  const baseOffscreen = document.createElement('canvas');
  baseOffscreen.width = cw; baseOffscreen.height = ch;
  const baseCtx = baseOffscreen.getContext('2d');
  baseCtx.lineCap  = 'round';
  baseCtx.lineJoin = 'round';

  const extOffscreen = document.createElement('canvas');
  extOffscreen.width = cw; extOffscreen.height = ch;
  const extCtx = extOffscreen.getContext('2d');
  extCtx.lineCap  = 'round';
  extCtx.lineJoin = 'round';

  // base/ext 두 컨텍스트에 동일한 스타일(굵기·투명도·색상)을 한 번에 적용하기 위한 헬퍼
  function setStyle(prop, val){ baseCtx[prop] = val; extCtx[prop] = val; }

  /**
   * traceStrand: 시작점(ix,sy_img)에서 목표 길이(targetLen)만큼
   * 결방향 필드를 따라 작은 스텝으로 전진하며 경로를 추적한다.
   * 결방향 데이터가 없거나 coherence가 낮은 구간에서는 자연스러운
   * 약한 흔들림(curlAmt 기반)으로 보강하여 완전히 끊기지 않게 한다.
   * @returns canvas 좌표계 점 배열 [{x,y}, ...] (길이 steps+1, steps는 목표 길이에 따라 가변)
   */
  function traceStrand(ix, sy_img, targetLen_img, jitterSeed){
    const stepLen = STRAND_STEP_LEN; // 고정 보폭 — targetLen_img에서 역산하지 않음
    const steps = Math.max(2, Math.round(targetLen_img / stepLen));
    const pts = [{x:ix, y:sy_img}]; // 마스크 좌표계(maskW,maskH 기준)로 누적
    // baseDir: curl/wiggle을 얹기 전, "결방향만" 반영한 순수 진행방향.
    // 다음 스텝의 orientation 블렌딩 기준(연속성 유지)으로 이것만 이어받는다.
    // → curl 보정을 여기 포함시켜 이어받으면 매 스텝 같은 방향으로 계속
    //   꺾이는 게 누적되어(부호가 안 바뀌는 sideDir 특성상) 긴 가닥일수록
    //   결국 옆으로 거의 수평이 되어 뻗어나가는 문제가 있었음.
    let baseDir = Math.PI/2;

    for(let s=0; s<steps; s++){
      const cur = pts[pts.length-1];
      let dir = baseDir;

      // 처음 2스텝은 orientation 필드 참조를 건너뜀.
      // 이유: 모든 가닥이 scalpY(두피 경계선) 바로 위에서 출발하는데,
      // 그 경계 픽셀 자체가 "머리카락↔배경" 급격한 명암차 경계라
      // Structure Tensor가 이 경계선 자체를 결로 착각해서 가로 방향을
      // 결방향으로 잘못 계산함. 그 결과 모든 가닥이 시작하자마자
      // 옆으로 꺾여서, 뷰 각도와 무관하게 두피 경계 높이에 가로
      // "빗살 띠"가 생기는 근본 원인이었음.
      // → 경계에서 살짝 벗어난 뒤(2스텝, 자연스러운 아래방향 진행)부터
      //   결방향을 신뢰하고 따라가도록 함.
      if(hasOrientation && s >= 2){
        const sample = sampleOrientation(orientation, cur.x*ox, orientMaskW, cur.y*oy);
        // 임계값을 0.12→0.05로 낮춤 — 기존엔 애매하게 낮은 coherence도 전부
        // "못 믿는다"고 보고 중력으로 덮어버려서, 결이 약하게라도 있는 구간까지
        // 필드 정보를 버리고 있었음. 결필드 원본 디버그로 실측한 결과 낮은
        // coherence 지점도 완전 노이즈가 아니라 약하게나마 방향성이 있는
        // 경우가 많았으므로, 진짜 노이즈(0.05 미만)만 중력으로 넘김.
        if(sample.coherence > 0.05){
          // sample.angle은 atan2 좌표계(0=+x축/가로, ±PI/2=+y축 방향/세로)로 계산된
          // "결의 방향" 그 자체이며, cos/sin을 취하면 바로 진행 단위벡터가 된다.
          // 단, 결방향은 선분이라 180도 모호성이 있음(angle과 angle+PI가 동일한 결)
          // → 고정된 "아래쪽" 기준이 아니라 baseDir과 더 가까운 쪽을 선택해야
          //   수평에 가까운 결(0도 경계)에서 지그재그 튐이 생기지 않음
          let targetDir = sample.angle;
          let deltaCheck = targetDir - baseDir;
          while(deltaCheck > Math.PI) deltaCheck -= Math.PI*2;
          while(deltaCheck < -Math.PI) deltaCheck += Math.PI*2;
          if(Math.abs(deltaCheck) > Math.PI/2){
            // 반대 표현(targetDir+PI)이 baseDir에 더 가까움 → 그쪽 채택
            targetDir += Math.PI;
          }
          // coherence가 높을수록 결방향을 강하게 따름, 낮으면 이전 방향 유지 비중↑
          const w = Math.min(1, sample.coherence * 1.3);
          // 각도를 보간 (최단 회전 방향으로)
          let delta = targetDir - baseDir;
          while(delta > Math.PI) delta -= Math.PI*2;
          while(delta < -Math.PI) delta += Math.PI*2;
          dir = baseDir + delta * w;
        } else {
          // 결방향을 못 믿는 구간(coherence 낮음 — 대부분 마스크 밖 ext 구간에서 발생).
          // "중력"으로 명명: 실제 머리카락도 뿌리 쪽은 결방향(웨이브·컬)을 유지하지만
          // 끝으로 갈수록 자체 무게 때문에 점점 아래로 처짐. 그래서 이 복원력을
          // 상수로 고정하지 않고 진행할수록(s/steps↑) 커지게 해서, 마스크를 막
          // 벗어난 시점의 baseDir이 대각선이어도 끝에 가서는 결국 아래쪽으로
          // 붙잡히도록 함. (예전엔 0.15 고정이라 대각선 방향을 거의 그대로
          // 유지한 채 곧게 뻗어나가 눈썹을 가로지르는 등의 문제가 있었음)
          let restore = Math.PI/2 - baseDir;
          while(restore > Math.PI) restore -= Math.PI*2;
          while(restore < -Math.PI) restore += Math.PI*2;
          // TEST: 얼굴박스 사각 블록 원인 검증용 임시 스위치. true면 중력 복원력을 0으로 만들어
          // ext 구간이 baseDir(결방향)을 그대로 유지하게 함. 블록이 옅어지면 중력이 증폭 원인 확정.
          // → 검증 완료, 원인 아니었음. clamp만으로는 대각선 처짐을 못 막아 중력 복원.
          const DEBUG_DISABLE_GRAVITY = false;
          const gravityPull = DEBUG_DISABLE_GRAVITY ? 0 : (0.15 + (s/steps) * 0.35); // 시작 0.15 → 끝 0.5
          dir = baseDir + restore * gravityPull;
        }
      }

      // 방향 상한(clamp) 제거됨 — 기존엔 진행 방향이 아래(PI/2) 기준 ±60도를
      // 못 넘게 강제해서, coherence가 높아 결방향이 뚜렷한 구간에서도 결이
      // 실제로 옆으로 흐르거나 위로 말리면 그 형태를 못 그리고 억지로
      // 아래쪽으로 눌러버리는 제한이었음. "결필드를 그대로 재현한다"는
      // 방향과 정면으로 충돌하는 규칙이라 제거. base(마스크 안) 구간은
      // destination-in clip이 최종적으로 실제 머리 모양 밖을 걸러주므로
      // 안전장치 역할은 clip이 대신한다.

      baseDir = dir; // 다음 스텝 기준은 curl 적용 전 방향으로 저장 (누적 방지)

      // curl 슬라이더 + 자연스러운 미세 흔들림 추가 (완전 직선 방지)
      // — 이번 스텝의 "이동"에만 적용하고 baseDir에는 반영하지 않으므로 누적되지 않음
      // wiggleGrowth: 진행할수록(s/steps) 흔들림 폭을 키운다. 가닥 개수(numSections/numMid/numFine)는
      // 길이와 무관하게 고정인데, 가닥이 길어질수록(scaledLen↑) 같은 개수가 더 넓은 영역에 퍼져서
      // 가닥 사이 간격이 벌어지고 "세로줄"처럼 분리되어 보이는 문제가 있었음. 시작 지점 근처는
      // 기존과 거의 동일하게 촘촘히 유지하고, 끝으로 갈수록 좌우로 더 크게 흔들리게 해서
      // 인접 가닥끼리 자연스럽게 겹치도록(overlap) 만들어 그 틈을 시각적으로 메운다.
      const wiggleGrowth = 1 + (s/steps) * 1.8;
      const wiggle = (Math.sin((s+jitterSeed)*0.9) * 0.12 + (Math.random()-0.5)*0.10) * wiggleGrowth;
      // curl: 기존엔 가닥 전체에 걸쳐 한 번만 크게 휘는 반원(sin 반 주기) 형태라, 결방향(orientation)과
      // 충돌하면 갑자기 옆으로 삐져나가는 모양이 생겼음. 파마머리/라면 면발처럼 일정한 파장으로
      // 완만하게 반복되는 웨이브로 변경 — curl 슬라이더는 진폭(구불거림 정도)만 조절.
      const CURL_WAVELENGTH_STEPS = 6; // 몇 스텝마다 한 번 파동이 반복되는지 — 값을 낮추면 더 자잘하게, 높이면 더 완만하게
      const curlPhase = (s / CURL_WAVELENGTH_STEPS) * Math.PI * 2;
      const curlComponent = Math.sin(curlPhase + jitterSeed) * (curl/100) * 0.07;
      const travelDir = dir + curlComponent + wiggle;

      // 실제 전진: travelDir은 "이미지 평면에서의 각도"이며 y축 기준 아래가 양수
      const dx = Math.cos(travelDir) * stepLen;
      const dy = Math.sin(travelDir) * stepLen;
      pts.push({x: cur.x + dx, y: cur.y + dy});
    }

    return pts;
  }

  // 마스크 좌표(이미지 픽셀 기준) 점 배열 → 캔버스 좌표로 변환
  function toCanvasPts(pts){
    return pts.map(p => ({ x: toCanvasX(p.x), y: toCanvasY(p.y) }));
  }

  // 점 배열을 부드러운 곡선으로 그림 (quadratic 중간점 보간) — 대상 컨텍스트를 인자로 받음
  function strokePolyline(targetCtx, cPts){
    if(cPts.length < 2) return;
    targetCtx.beginPath();
    targetCtx.moveTo(cPts[0].x, cPts[0].y);
    for(let i=1;i<cPts.length-1;i++){
      const mx = (cPts[i].x + cPts[i+1].x)/2;
      const my = (cPts[i].y + cPts[i+1].y)/2;
      targetCtx.quadraticCurveTo(cPts[i].x, cPts[i].y, mx, my);
    }
    const last = cPts[cPts.length-1];
    targetCtx.lineTo(last.x, last.y);
    targetCtx.stroke();
  }

  // extAmount(= scaledLen - origLen, ratio 적용 후 실제 늘어난/줄어든 양)와 고정 보폭
  // (STRAND_STEP_LEN)을 기준으로 base/ext 분할 지점을 계산. extAmount<=0(늘리지 않았거나
  // 줄인 경우)이면 무조건 전체 clip(base) — origLen(원본)보다 짧은 최소 길이 하한선
  // (maskH*0.02) 보정 때문에 scaledLen이 origLen보다 커지는 경우가 있어도, 그건
  // "슬라이더로 늘린 것"이 아니므로 clip 밖으로 나가면 안 됨.
  // (원본 결 보기처럼 ratio가 항상 1인 상태에서는 이 덕분에 예외 없이 전부 마스크 안에 있음)
  // totalSteps는 실제로 traceStrand가 생성한 점 개수-1(가변) — 이걸 넘겨받아 clamp한다.
  function splitIndexFor(extAmount, origLen, totalSteps){
    if(extAmount <= 0) return totalSteps;
    return Math.min(Math.round(origLen / STRAND_STEP_LEN), totalSteps);
  }

  // 가닥 하나를 그림: origLen까지는 base(clip 대상), 그 이후 연장분은 ext(clip 없음)로 나눠서 그림.
  // 보폭이 고정(STRAND_STEP_LEN)이므로, origLen까지의 경로는 ratio 값과 무관하게
  // 원본 결 보기 때와 항상 동일하다 — split은 그 경로를 어디서 자를지만 정한다.
  function drawStrand(ix, sy_img, scaledLen, origLen, extAmount, jitterSeed, strokeStyleVal){
    const pts = traceStrand(ix, sy_img, scaledLen, jitterSeed);
    const cPts = toCanvasPts(pts);
    const splitIdx = splitIndexFor(extAmount, origLen, pts.length - 1);
    setStyle('strokeStyle', strokeStyleVal);
    strokePolyline(baseCtx, cPts.slice(0, splitIdx+1));
    if(splitIdx < cPts.length-1){
      strokePolyline(extCtx, cPts.slice(splitIdx)); // splitIdx 지점을 공유해서 선이 끊기지 않게 이어줌
    }
  }

  // ── 실제 인식된 머리카락 마스크 안인지 검사 ──
  // 루트 확산 레이어(아래 "레이어 0")에서 두피 최상단선(scalpY)보다 더 깊은 지점에
  // 가닥 뿌리를 심을 때, 그 지점이 허공이나 피부 위가 아니라 실제 세그멘테이션이
  // 인식한 머리카락 픽셀 안인지 확인하기 위함 — 아니면 가닥이 이마 중간 등에서
  // 갑자기 시작되는 오류가 생길 수 있음.
  // 매 프레임 최초 호출 시 hairCanvas를 축소 해상도(orientMaskW/H, 이미 결방향
  // 계산용으로 만들어둔 것과 동일 크기)로 1회만 샘플링해서 캐시 — 매 가닥마다
  // 원본 해상도 getImageData를 부르지 않도록 함.
  let _hairSampleData = null, _hairSampleW = 0, _hairSampleH = 0, _hairSampleFailed = false;
  function isRealHairAt(x_img, y_img){
    if(_hairSampleData === null && !_hairSampleFailed){
      _hairSampleW = orientMaskW || Math.max(1, Math.round(maskW*0.5));
      _hairSampleH = orientMaskH || Math.max(1, Math.round(maskH*0.5));
      try{
        const sc = document.createElement('canvas');
        sc.width = _hairSampleW; sc.height = _hairSampleH;
        const sctx = sc.getContext('2d');
        sctx.drawImage(hairCanvas, 0, 0, _hairSampleW, _hairSampleH);
        _hairSampleData = sctx.getImageData(0,0,_hairSampleW,_hairSampleH).data;
      }catch(e){ _hairSampleFailed = true; }
    }
    if(!_hairSampleData) return true; // 샘플링 실패 시 항상 허용(안전 폴백 — 검증 없이 기존처럼 동작)
    const sx = Math.round((x_img/maskW) * _hairSampleW);
    const sy = Math.round((y_img/maskH) * _hairSampleH);
    if(sx<0||sx>=_hairSampleW||sy<0||sy>=_hairSampleH) return false;
    return _hairSampleData[(sy*_hairSampleW+sx)*4+3] > 40;
  }

  // 가닥 레이어 하나를 그리는 공용 헬퍼 — "굵은 섹션/중간 가닥/잔 가닥" 3개 레이어가
  // 개수·굵기·지터 폭만 다르고 구조는 동일해서(컬럼 선택 → 원본길이 계산 → 늘린 길이
  // 계산 → drawStrand 호출) 반복문 자체를 파라미터화해서 하나로 합침.
  // rootDepthFrac(옵션): 지정하면 두피 최상단선(scalpY) 대신 그보다 (hairEndY 방향으로)
  // 더 깊은 지점에서 가닥을 출발시킴 — 실제 머리처럼 여러 깊이에 뿌리를 둔 느낌을 내기
  // 위함(루트 확산 레이어 전용). 미지정 시 기존 3개 레이어와 완전히 동일하게 동작.
  function drawStrandLayer(cfg){
    const {
      count, alphaMul, lineWidth, pickCol, endYFallbackRatio,
      lenScale, startXJitter, startYJitter, jitterSeedFn, tintRange, rootDepthFrac
    } = cfg;
    setStyle('globalAlpha', alpha * alphaMul);
    setStyle('lineWidth', lineWidth);
    for(let i=0; i<count; i++){
      const ix = pickCol(i);
      const sy_top = iScalpY[ix]; if(sy_top < 0) continue;
      const ey_img = iHairEndY[ix] >= 0 ? iHairEndY[ix] : sy_top + maskH*endYFallbackRatio;
      let sy_img = sy_top;
      // depthScale: 이 가닥의 시작점이 두피선(frac=0)에서 얼마나 깊이(ey_img 방향으로)
      // 파고들었는지에 따라 길이 배율(ratio)의 "1에서 벗어난 정도"를 비례 축소하는 계수.
      // 기본 1(=두피선 레이어와 동일하게 ratio 변화량 전량 반영).
      let depthScale = 1;
      if(rootDepthFrac){
        const frac = Math.max(0, Math.min(0.9, rootDepthFrac()));
        const candidateY = sy_top + (ey_img - sy_top) * frac;
        // 후보 지점이 실제 마스크 안일 때만 채택, 아니면 원래 두피선으로 안전하게 폴백
        if(frac > 0 && isRealHairAt(ix, candidateY)){
          sy_img = candidateY;
          // 루트 확산 레이어가 두피선보다 훨씬 깊은 지점에서 출발해 origLen(남은 길이)
          // 자체가 짧은데, ratio 기반으로 바뀐 지금은 origLen에 비례하므로 예전(delta
          // 절대값 방식)만큼 극단적이진 않지만, 그래도 깊이가 깊을수록 배율 변화를
          // 줄여서 두피선 근처 대비 과도하게 요동치지 않도록 유지.
          depthScale = 1 - frac;
        }
      }
      const origLen = Math.max(ey_img - sy_img, maskH*0.05);
      // ratio(배율)의 "1에서 벗어난 만큼"만 depthScale로 축소 — ratio 자체를 곱하면
      // depthScale=0.5여도 여전히 큰 배율이 걸려버려서(예: ratio=2.6 → 1.8배 축소해도
      // 여전히 1.8배) 깊이 축소 의도가 죽는다. 1 기준 편차만 줄여야 "원래 길이 근처로
      // 되돌아가는" 축소가 됨.
      const rawRatio = lengthRatioFor(ix);
      const ratio = 1 + (rawRatio - 1) * depthScale;
      const scaledLen = Math.min(lenScale(origLen, ratio), maxStrandLen);
      const extAmount = scaledLen - origLen; // base/ext 분할 판단용(양수=연장, 음수 이하=전체 clip)
      const startX = ix + startXJitter();
      const startY = startYJitter ? sy_img + startYJitter() : sy_img;
      const jitterSeed = jitterSeedFn(i);
      const [tMin, tRange] = tintRange;
      drawStrand(startX, startY, scaledLen, origLen, extAmount, jitterSeed, tintColor(color, tMin+Math.random()*tRange));
    }
  }

  // ── 레이어 0: 루트 확산 레이어 (110~190개) ──
  // 기존 3개 레이어는 전부 두피 최상단선(scalpY) "한 줄"에서만 출발해서, 그 줄
  // 아래로 인식된 머리 영역(hairEndY까지)이 짧은 컬럼(옆머리 아래쪽, 프로필 하단
  // 등)에서는 가닥이 금방 끝나버려 비어 보이는 문제가 있었음. 실제 머리는 두피
  // 전체에 뿌리가 흩어져 있어서 시작 높이 자체가 제각각인데, 지금까지는 "출발선"이
  // 하나뿐이라 그 아래를 다른 가닥으로 못 채우고 있었던 것.
  // → rootDepthFrac으로 두피선~모발끝 사이 임의 깊이에서 추가로 뿌리를 심어, 옆/하단처럼
  //   원래 짧게 끊기던 구간을 다른 깊이의 가닥들이 겹쳐서 메우도록 함. 다른 레이어보다
  //   먼저 그려서 그 위에 레이어 1~3이 덮이게 하고, 두께는 잔가닥과 비슷하게 얇게 유지.
  // 버그 수정: 기존 Math.sqrt(Math.random())*0.55는 주석에 "얕은 쪽에 몰리게"라 적혀
  // 있었지만 실제로는 sqrt(균등분포)라 반대로 "깊은 쪽(0.55에 가까운 값)"에 밀도가 더
  // 쏠리는 공식이었음 + 최대 깊이도 0.55로 막혀 있어 두피선~모발끝의 아래쪽 45%는
  // 애초에 뿌리를 못 심었음. 정수리(얕은 지점)만 계속 밀집되고 중간·아래는 비어
  // 보이는 원인 중 하나 → 특정 깊이에 쏠리지 않는 균등분포로 바꾸고, 최대 깊이를
  // 0.55→0.8로 넓혀서 중간·아래쪽까지 뿌리가 실제로 닿도록 함.
  // 개수 1.6배 상향: 굵기를 0.367배로 줄인 만큼(테스트 결과 "듬성듬성해짐" 확인됨)
  // 가닥 사이 빈틈을 메우기 위한 보정. 완전 보정(1/0.367≈2.7배)까지는 안 가고
  // 우선 중간 지점(1.6배)부터 테스트.
  // sub-pixel 렌더링 문제 수정: 0.22~0.51px는 1px 미만이라 브라우저가 "더 얇게"가
  // 아니라 알파를 낮춰 흐릿하게 그려버림(캔버스가 sub-pixel 굵기를 실제로 표현 못 함).
  // 1px 근처로 최소굵기를 올려서 흐려지는 걸 막고, 대신 개수를 더 늘려 밀도로 보완.
  const numRootScatter = Math.round(460 + (volume/100) * 330);
  drawStrandLayer({
    count: numRootScatter,
    alphaMul: 1.0,
    // 705px 기준 튜닝값 → 실제 해상도(resScale)에 비례 스케일 + sub-pixel 방지 하한
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.9 + (thickness/100) * 0.5) * resScale),
    pickCol: ()=> validCols[Math.floor(Math.random()*validCols.length)],
    endYFallbackRatio: 0.35,
    // 균등분포 → 제곱분포로 변경: 두피선(frac=0) 근처에 확률이 더 실리고 꼬리가 길게
    // 빠지는 형태(Math.pow(Math.random(),2))라, 실제 헤어라인 밀도는 유지하면서
    // 중간·아래쪽까지 여전히 뿌리가 퍼짐. 균등분포일 때 두피선 근처 밀도가 과소해져
    // "정수리가 빈다"는 오버코렉션이 발생했던 것에 대한 수정.
    rootDepthFrac: ()=> Math.pow(Math.random(), 2) * 0.8,
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02) * (0.6+Math.random()*0.4),
    startXJitter: ()=> (Math.random()-0.5)*maskW*0.01,
    jitterSeedFn: (i)=> i*0.271,
    tintRange: [0.68, 0.55],
  });

  // ── 레이어 1: 굵은 섹션 (38~60개) ──
  // 가닥을 불투명하게 바꾸면서 밀도를 다시 소폭 상향 (30~48 → 38~60).
  // 개수 1.6배 상향 — 위 레이어0과 동일한 이유
  const numSections = Math.round(61 + (volume/100) * 35);
  drawStrandLayer({
    count: numSections,
    alphaMul: 1.0, // 형태를 잡는 가장 굵은 레이어 — 완전 불투명하게 해서 밑의 살색이 안 비치게
    // 705px 기준 튜닝값 → 해상도 비례 스케일
    lineWidth: Math.max(MIN_SAFE_WIDTH, (1.10 + (volume/100) * 1.10) * resScale),
    pickCol: (i)=> validCols[Math.floor((i/numSections)*validCols.length)],
    endYFallbackRatio: 0.40,
    // 한 줄(scalpY) 제한 해제: 다른 레이어처럼 두피선~모발끝 사이에 깊이를 분산시켜서,
    // 이 레이어 전체가 정수리 한 줄에 몰려 밀도가 뭉치는 걸 방지.
    rootDepthFrac: ()=> Math.pow(Math.random(), 2) * 0.6,
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02),
    startXJitter: ()=> (Math.random()-0.5)*(maskW/numSections)*1.5,
    jitterSeedFn: (i)=> i,
    tintRange: [0.70, 0.55],
  });

  // ── 레이어 2: 중간 가닥 (160~330개) ──
  // 개수 1.6배 상향 — 위와 동일한 이유
  const numMid = Math.round(256 + (volume/100) * 272);
  drawStrandLayer({
    count: numMid,
    alphaMul: 1.0,
    // 705px 기준 튜닝값 → 해상도 비례 스케일 + sub-pixel 방지 하한
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.85 + (thickness/100) * 0.6) * resScale),
    pickCol: ()=> validCols[Math.floor(Math.random()*validCols.length)],
    endYFallbackRatio: 0.38,
    rootDepthFrac: ()=> Math.pow(Math.random(), 2) * 0.7, // 한 줄 제한 해제 + 두피선 쪽 가중
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02) * (0.85+Math.random()*0.3),
    startXJitter: ()=> (Math.random()-0.5)*maskW*0.008,
    jitterSeedFn: (i)=> i*0.618,
    tintRange: [0.72, 0.60],
  });

  // ── 레이어 3: 잔 가닥 (160~320개) ──
  // 이 레이어가 가장 밝은 하이라이트(tintRange 상단)를 담당 — 완전 불투명(alphaMul 1.0)으로
  // 그려서 하이라이트가 살색에 묻히지 않고 또렷하게 도드라짐.
  // 개수 1.6배 상향 — 위와 동일한 이유
  // sub-pixel 문제 수정 + 개수 추가 상향 — 위 레이어0과 동일한 이유.
  // 이 레이어는 하이라이트(밝은 톤) 담당이라 흐려지면 머리 전체 광택감이 죽는
  // 영향이 가장 커서 우선적으로 손봄.
  const numFine = Math.round(330 + (volume/100) * 330);
  drawStrandLayer({
    count: numFine,
    alphaMul: 1.0,
    // 705px 기준 튜닝값 → 해상도 비례 스케일 + sub-pixel 방지 하한
    lineWidth: Math.max(MIN_SAFE_WIDTH, (0.9 + (thickness/100) * 0.5) * resScale),
    pickCol: ()=> validCols[Math.floor(Math.random()*validCols.length)],
    endYFallbackRatio: 0.35,
    rootDepthFrac: ()=> Math.pow(Math.random(), 2) * 0.85, // 한 줄 제한 해제 — 잔가닥은 가장 넓게 분산 + 두피선 쪽 가중
    lenScale: (origLen, ratio)=> Math.max(origLen * ratio, maskH*0.02) * (0.7+Math.random()*0.5),
    startXJitter: ()=> (Math.random()-0.5)*maskW*0.012,
    startYJitter: ()=> (Math.random()-0.5)*maskH*0.01,
    jitterSeedFn: (i)=> i*0.382,
    tintRange: [0.65, 0.75],
  });

  // ── 2단계 합성 ──
  // [1] base: origLen 이내 구간 → hairCanvas(실제 세그멘테이션 마스크)로 destination-in
  //     clip을 걸어서, 인식된 머리카락 영역 밖(얼굴·안경·배경)으로는 절대 안 나가게 함.
  // [2] ext: origLen을 넘겨 슬라이더로 늘어난 구간 → clip 없이 그대로.
  //     (짧게 줄인 경우엔 애초에 ext 구간 자체가 안 그려지므로 자연히 문제 없음)
  function compositeLayers(){
    const maskAlpha = document.createElement('canvas');
    maskAlpha.width = cw; maskAlpha.height = ch;
    const mCtx = maskAlpha.getContext('2d');
    // 버그 수정: hairCanvas(destination-in 클리핑 마스크)가 scalpY와 동일한 원본 마스크에서
    // 나와서, 이마 중앙 notch 같은 국소 인식 실패 구간은 마스크 알파도 0이라 validCols를
    // 고쳐서 그 컬럼에 뿌리를 심어도 여기서 다시 지워지는 문제가 있었음. → 클리핑용
    // 마스크에 작은 블러를 걸어 알파를 살짝 번지게(dilate)한 뒤 임계치로 다시 불투명
    // 처리해서, 좁은 gap(노치)만 부드럽게 메워지고 배경처럼 넓은 미인식 영역은 여전히
    // 클리핑되도록 함. (블러만 걸면 전체가 반투명해져 머리카락이 옅게 비쳐 보이므로
    // 임계치로 다시 하드 마스크화)
    const blurPx = Math.max(3, fit.dw * 0.015);
    mCtx.filter = `blur(${blurPx}px)`;
    mCtx.drawImage(hairCanvas, fit.dx, fit.dy, fit.dw, fit.dh);
    mCtx.filter = 'none';
    const mImg = mCtx.getImageData(0,0,cw,ch);
    for(let i=3;i<mImg.data.length;i+=4){
      mImg.data[i] = mImg.data[i] > 25 ? 255 : 0;
    }
    mCtx.putImageData(mImg,0,0);

    baseCtx.save();
    baseCtx.globalCompositeOperation = 'destination-in';
    baseCtx.drawImage(maskAlpha, 0, 0);
    baseCtx.restore();

    ctx.save();
    ctx.globalAlpha = 1;
    ctx.drawImage(baseOffscreen, 0, 0);
    ctx.drawImage(extOffscreen, 0, 0);
    ctx.restore();
  }
  compositeLayers();
}
function tintColor(hex, bright){
  // hex 또는 rgb() 문자열을 받아 밝기 조정
  let r=42,g=27,b=18;
  if(hex.startsWith('#')){
    const n=parseInt(hex.slice(1),16);
    r=(n>>16)&255; g=(n>>8)&255; b=n&255;
  } else {
    const m=hex.match(/\d+/g);
    if(m&&m.length>=3){r=+m[0];g=+m[1];b=+m[2];}
  }
  // 버그 수정: 기존엔 r*bright 처럼 순수 곱셈으로 밝기를 조정했는데, 이러면
  // 검정/짙은 갈색처럼 원래 값이 0에 가까운 색은 bright를 0.65~1.2로 바꿔도
  // 결과가 거의 그대로라 가닥끼리 색 차이가 안 생기고 다 뭉쳐 보였음
  // (예: 30*0.65=19.5, 30*1.2=36 — 육안으로 거의 차이 없음).
  // → 밝게 할 땐(bright>1) 흰색 쪽으로 섞어서(additive) 어두운 색에서도
  //   확실한 하이라이트가 생기게 하고, 어둡게 할 땐(bright<1) 기존처럼 곱셈 유지.
  const delta = bright - 1; // 대략 -0.35 ~ +0.2
  function mix(c){
    if(delta >= 0) return c + (255-c) * Math.min(1, delta*1.8);
    return c * bright;
  }
  return `rgb(${Math.min(255,Math.round(mix(r)))},${Math.min(255,Math.round(mix(g)))},${Math.min(255,Math.round(mix(b)))})`;
}

let rafId = null;
function drawAdjustPreview(){
  if(currentScreen!=='adjust') return;
  if(rafId) cancelAnimationFrame(rafId);
  rafId = requestAnimationFrame(()=>{
    renderAdjustFrame();
    rafId = null;
  });
}

function drawCompare(){
  if(currentScreen!=='compare') return;
  const angle = state.currentViewAngle;
  const pane  = document.getElementById('comparePane');
  const baseC = document.getElementById('compareBaseCanvas');
  const topC  = document.getElementById('compareTopCanvas');
  const clip  = document.getElementById('compareClip');

  const pw = pane.clientWidth, ph = pane.clientHeight;
  if(pw===0||ph===0){ setTimeout(()=>drawCompare(),80); return; }
  baseC.width=pw; baseC.height=ph;
  topC.width=pw;  topC.height=ph;
  topC.style.width=pw+'px'; topC.style.height=ph+'px';

  const div = document.getElementById('compareDivider');
  if(!div.style.left||div.style.left==='0px') div.style.left='50%';
  const pct = parseFloat(div.style.left)||50;
  clip.style.width = pct+'%';

  getCachedImg(angle,(img)=>{
    const ctx = baseC.getContext('2d');
    ctx.clearRect(0,0,pw,ph);
    if(img) drawImgOnCanvas(ctx,img,pw,ph);
  });

  renderFrame(topC, angle);
}

function positionCompareTop(){ drawCompare(); }

// divider drag
const divider=document.getElementById('compareDivider');
const clip=document.getElementById('compareClip');
let dragging=false;
divider.addEventListener('pointerdown',e=>{dragging=true;e.preventDefault();});
window.addEventListener('pointerup',()=>{dragging=false;});
window.addEventListener('pointermove',e=>{
  if(!dragging) return;
  const pane=document.getElementById('comparePane');
  const rect=pane.getBoundingClientRect();
  let pct=((e.clientX-rect.left)/rect.width)*100;
  pct=Math.max(4,Math.min(96,pct));
  divider.style.left=pct+'%'; clip.style.width=pct+'%';
});
window.addEventListener('resize',positionCompareTop);

/* ════════════════════════════════════════
   AI ANALYSIS
════════════════════════════════════════ */
async function analyzeWithClaude(){
  const frontImg=state.shots['front']; if(!frontImg) return;
  showAI('AI가 얼굴을 분석하고 있어요…','얼굴형 · 머리색 · 스타일 추천');
  const base64=frontImg.split(',')[1];
  const mediaType=frontImg.startsWith('data:image/png')?'image/png':'image/jpeg';
  const prompt=`미용실 고객 정면 사진입니다. 아래 JSON만 응답하세요. 다른 텍스트 없이.
{
  "hairColor": "black|brown|blonde|red|grey|colored",
  "faceShape": "oval|round|square|heart|long",
  "currentLength": "short|medium|long",
  "recommendedStyles": ["id1","id2"],
  "advice": "한국어 2문장 이내 스타일 조언"
}
스타일 id 목록: bob, long-wave, pixie, layered, curly, sleek, shag, lob`;
  try{
    const res=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:500,messages:[{role:'user',content:[
        {type:'image',source:{type:'base64',media_type:mediaType,data:base64}},
        {type:'text',text:prompt}
      ]}]})
    });
    const data=await res.json();
    const raw=data.content.map(b=>b.text||'').join('').replace(/```json|```/g,'').trim();
    aiAnalysis=JSON.parse(raw);
    document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('ai-recommended'));
    (aiAnalysis.recommendedStyles||[]).forEach(id=>{
      const el=document.getElementById('style-'+id); if(el) el.classList.add('ai-recommended');
    });
    const faceMap={oval:'계란형',round:'둥근형',square:'각진형',heart:'하트형',long:'긴형'};
    const colorMap={black:'블랙',brown:'브라운',blonde:'블론드',red:'레드',grey:'그레이',colored:'컬러'};
    const lenMap={short:'숏',medium:'미디엄',long:'롱'};
    document.getElementById('aiAnalysisText').textContent=aiAnalysis.advice||'';
    const tags=[faceMap[aiAnalysis.faceShape]||'',colorMap[aiAnalysis.hairColor]||'',lenMap[aiAnalysis.currentLength]||''];
    document.getElementById('aiAnalysisTags').innerHTML=tags.filter(Boolean).map(t=>`<span class="ai-tag">${t}</span>`).join('');
    document.getElementById('aiAnalysisCard').style.display='flex';
  }catch(e){
    showToast('AI 분석 실패. 수동으로 조정해주세요.');
  }
  hideAI();
}

/* ════════════════════════════════════════
   VOICE
════════════════════════════════════════ */
function toggleVoice(){
  if(listening){stopVoice();return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){showToast('음성인식은 Chrome에서만 작동해요.');return;}
  recognition=new SR();
  recognition.lang='ko-KR';recognition.continuous=true;recognition.interimResults=false;
  recognition.onresult=e=>{ const t=e.results[e.results.length-1][0].transcript.trim(); handleVoiceCmd(t); };
  recognition.onerror=()=>stopVoice();
  recognition.onend=()=>{if(listening){try{recognition.start();}catch(e){}}};
  recognition.start(); listening=true;
  document.getElementById('voiceBtn').classList.add('listening');
  document.getElementById('voiceBtnLabel').textContent='듣는 중… (탭하여 종료)';
}
function stopVoice(){
  listening=false;
  if(recognition){try{recognition.stop();}catch(e){}}
  document.getElementById('voiceBtn').classList.remove('listening');
  document.getElementById('voiceBtnLabel').textContent='음성으로 조정하기';
}
function handleVoiceCmd(text){
  document.getElementById('voiceTranscript').innerHTML='인식됨: <b>"'+text+'"</b>';
  const t=text.replace(/\s/g,'');
  const STEP=15; let matched=false;

  // 섹션 선택
  const sectionMap = {
    '크라운':'crown','정수리':'crown',
    '프론트':'front','앞머리':'front',
    '템플':'temple','관자':'temple',
    '사이드':'side','옆머리':'side',
    '후두부':'occipital','뒤통수':'occipital',
    '네이프':'nape','목선':'nape',
  };
  let targetSection = state.currentSection;
  Object.entries(sectionMap).forEach(([kw,sid])=>{ if(t.includes(kw)) targetSection=sid; });

  const adj=(param,delta)=>{
    const s=state.sections[targetSection];
    if(s[param]===undefined) return;
    s[param]=Math.max(0,Math.min(100,s[param]+delta));
    propagateSectionChange(targetSection,param);
    buildSectionTabs(); matched=true;
  };
  const has=arr=>arr.some(kw=>t.includes(kw));

  if(has(['길게','늘려','길이늘','더길'])) adj('length',STEP);
  else if(has(['짧게','줄여','길이줄','더짧'])) adj('length',-STEP);
  else if(has(['볼륨추가','볼륨올','볼륨업','풍성'])) adj('volume',STEP);
  else if(has(['볼륨줄','볼륨내','납작'])) adj('volume',-STEP);
  else if(has(['컬추가','웨이브추가','더컬'])){state._globalCurl=Math.min(100,state._globalCurl+STEP);matched=true;}
  else if(has(['펴줘','컬줄','스트레이트','직모'])){state._globalCurl=Math.max(0,state._globalCurl-STEP);matched=true;}
  else if(t.includes('다음각도')||t.includes('다음앵글')){ cycleAngle(1); matched=true; }
  else if(t.includes('이전각도')||t.includes('이전앵글')){ cycleAngle(-1); matched=true; }
  else if(t.includes('비교')||t.includes('완료')){ navTo('compare'); matched=true; }
  else if(t.includes('초기화')||t.includes('리셋')){ resetSections(); matched=true; }

  if(matched){ document.getElementById('slider-globalCurl').value=state._globalCurl; document.getElementById('val-globalCurl').textContent=state._globalCurl; drawAdjustPreview(); }
  else showToast('명령을 이해하지 못했어요: "'+text+'"');
}
function cycleAngle(dir){
  let idx=ANGLES.indexOf(state.currentViewAngle);
  idx=(idx+dir+4)%4; state.currentViewAngle=ANGLES[idx];
  renderAngleSwitches();
  drawAdjustPreview(); drawCompare();
}

function showAI(text,sub){
  document.getElementById('aiOverlayText').textContent=text;
  document.getElementById('aiOverlaySub').textContent=sub;
  document.getElementById('aiOverlay').classList.remove('hidden');
}
function hideAI(){ document.getElementById('aiOverlay').classList.add('hidden'); }

let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

function startNewCustomer(){
  aiAnalysis=null;
  ANGLES.forEach(a=>{state.shots[a]=null;state.hairCanvases[a]=null;state.hairMasks[a]=null;state.baseCanvases[a]=null;});
  state.landmarks = {};
  state.selectedStyle=null; state.currentCaptureIndex=0; state.currentSection='crown';
  // 섹션 초기화
  SECTION_ORDER.forEach(id=>{
    state.sections[id] = {...SECTIONS[id].defaults};
  });
  state._globalCurl = 30;
  document.getElementById('aiAnalysisCard').style.display='none';
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('ai-recommended','selected'));
  document.getElementById('toAdjustBtn').disabled=true;
  ['style','adjust','compare'].forEach(id=>{ const t=document.getElementById('nav-'+id); if(t) t.disabled=true; });
  updateAngleUI();
  navTo('capture');
}
