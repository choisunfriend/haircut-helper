<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>결 GYEOL · 2D 헤어 설계</title>
<style>
  /* ============================================================
     결(GYEOL) — 미용사용 2D 헤어 시뮬레이터
     철학: 완성 스타일을 "입히는" 도구가 아니라, 미용사가 섹션별로
           "조작해서 만들어가는" 시술 설계·합의 도구.
     범위: 2D까지. 3D·의상 추천은 후속.
     ============================================================ */

  :root{
    --bg:#12100E;           /* 어두운 워크벤치 — 머리 결과가 주인공 */
    --panel:#1C1916;
    --panel-2:#252019;
    --line:#332C24;
    --ink:#EDE6DA;          /* 따뜻한 상아 텍스트 */
    --ink-dim:#A89B87;
    --ink-faint:#6B6154;
    --accent:#C8A46B;       /* 황동/가위빛 골드 — 도구의 금속감 */
    --accent-soft:#8A7A5E;
    --cut:#7FA88C;          /* 커트=차분한 세이지 */
    --perm:#C99A6A;         /* 펌=구리 */
    --color:#B0788F;        /* 컬러=자수정 */
    --danger:#C56B5C;
    --r:10px;
    --font:'Helvetica Neue',-apple-system,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--font); font-size:14px; line-height:1.5;
    display:grid; grid-template-columns:1fr 360px; grid-template-rows:auto 1fr;
    grid-template-areas:"head head" "stage panel";
    height:100vh; overflow:hidden;
  }
  @media(max-width:880px){
    body{grid-template-columns:1fr; grid-template-rows:auto auto 1fr;
         grid-template-areas:"head" "stage" "panel"; overflow:auto}
  }

  /* ── 헤더 ── */
  header{
    grid-area:head; display:flex; align-items:center; gap:20px;
    padding:14px 22px; border-bottom:1px solid var(--line); background:var(--panel);
  }
  .brand{display:flex; align-items:baseline; gap:10px}
  .brand .kr{font-size:22px; font-weight:700; letter-spacing:2px; color:var(--accent)}
  .brand .en{font-size:11px; letter-spacing:3px; color:var(--ink-faint); text-transform:uppercase}
  .brand .tag{font-size:11px; color:var(--ink-dim); border-left:1px solid var(--line); padding-left:12px}
  .head-actions{margin-left:auto; display:flex; gap:8px}
  .btn{
    font-family:inherit; font-size:12px; color:var(--ink); cursor:pointer;
    background:var(--panel-2); border:1px solid var(--line); border-radius:8px;
    padding:8px 14px; transition:.15s; letter-spacing:.3px;
  }
  .btn:hover{border-color:var(--accent); color:var(--accent)}
  .btn.primary{background:var(--accent); color:#1a1510; border-color:var(--accent); font-weight:600}
  .btn.primary:hover{filter:brightness(1.1); color:#1a1510}

  /* ── 스테이지(결과) ── */
  .stage{
    grid-area:stage; position:relative; display:flex; flex-direction:column;
    align-items:center; justify-content:center; padding:24px; min-height:340px;
    background:radial-gradient(ellipse at 50% 38%, #1a1712 0%, var(--bg) 72%);
  }
  .view-tabs{position:absolute; top:16px; left:50%; transform:translateX(-50%);
    display:flex; gap:4px; background:var(--panel); border:1px solid var(--line);
    border-radius:10px; padding:4px}
  .view-tab{font-size:12px; color:var(--ink-dim); background:none; border:none;
    cursor:pointer; padding:6px 14px; border-radius:7px; font-family:inherit; letter-spacing:.5px}
  .view-tab.active{background:var(--panel-2); color:var(--accent)}
  #hairCanvas{
    background:var(--panel);
    border:1px solid var(--line); border-radius:var(--r);
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6); max-width:100%; height:auto;
  }
  .stage-note{position:absolute; bottom:14px; font-size:11px; color:var(--ink-faint);
    letter-spacing:.4px}

  /* ── 우측 패널 ── */
  .panel{
    grid-area:panel; background:var(--panel); border-left:1px solid var(--line);
    display:flex; flex-direction:column; overflow:hidden;
  }
  .section-bar{display:flex; flex-wrap:wrap; gap:4px; padding:12px; border-bottom:1px solid var(--line)}
  .sec-chip{flex:1 1 auto; min-width:64px; text-align:center; font-size:12px;
    padding:9px 6px; border-radius:8px; cursor:pointer; background:var(--panel-2);
    border:1px solid transparent; color:var(--ink-dim); transition:.15s; font-family:inherit}
  .sec-chip .en{display:block; font-size:8.5px; letter-spacing:1px; color:var(--ink-faint); margin-top:1px}
  .sec-chip.active{border-color:var(--accent); color:var(--accent); background:#221d16}
  .sec-chip:hover:not(.active){color:var(--ink)}

  .controls{flex:1; overflow-y:auto; padding:6px 16px 22px}
  .controls::-webkit-scrollbar{width:8px}
  .controls::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px}

  /* 공정 그룹(커트/펌/컬러) */
  .group{border-bottom:1px solid var(--line); padding:14px 0}
  .group:last-child{border-bottom:none}
  .group-head{display:flex; align-items:center; gap:9px; cursor:pointer; user-select:none}
  .group-dot{width:9px; height:9px; border-radius:3px; flex:none}
  .group-title{font-size:12px; letter-spacing:1.5px; text-transform:uppercase; font-weight:600}
  .group-sub{font-size:10px; color:var(--ink-faint); margin-left:auto; letter-spacing:.5px}
  .group-chevron{color:var(--ink-faint); transition:.2s; font-size:10px}
  .group.collapsed .group-chevron{transform:rotate(-90deg)}
  .group.collapsed .group-body{display:none}
  .group-body{padding-top:12px}
  .group.optional .group-title{color:var(--ink-dim)}

  /* 슬라이더 */
  .ctrl{margin:13px 0}
  .ctrl-top{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px}
  .ctrl-label{font-size:12.5px; color:var(--ink)}
  .ctrl-hint{font-size:10px; color:var(--ink-faint); margin-left:6px}
  .ctrl-val{font-size:12px; color:var(--accent); font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none; width:100%; height:3px; border-radius:2px;
    background:var(--line); outline:none; cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:15px; height:15px;
    border-radius:50%; background:var(--accent); border:2px solid var(--bg); cursor:pointer;
    box-shadow:0 1px 4px rgba(0,0,0,.4)}
  input[type=range]::-moz-range-thumb{width:15px; height:15px; border-radius:50%;
    background:var(--accent); border:2px solid var(--bg); cursor:pointer}
  .swatches{display:flex; gap:7px; flex-wrap:wrap; margin-top:8px}
  .sw{width:26px; height:26px; border-radius:7px; cursor:pointer; border:2px solid transparent}
  .sw.active{border-color:var(--ink)}

  .toggle-row{display:flex; align-items:center; gap:8px; margin:2px 0 4px}
  .toggle{width:34px; height:19px; border-radius:11px; background:var(--line);
    position:relative; cursor:pointer; transition:.2s; flex:none}
  .toggle.on{background:var(--accent)}
  .toggle::after{content:''; position:absolute; width:15px; height:15px; border-radius:50%;
    background:var(--ink); top:2px; left:2px; transition:.2s}
  .toggle.on::after{left:17px; background:#1a1510}

  .style-bar{padding:12px 16px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center}
  .style-bar select{flex:1; background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
    border-radius:8px; padding:8px; font-family:inherit; font-size:12px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <span class="kr">결</span>
    <span class="en">GYEOL</span>
    <span class="tag">미용사 2D 설계 · 섹션별 시술 시뮬레이션</span>
  </div>
  <div class="head-actions">
    <button class="btn" id="resetBtn">초기화</button>
    <button class="btn primary" id="downloadBtn">이미지 저장</button>
  </div>
</header>

<div class="stage">
  <div class="view-tabs" id="viewTabs">
    <button class="view-tab active" data-view="front">정면</button>
    <button class="view-tab" data-view="left">좌측</button>
    <button class="view-tab" data-view="right">우측</button>
    <button class="view-tab" data-view="back">후면</button>
  </div>
  <canvas id="hairCanvas" width="440" height="520"></canvas>
  <div class="stage-note">표준 두상 기반 · 사진 세그멘테이션 연동은 후속 단계</div>
</div>

<div class="panel">
  <div class="section-bar" id="sectionBar"></div>
  <div class="controls" id="controls"></div>
  <div class="style-bar">
    <select id="styleSelect"><option value="">— 저장된 스타일 불러오기 —</option></select>
    <button class="btn" id="saveStyleBtn">현재 저장</button>
  </div>
</div>

<script>
/* ============================================================
   1. 섹션 정의 (기존 index에서 계승 — 6구역)
   각 섹션 파라미터를 커트/펌/컬러 공정으로 태그.
   ============================================================ */
const SECTIONS = {
  crown:     { label:'크라운', en:'CROWN',     defaults:{technique:'uniform',   length:80, elevation:45, texture:20, curl:0, wave:50, color:null} },
  front:     { label:'프론트', en:'FRONT',     defaults:{technique:'onelength', length:70, elevation:20, texture:15, curl:0, wave:50, color:null} },
  temple:    { label:'템플',   en:'TEMPLE',    defaults:{technique:'graduation',length:80, elevation:30, texture:20, curl:0, wave:50, color:null} },
  side:      { label:'사이드', en:'SIDE',      defaults:{technique:'graduation',length:85, elevation:50, texture:25, curl:0, wave:50, color:null} },
  occipital: { label:'후두부', en:'OCCIPITAL', defaults:{technique:'uniform',   length:82, elevation:50, texture:25, curl:0, wave:50, color:null} },
  nape:      { label:'네이프', en:'NAPE',      defaults:{technique:'onelength', length:45, elevation:0,  texture:30, curl:0, wave:50, color:null} },
};
const SECTION_ORDER = ['crown','front','temple','side','occipital','nape'];

/* ============================================================
   1-B. 커트 기법 → 겹(슬라이스) 생성 규칙
   ★ 미용사는 기법 + 상위값만 조작. 이 함수가 겹 배열을 자동 생성.
   나중에 세부 조작(3번)이 필요해지면 이 배열을 UI로 열기만 하면 됨.
   각 겹: { pos(0=하단~1=상단), elevation, lenScale(하단 길이 대비 배율) }
   ============================================================ */
const TECHNIQUES = {
  onelength:  { label:'원랭스',        hint:'한 라인 · 무게감 하단' },
  graduation: { label:'그라데이션',    hint:'사선 · 무게 쌓임' },
  uniform:    { label:'유니폼 레이어', hint:'균일 층 · 가벼움' },
  increase:   { label:'인크리스 레이어', hint:'위로 갈수록 길게' },
};
const SLICES = 6; // 섹션당 겹 수 (내부 고정)

function buildGuides(p){
  const guides = [];
  for(let s=0;s<SLICES;s++){
    const pos = s/(SLICES-1);        // 0=하단(목쪽), 1=상단(정수리쪽)
    let elevation, lenScale;
    switch(p.technique){
      case 'onelength':   // 모든 겹 0°, 같은 지점에서 자름 → 길이 동일
        elevation = 0;
        lenScale  = 1;
        break;
      case 'graduation':  // 낮은 각도, 위로 갈수록 살짝 짧게(무게 하단)
        elevation = p.elevation * (0.3 + pos*0.5);
        lenScale  = 1 - pos*0.28;
        break;
      case 'uniform':     // 90°로 들어 두상 따라 균일 길이
        elevation = 90;
        lenScale  = 1;
        break;
      case 'increase':    // 위로 갈수록 길게(가이드 이동)
        elevation = 90;
        lenScale  = 1 + pos*0.6;
        break;
      default:
        elevation = p.elevation; lenScale = 1;
    }
    // 상위 '시술각 세기'(elevation 슬라이더)로 전체 각도 스케일 보정
    elevation *= (p.elevation/45); // 45를 기준값으로
    elevation = Math.max(0, Math.min(90, elevation));
    guides.push({ pos, elevation, lenScale });
  }
  return guides;
}

/* 특정 컬럼 높이(rootT: 0=하단~1=상단)에서 겹들을 보간해 실제 시술값 산출 */
function sampleGuides(guides, rootT){
  // rootT에 가장 가까운 두 겹을 선형 보간
  const x = rootT*(guides.length-1);
  const i0 = Math.floor(x), i1 = Math.min(guides.length-1, i0+1), f = x-i0;
  const a = guides[i0], b = guides[i1];
  return {
    elevation: a.elevation + (b.elevation-a.elevation)*f,
    lenScale:  a.lenScale  + (b.lenScale -a.lenScale )*f,
  };
}

/* 공정 그룹 정의 — 섹션 탭 내부를 커트→펌→컬러로 정리 */
const GROUPS = [
  { id:'cut',  title:'커트', sub:'형태', color:'var(--cut)', optional:false,
    params:[
      {key:'length',    label:'길이',       hint:'모발 길이',        min:10, max:100, unit:'%'},
      {key:'elevation', label:'엘리베이션', hint:'시술각',          min:0,  max:90,  unit:'°'},
      {key:'texture',   label:'텍스처라이징', hint:'질감·숱',        min:0,  max:100, unit:'%'},
    ]},
  { id:'perm', title:'펌', sub:'컬', color:'var(--perm)', optional:true,
    params:[
      {key:'curl', label:'컬 세기',  hint:'0이면 펌 없음', min:0, max:100, unit:'%'},
      {key:'wave', label:'웨이브 폭', hint:'로드 굵기',    min:0, max:100, unit:'%'},
    ]},
  { id:'color', title:'컬러', sub:'선택', color:'var(--color)', optional:true,
    params:[] }, // 색상은 스와치로 별도 렌더
];

const COLORS = ['#2B2016','#4A3421','#6B4A2E','#8B5A2B','#A9713C','#C89860','#3A2E4A','#7A3B4A','#B0788F'];

/* ============================================================
   2. cleanupLine — 정돈층 단일 함수 (설계 문서 6절)
   빈곳보간 → 이상치클램프(MAD) → 스텝제한 → 스무딩
   ============================================================ */
function cleanupLine(raw, opts={}){
  const { wrap=false, missing=-1, outlierK=2.5, neighborR=3, smoothR=2, maxStep=null } = opts;
  const n = raw.length; if(n===0) return [];
  const miss = v => v==null || v===missing || Number.isNaN(v);
  const at = (a,i)=> wrap ? a[((i%n)+n)%n] : a[Math.max(0,Math.min(n-1,i))];

  let line = raw.slice();
  const valid=[]; for(let i=0;i<n;i++) if(!miss(line[i])) valid.push(i);
  if(valid.length===0) return line;
  if(valid.length<n){
    for(let i=0;i<n;i++){
      if(!miss(line[i])) continue;
      let L=null,R=null;
      for(let d=1;d<=n;d++){
        if(L===null && !miss(at(line,i-d))) L={i:i-d,v:at(line,i-d)};
        if(R===null && !miss(at(line,i+d))) R={i:i+d,v:at(line,i+d)};
        if(L&&R) break;
      }
      if(L&&R){ const s=R.i-L.i; line[i]= s===0?L.v:L.v+(R.v-L.v)*((i-L.i)/s); }
      else if(L) line[i]=L.v; else if(R) line[i]=R.v;
    }
  }
  const median = xs=>{ const s=xs.slice().sort((a,b)=>a-b),m=s.length>>1;
    return s.length%2? s[m] : (s[m-1]+s[m])/2; };
  const cl = line.slice();
  for(let i=0;i<n;i++){
    const win=[]; for(let d=-neighborR;d<=neighborR;d++){ if(d) win.push(at(line,i+d)); }
    const med=median(win), mad=median(win.map(v=>Math.abs(v-med)))||1e-6;
    if(Math.abs(line[i]-med) > outlierK*mad) cl[i]=med;
  }
  if(maxStep!=null){
    for(let i=1;i<n;i++){ const df=cl[i]-cl[i-1];
      if(Math.abs(df)>maxStep) cl[i]=cl[i-1]+Math.sign(df)*maxStep; }
  }
  if(smoothR<=0) return cl;
  const out=cl.slice();
  for(let i=0;i<n;i++){ let s=0,w=0;
    for(let d=-smoothR;d<=smoothR;d++){ const ww=smoothR+1-Math.abs(d); s+=at(cl,i+d)*ww; w+=ww; }
    out[i]=s/w; }
  return out;
}

/* ============================================================
   3. 상태
   ============================================================ */
let state = { view:'front', activeSection:'crown', sections:{}, globalColor:'#6B4A2E' };
SECTION_ORDER.forEach(id=> state.sections[id] = {...SECTIONS[id].defaults});

/* ============================================================
   4. 2D 렌더 — 표준 두상 위에 섹션별 조작을 가닥으로 그림
   실제 앱에선 세그 실측 라인이 baseOutline을 대체(정돈층 경유).
   ============================================================ */
const canvas = document.getElementById('hairCanvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

/* 표준 두상 실루엣 (정면 기준 타원 머리+목) */
function headGeometry(view){
  const cx=W/2, topY=H*0.16, faceW=W*0.30, faceH=H*0.40;
  const chinY = topY + faceH*2;
  const crownY = topY - faceH*0.10; // 정수리(머리카락 시작 기준선)
  return {cx, topY, faceW, faceH, chinY, crownY, view};
}

/* 각 섹션이 두상 반원에서 차지하는 각도 범위(정면, 도 단위).
   -90=좌측끝, 0=정수리, +90=우측끝. 뿌리 컬럼을 섹션에 매핑. */
const SECTION_ARC = {
  front:     [-32,  32],
  crown:     [-58, -32], // 좌우 대칭이라 |deg|로 판정
  temple:    [-78, -58],
  side:      [-90, -78],
};
function sectionAtDeg(deg){
  const a = Math.abs(deg);
  if(a < 32) return 'front';
  if(a < 58) return 'crown';
  if(a < 78) return 'temple';
  return 'side';
}

/* ============================================================
   4-A. 실측 라인 훅 (★ 세그 이식 지점)
   지금은 표준 두상에서 두피선/모발끝선을 "생성"해 돌려준다.
   나중에 이 함수 속만 extractHairMask(사진) 결과로 교체하면
   나머지 렌더는 하나도 안 바꾸고 실사진 파이프라인이 붙는다.

   반환: 컬럼별 { rootX, rootY, endLen, sec }
     - rootX/rootY : 두피선(가닥 뿌리) 좌표  ← 세그의 scalpY에 해당
     - endLen      : 모발끝까지 픽셀 길이     ← 세그의 hairEndY-scalpY에 해당
   두 라인 모두 cleanupLine(정돈층)을 통과시킨다.
   ============================================================ */
function getScalpAndEndLines(g){
  const N = 140;
  const rootXraw=new Array(N), rootYraw=new Array(N), endRaw=new Array(N), secOf=new Array(N);

  // 섹션별 겹 배열을 미리 생성(섹션당 1회) — 상위값→겹 자동 변환
  const guideCache = {};
  for(const id of SECTION_ORDER) guideCache[id] = buildGuides(state.sections[id]);

  const elevOf = new Array(N); // 컬럼별 시술각(겹 보간 결과) — 렌더에서 사용

  for(let i=0;i<N;i++){
    const t = i/(N-1);
    const deg = -90 + t*180;            // 두상 상단 반원
    const rad = deg*Math.PI/180;
    const sec = sectionAtDeg(deg);
    secOf[i]=sec;
    const p = state.sections[sec];

    // 두피선: 두상 타원 표면 (표준). 세그 연동 시 실측 scalp 라인으로 대체.
    rootXraw[i] = g.cx + Math.sin(rad)*g.faceW*1.06;
    rootYraw[i] = g.crownY + (1-Math.cos(rad))*g.faceH*0.62;

    // 이 컬럼이 두상에서 얼마나 위쪽인지(rootT: 0=옆/아래, 1=정수리)
    const rootT = 1 - Math.abs(deg)/90;
    // ★ 겹 배열을 보간해 이 높이의 실제 시술값(길이배율·시술각) 산출
    const gsample = sampleGuides(guideCache[sec], rootT);

    // 길이: 섹션 기본 길이 × 겹의 lenScale (기법이 여기서 형태를 만듦)
    let len = (p.length/100) * H*0.46 * gsample.lenScale;
    elevOf[i] = gsample.elevation;

    // 세그 노이즈 흉내(훅 단계에서 정돈층 검증용): 드물게 결측/스파이크
    if(Math.random()<0.05) len = (Math.random()<0.5)? -1 : len*1.8;
    endRaw[i]=len;
  }

  // ★ 정돈층: 두 라인(뿌리Y, 끝길이) 각각 통과 — 튐/결측 제거
  const rootY = cleanupLine(rootYraw, {wrap:false, smoothR:2, maxStep:H*0.04});
  const endLen= cleanupLine(endRaw,   {wrap:false, missing:-1, outlierK:2.2, smoothR:3, maxStep:H*0.05});
  // rootX는 대칭축이라 스무딩만 가볍게
  const rootX = cleanupLine(rootXraw, {wrap:false, smoothR:1});
  // 시술각도 겹 경계에서 안 튀게 가볍게 스무딩
  const elev = cleanupLine(elevOf, {wrap:false, smoothR:2});

  const cols=[];
  for(let i=0;i<N;i++) cols.push({rootX:rootX[i], rootY:rootY[i], endLen:endLen[i], sec:secOf[i], elevation:elev[i]});
  return cols;
}

function draw(){
  ctx.clearRect(0,0,W,H);
  const g = headGeometry(state.view);

  /* ── 두상/얼굴 베이스 ── */
  ctx.save();
  ctx.fillStyle = '#E9CBA8';
  ctx.beginPath();
  ctx.ellipse(g.cx, g.topY+g.faceH, g.faceW, g.faceH, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillRect(g.cx-g.faceW*0.42, g.topY+g.faceH*1.55, g.faceW*0.84, g.faceH*0.7); // 목
  ctx.restore();

  /* ── 머리카락: 훅에서 실측 라인 받아 규칙으로 채워 그림 ── */
  const cols = getScalpAndEndLines(g);
  const N = cols.length;

  // (1) 머리 덩어리(실루엣 면) — 가닥 뒤에 깔아 볼륨감을 줌
  ctx.save();
  ctx.beginPath();
  for(let i=0;i<N;i++){
    const c=cols[i];
    const x=c.rootX, y=c.rootY;
    if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
  }
  for(let i=N-1;i>=0;i--){
    const c=cols[i];
    const p=state.sections[c.sec];
    const side = c.rootX<g.cx?-1:1;
    // 끝점: 뿌리에서 아래로 endLen, 겹 시술각만큼 바깥으로
    const flare = (c.elevation/90)*c.endLen*0.28;
    const ex = c.rootX + side*flare;
    const ey = c.rootY + c.endLen;
    ctx.lineTo(ex,ey);
  }
  ctx.closePath();
  ctx.fillStyle = state.globalColor;
  ctx.globalAlpha = 0.9;
  ctx.fill();
  ctx.restore();

  // (2) 가닥 디테일 — 컬/질감이 형태로 읽히게
  ctx.save();
  ctx.globalAlpha = 0.35;
  ctx.lineWidth = 1;
  for(let i=0;i<N;i+=1){
    const c=cols[i];
    const p=state.sections[c.sec];
    const col = p.color || state.globalColor;
    const side = c.rootX<g.cx?-1:1;
    const curl=p.curl/100, wave=0.6+p.wave/100, tex=p.texture/100;
    const flare = (c.elevation/90)*c.endLen*0.28;

    ctx.strokeStyle = shade(col, i%2? -12:8);
    ctx.beginPath();
    ctx.moveTo(c.rootX, c.rootY);
    const steps=20;
    for(let s=1;s<=steps;s++){
      const f=s/steps;
      let x = c.rootX + side*flare*f;
      let y = c.rootY + c.endLen*f;
      if(curl>0) x += Math.sin(f*Math.PI*(2+wave*2)) * curl*16 * f;   // 펌 웨이브
      x += (hash(i*7+s)-0.5) * tex*4 * f;                            // 텍스처
      ctx.lineTo(x,y);
    }
    ctx.stroke();
  }
  ctx.restore();
  ctx.globalAlpha=1;

  // (3) 활성 섹션 하이라이트 라벨
  const anyCol = cols.find(c=>c.sec===state.activeSection);
  if(anyCol){
    ctx.fillStyle='#C8A46B';
    ctx.font='600 12px sans-serif';
    ctx.fillText(SECTIONS[state.activeSection].label+' 편집 중', 14, 22);
  }
}

/* 색 밝기 조정 유틸 */
function shade(hex, amt){
  const n=parseInt(hex.slice(1),16);
  let r=(n>>16)+amt, gg=((n>>8)&255)+amt, b=(n&255)+amt;
  r=Math.max(0,Math.min(255,r)); gg=Math.max(0,Math.min(255,gg)); b=Math.max(0,Math.min(255,b));
  return '#'+((r<<16)|(gg<<8)|b).toString(16).padStart(6,'0');
}
/* 결정적 유사난수(질감이 매 프레임 안 떨리게) */
function hash(n){ const x=Math.sin(n*127.1)*43758.5453; return x-Math.floor(x); }

/* ============================================================
   5. UI 빌드
   ============================================================ */
function buildSectionBar(){
  const bar = document.getElementById('sectionBar');
  bar.innerHTML='';
  SECTION_ORDER.forEach(id=>{
    const b = document.createElement('button');
    b.className='sec-chip'+(id===state.activeSection?' active':'');
    b.innerHTML = `${SECTIONS[id].label}<span class="en">${SECTIONS[id].en}</span>`;
    b.onclick = ()=>{ state.activeSection=id; buildSectionBar(); buildControls(); };
    bar.appendChild(b);
  });
}

const collapsed = {perm:true, color:true}; // 선택 공정은 기본 접힘

function buildControls(){
  const wrap = document.getElementById('controls');
  wrap.innerHTML='';
  const sec = state.sections[state.activeSection];

  GROUPS.forEach(grp=>{
    const g = document.createElement('div');
    g.className='group'+(grp.optional?' optional':'')+((collapsed[grp.id])?' collapsed':'');

    const head = document.createElement('div');
    head.className='group-head';
    head.innerHTML = `<span class="group-dot" style="background:${grp.color}"></span>
      <span class="group-title" style="color:${grp.color}">${grp.title}</span>
      <span class="group-sub">${grp.sub}</span>
      <span class="group-chevron">▼</span>`;
    head.onclick = ()=>{ collapsed[grp.id]=!collapsed[grp.id]; buildControls(); };
    g.appendChild(head);

    const body = document.createElement('div');
    body.className='group-body';

    // 컬러 그룹은 스와치
    if(grp.id==='color'){
      const t = document.createElement('div'); t.className='toggle-row';
      const on = sec.color!==null;
      t.innerHTML = `<div class="toggle ${on?'on':''}"></div>
        <span class="ctrl-hint">이 섹션만 다른 색 적용 (발레아쥬 등)</span>`;
      t.querySelector('.toggle').onclick=()=>{
        sec.color = (sec.color===null)? state.globalColor : null; buildControls(); draw();
      };
      body.appendChild(t);
      if(on){
        const sw = document.createElement('div'); sw.className='swatches';
        COLORS.forEach(c=>{
          const s=document.createElement('div');
          s.className='sw'+(sec.color===c?' active':''); s.style.background=c;
          s.onclick=()=>{ sec.color=c; buildControls(); draw(); };
          sw.appendChild(s);
        });
        body.appendChild(sw);
      }
    } else {
      // 커트 그룹: 맨 위에 기법(커트 방식) 선택 — 미용사의 상위 결정
      if(grp.id==='cut'){
        const tw = document.createElement('div'); tw.className='ctrl';
        let opts='';
        Object.keys(TECHNIQUES).forEach(k=>{
          opts += `<option value="${k}" ${sec.technique===k?'selected':''}>${TECHNIQUES[k].label}</option>`;
        });
        tw.innerHTML = `<div class="ctrl-top">
            <span><span class="ctrl-label">커트 방식</span><span class="ctrl-hint">${TECHNIQUES[sec.technique].hint}</span></span>
          </div>
          <select class="tech-sel" style="width:100%;background:var(--panel-2);color:var(--ink);
            border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:12.5px">${opts}</select>`;
        const sel = tw.querySelector('select');
        sel.onchange = ()=>{ sec.technique=sel.value; buildControls(); draw(); };
        body.appendChild(tw);
      }
      grp.params.forEach(pm=>{
        const c = document.createElement('div'); c.className='ctrl';
        const hint = (grp.id==='cut'&&pm.key==='elevation')? '시술각 세기(겹 전체 스케일)' : pm.hint;
        c.innerHTML = `<div class="ctrl-top">
            <span><span class="ctrl-label">${pm.label}</span><span class="ctrl-hint">${hint}</span></span>
            <span class="ctrl-val">${sec[pm.key]}${pm.unit}</span>
          </div>
          <input type="range" min="${pm.min}" max="${pm.max}" value="${sec[pm.key]}">`;
        const inp = c.querySelector('input');
        inp.oninput = ()=>{
          sec[pm.key]=+inp.value;
          c.querySelector('.ctrl-val').textContent = inp.value+pm.unit;
          draw();
        };
        body.appendChild(c);
      });
    }
    g.appendChild(body);
    wrap.appendChild(g);
  });
}

/* ── 전역 컬러(스테이지 하단 빠른 선택) 은 헤더 근처 대신 컬러그룹으로 대체 ── */

/* ============================================================
   6. 뷰 · 버튼 · 스타일 저장
   ============================================================ */
document.getElementById('viewTabs').onclick = e=>{
  const b = e.target.closest('.view-tab'); if(!b) return;
  document.querySelectorAll('.view-tab').forEach(t=>t.classList.remove('active'));
  b.classList.add('active'); state.view=b.dataset.view; draw();
};

document.getElementById('resetBtn').onclick = ()=>{
  SECTION_ORDER.forEach(id=> state.sections[id]={...SECTIONS[id].defaults});
  buildControls(); draw();
};

document.getElementById('downloadBtn').onclick = ()=>{
  canvas.toBlob(blob=>{
    if(!blob){ alert('이미지 생성 실패'); return; }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.download = `gyeol-${state.view}-${Date.now()}.png`;
    a.href = url;
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{
      // 샌드박스로 a.click 다운로드가 막힌 경우: 새 탭으로 이미지 열기(우클릭 저장)
      try{ window.open(url, '_blank'); }catch(e){}
      document.body.removeChild(a);
      // URL은 새 탭이 읽을 시간을 준 뒤 해제
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }, 100);
  }, 'image/png');
};

/* 스타일 저장 — 설계 문서 5절: 값 + 기준정보(추후 랜드마크) 저장 */
function loadStyles(){
  try{ return JSON.parse(localStorage.getItem('gyeol_styles')||'{}'); }catch(e){ return {}; }
}
function refreshStyleSelect(){
  const sel=document.getElementById('styleSelect');
  const st=loadStyles();
  sel.innerHTML='<option value="">— 저장된 스타일 불러오기 —</option>';
  Object.keys(st).forEach(name=>{
    const o=document.createElement('option'); o.value=name; o.textContent=name; sel.appendChild(o);
  });
}
document.getElementById('saveStyleBtn').onclick = ()=>{
  const name = prompt('스타일 이름 (예: 내 레이어드 밥)');
  if(!name) return;
  const st=loadStyles();
  st[name] = {
    sections: JSON.parse(JSON.stringify(state.sections)),
    globalColor: state.globalColor,
    // 기준정보 자리 — 실제 앱에선 getFaceMetrics() 결과(턱선길이·두상폭 등)
    reference: { note:'표준두상 기준. 손님 적용 시 비율 환산 예정.' },
    savedAt: Date.now(),
  };
  try{ localStorage.setItem('gyeol_styles', JSON.stringify(st)); }catch(e){ alert('저장 실패'); }
  refreshStyleSelect();
};
document.getElementById('styleSelect').onchange = e=>{
  const name=e.target.value; if(!name) return;
  const st=loadStyles()[name]; if(!st) return;
  state.sections = JSON.parse(JSON.stringify(st.sections));
  state.globalColor = st.globalColor||state.globalColor;
  buildControls(); draw();
};

/* ── 부팅 ── */
buildSectionBar();
buildControls();
refreshStyleSelect();
draw();
</script>
