  accumulateAllViews(accumulate);

  // 실측 있는 밴드는 평균, 없는 밴드는 가장 가까운 실측 밴드값을 승계(최근접
  // 이웃) — computeHeadCrossSections와 동일 원칙(fillBandsWithNearestNeighbor로 공용화).
  fillBandsWithNearestNeighbor(bands, 'frac',
    {sum:'widthRatioSum', weight:'widthRatioWeight', out:'widthRatio'},
    {sum:'depthRatioSum', weight:'depthRatioWeight', out:'depthRatio'});

  // 정직한 최후 폴백: 모든 뷰·모든 밴드에서 실측이 전부 실패하면(바디
  // 세그멘터 로드 실패 등) 비율=1.0(두상과 같은 폭) — "정보가 없으니 커지지도
  // 작아지지도 않는다"는 가장 보수적인 기본값. 그리고 어떤 경우든(실측이든
  // 폴백이든) NECK_RATIO 범위로 clamp해서 오탐이 원반처럼 튀는 것을 막는다.
  bands.forEach(band=>{
    if(typeof band.widthRatio !== 'number') band.widthRatio = 1.0;
    if(typeof band.depthRatio !== 'number') band.depthRatio = 1.0;
    band.widthRatio = clamp(band.widthRatio, NECK_RATIO_MIN, NECK_RATIO_MAX);
    band.depthRatio = clamp(band.depthRatio, NECK_RATIO_MIN, NECK_RATIO_MAX);
  });

  // 2026-07-14 추가: 전역 clamp(0.7~3.0)만으로는 "밴드 5개 중 딱 하나만
  // personMask 오탐(옷 주름·그림자·팔 등)으로 튀는" 경우를 못 막는다 —
  // 그 밴드 혼자 3.0배까지 커져도 통과되기 때문에, 위아래 이웃은 정상인데
  // 중간 한 밴드만 확 넓어지는 "원반(UFO)" 모양이 그대로 재현될 수 있음
  // (실기기 재현 스크린샷으로 확인됨 — anchor 대비 최대 3배는 두상 자체
  // 폭보다도 훨씬 넓어서, 실측이 아닌 한 곳만 튀어도 시각적으로 확 티가 남).
  // 안전한 두상 실측값(frac=0)에서부터 바깥으로 갈수록만 신뢰도가 낮아진다는
  // 원칙에 맞춰, 인접 밴드 사이의 배율 변화폭도 STEP_MAX로 한 번 더 제한해서
  // "이웃과 동떨어진 밴드 하나가 툭 튀어나오는" 형태 자체를 원천 차단한다.
  const NECK_STEP_MAX = 1.35; // 인접 밴드(높이 0.25 간격) 사이 최대 배율 변화
  for(let i=1; i<bands.length; i++){
    const prev = bands[i-1], cur = bands[i];
    cur.widthRatio = clamp(cur.widthRatio, prev.widthRatio/NECK_STEP_MAX, prev.widthRatio*NECK_STEP_MAX);
    cur.depthRatio = clamp(cur.depthRatio, prev.depthRatio/NECK_STEP_MAX, prev.depthRatio*NECK_STEP_MAX);
  }

  bands.forEach(band=>{
    band.halfWidth = anchorHalfWidth * band.widthRatio;
    band.halfDepth = anchorHalfDepth * band.depthRatio;
  });
  // frac=0(두상과 맞물리는 이음매) 밴드는 비율 계산과 무관하게 두상 실측값과
  // 정확히 같게 강제 고정 — Y뿐 아니라 반지름까지 완전히 연속적으로 이어지게.
  bands[0].halfWidth = anchorHalfWidth;
  bands[0].halfDepth = anchorHalfDepth;

  _neckCrossSectionCache = bands;
  return bands;
}

// meshY(월드 Y좌표) → 인접 밴드끼리 선형보간. bands는 frac 0(위, meshY 큼)→
// 1(아래, meshY 작음) 순서라 phi 기준 오름차순이던 interpolateHeadCrossSection과
// 달리 meshY 기준 내림차순으로 순회.
function interpolateNeckCrossSection(meshY){
  return interpolateBands(computeNeckCrossSections(), 'meshY', meshY);
}

/* ── (a) 실측 사진 기반 3D 형태 보정 ──
   기존엔 3D 가닥의 길이/부풀기가 오직 조정화면 슬라이더(length/volume) 값에서만
   나왔음 — 정작 4장이나 찍은 실제 사진의 실루엣(hairMasks.scalpY/hairEndY)은
   avgColor(색상) 말고는 전혀 안 쓰이고 있었음("가닥이 다 랜덤 아니야?" 지적).
   여기서부터는 각 섹션이 실제로 어느 뷰에서 어떤 신뢰도로 촬영됐는지
   (state.viewMapping·getViewPoseConfidence)와 그 뷰의 실측 헤어 실루엣 길이를
   결합해서 "이 섹션은 실제 사진에서 얼마나 뻗어나와 보였는지" 배율(factor)을
   뽑고, 사진 커버리지가 부족한 섹션만 그 부족분(1-confidence)만큼 AI 추정치로
   보완한다. 진짜 포토그래메트리(SfM)는 4장(90°가 아니라 실측 임의각)으로는
   성립 자체가 안 돼서 제외 — 대신 이미 갖고 있던 실측 포즈+실루엣 데이터를
   최대한 활용하는 절충안. */

// 뷰(angle)의 포즈 추정이 얼마나 신뢰할 만한지 0~1로. getViewYawDeg()의 우선순위
// 체인(실측 PnP > 근사 비율 > 슬롯 기본값)과 동일한 기준을 신뢰도 점수로 환산.
// 위 getViewYawDeg가 돌려준 각도를 얼마나 믿을 수 있는지(0~1) — 판정은
// getViewPoseSource가 단독으로 담당하므로 각도와 항상 같은 근거를 본다.
function getViewPoseConfidence(angle){
  const { tier } = getViewPoseSource(angle);
  if(tier === 'pnp') return 1.0;      // 실측 PnP 포즈(가장 정확)
  if(tier === 'approx') return 0.6;   // 포즈 행렬 분해 실패 → 귀 간격 비율 근사
  if(tier === 'live') return 0.5;     // 촬영 직전 라이브 실측 PnP(각도는 실측, 셔터와 시차만 있음)
  return 0.25;                        // 랜드마크 감지 자체 실패 → 촬영 슬롯 기본 각도로 폴백
}

/* ── (3단계) 헤어스타일 기반 의상 추천 AI ──
   비즈니스 로드맵 3번(파일 상단 주석) 착수. 확정된 헤어스타일(색상·길이·
   볼륨 느낌)과 정면 사진을 함께 보내서, OUTFIT_CATALOG(지금은 목업, 나중에
   진짜 제휴 상품 DB로 교체될 자리) 중 가장 잘 어울리는 항목을 고르게 한다.
   analyzeWithClaude()/estimateHairVolumeWithAI()와 동일한 호출 패턴 재사용.
   세션당 1회만 호출(캐싱), 새 고객 시작 시 초기화(startNewCustomer 참고). */
async function recommendOutfitWithAI(){
  if(state.aiOutfitRecommendation) return state.aiOutfitRecommendation;
  const frontImg = state.shots.front;
  if(!frontImg) return null;

  // 버그 수정(2026-07-13): 예전엔 state.selectedStyle이 있어야만 추천했는데,
  // "스타일 미적용"(프리셋 없이 직접 조정) 모드에서는 selectedStyle이 계속
  // null이라 이 함수 자체가 항상 null을 반환 → setupModel3DScreen의 의상
  // 로딩 블록 전체가 스킵되고 3D에 두상만 남는 원인이었음. 프리셋 이름/태그
  // 대신 실제 섹션 값(크라운 길이·엘리베이션)과 실측 헤어 색상으로 설명
  // 텍스트를 대체 구성해서, 스타일을 확정 안 해도 추천이 되게 함.
  const style = state.selectedStyle;
  let styleDesc, colorHex;
  if(style){
    styleDesc = `${style.name} (${style.tags})`;
    colorHex = style.colorHex;
  } else {
    const crown = state.sections.crown;
    styleDesc = `직접 조정한 스타일(크라운 길이 ${crown.length}, 엘리베이션 ${crown.elevation}°)`;
    colorHex = (state.hairMasks.front && state.hairMasks.front.avgColor) || '#2A1B12';
  }
  // 렌더가 FORCED_HAIR_COLOR로 강제되는 동안엔 추천 프롬프트에 보내는
  // 헤어컬러도 같은 값이어야 함 — 안 그러면 화면은 검정인데 AI는 실측
  // 갈색 기준으로 의상을 골라 색 조합 추천이 어긋남.
  if(FORCED_HAIR_COLOR) colorHex = FORCED_HAIR_COLOR;

  const catalogList = OUTFIT_CATALOG.map(o=>`- ${o.id}: ${o.name} (${o.category}, 태그: ${o.tags.join('/')})`).join('\n');
  const base64 = frontImg.split(',')[1];
  const mediaType = frontImg.startsWith('data:image/png') ? 'image/png' : 'image/jpeg';
  const prompt = `미용실 고객 정면 사진과 확정된 헤어스타일 정보입니다.
헤어스타일: ${styleDesc}, 헤어컬러: ${colorHex}
아래 의상 목록 중 이 헤어스타일·이미지와 가장 잘 어울리는 것 하나를 고르세요.
{"outfitId":"목록의 id 중 하나","reason":"한국어 1문장 추천 이유"}
JSON만 응답하세요, 다른 텍스트 없이.
의상 목록:
${catalogList}`;

  try{
    const parsed = await callClaudeJSON({ base64, mediaType, prompt, maxTokens:200 });
    const item = OUTFIT_CATALOG.find(o=>o.id===parsed.outfitId) || OUTFIT_CATALOG[0];
    const result = { item, reason: parsed.reason || '' };
    state.aiOutfitRecommendation = result;
    return result;
  }catch(e){
    console.warn('의상 추천 AI 실패(기본 항목으로 대체):', e);
    const result = { item: OUTFIT_CATALOG[0], reason: '' };
    state.aiOutfitRecommendation = result;
    return result;
  }
}

/* ── 의상 3D 부착 — 지금은 절차적 플레이스홀더, 나중에 제휴사 3D 에셋으로 교체 ──
   ※ neckAttachPoint 연결 규격(외부 에셋 제작/연동 시 이 기준을 따르면 됨):
   - 좌표계: 두상과 동일한 로컬 원점(headGroup 기준), Y-up · Z-forward(+Z가
     캐릭터 정면) · X-right. 두상 자체와 완전히 같은 좌표계라 별도 변환 불필요.
   - 목(neckAttachPoint) 치수(2026-07-14, buildRealNeckMesh로 교체 — 예전엔
     고정 반지름 원통이었으나 이제 그 사람 실측 단면 기반 비원형 형태):
     y범위는 그대로 위쪽=두상 최하단(HEAD_PHI_BANDS 최댓값의 cos, 대략
     y≈-0.55) → 아래쪽 y=-1.15(고정, 불변식) 이지만, 각 높이의 반지름이
     원형이 아니라 halfWidth(X, 좌우폭)≠halfDepth(Z, 앞뒤깊이)인 타원형
     단면이고 그 값 자체가 사람마다 다름(computeNeckCrossSections 참고,
     실측 실패 시 예전 0.42~0.5*widthFactor 원형으로 폴백). 외부 의상
     에셋을 딱 맞춰 정렬하려면 고정 상수 대신 이 함수를 호출해서 실측값을
     읽어야 함 — 대략적 정렬만 필요하면 예전처럼 y=-0.55에서
     0.42*widthFactor 근방으로 잡아도 크게 어긋나진 않음(실측값이 이 근방
     상수를 기준으로 그 사람 비율만큼 조정된 값이라서).
   - 스케일: widthFactor/heightFactor(getFaceMetrics() 참고)는 그 사람 실측
     비율이라, 외부 에셋도 이 값을 곱해서 스케일하면 두상 크기와 비례가 맞음
     (buildOutfitPlaceholderMesh가 실제로 이렇게 함 — 참고용 구현 예시).
   - 원점 기준 y=-1.15 아래로 어깨/몸통이 이어진다고 가정.
   지금은 OUTFIT_MESH_SOURCE.type이 'gltf'인 경우를 대비한 분기만 준비해두고
   실제 로더는 미구현(HEAD_MESH_SOURCE와 동일한 진행 방식) — 진짜 파일 생기면
   loadHeadMeshFromGLTF()를 참고해서 채우면 됨. */
function buildOutfitPlaceholderMesh(item, widthFactor){
  const group = new THREE.Group();
  group.name = 'outfitPlaceholder'; // 이름은 유지하지만 이제 상반신뿐 아니라 전신(골반·다리·발)까지 포함
  const color = new THREE.Color(item.colorHex || '#888888');
  const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.75 });
  const pantsColor = color.clone().multiplyScalar(0.55); // 상의보다 어두운 톤 = 하의(바지) 자리표시자
  const pantsMat = new THREE.MeshStandardMaterial({ color: pantsColor, roughness: 0.75 });
  const shoeMat = new THREE.MeshStandardMaterial({ color: new THREE.Color('#241E1A'), roughness: 0.6 }); // 신발은 색과 무관하게 어두운 톤 고정

  // 어깨~가슴 상단부를 대충 근사하는 원뿔대(목에서 어깨로 벌어지는 형태).
  const torsoTopR = 0.50*widthFactor, torsoBotR = 0.92*widthFactor, torsoH = 1.15;
  const torsoGeo = new THREE.CylinderGeometry(torsoTopR, torsoBotR, torsoH, 24);
  const torso = new THREE.Mesh(torsoGeo, mat);
  const torsoTopY = -1.15, torsoBotY = torsoTopY - torsoH; // -2.30
  torso.position.y = (torsoTopY + torsoBotY) / 2;
  torso.name = 'outfitTorsoPlaceholder';
  group.add(torso);

  // 옷깃: 목 밑동(y=-1.15)에 딱 맞는 얇은 링. 몸통보다 살짝 어둡게 해서
  // "여기가 목선이다"를 시각적으로 구분해줌 — 원뿔 하나뿐이던 것보다 훨씬
  // 옷처럼 보이게 하는 최소한의 디테일.
  const collarMat = new THREE.MeshStandardMaterial({ color: color.clone().multiplyScalar(0.75), roughness: 0.8 });
  const collarGeo = new THREE.TorusGeometry(torsoTopR*1.03, 0.035*widthFactor, 8, 20);
  const collar = new THREE.Mesh(collarGeo, collarMat);
  collar.position.y = torsoTopY;
  collar.rotation.x = Math.PI/2; // 눕혀서 목 둘레를 감싸는 링 형태로
  collar.name = 'outfitCollarPlaceholder';
  group.add(collar);

  // ── 골반: 몸통 하단에서 허벅지로 이어지는 완충 구간 ──
  const hipTopR = torsoBotR, hipBotR = 0.72*widthFactor, hipH = 0.45;
  const hipGeo = new THREE.CylinderGeometry(hipTopR, hipBotR, hipH, 20);
  const hip = new THREE.Mesh(hipGeo, pantsMat);
  const hipTopY = torsoBotY, hipBotY = hipTopY - hipH; // 골반 하단 = 다리 시작점
  hip.position.y = (hipTopY + hipBotY) / 2;
  hip.name = 'outfitHipPlaceholder';
  group.add(hip);

  // ── 다리 2개: 골반 하단에서 발까지 ──
  const legTopR = 0.30*widthFactor, legBotR = 0.19*widthFactor, legH = 2.35;
  const legGeo = new THREE.CylinderGeometry(legTopR, legBotR, legH, 16);
  const legXOffset = 0.32*widthFactor;
  const legBotY = hipBotY - legH;
  [-1, 1].forEach(side=>{
    const leg = new THREE.Mesh(legGeo, pantsMat);
    leg.position.set(side*legXOffset, (hipBotY + legBotY)/2, 0);
    leg.name = 'outfitLegPlaceholder';
    group.add(leg);
  });

  // ── 발 2개: 다리 하단에서 앞(+Z)으로 살짝 뻗은 형태 ──
  const footW = 0.24*widthFactor, footH = 0.16, footD = 0.46*widthFactor;
  const footGeo = new THREE.BoxGeometry(footW, footH, footD);
  [-1, 1].forEach(side=>{
    const foot = new THREE.Mesh(footGeo, shoeMat);
    foot.position.set(side*legXOffset, legBotY - footH/2, footD*0.28); // 발끝이 앞으로 나오도록 z 오프셋
    foot.name = 'outfitFootPlaceholder';
    group.add(foot);
  });

  // ── 팔 2개: 어깨에서 대략 허벅지 중간 높이까지(안정된 직립 자세 근사) ──
  // 이전엔 짧은 소매(0.85)로 상반신에서 끝났음 — 전신상 요청으로 실제
  // 팔 길이만큼 늘리고, 각도도 옆으로 60° 벌어진 소매가 아니라 몸통을 따라
  // 거의 수직으로 내려오되 살짝 바깥으로 벌어지는(자연스러운 직립 자세)
  // 방향으로 변경.
  const shoulderY = -1.35; // 목 밑동보다 살짝 아래(어깨선 근사)
  const shoulderFrac = (shoulderY - torsoTopY) / (-torsoH); // 원뿔대 상단 기준 진행률(0=상단, 1=하단)
  const shoulderR = torsoTopR + shoulderFrac * (torsoBotR - torsoTopR);
  const armLen = 2.6, armTopR = 0.15*widthFactor, armBotR = 0.10*widthFactor;
  const armGeo = new THREE.CylinderGeometry(armTopR, armBotR, armLen, 12);
  [-1, 1].forEach(side=>{
    const arm = new THREE.Mesh(armGeo, mat);
    // 거의 수직 아래(-Y)로 내려오되 살짝 바깥으로 벌어지는 방향 —
    // Rz(dirAngle)·(0,1,0) = (-sin(dirAngle), cos(dirAngle), 0)이 되도록
    // 목표 방향(옆으로 살짝, 대부분 아래)에 맞는 각도를 역산해서 사용.
    const dirAngle = -side * 2.900; // 라디안 — 목표 방향 벡터(±0.24, -0.97, 0)에 대응
    const dir = new THREE.Vector3(-Math.sin(dirAngle), Math.cos(dirAngle), 0);
    const shoulderPos = new THREE.Vector3(side*shoulderR*0.92, shoulderY, 0.02);
    arm.position.set(
      shoulderPos.x + dir.x*armLen*0.5,
      shoulderPos.y + dir.y*armLen*0.5,
      shoulderPos.z + dir.z*armLen*0.5,
    );
    arm.rotation.z = dirAngle;
    arm.name = 'outfitArmPlaceholder';
    group.add(arm);
  });

  // 포멀 카테고리는 옷깃 아래로 앞트임(라펠) 느낌의 판 2개를 V자로 추가 —
  // 재킷 실루엣을 아주 단순하게나마 구분되게(캐주얼/스트릿과 같은 원뿔로
  // 뭉뚱그려지지 않도록).
  if(item.category === '포멀'){
    const lapelMat = new THREE.MeshStandardMaterial({ color: color.clone().multiplyScalar(0.85), roughness: 0.7 });
    const lapelGeo = new THREE.BoxGeometry(0.16*widthFactor, 0.55, 0.02);
    [-1, 1].forEach(side=>{
      const lapel = new THREE.Mesh(lapelGeo, lapelMat);
      lapel.position.set(side*0.14*widthFactor, -1.45, torsoTopR*0.85);
      lapel.rotation.z = -side*0.28;
      lapel.name = 'outfitLapelPlaceholder';
      group.add(lapel);
    });
  }

  return group;
}

// 실제 .obj(+.mtl) 의상/전신 에셋 로더. Quaternius 등에서 받은 파일을
// OUTFIT_MESH_SOURCE.objUrl(+mtlUrl)에 넣으면 절차적 플레이스홀더 대신
// 진짜 3D가 붙는다. 에셋마다 원래 스케일·피벗이 제각각이라, bounding box를
// 재서 자동으로 (a) neckAttachPoint 하단(y=-1.15)에 상단이 맞닿도록,
// (b) 전신 높이가 지금 절차적 플레이스홀더와 비슷한 범위(약 4유닛)가
// 되도록 스케일·위치를 맞춘다 — 에셋마다 정확도가 다를 수 있어
// OUTFIT_MESH_SOURCE.offsetY/scaleOverride로 수동 보정 가능하게 열어둠.
// neckCutFrac은 호출 쪽(OUTFIT_CATALOG[i].asset.neckCutFrac)에서 에셋별
// 실측값을 넘겨받음 — 전부 같은 베이스 바디라 비슷하지만 에셋마다 다름.
// ※ THREE.OBJLoader/Box3는 브라우저 전용 API라 Canvas류와 마찬가지로 이
// 함수 자체는 Node 샌드박스에서 실행 검증 불가 — 문법 검사만 통과.
function loadOutfitMeshFromOBJ(objUrl, mtlUrl, widthFactor, neckCutFrac){
  return new Promise((resolve, reject)=>{
    if(typeof THREE.OBJLoader !== 'function'){
      reject(new Error('OBJLoader 스크립트가 로드되지 않았습니다'));
      return;
    }
    function loadObj(materials){
      const objLoader = new THREE.OBJLoader();
      if(materials) objLoader.setMaterials(materials);
      objLoader.load(objUrl, (obj)=>{
        try{
          const box = new THREE.Box3().setFromObject(obj);
          const size = new THREE.Vector3(); box.getSize(size);

          // 에셋 자체 높이(발~정수리) 대비 "목 밑동" 위치 비율로, 그 위쪽(에셋 자체
          // 머리/목/헤어)은 스케일 계산에서도 제외하고 나중에 클리핑으로도 잘라냄 —
          // 우리 두상(실측 사진 기반 얼굴+헤어)만 보이게 하기 위함.
          const cutFrac = (typeof neckCutFrac === 'number') ? neckCutFrac : 0.84;
          const neckCutYRaw = box.min.y + cutFrac * size.y;
          const bodyHeightRaw = neckCutYRaw - box.min.y; // 발~목까지만(머리 제외) 실측 높이

          const TARGET_HEIGHT = 4.0; // 목 밑동~발끝까지 대략 이 정도(절차적 플레이스홀더 기준)
          const scale = OUTFIT_MESH_SOURCE.scaleOverride || (TARGET_HEIGHT / (bodyHeightRaw || 1)) * widthFactor;
          obj.scale.setScalar(scale);

          // 스케일 적용 후 좌표 기준으로 재계산해서 위치 정렬(중심을 x/z=0으로,
          // 목 밑동 지점이 neckAttachPoint 하단 y=-1.15에 오도록)
          const box2 = new THREE.Box3().setFromObject(obj);
          const center2 = new THREE.Vector3(); box2.getCenter(center2);
          const neckCutYScaled = neckCutYRaw * scale;
          const offsetY = OUTFIT_MESH_SOURCE.offsetY || 0;
          obj.position.x += -center2.x;
          obj.position.z += -center2.z;
          obj.position.y += (-1.15 - neckCutYScaled) + offsetY;
          obj.name = 'outfitLoadedOBJ';

          // 에셋 자체 "Hair" 재질은 완전히 숨김(우리 자체 헤어 시스템을 쓰므로).
          // 나머지 재질(Skin/Eyes/Shirt/Pants/Socks 등)에는 위치 정렬 후의
          // 월드 좌표 기준 y=-1.15 클리핑 플레인을 적용해서, 정렬이 살짝 어긋나도
          // 그 위쪽(에셋 자체 머리/목)은 어차피 안 보이게 하는 안전장치로 사용.
          // + 감마 보정: Blender OBJ export는 Kd를 리니어 색공간으로 쓰는데
          // 렌더러가 그대로 표시하면 실제보다 어둡게 나옴(카탈로그 colorHex는
          // 이미 보정된 "진짜 보일 색"으로 계산해둠) — 여기서 실제 로드된
          // material.color에도 동일한 보정을 적용해야 카탈로그 색상과 실제
          // 렌더링이 일치함. THREE.Color.convertLinearToSRGB()가 정확히 이 변환.
          const HIDE_MATERIAL_NAMES = ['hair'];
          const neckClipPlane = new THREE.Plane(new THREE.Vector3(0,-1,0), -1.15);
          obj.traverse(child=>{
            if(!child.isMesh) return;
            const matName = (child.material && child.material.name || '').toLowerCase();
            if(HIDE_MATERIAL_NAMES.includes(matName)){ child.visible = false; return; }
            const mats = Array.isArray(child.material) ? child.material : [child.material];
            mats.forEach(m=>{
              if(!m) return;
              m.clippingPlanes = [neckClipPlane];
              m.clipShadows = true;
              if(m.color && typeof m.color.convertLinearToSRGB === 'function') m.color.convertLinearToSRGB();
            });
          });

          resolve(obj);
        }catch(e){ reject(e); }
      }, undefined, (err)=>reject(err));
    }
    if(mtlUrl && typeof THREE.MTLLoader === 'function'){
      const mtlLoader = new THREE.MTLLoader();
      mtlLoader.load(mtlUrl, (materials)=>{
        materials.preload();
        loadObj(materials);
      }, undefined, ()=>loadObj(null)); // mtl 로드 실패해도 obj는 시도(무채색으로)
    } else {
      loadObj(null);
    }
  });
}

// 이제 실제 에셋 정보는 OUTFIT_CATALOG[i].asset(id별로 다른 obj/mtl/neckCutFrac)에
// 있음 — item에 asset이 있으면 그걸로 로드, 없으면(아직 실제 에셋 없는 카탈로그
// 항목) 절차적 플레이스홀더로 폴백. 로드 실패(파일 404 등)해도 동일하게 폴백.
async function loadOutfitMesh(item, widthFactor){
  if(item.asset && item.asset.objUrl){
    try{
      return await loadOutfitMeshFromOBJ(item.asset.objUrl, item.asset.mtlUrl, widthFactor, item.asset.neckCutFrac);
    }catch(e){
      console.warn('OBJ 의상 에셋 로드 실패, 절차적 플레이스홀더로 폴백:', e);
    }
  }
  return buildOutfitPlaceholderMesh(item, widthFactor);
}

/* ── 뿌리 위치·길이·결방향을 진짜로 3D에 반영 ──
   지적: "computeSectionRealExtent가 만드는 건 섹션 전체에 곱하는 배율 하나뿐이고,
   뿌리가 어디 심기는지(phi/theta)·어느 방향으로 흐르는지(결방향)는 여전히 랜덤
   아니냐" — 정확한 지적. state.hairMasks[angle].orientation(실측 결방향 필드,
   2D에서 이미 쓰고 있는 그 데이터)이 3D 쪽에서는 한 번도 안 읽히고 있었음.
   여기서부터 실제로 연결한다.
   좌우 대칭(temple/side)은 어느 실측 뷰가 물리적으로 어느 쪽(왼/오)에
   대응하는지 좌표계 관례가 코드 어디에도 확정돼 있지 않아서, 잘못 매핑하면
   "왼쪽 결이 오른쪽에 심긴다" 같은 검증하기 어려운 좌우反전 버그가 생길 위험이
   있음. 그래서:
   - phi(위아래 뿌리 위치)·길이비율·결 강도(방향의 크기, 부호 아님)는 모든
     섹션에 안전하게 적용(좌우 모호성이 없는 값들).
   - theta(좌우 뿌리 위치)의 "실측 위치 매핑"은 중심이 하나뿐인 섹션(front/
     occipital/nape)에만 적용 — 그 사진 한 장 안에서 좌/우가 자체적으로
     일관되므로 좌우反전 위험이 없음. temple/side(거울대칭 2중심)는 기존처럼
     무작위 배치를 유지하되, 실측 길이·결 강도는 그대로 반영. */

/* ── 진짜 2D→3D 투영: outputFacialTransformationMatrixes를 실제로 활용 ──
   지적: "makeFaceProjector 말고, 랜드마크 연결할 때 쓰던 AR용 진짜 캘리브레이션
   행렬(outputFacialTransformationMatrixes)이 있었잖아, 그건 왜 안 써?" — 정확한
   지적. 이 매트릭스는 MediaPipe가 "캐노니컬 얼굴을 실제 감지된 얼굴 위치/각도에
   맞춰 정렬하는" 진짜 AR 캘리브레이션 결과인데, decomposePoseMatrix()가 여기서
   yaw/pitch/roll "각도 3개"만 뽑고 나머지(그 각도로 실제 회전을 재구성하는 데
   필요한 나머지 정보)는 버리고 있었음. 심지어 파일 상단 개발 로그에 "이 방향
   재활용 가능"이라고 이미 적어뒀던 걸 놓쳤음.
   여기서부터: 저장된 yaw/pitch/roll(비손실 분해값, 실측 행렬과 100% 동일한
   회전 정보)로 회전행렬을 다시 조립해서, 사진 픽셀 하나하나를 실제 두상 표면
   3D 좌표로 진짜 투영한다 — "시작점·끝점 좌표를 그대로 찍어서 쓴다"는 원래
   말씀하신 방식. */

// decomposePoseMatrix가 어떤 합성순서를 가정한 건지 몰라서(그 함수엔 각도를
// 다시 행렬로 되돌리는 대응 함수가 없었음), Node로 300개 랜덤 각도 왕복
// 테스트를 돌려 정확히 일치하는 합성순서를 수치로 찾아냄: R = Rz(roll)·Ry(yaw)·Rx(pitch)
// (row-major 3x3, 왕복 오차 0.000000 확인됨).
function composeRotationZYX(yawRad, pitchRad, rollRad){
  const cy=Math.cos(yawRad), sy=Math.sin(yawRad);
  const cx=Math.cos(pitchRad), sx=Math.sin(pitchRad);
  const cz=Math.cos(rollRad), sz=Math.sin(rollRad);
  function matMul(a,b){ const r=new Array(9); for(let i=0;i<3;i++)for(let j=0;j<3;j++){ let s=0; for(let k=0;k<3;k++) s+=a[i*3+k]*b[k*3+j]; r[i*3+j]=s; } return r; }
  const Rz=[cz,-sz,0, sz,cz,0, 0,0,1];
  const Ry=[cy,0,sy, 0,1,0, -sy,0,cy];
  const Rx=[1,0,0, 0,cx,-sx, 0,sx,cx];
  return matMul(matMul(Rz,Ry),Rx);
}
// 전치(=직교행렬의 역) 적용 — "카메라 공간 → 두상 공간" 방향 변환용.
// MediaPipe 포즈 행렬은 "두상(캐노니컬) → 카메라" 방향이므로, 사진에서 읽은
// 카메라 공간 좌표를 두상 공간으로 가져오려면 역회전을 써야 함(아래
// projectImagePointToHead의 2026-07-14 방향 버그 수정 참고).
function applyRotationTranspose3(mat9, v){
  return new THREE.Vector3(
    mat9[0]*v.x + mat9[3]*v.y + mat9[6]*v.z,
    mat9[1]*v.x + mat9[4]*v.y + mat9[7]*v.z,
    mat9[2]*v.x + mat9[5]*v.y + mat9[8]*v.z,
  );
}

// ── 후면(랜드마크 없는 뷰) 실루엣 앵커 (2026-07-14, 사용자 설계) ──
// "후면 사진 앵커 귀와 정수리 등으로 잡아" — 얼굴 랜드마크가 없는 사진의
// 투영 기준점을 지어낸 고정값(getEstimatedLandmarks) 대신 그 사진에 실제로
// 있는 것에서 실측:
//   가로 축척 = 귀 높이의 실루엣 폭(뒤에서도 귀는 실루엣 양옆으로 보임 —
//     정수리에서 아래로 내려가며 폭을 재다가, 어깨(폭 급증) 전 구간에서
//     가장 넓은 행 = 귀 높이/귀 간격)
//   세로 기준(눈/턱 높이) = 같은 사람 정면 사진에서 실측한 "정수리→눈/턱
//     거리 ÷ 귀높이 실루엣 폭" 비율을 후면 실루엣에 적용(같은 사람이니
//     비율은 동일 — 지어낸 상수 없이 전부 그 사람 실측).
// 정면 쪽 폭도 랜드마크 귀 간격이 아니라 같은 정의(실루엣 폭@귀높이)로
// 재서 앞/뒤 측정 정의를 일치시킴(헤어가 부풀어도 양쪽이 같이 부풀어
// 비율이 유지되도록). 포즈는 poseYawDeg를 넣지 않아 기존 폴백(촬영 슬롯
// 기본각 — back이면 180°)을 그대로 따름.
let _silhouetteAnchorCache = {};
function computeSilhouetteAnchors(angle){
  if(_silhouetteAnchorCache[angle] !== undefined) return _silhouetteAnchorCache[angle];
  let result = null;
  try{
    const maskInf = state.hairMasks && state.hairMasks[angle];
    const frontLm = state.landmarks && state.landmarks.front;
    const frontInf = state.hairMasks && state.hairMasks.front;
    if(maskInf && maskInf.personMask && frontLm && frontInf && frontInf.personMask && frontInf.scalpY){
      // 공용: 특정 마스크에서 "중앙 1/3 구간 최상단(5퍼센타일)"과 "행별 실루엣 폭"
      const topOf = (mask, mw, mh)=>{
        const tops = [];
        for(let x=Math.floor(mw/3); x<Math.floor(mw*2/3); x++){
          for(let y=0; y<mh; y++){ if(mask[y*mw+x]){ tops.push(y); break; } }
        }
        if(tops.length < 10) return -1;
        tops.sort((a,b)=>a-b);
        return tops[Math.floor(tops.length*0.05)];
      };
      const rowSpanOf = (mask, mw, y)=>{
        let l=-1, r=-1;
        for(let x=0;x<mw;x++){ if(mask[y*mw+x]){ l=x; break; } }
        for(let x=mw-1;x>=0;x--){ if(mask[y*mw+x]){ r=x; break; } }
        return (l>=0 && r>=l) ? { l, r, w: r-l+1 } : null;
      };
      // "정수리부터 내려가며 어깨(폭 급증) 전 최대 폭 행" = 귀 높이
      const earRowOf = (mask, mw, mh, topRow)=>{
        let earRow=-1, earL=0, earR=0, best=0;
        const widths = [];
        for(let y=topRow; y<mh; y++){
          const rw = rowSpanOf(mask, mw, y); if(!rw) continue;
          widths.push(rw.w);
          if(widths.length > 8){
            const med = widths.slice().sort((a,b)=>a-b)[Math.floor(widths.length/2)];
            if(rw.w > med*1.6) break; // 어깨 시작 — 머리 구간 종료
          }
          if(rw.w > best){ best=rw.w; earRow=y; earL=rw.l; earR=rw.r; }
        }
        return earRow > topRow ? { earRow, earL, earR, span: earR-earL } : null;
      };

      const mw = maskInf.maskW, mh = maskInf.maskH;
      const fw = frontInf.maskW, fh = frontInf.maskH;
      const topB = topOf(maskInf.personMask, mw, mh);
      const topF = topOf(frontInf.personMask, fw, fh);
      const earB = topB >= 0 ? earRowOf(maskInf.personMask, mw, mh, topB) : null;
      const earF = topF >= 0 ? earRowOf(frontInf.personMask, fw, fh, topF) : null;
      if(earB && earF && earB.span > 4 && earF.span > 4){
        // 정면 실측 비율(마스크 픽셀 단위 — 프레이밍 무관): 정수리→눈/턱 거리 ÷ 귀높이 폭
        const rEye  = (frontLm.eyeY*fh  - topF) / earF.span;
        const rChin = (frontLm.chinY*fh - topF) / earF.span;
        const eyeY  = (topB + rEye  * earB.span) / mh;
        const chinY = (topB + rChin * earB.span) / mh;
        result = {
          eyeY, chinY,
          browTopY: Math.max(0, eyeY - (frontLm.eyeY - frontLm.browTopY)), // 정면 실측 간격 재사용
          earY: earB.earRow / mh,
          foreheadY: Math.max(0, eyeY - (frontLm.eyeY - frontLm.foreheadY)),
          lEarX: earB.earL / mw, rEarX: earB.earR / mw,
          _silhouette: true, // [진단용] 실루엣 앵커로 만들어진 것 표시
        };
      }
    }
  }catch(e){ console.warn('실루엣 앵커 계산 실패:', angle, e); }
  _silhouetteAnchorCache[angle] = result;
  return result;
}

// 사진 한 장의 정규화 좌표(nx,ny 0~1)를 실제 두상 표면 3D 좌표로 투영.
// 1) makeFaceProjector로 "그 뷰가 정면을 보고 있다고 가정했을 때"의 로컬
//    평면 좌표(localX,localY)를 구함(뷰마다 자기 랜드마크 기준이라 재사용 가능).
// 2) 로컬 좌표가 두상 타원면 위에 있다고 보고 localZ를 방정식으로 풀어냄
//    (카메라를 향한 쪽 = +Z해를 선택).
// 3) 그 뷰의 실측 회전(yaw/pitch/roll, PnP 결과)을 로컬 좌표에 실제로 적용해서
//    월드(두상 전체 기준) 좌표로 회전 — 이 부분이 기존엔 없었음(yaw 각도를
//    "어느 섹션이 이 뷰에 가까운가" 가중치 계산에만 쓰고, 실제 좌표 회전에는
//    한 번도 안 썼음). 왼쪽/오른쪽 사진이 실측으로 서로 다른 부호의 회전을
//    갖게 되므로, 예전에 걱정했던 "좌우反전 위험"이 추측이 아니라 실측값으로
//    해소됨.
// (2026-07-16) opts 추가 — "2D 헤어·두피 좌표 그대로 옮기기"용:
//   opts.hangZ    : 점이 두피 타원 밖(머리 실루엣 아래로 늘어진 구간)이어도
//                   버리지 않고, 넘겨준 카메라공간 깊이(z)로 그대로 배치.
//                   호출부(buildHairStrandsFromPaths)가 "이 가닥에서 마지막으로
//                   두피면 위에 있었던 점의 깊이"를 넘겨서, 늘어진 머리가
//                   두피에서 떨어지는 지점의 깊이를 유지한 채 이미지 그대로의
//                   모양으로 내려가게 함(예전엔 이 구간이 전부 null로 잘려서
//                   경로가 끊기고, 나머지는 타원면을 따라 감겨 우산/버섯 모양이 됐음).
//   opts.clampRim : 타원 살짝 밖(실루엣 가장자리 컬럼의 뿌리)을 z=0(림 평면)에
//                   붙임 — 가장자리 뿌리가 통째로 버려지지 않게.
//   opts.usedZ    : (출력) 이번 점에 실제 사용된 카메라공간 z — 호출부가
//                   다음 점의 hangZ로 이어받음.
// opts 없이 부르면 기존 동작과 완전히 동일(다른 호출부 영향 없음).
function projectImagePointToHead(angle, nx, ny, widthFactor, heightFactor, opts){
  // (2026-07-14, 후면 실루엣 앵커) 실측 랜드마크가 없으면 지어낸 고정값
  // (getEstimatedLandmarks) 전에 실루엣 실측 앵커(귀+정수리, 아래 함수)를
  // 먼저 시도 — 사용자 설계: "후면 사진 앵커 귀와 정수리 등으로 잡아".
  const lm = (state.landmarks && state.landmarks[angle]) || computeSilhouetteAnchors(angle) || getEstimatedLandmarks(angle);
  if(!lm) return null;
  const wf = widthFactor || 1, hf = heightFactor || 1;
  const proj = makeFaceProjector(lm, wf, hf);
  const localX = proj.toMeshX(nx);
  const localY = proj.toMeshY(ny);

  // 버그 수정(2026-07-14, 계속): 실기기에서 "정면/측면 헤어가 두상 밖으로
  // 튀어나와 보인다" 피드백 — buildRealFaceMesh에서 고쳤던 것과 정확히
  // 같은 원인이었음. 여기(헤어 실측 투영)는 여전히 고정 타원 상수(a=0.78wf,
  // c=0.85wf)로 Z를 풀고 있었는데, 실제로 화면에 그려지는 두상(buildHeadMesh)
  // 은 이미 "★★ 타원체 완전 제거" 항목에서 이 사람 실측 단면 기반 메쉬로
  // 바뀐 지 오래라 — 그 실측 폭/깊이가 고정 0.78/0.85보다 좁으면, 이 함수가
  // 계산한 헤어 뿌리·끝점이 실제 두상 표면보다 바깥에 놓여 "머리가 두상보다
  // 붕 떠서 튀어나온" 것처럼 보임. 위 얼굴 메쉬 수정 때 남겨둔 "다음 단계
  // 후보"(두상 표시와 헤어/얼굴 위치 계산의 두상 모양 기준이 서로 다르다)가
  // 바로 이거였음 — 이번에 같은 방식으로 통일.
  // 수정: 고정 상수 대신 buildHeadMesh와 동일한 데이터 출처(이 사람의 실측
  // 적도=눈높이 단면, interpolateHeadCrossSection(π/2))로 a/c를 계산 — 얼굴
  // 메쉬에 적용한 것과 동일한 보정.
  // (2026-07-14) 세로축 b: 1×hf(임의) → 실측 세로 반지름 — 헤어 뿌리를 놓는
  // 이 면이 두상 돔(두피면)과 정의상 같은 면이 되도록 정렬. 뿌리의 높이는
  // 사진 픽셀(toMeshY)에서 오므로 이 변경으로 헤어 높이가 움직이진 않고,
  // 정수리 근처 뿌리가 두피 표면에 정확히 붙게 되는 것만 달라짐.
  const { a, b, c } = getHeadEllipsoid(); // 두상 타원 반경(x,y,z)
  const yLocal = localY - 0.15; // 타원 중심(0,0.15,0) 기준으로 이동
  const inside = (localX/a)*(localX/a) + (yLocal/b)*(yLocal/b);
  let localZ;
  if(inside <= 0.98){
    localZ = c * Math.sqrt(Math.max(0, 1 - inside)); // 두피면 위: 카메라를 향한 쪽(+Z) 해 — 이 점의 "두피 3D 좌표"
  } else if(opts && typeof opts.hangZ === 'number'){
    localZ = opts.hangZ; // 두피면 밖(늘어진 구간): 마지막 두피 깊이를 유지한 채 이미지 좌표 그대로 배치
  } else if(opts && opts.clampRim && inside <= 1.2){
    localZ = 0; // 실루엣 가장자리 뿌리: 림 평면에 붙임
  } else {
    return null; // 타원 밖(귀/윤곽 밖 극단치) — 이 픽셀은 투영 포기 (기존 동작)
  }
  if(opts) opts.usedZ = localZ;

  const yawRad   = (lm.poseYawDeg   ?? getViewYawDeg(angle)) * Math.PI/180;
  const pitchRad = (lm.posePitchDeg ?? 0) * Math.PI/180;
  const rollRad  = (lm.poseRollDeg  ?? 0) * Math.PI/180;
  const rot = composeRotationZYX(yawRad, pitchRad, rollRad);

  // ── 회전 방향 버그 수정(2026-07-14, "우산처럼 벌어진 헤어"의 원인) ──
  // 기존엔 applyRotation3(rot, …) 즉 포즈 행렬 R을 정방향으로 적용했는데,
  // R은 "두상(캐노니컬) 공간 → 카메라 공간" 방향이고 localX/yLocal/localZ는
  // 사진에서 읽은 "카메라 공간" 좌표라, 두상 공간으로 가려면 역회전(R^T)이
  // 맞음. yaw만 클 땐 티가 덜 났지만 pitch/roll이 섞이면(폰을 살짝 내려/
  // 기울여 찍는 자연스러운 자세) 뷰마다 반대 방향으로 뿌리가 벌어져 정수리
  // 위에 우산처럼 퍼지는 모양이 됨 — 실기기 스크린샷과 일치.
  // 검증(합성 실험, verify_rotation_direction.js): 정답을 아는 합성 두상을
  // 실측 포즈(정면 -2.8/-7.6/-1.2, 좌 50.7/-18.5/-18.6, 우 -57.8/-19.2/26.3)로
  // 촬영→복원했을 때 측면 뷰에서 역회전이 5~6배 정확했고, 포즈 그리드
  // 스윕(yaw ±60, pitch -25~0, roll ±25, 2293점)에서도 평균 오차
  // 0.42→0.19(최악 1.13→0.55)로 역회전이 최선(yaw만 적용하는 변형들보다도
  // 나음). 잔여 오차 ~0.19는 회전이 아니라 프로젝터의 앵커(귀 간격 등)
  // 보정 한계에서 옴 — 별도 항목.
  const rotated = applyRotationTranspose3(rot, new THREE.Vector3(localX, yLocal, localZ));
  rotated.y += 0.15; // 중심 오프셋 복원
  return rotated;
}

// ── [진단용] 가닥 뿌리 기준면(가상 타원체) 시각화 (2026-07-14 추가) ──
// 사용자 아이디어: "헤어들이 만나서 가상의 타원 하나가 생겨야 되잖아? 그
// 가상의 타원을 3D 이미지에 그려 넣으면 어느 쪽이 문제인지 알 수 있지 않을까"
// — 실기기에서 두상(안면 메쉬)은 제자리인데 헤어 가닥들만 떠 있는 문제의
// 원인 분리용. 가닥 뿌리는 두 경로로 배치됨:
//   (1) 실측 투영 경로: projectImagePointToHead(위)가 푸는 가상 타원체
//       (a=적도 실측 halfWidth, b=1×heightFactor, c=적도 실측 halfDepth,
//       중심 y=0.15) 표면 — 이 함수가 그리는 것이 바로 이 타원체.
//   (2) 합성 폴백 경로: scalpPointToWorld(phi별 실측 단면) — 이건 두상
//       메쉬(buildHeadMesh)와 같은 면이라 두상 자체가 기준면 역할을 함.
// 따라서 이 타원체(하늘색 와이어프레임)를 그렸을 때:
//   - 타원체가 두상과 잘 겹치는데 가닥만 떠 있다 → 투영 계산(포즈 회전/
//     랜드마크 프로젝터) 쪽 문제
//   - 타원체 자체가 두상과 어긋나 있다 → 타원체 모델(a/b/c/중심) 자체가
//     두상 메쉬와 안 맞는 것 (예: b=1×heightFactor는 위아래 대칭인데 실제
//     두상 메쉬는 y=0.15 중심에서 위로 1.0, 아래로 cos(PHI_MAX)≈0.70까지라
//     아래쪽 반이 두상보다 김 — 그려보면 바로 보임)
// a/b/c/중심 계산식은 projectImagePointToHead와 글자 단위로 동일하게 유지할 것
// (여기가 달라지면 진단 자체가 무의미해짐).
function buildStrandProjectionEllipsoidDebug(){
  // (2026-07-14) heightFactor 인자 제거 — 세로축이 실측 반지름으로 바뀌면서 미사용
  const { a, b, c } = getHeadEllipsoid();
  const geo = new THREE.SphereGeometry(1, 24, 16);
  const mat = new THREE.MeshBasicMaterial({
    color: 0x4FC3F7, wireframe: true, transparent: true, opacity: 0.35,
  });
  const mesh = new THREE.Mesh(geo, mat);
  mesh.scale.set(a, b, c);
  mesh.position.set(0, 0.15, 0); // 타원 중심(0,0.15,0) — projectImagePointToHead의 중심 오프셋과 동일
  mesh.name = 'strandEllipsoidDebug';
  return mesh;
}

// 3D 화면의 "기준면 보기" 토글 — 기본 꺼짐(일반 사용자용 화면을 어지럽히지
// 않기 위함), 켜면 위 가상 타원체가 하늘색 와이어프레임으로 표시됨.
function toggleStrandDebug(){
  state.debugShowStrandSurface = !state.debugShowStrandSurface;
  const btn = document.getElementById('strandDebugToggle');
  if(btn){
    btn.textContent = state.debugShowStrandSurface ? '기준면 숨기기' : '기준면 보기';
    btn.classList.toggle('on', state.debugShowStrandSurface);
  }
  if(model3D && model3D.initialized){
    const m = model3D.headGroup.getObjectByName('strandEllipsoidDebug');
    if(m) m.visible = state.debugShowStrandSurface;
  }
}


// ── 2D 가닥 경로를 3D로 들어올려 렌더(현재 방식) ──
// 사용자 설계: "2D 렌더링이 끝나면 그 점들을 3D 좌표로 옮겨서 렌더하면 된다".
// 절차 생성 방식(섹션별로 3D에서 새로 심기)
// 대신, 조정 화면에서 실제로 그려진(사용자가 눈으로 확인한) 가닥 경로의
// 점들을 projectImagePointToHead로 각각 3D화해서 가는 선(LineSegments)으로
// 그림. 모양·길이·색(실측 팔레트)·컬이 2D와 정의상 일치. 경로 캡처가 없으면
// null을 반환하고 호출부가 기존 절차 생성으로 폴백(동작 보존).
// (2026-07-16) 3D 진입 시, 아직 캡처 안 된 뷰의 2D 가닥 경로를 오프스크린
// 렌더로 확보 — "2D 헤어·두피의 3D 좌표를 산출해서 그대로 옮긴다"가 네 뷰
// 전부에서 성립하도록. (기존엔 사용자가 조정 화면에서 실제로 열어본 뷰만
// 캡처돼 있어서, 안 열어본 뷰는 절차 생성 폴백과 섞였음.) 렌더 조건·옵션은
// renderFrame의 가닥 호출과 동일하게 맞춤(rawMode 아님) — 화면에 그려질
// 그 가닥과 같은 것이 캡처됨. 캔버스 크기도 DRAW_RES(1200) 동일.
function captureStrandPathsFor(angle, rawMode){
  return new Promise(resolve=>{
    const maskInf = state.hairMasks && state.hairMasks[angle];
    const hairC = state.hairCanvases && state.hairCanvases[angle];
    if(!maskInf || !maskInf.scalpY || !hairC){ resolve(false); return; }
    getCachedImg(angle, (img)=>{
      if(!img){ resolve(false); return; }
      try{
        const validCount = countValidCols(maskInf.scalpY);
        if(validCount <= maskInf.w * 0.05){ resolve(false); return; }
        const canvas = document.createElement('canvas');
        canvas.width = DRAW_RES;
        canvas.height = Math.round(DRAW_RES * img.height / img.width);
        const ctx = canvas.getContext('2d');
        const fit = computeFit(img.width, img.height, canvas.width, canvas.height);
        // (11차) rawMode=true면 중립(길이 기본·컬0) 캡처 — 3D 조정 연산자의 소스.
        drawHairStrands(ctx, fit, maskInf.scalpY, maskInf.hairEndY, maskInf.w, maskInf.h, hairC,
          buildStrandOpts(maskInf, angle, !!rawMode));
        resolve(!!(state.strandPaths && state.strandPaths[angle] && state.strandPaths[angle].strands.length));
      }catch(e){ console.warn('오프스크린 가닥 캡처 실패('+angle+'):', e); resolve(false); }
    });
  });
}

// (2026-07-17 재작성 v3) "헤어도 두상처럼 4장 실루엣으로 깎는다" — 사용자
// 지적: "두상이 실측해서 입체로 나온다면, 그 위에 얹혀지는 헤어가닥의 점들도
// 다 3D좌표(입체)에 찍힐 수 있을 거 아니야?" / "사진 4장의 실루엣으로 폭·깊이
// 재는 과정을 헤어도 거쳐야지." 합의된 4단계:
//   1단계 — 헤어 외곽 헐(hull) 깎기: 높이별로 정면/후면 마스크에서 헤어
//     반폭(W), 좌/우측 마스크에서 헤어 반깊이(D)를 실측(소스는 이미 저장된
//     scalpY~hairEndY 컬럼 스팬 — 새 세그멘테이션 없음). 두상 단면 깎기와
//     동일 발상, 소스만 두상 실루엣 → 헤어 마스크.
//   2단계 — 가닥 점의 깊이(z)를 전역 타원체 대신 그 높이의 실측 헐 단면
//     타원(W(y), D(y))에서 읽음. 단면 밖(늘어짐)은 마지막 깊이 유지(기존).
//   3단계 — 두께(부피): 같은 높이의 두피면(두상 타원)과 헐 사이 간격이 곧
//     실측 헤어 두께 — 가닥마다 결정적 난수 t∈[0.35,1]로 그 간격 안에 배치
//     (0=두피, 1=헐 바깥면). 지어낸 상수가 아니라 실측 간격 안에서만 흩뿌림.
//   4단계 — 깊이 음영: 안쪽 층(t 작음)은 어둡게, 바깥층·카메라를 향한
//     곡면일수록 밝게(가산 성분 포함 — 검은 머리에서도 곡률이 보이도록).
//     LineBasicMaterial이 무조명이라 정점 색으로 직접 음영을 구움.
// 매핑 앵커는 v2와 동일(두피선 최고점↔두상 꼭대기, 두피선 반폭↔두상 반지름).
// (2026-07-17 좌표 축 통합으로 갱신) "뷰별 고정 yaw만, 포즈 미사용"이던
// 서술은 폐기 — 이제 뷰별 실측 포즈(getViewYawDeg 폴백 체인 + pitch/roll)를
// 쓰고, 헐 실측도 관측(E,θ) 역투영으로 일반화됨. 상세는 함수 본문 주석과
// 파일 상단 개발로그 "좌표 축 통합" 항목 참고.
function buildHairStrandsFromPaths(){
  if(!state.strandPaths) return null;
  const headEll = getHeadEllipsoid();
  const a  = headEll.a;   // 두상 가로 반지름(폭)
  const b  = headEll.b;   // 두상 세로 반지름
  const cD = headEll.c;   // 두상 앞뒤 반지름(깊이)
  const CY = 0.15;                                   // 두상 중심 y (두상 메쉬와 동일)
  // (2026-07-17 통합) 고정 yaw(front:0/left:-90/right:90/back:180) 가정 제거 —
  // 실측 포즈 축(랜드마크 PnP)으로 통일. 사용자 설계: 랜드마크는 4장 연결의
  // 기준점이고, 실제 촬영은 90°가 아니라 경사(예: 24°)로 이루어짐(90°에선
  // MediaPipe 랜드마크 인식 자체가 실패). 얼굴/두상(projectImagePointToHead
  // 계열)은 이미 실측 포즈를 쓰는데 이 함수만 90°를 가정해 좌표 철학이 둘로
  // 갈라져 있었음 — 여기가 그 통합 지점.
  const poseOf = angle => {
    const lm = state.landmarks && state.landmarks[angle];
    return {
      yaw:   getViewYawDeg(angle) * Math.PI/180,               // 실측→근사→고정 폴백 체인
      pitch: ((lm && lm.posePitchDeg) || 0) * Math.PI/180,
      roll:  ((lm && lm.poseRollDeg)  || 0) * Math.PI/180,
    };
  };
  // 두피면(두상 타원)의 높이별 반폭/반깊이 — 헐의 안쪽 경계이자 결측 폴백
  const headHalf = (y, axis) => {
    const yl = (y - CY) / b, q = 1 - yl*yl;
    return q <= 0 ? 0 : (axis === 'w' ? a : cD) * Math.sqrt(q);
  };

  // ── 뷰별 2D→모델 매핑 파라미터 (앵커는 v2와 동일, 스케일만 실측 yaw 반영) ──
  // 세로 앵커용 얼굴 종횡 계수(얼굴 메쉬와 동일 출처) — 실패 시 1로 폴백
  let fmW = 1, fmH = 1;
  try{ const fm = getFaceMetrics(); if(fm){ fmW = fm.widthFactor || 1; fmH = fm.heightFactor || 1; } }catch(e){}
  const views = {};
  ['front','left','right','back'].forEach(angle=>{
    const rec = state.strandPaths[angle];
    const maskInf = state.hairMasks && state.hairMasks[angle];
    if(!rec || !rec.strands || !rec.strands.length || !maskInf || !maskInf.scalpY) return;
    let xMin = Infinity, xMax = -Infinity, crownY = Infinity, validCols = 0;
    for(let x=0; x<maskInf.w; x++){
      const sy = maskInf.scalpY[x];
      if(sy >= 0){
        validCols++;
        if(x < xMin) xMin = x;
        if(x > xMax) xMax = x;
        if(sy < crownY) crownY = sy;
      }
    }
    if(!(xMax > xMin) || !isFinite(crownY)) return;
    const halfPx = (xMax - xMin) / 2;
    if(halfPx < 4) return;
    // (2026-07-17) 뷰 품질 게이트 — 실기기 피드백: "후면은 사진이 제대로 된
    // 게 없었고, 폴백이 작동 안 했네." 원인: captureStrandPathsFor는 사진이
    // 존재하기만 하면(유효 컬럼 5% 이상) 캡처를 만들어 strandPaths[angle]을
    // 채우는데, 그 캡처가 불량이어도 이 함수의 거울 폴백은 "뷰가 있다"고
    // 보고 양보해버림 → 불량 캡처가 자리만 차지하고 뒤통수가 비는 결과.
    // 게이트: 가닥 12개 미만 또는 유효 컬럼이 마스크 폭의 8% 미만이면 실측
    // 부적격으로 제외 — 헐 관측에도 안 들어가고, 자리가 비므로 아래 거울
    // 채움이 대신 들어옴. (12/8%는 실측이 아니라 "이보다 아래면 실루엣
    // 실측이라 부를 수 없다" 수준의 최소 게이트 상수 — 실기기에서 정상
    // 촬영이 걸러지면 낮출 것.)
    if(rec.strands.length < 12 || validCols < maskInf.w * 0.08){
      console.log('[3D] 뷰 품질 게이트: ' + angle + ' 실측 부적격(가닥 ' + rec.strands.length +
        '개, 유효 컬럼 ' + validCols + '/' + maskInf.w + ') — 거울 채움으로 대체');
      return;
    }
    const pose = poseOf(angle);
    const cos2 = Math.cos(pose.yaw)**2, sin2 = Math.sin(pose.yaw)**2;
    // 이 뷰 카메라에서 본 두상 투영 반폭: 타원(a,cD)을 방위각 θ에서 보면
    // E = sqrt(a²cos²θ + cD²sin²θ) — 예전 SIDE?cD:a 이분법의 연속 일반화
    // (θ=0이면 a, θ=90°면 cD로 기존과 동일하게 환원됨).
    const aH_head = Math.sqrt(a*a*cos2 + cD*cD*sin2);
    // (2026-07-17, 2차 수정) 세로 매핑 = 크라운 오프셋 + 눈/턱 실측 배율.
    // 1차 시도(눈/턱 프로젝터로 오프셋+배율 둘 다)는 실기기에서 뿌리선이
    // 목 높이 링으로 흘러내림 — 사용자: "눈기준이어서 그런거야. 출발점이
    // 저기가 되면 안되지." 정확한 지적: 머리카락의 출발점은 물리적으로
    // 두피이므로 오프셋을 눈 캘리브레이션에 맡기면 안 됨(촬영각 큰 뷰에서
    // 눈/턱 세로 간격이 원근·pitch로 압축되면 오프셋까지 통째로 틀어짐).
    // 분리: ① 오프셋 = 크라운 픽셀 → 두피 돔 꼭대기(원래 방식 — 뿌리가
    // 항상 두피에서 출발) ② 배율 = 눈/턱 프로젝터의 bY(모델단위/정규화y)
    // — 지난 턴의 "뿌리가 눈높이까지 과신장" 원인이었던 두상 폭 유래
    // 스케일(v.s)과 분리 유지. 배율도 pitch가 크면 과대해질 수 있는 한계는
    // 남지만(눈/턱 간격 압축) 오프셋이 두피에 고정되어 출발점은 불변.
    // 랜드마크 없는 뷰(후면 등)는 기존 v.s 폴백.
    let sy = aH_head/halfPx; // 폴백: x유래 스케일(기존 동작)
    const lmV = state.landmarks && state.landmarks[angle];
    if(lmV && typeof lmV.eyeY === 'number' && typeof lmV.chinY === 'number'){
      const proj = makeFaceProjector(lmV, fmW, fmH);
      if(isFinite(proj.bY) && proj.bY > 0.2 && proj.bY < 15){ // 랜드마크 붕괴(눈≈턱) 가드
        sy = proj.bY / maskInf.h; // 정규화 배율 → 픽셀 배율
      }
    }
    views[angle] = { rec, maskInf, cx:(xMin+xMax)/2, crownY, s: aH_head/halfPx, sy, pose, cos2, sin2 };
  });
  const names = Object.keys(views);
  if(!names.length) return null;

  // ── 1단계: 헤어 외곽 헐 실측 ──
  const NY = 64;                 // 높이 버킷 수
  const yTop = CY + b;           // 크라운(두피선 최고점) ↔ 두피 돔 꼭대기 — 뿌리 출발점 고정
  const mapY = (v, py) => yTop - (py - v.crownY) * v.sy; // 배율은 뷰별(눈/턱 실측 우선)
  let yBot = CY - b;             // 최저점: 각 뷰 hairEndY 최댓값의 모델 y 중 최솟값
  names.forEach(n=>{
    const v = views[n];
    let maxEnd = -1;
    for(let x=0; x<v.maskInf.w; x++){
      if(v.maskInf.scalpY[x] >= 0 && v.maskInf.hairEndY[x] > maxEnd) maxEnd = v.maskInf.hairEndY[x];
    }
    if(maxEnd >= 0){
      const y = mapY(v, maxEnd);
      if(y < yBot) yBot = y;
    }
  });
  const yStep = (yTop - yBot) / (NY - 1);
  const bucketOfY = y => Math.min(NY-1, Math.max(0, Math.round((yTop - y) / yStep)));
  // 버킷별 관측 목록: 각 뷰에서 잰 반폭 E와 그 뷰의 cos²θ/sin²θ.
  // (예전엔 정면류→W합산, 측면류→D합산의 이분법이라 24° 사진이 "90° 옆모습"
  // 으로 취급돼 깊이 실측이 통째로 왜곡됐음 — 실기기의 납작 두상 헐 원인 중 하나)
  const obs = Array.from({length:NY}, ()=>[]);
  names.forEach(n=>{
    const v = views[n];
    const minX = new Float32Array(NY).fill(Infinity);
    const maxX = new Float32Array(NY).fill(-Infinity);
    // 컬럼 스팬(scalpY~hairEndY)이 지나가는 높이 버킷마다 좌우 극값 갱신
    for(let x=0; x<v.maskInf.w; x++){
      const sY = v.maskInf.scalpY[x], eY = v.maskInf.hairEndY[x];
      if(sY < 0 || eY < 0) continue;
      const b0 = bucketOfY(mapY(v, sY));
      const b1 = bucketOfY(mapY(v, eY));
      for(let bi=Math.min(b0,b1); bi<=Math.max(b0,b1); bi++){
        if(x < minX[bi]) minX[bi] = x;
        if(x > maxX[bi]) maxX[bi] = x;
      }
    }
    for(let bi=0; bi<NY; bi++){
      if(maxX[bi] < minX[bi]) continue;
      obs[bi].push({ E: (maxX[bi] - minX[bi]) / 2 * v.s, cos2: v.cos2, sin2: v.sin2 });
    }
  });
  // 관측(E,θ) → 헐 단면(W,D) 역투영. E² = W²cos²θ + D²sin²θ 를 푼다:
  // 1차 — 깊이비를 두상비율(cD/a)로 가정하고 모든 관측에서 W 추정(평균).
  // 2차 — 측면성이 충분한 관측(sin²θ>0.06, 즉 |θ|>약 14°)에서 1차 W를 대입해
  //        D를 역산, [0.35W, 1.5W]로 클램프(작은 sinθ 나눗셈의 노이즈 억제).
  // 측면성 관측이 하나도 없으면 기존 폴백(D = W×두상비율) 유지.
  const hullW = new Float32Array(NY), hullD = new Float32Array(NY);
  const rHead = cD / a;
  for(let bi=0; bi<NY; bi++){
    const y = yTop - bi*yStep;
    let W = NaN, D = NaN;
    if(obs[bi].length){
      let wAcc = 0;
      obs[bi].forEach(o=>{ wAcc += o.E / Math.sqrt(o.cos2 + rHead*rHead*o.sin2); });
      W = wAcc / obs[bi].length;
      let dAcc = 0, dCnt = 0;
      obs[bi].forEach(o=>{
        if(o.sin2 <= 0.06) return;
        const d2 = (o.E*o.E - W*W*o.cos2) / o.sin2;
        if(d2 > 0){ dAcc += Math.sqrt(d2); dCnt++; }
      });
      // 헤어 헐 깊이도 두상 밴드와 같은 얕은-각도 폭발 문제 → 사람 두상 비율 범위로
      // 좁혀(0.9~1.35×폭) 헤어가 앞뒤로 과하게 감겨 옆에서 휘어 보이던 것을 억제.
      if(dCnt) D = Math.max(0.9*W, Math.min(1.35*W, dAcc/dCnt));
    }
    if(isNaN(D) && !isNaN(W)) D = W * rHead;
    if(isNaN(W)){ W = headHalf(y,'w') * 1.02; D = headHalf(y,'d') * 1.02; }
    hullW[bi] = Math.max(W, headHalf(y,'w')); // 헐은 항상 두피면 바깥
    hullD[bi] = Math.max(D, headHalf(y,'d'));
  }
  for(let pass=0; pass<2; pass++){ // 마스크 노이즈 완화(이동평균 2회)
    for(let bi=1; bi<NY-1; bi++){
      hullW[bi] = (hullW[bi-1] + 2*hullW[bi] + hullW[bi+1]) / 4;
      hullD[bi] = (hullD[bi-1] + 2*hullD[bi] + hullD[bi+1]) / 4;
    }
  }

  // ── 2~4단계: 헐 깊이 + 두께 채움 + 깊이 음영 ──
  const group = new THREE.Group();
  group.name = 'hairStrands';
  // (2026-07-17) 반대편 미촬영 뷰 거울 채움 — front만 캡처된 상태에선 모든
  // 가닥의 z≥0(앞반구)이라 옆에서 보면 반쪽 껍질이 종잇장처럼 납작하게 보임
  // (실기기 스크린샷 + Node 하네스로 z분포 0~+cD 확인. 사용자: "머리가
  // 납작하게 나왔는데, 머리모양처럼 타원처럼 나오게"). 실측이 없는 뷰는
  // 맞은편 캡처(front↔back, left↔right)를 x반전·해당 yaw로 재사용해 타원
  // 전체를 덮는다 — 실측 아님(자리표시자)이라 mirrored 플래그로 표시.
  // 해당 각도 사진을 실제로 찍으면 실측이 우선되고 거울 채움은 사라짐.
  const MIRROR_SRC = { front:'back', back:'front', left:'right', right:'left' };
  const jobs = names.map(n2 => {
    const v2 = views[n2];
    return { angle:n2, v:v2, mirrored:false, yaw:v2.pose.yaw, pitch:v2.pose.pitch, roll:v2.pose.roll };
  });
  Object.keys(MIRROR_SRC).forEach(missing=>{
    if(views[missing]) return;
    const srcV = views[MIRROR_SRC[missing]];
    if(!srcV) return;
    // 거울 잡의 포즈도 실측에서 파생: 전↔후는 원본 실측 yaw+180°,
    // 좌↔우는 중앙면(x) 대칭이므로 yaw 부호 반전. roll도 대칭상 부호 반전.
    const fb = (missing === 'front' || missing === 'back');
    jobs.push({ angle:missing, v:srcV, mirrored:true,
      yaw:  fb ? srcV.pose.yaw + Math.PI : -srcV.pose.yaw,
      pitch: srcV.pose.pitch, roll: -srcV.pose.roll });
  });
  const STRAND_SAMPLE_3D = 2; // 가닥 솎아내기 손잡이(저사양 대응 시 올림)
  let seed = 20260717;        // 결정적 난수 — 재구성해도 같은 배치(디버그 재현성)
  const rand = ()=>{ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
  // ── (10차, 3D 조정 전환 1단계) 정규 3D 모델 채집 ──
  // 이 리프트가 만드는 월드 3D 가닥을 재사용 가능한 형태로 stash — "3D가 원본,
  // 2D는 그 투영"이라는 합의 구조의 토대. 조정 화면이 이 모델을 현재 뷰 카메라로
  // 되쏘아(projectHair3DToView) 2D로 표시하게 된다. 여기선 모델 채집만; 조정
  // 연산자(길이/컬/섹션)와 렌더 배선은 다음 단계.
  const canonicalStrands = [];      // [{pts:[{x,y,z}], sec, color, srcAngle, mirrored}]
  const viewCal = {};               // 뷰별 image↔model 캘리브레이션(되쏘기용)
  names.forEach(n3=>{               // names = 실측(비거울) 뷰만
    const vv = views[n3];
    viewCal[n3] = { cx:vv.cx, s:vv.s, sy:vv.sy, crownY:vv.crownY,
                    yaw:vv.pose.yaw, pitch:vv.pose.pitch, roll:vv.pose.roll };
  });
  let total = 0;
  jobs.forEach(job=>{
    const angle = job.angle;
    const v = job.v;
    // 실측 포즈 회전 — projectImagePointToHead와 동일한 관례(카메라 공간
    // 좌표에 역회전 R^T 적용, "우산 헤어" 버그 수정 때 수치 검증된 방향).
    const rot = composeRotationZYX(job.yaw, job.pitch, job.roll);
    // 이 잡의 카메라 방위 성분 — 단면 반경 일반화에 사용
    const jCos2 = Math.cos(job.yaw)**2, jSin2 = Math.sin(job.yaw)**2;
    const positions = [];
    const colors = [];
    const c = new THREE.Color();
    for(let si=0; si<v.rec.strands.length; si+=STRAND_SAMPLE_3D){
      const st = v.rec.strands[si];
      c.set(st.color);
      const t = 0.35 + 0.65 * rand(); // 이 가닥의 깊이층: 0=두피면, 1=헐 바깥면
      let prev = null, prevR=0, prevG=0, prevB=0;
      let lastZ = null;
      const worldPts = []; // (10차) 정규 모델용 월드 폴리라인
      for(let i=0;i<st.pts.length;i++){
        const p = st.pts[i];
        const mxRaw = (p.x - v.cx) * v.s;
        const mx = job.mirrored ? -mxRaw : mxRaw; // 거울 뷰는 x반전(그 방향에서 본 좌우가 맞도록)
        const my = mapY(v, p.y);
        const bi = bucketOfY(my);
        // 이 잡 카메라에서 본 헐/두피 단면 반경 — 예전 SIDE 이분법(폭↔깊이
        // 스왑)의 연속 일반화: 방위각 θ에서 본 타원(W,D)의 투영 반폭은
        // sqrt(W²cos²θ+D²sin²θ), 중앙(카메라 축) 코드 반깊이는 WD/반폭.
        // θ=0/90°에서 기존 값(W,D / D,W)으로 정확히 환원되고, 중간 각도
        // (실촬영 24° 등)에선 근사(코드 중심이 약간 어긋나는 회전타원 효과는
        // 무시) — projectImagePointToHead가 쓰는 것과 같은 수준의 근사.
        const Wb = hullW[bi], Db = hullD[bi];
        const aH  = Math.sqrt(Wb*Wb*jCos2 + Db*Db*jSin2);
        const aD  = (Wb*Db) / Math.max(aH, 1e-4);
        const hw = headHalf(my,'w'), hd = headHalf(my,'d');
        const aHh = Math.sqrt(hw*hw*jCos2 + hd*hd*jSin2);
        const aDh = aHh > 1e-4 ? (hw*hd) / aHh : 0;
        let px = mx, mz, facing = 0;
        const u = aH > 1e-4 ? (mx/aH)*(mx/aH) : 2;
        if(u <= 1){
          const hullZ  = aD * Math.sqrt(1 - u);                    // 헐 바깥면 깊이
          const uh     = aHh > 1e-4 ? (mx/aHh)*(mx/aHh) : 2;
          const scalpZ = uh <= 1 ? aDh * Math.sqrt(1 - uh) : 0;    // 두피면 깊이
          mz = scalpZ + (hullZ - scalpZ) * t;                      // 실측 두께 안에 층 배치
          facing = Math.sqrt(1 - u);                               // 카메라를 향한 정도(곡률 음영용)
        } else if(headHalf(my,'w') > 1e-3){
          // (2026-07-17) 단면 밖(u>1)이지만 아직 두상 높이 범위 안: 예전엔
          // lastZ 유지/림 평면(z=0)이라 가장자리 가닥이 납작한 커튼으로
          // 눌렸음. 반폭 초과분을 호길이로 환산해 타원 둘레를 따라 뒤쪽으로
          // 감아 배치("타원처럼"). 림(θ=π/2)에서 x=aH, z=0이라 위 분기와
          // 이음새 연속(림에선 scalpZ=hullZ=0이라 t와 무관하게 mz=0).
          // θ 상한 0.85π — 반대편 뒤통수 중심을 뚫고 지나가는 것 방지.
          const sgn = mx >= 0 ? 1 : -1;
          const rEdge = Math.max(1e-3, (aH + aD) / 2);            // 근사 둘레 반경
          const theta = Math.min(Math.PI * 0.85, Math.PI/2 + (Math.abs(mx) - aH) / rEdge);
          px = sgn * aH * Math.sin(theta);
          mz = aD * Math.cos(theta);
        } else if(lastZ !== null){
          mz = lastZ;    // 두상 아래(늘어짐): 마지막 깊이 유지 — 목을 감지 않게
        } else {
          mz = 0;        // 시작부터 두상 밖(가장자리 뿌리): 림 평면
        }
        lastZ = mz;
        const w3 = applyRotationTranspose3(rot, new THREE.Vector3(px, my - CY, mz));
        w3.y += CY;
        worldPts.push({ x:w3.x, y:w3.y, z:w3.z }); // (10차) 정규 모델 채집
        // 4단계 음영: 곱(층 깊이) + 가산(바깥층·정면 곡면 하이라이트, 검은 머리 대응)
        const k = 0.55 + 0.45 * t;
        const rim = 0.05 * t + 0.11 * t * facing;
        const r = Math.min(1, c.r * k + rim);
        const g = Math.min(1, c.g * k + rim);
        const bl = Math.min(1, c.b * k + rim);
        if(prev){
          positions.push(prev.x, prev.y, prev.z, w3.x, w3.y, w3.z);
          colors.push(prevR, prevG, prevB, r, g, bl);
        }
        prev = w3; prevR = r; prevG = g; prevB = bl;
      }
      if(worldPts.length >= 2){
        canonicalStrands.push({ pts:worldPts, sec: st.sec || 'crown', color: st.color, srcAngle: angle, mirrored: job.mirrored });
      }
      total++;
    }
    if(!positions.length) return;
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions), 3));
    geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors), 3));
    const mat = new THREE.LineBasicMaterial({ vertexColors: true });
    const lines = new THREE.LineSegments(geo, mat);
    lines.name = 'strandLines-' + angle + (job.mirrored ? '-mirror' : '');
    lines.userData.fromPaths = true; // [진단용]
    lines.userData.mirrored = job.mirrored; // [진단용] 실측 아님(맞은편 뷰 거울 채움)
    group.add(lines);
  });
  // [진단용] '겹'(커트 레이어) 확인 — 실측 뷰 하나에서 뿌리 높이(pts[0].y)별로
  // 가닥의 세로 길이를 상/중/하 3구간 평균 내어 비교한다. 커트기법이 유니폼(기본)이면
  // 층이 거의 없어 상≈하, 원랭스면 높은 뿌리가 더 길고(끝 수렴), 인크리스면 더 짧다(확산).
  // 값은 마스크 y좌표계 기준 상대 비교용. (동작 무변경 — 읽기·로그만)
  try {
    const rj = jobs.find(j=>!j.mirrored) || jobs[0];
    const strands = rj && rj.v && rj.v.rec && rj.v.rec.strands;
    if(strands && strands.length){
      let minY=Infinity, maxY=-Infinity;
      strands.forEach(s=>{ if(s.pts && s.pts.length){ const y=s.pts[0].y; if(y<minY)minY=y; if(y>maxY)maxY=y; } });
      const span=Math.max(1e-6, maxY-minY);
      const bins=[[0,0],[0,0],[0,0]]; // [길이합, 개수] 상/중/하 뿌리
      strands.forEach(s=>{
        if(!s.pts || s.pts.length<2) return;
        const t=(s.pts[0].y - minY)/span;                       // 0=최상단 뿌리, 1=최하단
        const len=Math.abs(s.pts[s.pts.length-1].y - s.pts[0].y); // 가닥 세로 길이
        const bi = t<0.34?0 : t<0.67?1 : 2;
        bins[bi][0]+=len; bins[bi][1]++;
      });
      const mean=b=> b[1]? b[0]/b[1] : 0;
      const top=mean(bins[0]), mid=mean(bins[1]), bot=mean(bins[2]);
      const rel = bot>1e-6 ? (top-bot)/bot : 0;
      const verdict = Math.abs(rel)<0.06 ? '층 거의 없음(유니폼/기본값)'
                    : rel>0 ? '높은뿌리가 더 긺 → 수렴(원랭스/그라데이션 층 형성됨)'
                    : '높은뿌리가 더 짧음 → 확산(인크리스 롱레이어 형성됨)';
      console.log('[진단·겹] '+rj.angle+' 뿌리높이별 평균 가닥길이 상='+top.toFixed(3)
        +' 중='+mid.toFixed(3)+' 하='+bot.toFixed(3)+' (상/하차 '+(rel*100).toFixed(0)+'%) → '+verdict);
    }
  } catch(e){ /* 진단 실패는 무시 */ }

  console.log('[3D] 헐 기반 옮기기:', total, '가닥 (실측 뷰:', names.join(','),
    '/ 거울 채움:', jobs.filter(j=>j.mirrored).map(j=>j.angle).join(',') || '없음', ')');
  // (10차) 정규 3D 모델 stash — 조정 화면 되쏘기(projectHair3DToView)의 소스.
  state.hair3D = { strands: canonicalStrands, viewCal, yTop, CY };
  return total > 0 ? group : null;
}

// ── (11차) 3D 조정 연산자 — 순수 기하(Node 검증 가능) ──
// 3D=원본 구조에서 조정을 "월드 가닥 폴리라인"에 직접 가한다. 2D의 한계(직모
// 결과 충돌)가 없어 컬은 두상 곡면 위 나선으로 진짜로 감긴다.
// 벡터 유틸(THREE 없이 순수) — Node 하네스에서 그대로 검증.
function _v3sub(a,b){ return {x:a.x-b.x, y:a.y-b.y, z:a.z-b.z}; }
function _v3add(a,b){ return {x:a.x+b.x, y:a.y+b.y, z:a.z+b.z}; }
function _v3scale(a,s){ return {x:a.x*s, y:a.y*s, z:a.z*s}; }
function _v3len(a){ return Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z); }
function _v3norm(a){ const l=_v3len(a)||1e-9; return {x:a.x/l, y:a.y/l, z:a.z/l}; }
function _v3cross(a,b){ return {x:a.y*b.z-a.z*b.y, y:a.z*b.x-a.x*b.z, z:a.x*b.y-a.y*b.x}; }

// (11차 3D컬 재재작성, 사용자 교정) 실제 펌 물리: 로드(rod) 크기 = 웨이브 폭이
// "루프 지름"을 정하고, 그건 머리 전체에서 동일하다. 긴 머리는 같은 로드에 더
// 여러 바퀴 감길 뿐 루프 크기는 같다 → 길이 비례가 아니라 로드(웨이브폭) 고정.
// 웨이브 폭 → 루프 반경 R(모델 단위, 두상 가로반경 a≈0.29 기준). 머리 전체 공통.
const CURL3D_R_MIN = 0.020; // 작은 로드(웨이브폭 0%) — 촘촘한 작은 스파이럴
const CURL3D_R_MAX = 0.070; // 큰 로드(웨이브폭 100%) — 느슨한 큰 웨이브
// 3D 컬: 가닥을 로드 반경 R의 "스프링 나선"으로 감는다. 감기면 호길이가 축방향으로
// 압축돼(피치<둘레) 끝이 위로 끌려 올라가는 진짜 링렛이 된다. curlAmt(컬 세기, 0~100)
// =로드 밀착도(반경)+코일 촘촘함(피치), waveT(웨이브 폭)=로드 반경 R. 뿌리 고정.
// 같은 로드에 긴 가닥은 자동으로 더 여러 바퀴. 감은 뒤 gravityDroop3D가 아래로 늘어뜨림.
function curlStrand3D(pts, curlAmt, waveT){
  if(!pts || pts.length < 3 || !(curlAmt > 0)) return pts;
  const root = pts[0], tip = pts[pts.length-1];
  const core = _v3norm(_v3sub(tip, root));
  // 원본 호길이 = 이 가닥이 실제로 가진 머리 길이. 이 길이가 그대로 나선에 감긴다
  // (긴 가닥은 같은 로드에 더 여러 바퀴). 나선은 스프링처럼 축길이를 줄여 끝을 끌어올림.
  let arc = 0; for(let i=1;i<pts.length;i++) arc += _v3len(_v3sub(pts[i], pts[i-1]));
  if(arc < 1e-5) return pts;
  // 로드(웨이브폭) 반경 — 머리 전체 고정. 루프 지름을 정한다.
  const R = CURL3D_R_MIN + waveT * (CURL3D_R_MAX - CURL3D_R_MIN);
  const tight = Math.max(0, Math.min(100, curlAmt)) / 100; // 컬 세기 0~1
  // 컬 세기 = ① 로드에 얼마나 밀착돼 감기는지(나선 반경 A) + ② 감긴 코일이 얼마나
  // 촘촘히 유지되는지(피치 b, 라디안당 축방향 상승). 약한 컬=거의 안 감기고 늘어져
  // (큰 피치→직모), 강한 컬=로드 반경까지 꽉 차고 촘촘한 스프링(작은 피치).
  const A = tight * R;                       // 나선 반경(컬 셀수록 로드 반경 R에 근접)
  const b = R * (2.6 - 2.28 * tight);        // 피치비 2.6R(느슨)→0.32R(탱탱)
  const perRad = Math.sqrt(A*A + b*b) || 1e-4; // 라디안당 소비되는 호길이
  const thetaMax = arc / perRad;               // 총 감김 각 — 긴 가닥일수록 여러 바퀴
  // 코어축(뿌리→끝)에 수직인 로컬 프레임 u,v
  let up = {x:0,y:1,z:0};
  if(Math.abs(core.y) > 0.94) up = {x:1,y:0,z:0};
  const u = _v3norm(_v3cross(core, up));
  const v = _v3norm(_v3cross(core, u));
  // 한 바퀴당 점 12개 이상 확보(이전 각짐/jagged 방지). 촘촘한 코일일수록 점을 늘림.
  const turns = thetaMax / (2*Math.PI);
  const M = Math.max(pts.length, Math.min(400, Math.ceil(turns * 12) + 2));
  const out = [pts[0]];
  for(let i=1;i<=M;i++){
    const f = i / M;
    const theta = thetaMax * f;
    const env = Math.min(1, i / (M*0.12 + 1e-6)); // 뿌리 근처 테이퍼(부착 유지)
    const axis = b * theta;                        // 압축된 등뼈(스프링 축길이<호길이)
    const rad = A * env;
    const base = _v3add(root, _v3scale(core, axis));
    const off = _v3add(_v3scale(u, Math.cos(theta)*rad), _v3scale(v, Math.sin(theta)*rad));
    out.push(_v3add(base, off));
  }
  return out;
}

// (11차) 중력 처짐 — 실제 펌: 로드로 감은 뒤 풀면 자체 무게로 끝이 아래로 늘어짐.
// 사용자: "그렇게 된 다음에 적절한 중력이 작용." 컬 나선 위에 얹는 마지막 단계.
// 뿌리 고정, 끝으로 갈수록 가속 처짐(t²). 컬 강할수록 탱탱하게 덜 처짐(hold).
const GRAV3D_STRENGTH = 0.35; // 중력 처짐 세기(튜닝 지점) — 호길이 대비 최대 처짐 비율
function gravityDroop3D(pts, curlAmt){
  if(!pts || pts.length < 3) return pts;
  let arc = 0; for(let i=1;i<pts.length;i++) arc += _v3len(_v3sub(pts[i], pts[i-1]));
  if(arc < 1e-5) return pts;
  const hold = 1 - 0.6 * (Math.max(0, Math.min(100, curlAmt))/100); // 강한 컬=덜 처짐(0.4~1)
  const n = pts.length - 1;
  const out = [pts[0]];
  for(let i=1;i<pts.length;i++){
    const t = i / n;
    const sag = GRAV3D_STRENGTH * arc * t * t * hold; // 끝으로 갈수록 가속(t²) 아래로
    out.push({ x: pts[i].x, y: pts[i].y - sag, z: pts[i].z });
  }
  return out;
}

// 3D 길이: 호길이 기준 트림(ratio<1)/연장(ratio>1). 연장은 마지막 진행방향 유지.
// ratio=1이면 원본 그대로. 뿌리 고정, 끝만 이동.
function lengthStrand3D(pts, ratio){
  if(!pts || pts.length < 2 || !(ratio > 0) || Math.abs(ratio-1) < 1e-6) return pts;
  // 누적 호길이
  const seg = [], cum = [0];
  for(let i=1;i<pts.length;i++){ const d=_v3len(_v3sub(pts[i],pts[i-1])); seg.push(d); cum.push(cum[i-1]+d); }
  const total = cum[cum.length-1]; if(total < 1e-9) return pts;
  const target = total * ratio;
  if(ratio < 1){
    // 트림: target 호길이 지점까지 포인트 취하고 마지막은 보간
    const out = [pts[0]];
    for(let i=1;i<pts.length;i++){
      if(cum[i] <= target){ out.push(pts[i]); }
      else { const t=(target-cum[i-1])/(seg[i-1]||1e-9); out.push(_v3add(pts[i-1], _v3scale(_v3sub(pts[i],pts[i-1]), t))); break; }
    }
    return out.length>=2 ? out : pts;
  } else {
    // 연장: 원본 전체 + 마지막 방향으로 (target-total) 만큼 추가 스텝
    const out = pts.slice();
    const dir = _v3norm(_v3sub(pts[pts.length-1], pts[pts.length-2]));
    const step = total / (pts.length-1);
    let added = 0; const extra = target - total; let cur = pts[pts.length-1];
    while(added < extra){ const d=Math.min(step, extra-added); cur=_v3add(cur,_v3scale(dir,d)); out.push(cur); added+=d; }
    return out;
  }
}

// ── (10차) 3D 조정 전환 — 3D→2D 되쏘기(투영) ──
// 월드 3D 점 → 특정 뷰 카메라의 이미지(mask) 좌표 + 깊이. buildHairStrandsFromPaths
// 리프트(w3 = R^T·(px,my-CY,mz)+CY)의 정확한 역: local = R·(world-CY),
// ix = px/s+cx, iy = crownY+(yTop-my)/sy. R·R^T=I라 같은 뷰 왕복은 수학적으로 정확
// (Node 하네스로 검증). depth(mz)는 painter's 정렬용.
function project3DPointToView(world, cal, yTop, CY){
  const R = composeRotationZYX(cal.yaw, cal.pitch, cal.roll); // row-major 9 (forward)
  const wy = world.y - CY;
  const lx = R[0]*world.x + R[1]*wy + R[2]*world.z;
  const ly = R[3]*world.x + R[4]*wy + R[5]*world.z;
  const lz = R[6]*world.x + R[7]*wy + R[8]*world.z;
  const my = ly + CY;
  return {
    ix: lx / cal.s + cal.cx,
    iy: cal.crownY + (yTop - my) / cal.sy,
    depth: lz, // 카메라 축 성분 — 정렬 부호는 렌더에서 실측 조정
  };
}

// (11차 3단계) 조정된 3D 모델을 현재 뷰로 되쏘아 조정창 2D 캔버스에 그린다(baseC 위).
// 소스는 중립 모델(viewCal)+조정 연산자(computeAdjustedHair3DStrands). 대상 뷰 캡처
// 가닥만(srcAngle 필터) 투영해 교차뷰 잡음 없이 "그 뷰의 머리 = 3D 조정 결과의 투영".
// painter's 깊이 정렬로 겉겹이 속겹을 덮는 가림이 3D 실제 z 기준으로 정확해짐.
function projectHair3DToView(ctx, fit, angle, maskInf){
  const model = state.hair3Dneutral;
  if(!model || !model.viewCal || !model.viewCal[angle]) return false;
  const adj = computeAdjustedHair3DStrands(angle);         // 이 뷰 캡처 가닥만
  if(!adj || !adj.length) return false;
  const cal = model.viewCal[angle];
  const { toX: toCX, toY: toCY } = makeImgToCanvas(fit, maskInf.w, maskInf.h);
  const projected = [];
  for(const st of adj){
    const pts = st.pts; let dsum=0; const cpts=[];
    for(let i=0;i<pts.length;i++){
      const pr = project3DPointToView(pts[i], cal, model.yTop, model.CY);
      cpts.push({ x: toCX(pr.ix), y: toCY(pr.iy) });
      dsum += pr.depth;
    }
    projected.push({ cpts, depth: dsum / pts.length });
  }
  projected.sort((a,b)=> a.depth - b.depth); // 뒤(작은 depth)부터 → 앞이 위에 덮임
  // ── 최소 파리티: 두피색 언더코트(굵게) → 머리색 가닥(가늘게) ──
  // 2D drawHairStrands의 통짜 실루엣 대신 "가닥 경로 추종" 방식과 동일 취지.
  const hairCol  = (typeof FORCED_HAIR_COLOR!=='undefined' && FORCED_HAIR_COLOR) || '#1a1a1a';
  const scalpCol = (maskInf.scalpColor) || 'rgb(224,178,148)';
  const resScale = fit.dw / 705;
  ctx.save();
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.globalAlpha = 1;
  ctx.strokeStyle = scalpCol; ctx.lineWidth = Math.max(1.3, resScale * 1.5);
  for(const p of projected) strokeSmoothPolyline(ctx, p.cpts);   // 언더코트 패스
  ctx.strokeStyle = hairCol;  ctx.lineWidth = Math.max(0.7, resScale * 0.6);
  for(const p of projected) strokeSmoothPolyline(ctx, p.cpts);   // 가닥 패스
  ctx.restore();
  return true;
}

// ── (10차) 개발용 3D 검증 미니뷰 ──
// 최종 UX에선 조정 화면에서 3D를 숨기지만, 개발 중엔 "조정이 3D에서 제대로
// 일어나는지" 눈으로 봐야 함(사용자 지적). 정규 3D 모델(state.hair3D)을 직접
// 렌더하는 경량·독립 THREE 뷰 — 메인 3D 화면(model3D 싱글턴)과 충돌 안 함.
// 드래그 회전 + 탭 확대. 조정 시 refreshDevMini3D로 실시간 갱신.
// (12차) 미니뷰 섹션 구분색 — 크라운=호박, 프론트=파랑, 템플=핑크, 사이드=초록,
// 후두부=보라, 네이프=주황. 어느 부위가 어느 섹션인지 3D에서 즉시 확인.
const SECTION_COLORS = {
  crown:'#e6b93c', front:'#3ca6e6', temple:'#e64c8c',
  side:'#3ce67a', occipital:'#a860e6', nape:'#e67a3c'
};
let devMini3D = null;
function initDevMini3D(){
  if(devMini3D || typeof THREE === 'undefined') return devMini3D;
  const wrap = document.getElementById('devMini3DCanvasWrap');
  if(!wrap) return null;
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const w = wrap.clientWidth||150, h = wrap.clientHeight||150;
  renderer.setSize(w, h);
  wrap.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, w/h, 0.01, 100);
  camera.position.set(0, 0.15, 3);
  scene.add(new THREE.AmbientLight(0xffffff, 0.9));
  const group = new THREE.Group();
  scene.add(group);
  // 두상 기준 와이어(방향 감 잡기용) — 반투명 구
  let headWire = null;
  try {
    const he = getHeadEllipsoid();
    const g = new THREE.SphereGeometry(1, 16, 12);
    const m = new THREE.MeshBasicMaterial({ color:0x2a2620, wireframe:true, transparent:true, opacity:0.4 }); // 밝은 미니뷰 배경 대비용 어두운 와이어
    headWire = new THREE.Mesh(g, m);
    headWire.scale.set(he.a, he.b, he.c);
    headWire.position.y = 0.15;
    group.add(headWire);
    // (10차 보강) 앞면(코) 마커 — 처음 봤을 때 어디가 앞인지 모르겠다는 피드백.
    // 얼굴 정면(+Z)에 액센트색 원뿔을 코처럼 붙임(그룹에 추가돼 함께 회전).
    // 코가 보이면 앞, 안 보이면 뒤 → 방향이 직관적으로 잡힘.
    const noseG = new THREE.ConeGeometry(he.a*0.18, he.c*0.5, 12);
    const noseM = new THREE.MeshBasicMaterial({ color:0xC98A4B });
    const nose = new THREE.Mesh(noseG, noseM);
    nose.rotation.x = Math.PI/2;            // 원뿔 축 +Y → +Z(정면)로
    nose.position.set(0, 0.06, he.c*0.98);  // 얼굴 높이·앞면 표면
    group.add(nose);
    // 앞면 라벨 대용 작은 텍스트 스프라이트("앞") — 코 위에 살짝
    try {
      const lc = document.createElement('canvas'); lc.width=64; lc.height=32;
      const lx = lc.getContext('2d');
      lx.fillStyle='#C98A4B'; lx.font='bold 22px sans-serif'; lx.textAlign='center'; lx.textBaseline='middle';
      lx.fillText('앞', 32, 16);
      const tex = new THREE.CanvasTexture(lc);
      const spr = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, transparent:true }));
      spr.scale.set(0.22, 0.11, 1);
      spr.position.set(0, 0.22, he.c*1.05);
      group.add(spr);
    } catch(e){}
  } catch(e){}
  let dragging=false, lastX=0, lastY=0, autoRot=true;
  const dom = renderer.domElement;
  dom.addEventListener('pointerdown', e=>{ dragging=true; autoRot=false; lastX=e.clientX; lastY=e.clientY; e.preventDefault(); });
  window.addEventListener('pointerup', ()=>{ dragging=false; });
  window.addEventListener('pointermove', e=>{
    if(!dragging || !devMini3D) return;
    group.rotation.y += (e.clientX-lastX)*0.01;
    group.rotation.x += (e.clientY-lastY)*0.01;
    lastX=e.clientX; lastY=e.clientY;
  });
  devMini3D = { renderer, scene, camera, group, headWire, strandObj:null, raf:null, autoRot:()=>autoRot };
  function animate(){
    if(autoRot) group.rotation.y += 0.005;
    renderer.render(scene, camera);
    devMini3D.raf = requestAnimationFrame(animate);
  }
  animate();
  return devMini3D;
}

// (11차) 중립 3D 모델에 섹션별 조정 연산자(길이·컬)를 적용해 "조정된 월드 가닥"을
// 반환. 미니뷰(3D)와 조정창 투영(2D)이 같은 소스를 쓰게 하는 단일 출처.
// srcAngleFilter를 주면 그 뷰 캡처 가닥만(뷰별 투영 시 교차뷰 잡음 방지).
function computeAdjustedHair3DStrands(srcAngleFilter){
  const model = state.hair3Dneutral;
  if(!model || !model.strands) return null;
  const out = [];
  for(const st of model.strands){
    if(srcAngleFilter && st.srcAngle !== srcAngleFilter) continue;
    const sec = (state.sections && state.sections[st.sec]) || {};
    const baseLen = (SECTIONS[st.sec] && SECTIONS[st.sec].defaults && typeof SECTIONS[st.sec].defaults.length==='number') ? SECTIONS[st.sec].defaults.length : 50;
    const ratio = Math.max(0, 1 + (((typeof sec.length==='number')?sec.length:baseLen) - baseLen) * LENGTH_RATIO_PER_UNIT);
    const curlAmt = (typeof sec.curl==='number')?sec.curl:0;
    let pts = lengthStrand3D(st.pts, ratio);                       // ① 3D 길이
    pts = curlStrand3D(pts, curlAmt, ((typeof sec.wave==='number')?sec.wave:50)/100); // ② 3D 컬(로드 나선)
    if(curlAmt > 0) pts = gravityDroop3D(pts, curlAmt);           // ③ 감은 뒤 중력 처짐
    out.push({ pts, color: st.color, sec: st.sec, srcAngle: st.srcAngle });
  }
  return out;
}

// 중립 모델 + 조정 연산자 → 미니뷰 LineSegments 재구성. 슬라이더가 바뀌면
// 재캡처·재리프트 없이 이 함수만 다시 불러 연산자를 재적용한다(효율+이중적용 방지).
function refreshDevMini3D(){
  if(!devMini3D) return;
  const adj = computeAdjustedHair3DStrands();
  if(!adj) return;
  const { group } = devMini3D;
  if(devMini3D.strandObj){
    group.remove(devMini3D.strandObj);
    if(devMini3D.strandObj.geometry) devMini3D.strandObj.geometry.dispose();
    if(devMini3D.strandObj.material) devMini3D.strandObj.material.dispose();
    devMini3D.strandObj = null;
  }
  const positions=[], colors=[]; const c=new THREE.Color();
  for(const st of adj){
    const pts = st.pts;
    // (12차) 미니뷰를 섹션별 색으로 — 어느 부위가 어느 섹션인지 눈으로 확인
    // (실기기 섹션 분포 튜닝용). SECTION_COLORS는 미니뷰 전용(실제 머리색 아님).
    c.set(SECTION_COLORS[st.sec] || '#cccccc');
    for(let i=0;i<pts.length-1;i++){
      positions.push(pts[i].x,pts[i].y,pts[i].z, pts[i+1].x,pts[i+1].y,pts[i+1].z);
      colors.push(c.r,c.g,c.b, c.r,c.g,c.b);
    }
  }
  if(!positions.length) return;
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(new Float32Array(positions),3));
  geo.setAttribute('color', new THREE.BufferAttribute(new Float32Array(colors),3));
  const obj=new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ vertexColors:true }));
  group.add(obj);
  devMini3D.strandObj = obj;
}

// (11차) 중립 3D 모델 생성 — 촬영된 뷰들을 중립(rawMode)으로 캡처 → 리프트.
// 조정과 무관하게 한 번만 만들면 되고(슬라이더는 연산자 재적용만), 3D 화면의
// 비중립 캡처(state.strandPaths)는 swap-restore로 보존한다.
function buildNeutralHair3D(cb){
  if(typeof THREE === 'undefined'){ cb && cb(); return; }
  const angles = ANGLES.filter(a => state.shots && state.shots[a]);
  if(!angles.length){ cb && cb(); return; }
  const savedPaths = state.strandPaths, savedModel = state.hair3D;
  state.strandPaths = {}; // 중립 캡처 임시 저장소
  let idx = 0;
  const done = ()=>{
    try { buildHairStrandsFromPaths(); } catch(e){ console.warn('중립 3D 리프트 실패:', e); }
    state.hair3Dneutral = state.hair3D || null;
    state.strandPaths = savedPaths; state.hair3D = savedModel; // 복원(3D 화면 캡처 보존)
    cb && cb();
  };
  const next = ()=>{ if(idx >= angles.length){ done(); return; } captureStrandPathsFor(angles[idx++], true).then(next); };
  next();
}

function resizeDevMini3D(){
  if(!devMini3D) return;
  const wrap = document.getElementById('devMini3DCanvasWrap');
  if(!wrap) return;
  const w=wrap.clientWidth, h=wrap.clientHeight;
  if(w<=0||h<=0) return;
  devMini3D.renderer.setSize(w,h);
  devMini3D.camera.aspect=w/h; devMini3D.camera.updateProjectionMatrix();
}

// 3D 조정 엔진 토글과 연동: ON이면 패널 표시+모델 반영, OFF면 숨김.
function showDevMini3D(on){
  const panel = document.getElementById('devMini3D');
  if(!panel) return;
  panel.style.display = on ? 'flex' : 'none';
  if(on){
    if(!devMini3D) initDevMini3D();
    setTimeout(()=>{ resizeDevMini3D(); refreshDevMini3D(); }, 30);
  }
}

function toggleDevMini3DExpand(){
  const panel = document.getElementById('devMini3D');
  if(!panel) return;
  panel.classList.toggle('expanded');
  setTimeout(resizeDevMini3D, 30); // 크기 전환 후 렌더러 리사이즈
}

// headGroup 재구성 시(스타일이 바뀌어 이전 가닥/두상을 지울 때) geometry/material을
// 같이 dispose. 자리표시자 돔 1개일 땐 신경 안 써도 됐지만, 가닥이 수십~백여
// 개로 늘면서 재구성마다 누적되는 GPU 메모리가 무시할 수준이 아니게 됨.
function disposeObject3D(obj){
  obj.traverse(node=>{
    if(node.geometry) node.geometry.dispose();
    if(node.material){
      const mats = Array.isArray(node.material) ? node.material : [node.material];
      // map(=사진 데칼의 CanvasTexture) dispose 추가 — 데칼은 재구성마다 새
      // 캔버스 텍스처를 새로 만들므로, 안 지우면 스트랜드 늘어날 때와 같은
      // 부류의 GPU 메모리 누수가 남는다.
      mats.forEach(m=>{ if(m.map) m.map.dispose(); m.dispose(); });
    }
  });
}

// 나중에 진짜 두상 파일(.glb)이 생기면 이 분기가 실행됨.
// GLTFLoader는 THREE 코어에 안 딸려있어서 실제 사용 시 별도 CDN 스크립트
// (three@0.128.0용 GLTFLoader.js) 추가가 필요 — procedural 단계에선 로드 안 함.
function loadHeadMeshFromGLTF(url){
  return new Promise((resolve, reject)=>{
    if(typeof THREE.GLTFLoader !== 'function'){
      reject(new Error('GLTFLoader 스크립트가 로드되지 않았습니다 — gltf 모드로 전환 시 CDN 스크립트 추가 필요'));
      return;
    }
    const loader = new THREE.GLTFLoader();
    loader.load(url, gltf=>resolve(gltf.scene), undefined, reject);
  });
}

async function loadHeadMesh(faceMetrics, skinColorCss){
  if(HEAD_MESH_SOURCE.type === 'gltf' && HEAD_MESH_SOURCE.url){
    const scene = await loadHeadMeshFromGLTF(HEAD_MESH_SOURCE.url);
    return { group: scene, headMesh: scene };
  }
  return buildProceduralHead(faceMetrics, skinColorCss);
}

function initModel3DRenderer(container){
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  renderer.setSize(container.clientWidth, container.clientHeight);
  renderer.localClippingEnabled = true; // 실제 전신 OBJ 에셋의 머리/목 부분을 잘라내는 클리핑 플레인 사용(loadOutfitMeshFromOBJ 참고)
  // 버그 수정(2026-07-14): 기존 container.innerHTML='' 가 WebGL 캔버스만이
  // 아니라 뷰포트 안의 오버레이 UI(#model3dTag "범용 3D 두상" 태그,
  // "드래그해서 회전" 힌트, #strandDebugToggle "기준면 보기" 버튼)까지
  // 통째로 삭제하고 있었음 — 그래서 3D 화면에서 이 오버레이들이 어떤
  // 버전에서도 전혀 안 보였던 것(사용자 스크린샷으로 확인, "토글이 없다"의
  // 진짜 원인. setupModel3DScreen의 model3dTag 갱신 코드도 if(tag) 가드
  // 때문에 조용히 스킵되고 있어서 지금까지 아무 에러 없이 숨어 있었음).
  // → 이전 렌더러 캔버스만 골라서 제거하고 오버레이 요소들은 보존.
  // 오버레이는 전부 position:absolute라 static인 캔버스 위에 그려짐.
  container.querySelectorAll('canvas').forEach(c=>c.remove());
  container.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(32, container.clientWidth/container.clientHeight, 0.1, 100);
  // 초기 위치는 임시값 — 실제 프레이밍은 모델을 다 구성한 뒤 frameCameraToHead()가
  // 바운딩 박스 기준으로 다시 계산해서 덮어씀 (아래 버그 수정 참고).
  camera.position.set(0, 0, 5);

  const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
  keyLight.position.set(1.5, 2, 2);
  scene.add(keyLight);
  const fillLight = new THREE.DirectionalLight(0xffffff, 0.35);
  fillLight.position.set(-2, 0.5, 1);
  scene.add(fillLight);
  scene.add(new THREE.AmbientLight(0xffffff, 0.55));

  const headGroup = new THREE.Group();
  scene.add(headGroup);

  // 드래그 회전 (OrbitControls 없이 직접 구현 — 가벼움 유지)
  let dragging=false, lastX=0, autoRotate=true;
  const dom = renderer.domElement;
  dom.style.touchAction='none';
  dom.addEventListener('pointerdown', e=>{ dragging=true; autoRotate=false; lastX=e.clientX; });
  window.addEventListener('pointerup', ()=>{ dragging=false; });
  window.addEventListener('pointermove', e=>{
    if(!dragging) return;
    const dx = e.clientX - lastX; lastX = e.clientX;
    headGroup.rotation.y += dx * 0.01;
  });

  const state3D = { renderer, scene, camera, headGroup, container, autoRotateRef:()=>autoRotate };

  function animate(){
    if(autoRotate) headGroup.rotation.y += 0.004;
    renderer.render(scene, camera);
    model3D.animId = requestAnimationFrame(animate);
  }
  model3D = { ...state3D, animId:null, initialized:true };
  animate();
  return model3D;
}

function resizeModel3D(){
  if(!model3D || !model3D.initialized) return;
  const { renderer, camera, container } = model3D;
  const w = container.clientWidth, h = container.clientHeight;
  if(w<=0||h<=0) return;
  renderer.setSize(w, h);
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  frameCameraToHead(); // 화면 크기(aspect)가 바뀌면 프레이밍도 다시 계산
}
window.addEventListener('resize', resizeModel3D);

// 버그 수정: 예전엔 camera.position을 (0,0.1,3.4) 같은 눈대중 값으로 고정해뒀는데,
// 실기기 스크린샷을 보니 두상이 화면을 꽉 채우고 눈·헤어·목이 전부 프레임 밖으로
// 잘려나가는 심한 줌인 버그였음(회전 자체는 되고 있었는데 특징 없는 곡면만 보여서
// "안 움직인다"고 느껴진 것). 원인은 카메라 거리/화각을 모델 실제 크기와 무관하게
// 손으로 대충 잡았던 것 — 화면 세로/가로 비율(aspect)에 따라 필요한 거리가 다른데
// 그걸 반영 안 함.
// → 모델의 바운딩 박스를 실측해서 세로 기준/가로 기준 두 필요거리 중 더 큰 쪽으로
// 카메라를 배치하도록 수정. 이렇게 하면 나중에 진짜 두상 3D 파일(다른 크기·비율)로
// 바꿔도 다시 눈대중으로 튜닝할 필요 없이 항상 알맞게 잡힘.
function frameCameraToHead(){
  if(!model3D || !model3D.initialized) return;
  const { camera, headGroup } = model3D;
  const box = new THREE.Box3().setFromObject(headGroup);
  if(box.isEmpty()) return;
  const size = box.getSize(new THREE.Vector3());
  const center = box.getCenter(new THREE.Vector3());

  const vFov = camera.fov * Math.PI/180;
  const MARGIN = 1.45; // 프레임 가장자리에 여백을 두기 위한 배율
  const distForHeight = (size.y/2) / Math.tan(vFov/2);
  const distForWidth  = (size.x/2) / (Math.tan(vFov/2) * camera.aspect);
  const dist = Math.max(distForHeight, distForWidth) * MARGIN;

  camera.position.set(center.x, center.y, center.z + dist);
  camera.near = Math.max(0.01, dist/100);
  camera.far  = dist*100;
  camera.lookAt(center);
  camera.updateProjectionMatrix();
}

// 'model3d' 화면 진입 시 셋업: 렌더러 최초 1회 생성(이후엔 재사용), 확정된
// 스타일 파라미터로 두상+헤어캡 다시 그림.
async function setupModel3DScreen(){
  const container = document.getElementById('model3dViewport');
  if(!container) return;

  if(!model3D || !model3D.initialized){
    initModel3DRenderer(container);
  } else {
    resizeModel3D();
  }

  // 이전에 그려둔 두상/헤어 제거 후 새로 구성 (스타일이 바뀌었을 수 있으므로).
  // 가닥이 수십~백여 개로 늘면서 dispose 없이 remove만 하면 GPU 메모리가
  // 재구성마다 누적되므로 disposeObject3D()로 geometry/material까지 정리.
  while(model3D.headGroup.children.length){
    const obj = model3D.headGroup.children[0];
    disposeObject3D(obj);
    model3D.headGroup.remove(obj);
  }
  model3D.headGroup.rotation.y = 0; // 프레이밍 계산이 항상 같은 기준(정면)에서 이뤄지도록 리셋

  model3DGeneration++;
  const myGen = model3DGeneration;

  // 실측 얼굴 비율(getFaceMetrics)과 실제 두피색(scalpColor — extractHairMask가
  // 이미 얼굴 피부에서 샘플링해뒀던 값, 지금까진 언더코트 색으로만 쓰이고 3D엔
  // 전혀 반영 안 되고 있었음)을 뽑아서 두상 생성에 넘긴다.
  const faceMetrics = getFaceMetrics();
  const skinColorCss = (state.hairMasks && state.hairMasks.front && state.hairMasks.front.scalpColor) || '#E8C39E';

  const { group } = await loadHeadMesh(faceMetrics, skinColorCss);
  model3D.headGroup.add(group);

  // (2026-07-16 재작성) 3D 헤어 = "2D 전체를 3D 좌표로 그대로 옮기기" 단일 경로.
  // 사용자 지시: "그냥 전체를 3D좌표로 옮겨. 함수랑 섞으면 더 복잡해" —
  // 절차 생성(buildHairStrands)·AI 볼륨 보완·styleParams·viewMapping 등
  // 함수 기반 3D 헤어 경로를 이 화면에서 전부 제거. 아직 캡처 안 된 뷰는
  // 오프스크린 렌더로 경로를 먼저 확보해서 네 뷰 전부 옮기기로만 렌더.
  for(const a of ANGLES){
    const has = state.strandPaths && state.strandPaths[a] && state.strandPaths[a].strands && state.strandPaths[a].strands.length;
    if(!has && state.shots[a]) await captureStrandPathsFor(a);
  }
  if(myGen !== model3DGeneration) return; // 캡처 대기 중 화면 재구성됨 — 오래된 진행 중단

  const liftedStrands = buildHairStrandsFromPaths();
  if(liftedStrands){
    model3D.headGroup.add(liftedStrands);
  } else {
    // 사진/마스크가 하나도 없어 캡처 자체가 불가능한 경우 — 두상만 표시.
    // (절차 생성 폴백은 사용자 결정으로 제거 — 함수 생성 헤어를 섞지 않음)
    console.warn('[3D] 옮길 2D 가닥 경로가 없음 — 헤어 없이 두상만 표시');
  }

  // [진단용] 가닥 뿌리 기준면(가상 타원체) — "기준면 보기" 토글로 표시.
  // headGroup 재구성 때마다 새로 만들어 넣되, 토글 상태는 유지.
  const strandDebugMesh = buildStrandProjectionEllipsoidDebug();
  strandDebugMesh.visible = !!state.debugShowStrandSurface;
  model3D.headGroup.add(strandDebugMesh);

  // (3단계) 헤어스타일 기반 의상 추천 + 플레이스홀더 부착.
  // 버그 수정(2026-07-13): 예전엔 state.selectedStyle이 있어야만 실행됐는데,
  // "스타일 미적용"(프리셋 없이 직접 조정) 모드에서는 이 조건이 항상 false라
  // 의상 로딩 전체가 스킵되고 3D에 두상만 남는 원인이었음(recommendOutfitWithAI
  // 자체도 위에서 동일하게 수정). 정면 사진만 있으면 되도록 조건 완화 —
  // recommendOutfitWithAI 내부에서 style 유무에 따라 알아서 다르게 설명 구성.
  let outfitTag = '';
  if(state.shots && state.shots.front){
    showAI('AI가 어울리는 의상을 고르고 있어요…','헤어스타일 기반 추천 (데모)');
    const outfitRec = await recommendOutfitWithAI();
    hideAI();
    if(outfitRec && myGen === model3DGeneration){
      const outfitMesh = await loadOutfitMesh(outfitRec.item, faceMetrics.widthFactor);
      model3D.headGroup.add(outfitMesh);
      outfitTag = ` · 의상 추천: ${outfitRec.item.name}(${outfitRec.item.category}, 데모)`;
    }
  }

  frameCameraToHead(); // 버그 수정: 모델 크기 기준으로 카메라 거리 자동 계산 (이전엔 눈대중 고정값이라 심하게 줌인됐었음)

  // 실측 정면 사진 기반 얼굴은 비동기(이미지 로드)라 두상·헤어부터 먼저
  // 그려서 화면이 비지 않게 한 뒤 나중에 얹는다. myGen이 그 사이 바뀌었으면
  // (화면을 벗어났다 다시 들어와 headGroup이 재구성된 경우) 오래된 결과를
  // 버린다. 진짜 3D 얼굴 메쉬(buildRealFaceMesh, 468개 랜드마크 기반 입체)를
  // 먼저 시도하고, rawLandmarks가 없는 경우(폴백 추정 랜드마크, 예전 캐시
  // 데이터 등) 기존 평면 데칼(buildFacePhotoDecal)로 자동 대체 — 신규
  // 실패 모드 추가 아님.
  buildRealFaceMesh(faceMetrics).then(realFace=>{
    if(realFace && myGen === model3DGeneration && model3D && model3D.initialized){
      model3D.headGroup.add(realFace);
      return;
    }
    // 폴백: 평면 데칼
    return buildFacePhotoDecal(faceMetrics).then(decal=>{
      if(!decal || myGen !== model3DGeneration || !model3D || !model3D.initialized) return;
      model3D.headGroup.add(decal);
    });
  }).catch(e=>console.warn('얼굴(실제 메쉬/데칼 둘 다) 첨부 실패(절차적 이목구비 유지):', e));

  const tag = document.getElementById('model3dTag');
  if(tag){
    const name = state.selectedStyle ? state.selectedStyle.name : '커스텀 스타일';
    tag.textContent = `범용 3D 두상 · ${name} 적용 (프로토타입)${outfitTag}`;
  }
}

/* ════════════════════════════════════════
   HELPERS
════════════════════════════════════════ */
function showAI(text,sub){
  document.getElementById('aiOverlayText').textContent=text;
  document.getElementById('aiOverlaySub').textContent=sub;
  document.getElementById('aiOverlay').classList.remove('hidden');
}
function hideAI(){ document.getElementById('aiOverlay').classList.add('hidden'); }

let toastTimer;
function showToast(msg){
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>el.classList.remove('show'),2800);
}

function startNewCustomer(){
  aiAnalysis=null;
  state.aiSectionEstimate=null; // (a) 실측 사진 기반 3D 보정 캐시도 새 고객마다 초기화
  state.hair3D=null; state.hair3Dneutral=null; // (11차) 3D 모델 캐시도 새 고객마다 무효화
  state.aiOutfitRecommendation=null; // (3단계) 의상 추천 캐시도 초기화
  _headCrossSectionCache = null; // 두상 실측 단면(Shape-from-Silhouette) 캐시도 새 고객마다 초기화
  _headVerticalRadiusCache = null; // 두상 세로 반지름 실측 캐시도 새 고객마다 초기화
  _headEllipsoidLogged = false; // [진단용] 두상 넙적도 로그도 새 고객마다 다시 1회 출력
  ANGLES.forEach(a=>{state.shots[a]=null;state.hairCanvases[a]=null;state.hairMasks[a]=null;state.baseCanvases[a]=null;});
  state.landmarks = {};
  state.captureLmStatus = {}; // 촬영 직후 랜드마크 감지 배지 상태도 초기화
  state.liveYaw = {};         // 촬영 직전 라이브 실측 yaw도 초기화
  _lastLiveYaw = null;
  state.strandPaths = {}; // 캡처된 2D 가닥 경로(3D 리프트 소스)도 초기화
  _silhouetteAnchorCache = {}; // 실루엣 앵커 캐시도 새 고객마다 초기화
  state.selectedStyle=null; state.currentCaptureIndex=0; state.currentSection='crown';
  // 섹션 초기화
  SECTION_ORDER.forEach(id=>{
    state.sections[id] = {...SECTIONS[id].defaults};
  });
  state._globalCurl = 30;
  document.getElementById('aiAnalysisCard').style.display='none';
  document.querySelectorAll('.style-card').forEach(c=>c.classList.remove('ai-recommended','selected'));
  document.getElementById('toAdjustBtn').disabled=true;
  ['style','adjust','compare','model3d'].forEach(id=>{ const t=document.getElementById('nav-'+id); if(t) t.disabled=true; });
  updateAngleUI();
  navTo('capture');
}
</script>
