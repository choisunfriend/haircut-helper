  ── 재발 방지 교훈(같은 함정을 다시 밟지 말 것) ──
  A. 전역 상태 공유로 뷰가 뒤섞임: SECTIONS를 4개 뷰가 공유하다 경계 인식이
     서로 오염된 적 있음. 뷰별 데이터는 반드시 뷰별로 분리.
  B. resolveSectionId가 정면 뷰에서 존재하지도 않는 'side' 섹션을 반환 —
     에러는 안 났지만 로직이 조용히 틀렸음. "실행됨 ≠ 맞음"의 대표 사례.
  C. "우산처럼 벌어진 헤어" 버그: 포즈 회전을 전치 없이(정회전으로) 적용해
     가닥이 바깥으로 뒤집힘. 카메라공간 좌표엔 역회전을 써야 함(좌표 규약 참고).
  D. 두상 폭 과대실측 → 원반/납작 두상: personMask 오탐으로 목 밴드 하나가
     튀면 "좁은 목 위 넓은 챙" 원반이 됨. 전역 clamp(NECK_RATIO 0.7~3.0)만으론
     국소 스파이크를 못 막아 인접 밴드 변화폭 제한(NECK_STEP_MAX=1.35)을 추가.
     (computeHeadCrossSections의 두상 폭 실측 자체가 부풀어 3D가 접시처럼
     나오는 문제는 아직 미해결 — 다음 진단 대상.)
  E. 촬영각 함정: 좌/우측을 90°로 찍으면 MediaPipe 랜드마크 인식이 실패한다.
     실제 촬영은 경사(24°/39° 등)로 이뤄지므로, "측면=90°"를 가정하지 말고
     실측 yaw를 써야 한다(헤어 헐 실측을 관측각 역투영으로 일반화한 이유).
  F. 헤어 세로 앵커: 출발점(오프셋)은 두피(크라운→돔 꼭대기)에 고정하고,
     배율만 눈/턱 실측에서 가져온다. 오프셋까지 눈 기준으로 하면 촬영각이 큰
     뷰에서 뿌리가 목까지 흘러내린다("가닥이 눈에서 출발" 버그의 교정).
  G. 뷰 품질 게이트: 캡처가 존재하기만 하면 불량이어도 거울 폴백이 양보해
     뒤통수가 비었음. 가닥<12개 또는 유효컬럼<8%면 실측 부적격으로 제외해
     거울 채움이 들어오게 함.

  ── 2026-07-19 얼굴 메쉬 측면 깊이 통합(평평한 얼굴 개선) ──
  사용자 지적: outputFacialTransformationMatrix(실측 회전)를 헤어엔 4장 전부
  적용하면서 얼굴은 front 단안 z만 쓰고 측면 실측은 코·턱·이마 3점에만 썼음.
  "안 쓸 거면 헤어처럼 전체를 같은 방식으로 통합하면 연결부위 문제가 없다."
  진단으로 확인한 사실: (1) front 얼굴에 실측 회전을 그냥 걸면 pitch가 코 같은
  돌출부를 지렛대처럼 밀어 "막대기 버그"가 재발함(역회전이어도 front는 yaw가
  작아 정회전과 이동량 동일 — 회전 방향이 아니라 "front=월드기준" 규약이 핵심).
  (2) 얼굴 깊이가 computeHeadCrossSections와 이어지는 유일한 끈은 ELL_C(두상
  깊이 반경)이고, 측면 실측 보정이 그 얕은 ELL_C를 교정하는 유일한 통로였는데
  3앵커에만 적용돼 있었음.
  적용: front엔 회전을 걸지 않되(막대기 방지), 깊이(z)만 465개 나머지 정점도
  좌/우 측면 실측(projectImagePointToHead — 헤어와 동일 경로)으로 받아온다.
  computeFullProfileDepthMap 신설: 정점별로 좌/우 측면에 투영해 실측 z를 직접
  얻고, front 추정 z와의 차이(deltaZ)를 정점에 직접 적용. 안전장치는 3앵커
  버전과 동일(신뢰도<0.5 스킵, 타원 밖 스킵, 좌우 모순 스킵, ±0.6*ELL_C clamp,
  실측 없는 정점은 front 폴백). 3앵커 가우시안 확산은 전체맵에 실측 없는
  정점의 폴백으로 유지. 스위치 USE_FULL_PROFILE_DEPTH=true(문제 시 false).
  검증: node --check OK. 하네스(원반 두상 ELL_C=0.55): 얼굴 깊이 범위
  0.070→0.121(+73%, 더 입체적) 확인.
  ⚠ 한계: 여전히 ELL_C에 얹히는 상대 보정이라 근본인 원반 두상(작은 ELL_C)이
  고쳐지지 않으면 clamp 폭도 작아 개선폭에 한계. 하지만 얼굴이 두상과 같은
  좌표계(측면 실측)로 통합돼 연결부위 불일치는 해소. 실기기 재확인 필요 —
  특히 측면 랜드마크 오탐이 많은 정점을 밀지 않는지(clamp·좌우모순 검사가
  전 정점에 걸리므로 안전할 것으로 예상하나 미검증).

  ── 2026-07-19 넙적한 원반 두상 수정(computeHeadCrossSections 각도 역투영) ──
  사용자 관찰(실기기): "기준면 자체가 넙적한 타원체라서 그 모양대로 나왔다"
  (정면↔후면 두상 연결은 잘 됨). 실측값 분석으로 근본 원인 확정:
  computeHeadCrossSections가 좌/우측 헤어 실루엣 반폭을 halfDepth로 "그대로"
  기록했는데, 측면 사진이 완전 옆모습(90°)이 아니라 실측 25~31°(이 앱은 90°면
  랜드마크 인식 실패라 경사 촬영이 정상 — 교훈 E). 이 각도에선 실루엣 반폭 E에
  깊이(D)보다 폭(W) 성분이 더 많이 섞여(E²=W²cos²θ+D²sin²θ, 25°면 cos²≈0.82),
  E를 순수 깊이로 쓰면 실제 깊이가 15~17% 얕게 나옴 → 폭 정상·깊이 과소 =
  넙적한 원반. (헤어 헐 buildHairStrandsFromPaths는 이미 이 역투영을 쓰는데
  두상 단면만 그 수정을 못 받았던 것.)
  수정: accumulate가 폭/깊이를 각도로 분리하지 않고 각 밴드에 관측
  (E, cos²θ, sin²θ, confidence)만 모은 뒤 역투영으로 W·D 복원.
  · W(폭): 정면성 높은 관측(cos²>0.9=front/back)은 E≈W이므로 직접 평균.

  · 폴백: 정면 관측 없으면 rHead(0.82)로 W 추정, 측면 관측 없으면 D=W×rHead.

  · angularWeight/buildViewMapping/propagateSectionToViews(+state.viewMapping) —
    flat 섹션 모델(state.sections[secId] 하나로 전 뷰 자동 적용) 도입 후 유일
    소비자가 사라진 뷰 간 가중치 매핑. buildViewMapping 호출·[매핑] 로그도 제거.
  · gySectionHemCapNy/HEM_OVERLAP — 4차 헴 캡, 6차 실측 길이 렌더로 대체돼 미호출.
  · splitIndexFor 스테일 주석 정정(함수는 6차에 이미 소멸).
  검증: node --check OK + 회귀 하네스(섹션 판정 3종·투영 왕복 3종 6/6) 통과 —
  제거가 동작에 영향 없음 확인. 순 약 -80줄. getViewYawDeg/getViewPoseSource 등
  3D 리프트가 쓰는 헬퍼는 보존. symmetrize1D는 cleanupLine1D의 문서화된 선택
  단계로 연결돼 있어(런타임 미발동이나 orphan 아님) 유지.

  ── 2026-07-22 (중복 통합) 반복 로직 4종을 공용 유틸로 ──
  "중복된 함수와 로직을 찾아 하나로 합쳐. 동작 동일 유지." grep으로 실제 중복만:
  · hashFract(x) — 결정적 의사난수 fract(sin(x)·43758.5453). pseudoRandForCol·
    결불연속 임계(_discThr)·슬라이스 스태거(sliceJit) 3곳이 각자 인라인하던 것 통합.
  · strokeSmoothPolyline(ctx, pts) — quadratic 중간점 곡선 스트로크.
    drawHairStrands의 strokePolyline(별칭으로 유지)과 projectHair3DToView의
    인라인 루프가 글자 그대로 같던 것 통합.
  · makeImgToCanvas(fit,maskW,maskH) — 이미지→캔버스 좌표 매핑. drawHairStrands
    (toCanvasX/Y)와 projectHair3DToView(toCX/toCY) 통합(구조분해로 지역명 유지).
  · clampCol(ix) — 컬럼 인덱스 [0,maskW-1] 클램프. makeColumnResolver·
    colorForSection 2곳 통합(createColumnStyleResolvers 지역 헬퍼).
  인자를 그대로 넘겨 산술 결과 완전 동일. 검증: node --check + 회귀 하네스
  (hashFract·makeImgToCanvas 동일성 + 섹션 판정·투영 왕복 8/8) 통과.
  ※ 서로 다른 스코프의 사소한 1줄식(예: Math.max 길이 하한)은 함수화가 오히려
    간접참조만 늘려 통합 안 함 — 진짜 반복 블록만 대상.

  ── 2026-07-22 (11차) 3D 조정 2단계 착수 — 순수 3D 연산자 + 미니뷰 배선 ──
  "3D 조정으로 간다"에 이어 조정 연산자를 3D로 이관 시작(개발용 미니뷰에서 먼저).
  · 순수 벡터 유틸(_v3sub/add/scale/len/norm/cross) + 3D 연산자 2종:
    - curlStrand3D(pts, curlAmt, waveT): 가닥 코어축 둘레로 나선(helix) 변위.
      뿌리 고정, 끝으로 갈수록 진폭 포화. 2D의 "직모 위 잔물결" 한계 없이 두상
      곡면 위에서 진짜로 감김. curlAmt=0이면 무변경.
    - lengthStrand3D(pts, ratio): 호길이 기준 트림(ratio<1)/연장(ratio>1),
      연장은 마지막 방향 유지. 뿌리 고정.
  · 중립 모델 파이프라인: buildNeutralHair3D가 촬영 뷰를 rawMode(길이 기본·컬0)로
    캡처→리프트해 state.hair3Dneutral 생성(조정 무관 고정, 3D 화면 캡처는
    swap-restore로 보존). refreshDevMini3D가 이 중립 모델에 섹션별 길이·컬
    연산자를 적용해 미니뷰 LineSegments 재구성 — 슬라이더는 재캡처 없이 연산자만
    재적용(가벼움+이중적용 방지). captureStrandPathsFor에 rawMode 인자 추가.
  · 배선: 토글 ON→중립모델 1회 생성→연산자 적용. 슬라이더→scheduleHair3DRefresh
    (120ms)로 연산자 재적용. 새 고객 시 hair3D/hair3Dneutral 무효화.
  · 2D 메인 렌더는 그대로(projectTo2D off) — 미니뷰가 "3D 조정 미리보기"로
    먼저 검증되면, 이후 메인 렌더를 3D 투영으로 전환(3단계).
  검증: node --check + 연산자 하네스(컬 진폭 스케일·뿌리 고정·코어 수직·길이
  트림/연장 비율 7/7) + 종합 회귀(13/13) 통과. 미니뷰 시각 확인은 실기기.

  ── 2026-07-23 (11차 3단계) 조정창 = 3D 투영(비교 화면 제거 준비) ──
  사용자: "비교하기 화면은 장기적으로 뺄 거고, 조정창에서 바로 투영되면 안 되나?"
  → 조정창 메인 렌더를 3D 모델의 투영으로 전환(3D 엔진 β ON일 때). "3D로 조정,
  2D로 표현"의 완성이자 비교 화면 제거의 토대.
  · computeAdjustedHair3DStrands(srcAngleFilter): 중립 모델 + 조정 연산자(길이·컬)를
    적용한 "조정된 월드 가닥" 단일 출처. 미니뷰(3D)와 조정창 투영(2D)이 공유.
    srcAngle 필터로 그 뷰 캡처 가닥만 → 교차뷰 잡음 없이 "그 뷰 머리=3D조정 투영".
  · projectHair3DToView 재작성: 소스를 state.hair3D→hair3Dneutral+연산자, 최소
    파리티(두피색 언더코트 굵게→머리색 가닥 가늘게, painter's 깊이정렬) 추가.
  · renderFrame: use3DAdjust ON + 중립모델 준비 + 투영 성공 시 투영, 아니면 기존
    2D drawHairStrands 폴백(엔진 OFF=기본은 완전 무변경). 컬은 curl3D 진폭 0.11.
  · 컬 진폭 0.05→0.11(실기기 "컬 약함"). CURL3D_AMP 상수로 튜닝.
  · 미니뷰: "3D 검증"→"3D 미리보기"(제품 기능화), 확대는 fixed 전체창(세로 확보),
    기본 크기↑. 슬라이더·패널·미니뷰 밝기 상향.
  검증: node --check + 조정연산자 하네스(컬 진폭·직선유지·길이배율·srcAngle 필터
  6/6). 투영 시각 품질(파리티·가림)은 실기기 확인 — 거칠면 언더코트/굵기/클립 보강.
  다음: 확인되면 비교 화면 제거 + 4뷰 통합 모델(현재는 뷰별 자기 캡처 투영).

  ── 2026-07-23 (11차 컬 물리 교정) 로드 고정 — 길이 비례 폐기 ──
  실기기 3D: 컬이 톱니처럼 튀고 짧은 가닥은 폭발. 1차 수정(호길이 비례 진폭)도
  틀림 — 사용자 교정: "한 사람 머리 안에서 길고 짧은 데가 있어도 미용사는 같은
  웨이브 폭(로드)으로 컬을 넣는다." 즉 루프 지름은 로드 크기로 정해지고 머리
  전체 동일, 길이 비례가 아님. 긴 머리는 같은 로드에 더 여러 바퀴 감길 뿐.
  재작성: 웨이브폭 → 로드 반경 R(CURL3D_R_MIN 0.02 ~ R_MAX 0.07, 머리 전체 고정),
  컬세기 → R에 감긴 정도(진폭=curl×R), 한 바퀴 arc=로드 둘레(2πR)/stepLen →
  긴 가닥 자동으로 더 여러 바퀴. 최소 4스텝/바퀴로 톱니 방지.
  검증: node --check + 하네스 6/6(길이 달라도 진폭=R 동일, 웨이브폭이 루프 크기,
  긴 가닥 더 여러 바퀴, 컬0 무변경). R_MIN/MAX가 세기 튜닝 지점.

  ── 2026-07-23 (11차 중력 처짐) 로드로 감은 뒤 중력 — 3D 경로에 복원 ──
  사용자: "그렇게 된 다음에 적절한 중력이 작용. 이전에 얹었었는데 없어졌어."
  확인: 2D(traceStrandPath)의 중력(gravityPull·이탈후 아래수렴)은 그대로 있으나,
  새 3D 컬 연산자(curlStrand3D)엔 중력이 없어 균일 나선(뻣뻣한 스프링)이었음.
  추가: gravityDroop3D — 컬 나선 위에 얹는 마지막 단계. 뿌리 고정, 끝으로 갈수록
  가속 처짐(t²), 컬 강할수록 탱탱하게 덜 처짐(hold=1-0.6×curl). computeAdjusted…
  에서 길이→컬→중력 순 적용(curl>0일 때만). GRAV3D_STRENGTH가 처짐 세기 튜닝.
  검증: 하네스 6/6(뿌리 고정, 끝 아래 처짐, t² 가속, 강한컬 덜 처짐, x·z 불변).

  ── 2026-07-23 (12차) 섹션 재분배 — 프론트 무반응·사이드 과소 수정 + 섹션 색 ──
  실기기: "프론트 만질 때 하나도 안 먹고 크라운만 먹힌다. 사이드도 작다."
  원인: 프론트가 "헤어라인~눈썹 얇은 띠 × 귀 사이 좁은 폭(7%)"만 소유해 그 위
  중앙이 전부 크라운으로 먹혔고, 측면은 크라운(위 35%)이 사이드를 눌렀음.
  수정:
  · 프론트 = 중앙 컬럼 전체(꼭대기~눈썹). 세로 하한(frontY0) 제거.
  · 프론트 x밴드 = 머리 실측 좌우 폭의 중앙 50%(귀 폭이 더 넓으면 채택) —
    귀가 좁게 잡혀도 밴드가 안 쪼그라들게. 하네스: 정면 front 14→48%.
  · 측면 parietalFrac 0.35→0.25(크라운 축소), 사이드 fw 밴드 25→22%(사이드 확대).
    하네스: 좌측 side 13→32%, crown 55→40%.
  · 미니뷰를 섹션별 색(SECTION_COLORS: 크라운=호박/프론트=파랑/템플=핑크/
    사이드=초록/후두부=보라/네이프=주황)으로 칠해 부위-섹션 대응을 눈으로 확인.
  검증: node --check + 섹션 재분배 하네스 5/5(정면 프론트 주도·크라운<45,
  좌측 사이드>=28·크라운<42). 실기기 색 확인으로 추가 튜닝.
-->

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>결 GYEOL — 스타일 프리뷰</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1B1816; --surface:#242019; --surface-2:#2D2820; --line:#3A332B;
  --accent:#C98A4B; --accent-soft:#E8C39E; --text:#F3ECE2; --text-muted:#9C9183;
  --ok:#8FA888; --warn:#C2685A;
  /* gyeol 공정 색상 — 커트=세이지, 펌=구리, 컬러=자수정 */
  --gy-cut:#7FA88C; --gy-perm:#C99A6A; --gy-color:#B0788F;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}

/* ── HEADER ── */
header{
  display:flex;align-items:center;justify-content:space-between;
  padding:env(safe-area-inset-top,14px) 20px 12px;
  padding-top:max(env(safe-area-inset-top),14px);
  background:var(--surface);border-bottom:1px solid var(--line);flex-shrink:0;
  min-height:54px;
}
.brand-mark{font-family:'Fraunces',serif;font-size:20px;font-weight:600;color:var(--accent-soft);}
.stage-pill{
  font-size:11px;letter-spacing:1px;text-transform:uppercase;
  background:var(--surface-2);border:1px solid var(--line);
  padding:4px 10px;border-radius:20px;color:var(--text-muted);
}
.stage-pill b{color:var(--accent-soft);font-weight:600;}

main{flex:1;position:relative;overflow:hidden;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.active{display:flex;}

/* ── BOTTOM NAV ── */
.bottom-nav{
  display:flex;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0);flex-shrink:0;
}
.nav-tab{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;cursor:pointer;border:none;background:none;
  color:var(--text-muted);font-size:10px;letter-spacing:0.5px;
  transition:color .15s;
}
.nav-tab .icon{font-size:18px;}
.nav-tab.active{color:var(--accent-soft);}
.nav-tab:disabled{opacity:0.35;cursor:not-allowed;}

/* ── BUTTONS ── */
.btn{
  border:none;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;
  border-radius:12px;padding:13px 20px;font-size:14px;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  transition:transform .1s,opacity .15s;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent);color:#1B1816;}
.btn-primary:disabled{background:var(--surface-2);color:var(--text-muted);cursor:not-allowed;}
.btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--line);}

/* ── SCREEN 1: CAPTURE ── */
#screen-capture{background:var(--bg);}
.capture-video-wrap{
  flex:1;position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  background:#0a0907;
}
#video{width:100%;height:100%;object-fit:cover;display:block;}
.cam-off-msg{color:var(--text-muted);font-size:13px;text-align:center;padding:0 32px;line-height:1.8;position:absolute;}
#shotPreview{width:100%;height:100%;object-fit:cover;display:none;position:absolute;inset:0;}
.face-guide-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
.cap-hint{
  position:absolute;bottom:14px;left:0;right:0;text-align:center;
  font-size:13px;color:var(--accent-soft);
  background:rgba(27,24,22,0.6);padding:6px;
}

/* angle strip */
.angle-strip{
  display:flex;gap:0;background:var(--surface);border-top:1px solid var(--line);
  flex-shrink:0;
}
.angle-item{
  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:8px 4px;cursor:pointer;position:relative;border-right:1px solid var(--line);
}
.angle-item:last-child{border-right:none;}
.angle-item.current::after{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent);
}
.angle-thumb{
  width:36px;height:36px;border-radius:6px;
  background:var(--surface-2);overflow:hidden;display:flex;align-items:center;justify-content:center;
}
.angle-thumb img{width:100%;height:100%;object-fit:cover;}
.angle-name{font-size:10px;color:var(--text-muted);letter-spacing:0.5px;}
.angle-check{font-size:11px;color:var(--ok);}

.capture-actions{
  display:flex;gap:10px;padding:12px 16px;
  background:var(--surface);flex-shrink:0;
}
.shutter-btn{
  width:60px;height:60px;border-radius:50%;
  background:var(--accent);border:4px solid rgba(201,138,75,0.3);
  flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;
  font-size:20px;transition:transform .1s;align-self:center;
}
.shutter-btn:active{transform:scale(0.92);}
.cap-right{flex:1;display:flex;flex-direction:column;gap:8px;}
.dial-row{display:flex;align-items:center;gap:10px;}
.dial-mini{position:relative;width:44px;height:44px;flex-shrink:0;}
.dial-mini svg{width:100%;height:100%;}
.dial-mini-center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--text-muted);}
.cap-hint-small{font-size:12px;color:var(--accent-soft);flex:1;}
.cap-btns{display:flex;gap:8px;}

/* ── SCREEN 2: STYLE ── */
#screen-style{overflow:hidden;}
.style-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:12px 12px 4px;}
.style-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
.style-card{
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;
  padding:12px;cursor:pointer;transition:border-color .15s,transform .1s;
  display:flex;flex-direction:column;gap:7px;
}
.style-card:active{transform:scale(0.98);}
.style-card.selected{border-color:var(--accent);}
.style-card.ai-recommended{border-color:var(--ok);}
.style-card-none{border-style:dashed;opacity:0.85;}
.style-card-none.selected{opacity:1;}
.style-icon-box{height:80px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;overflow:hidden;}
.style-card .name{font-size:13px;font-weight:600;}
.style-card .tags{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;}
.style-card .ai-rec{font-size:10px;color:var(--ok);display:none;}
.style-card.ai-recommended .ai-rec{display:block;}
.style-footer{display:flex;padding:10px 14px 14px;gap:8px;flex-shrink:0;}

/* ── SCREEN 3: ADJUST ── */
#screen-adjust{overflow:hidden;}
.adjust-preview{
  height:45vh;position:relative;overflow:hidden;flex-shrink:0;
  background:var(--surface);
}
.adjust-preview canvas{width:100%;height:100%;display:block;}
/* (10차) 개발용 3D 검증 미니뷰 */
#devMini3D{position:absolute;right:8px;bottom:8px;width:172px;height:222px;z-index:60;
  background:rgba(74,70,62,0.95);border:1px solid #6b6252;border-radius:10px;
  display:flex;flex-direction:column;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,0.4);}
/* (11차) 확대 = 뷰포트 기준 별도 창(fixed) — 미리보기 영역 안에 갇혀 세로가
   좁던 문제 해결. 화면 거의 전체를 덮어 두상이 크게 보임. */
#devMini3D.expanded{position:fixed;left:3vw;right:3vw;top:3vh;bottom:3vh;width:auto;height:auto;z-index:300;}
#devMini3DHeader{display:flex;align-items:center;justify-content:space-between;
  padding:4px 8px;font-size:11px;font-weight:600;color:var(--accent-soft);
  background:rgba(0,0,0,0.35);flex-shrink:0;}
#devMini3DExpand{background:none;border:none;color:var(--accent-soft);font-size:14px;cursor:pointer;padding:0 2px;}
#devMini3DCanvasWrap{flex:1;position:relative;min-height:0;}
#devMini3DCanvasWrap canvas{width:100%;height:100%;display:block;touch-action:none;}
#devMini3DHint{font-size:9px;color:var(--text-muted);text-align:center;padding:2px;flex-shrink:0;}
.preview-tag{
  position:absolute;top:10px;left:10px;
  background:rgba(27,24,22,0.75);backdrop-filter:blur(4px);
  padding:4px 10px;border-radius:8px;font-size:11px;color:var(--accent-soft);
}
.seg-status{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:11px;color:var(--text-muted);}
.debug-btn{
  position:absolute;right:10px;
  background:rgba(27,24,22,0.75);backdrop-filter:blur(4px);
  padding:4px 10px;border-radius:8px;font-size:11px;color:var(--accent-soft);
  border:1px solid var(--line);cursor:pointer;font-family:'JetBrains Mono',monospace;
}
.mask-debug-btn{top:10px;}
.mask-debug-btn.on{background:var(--accent);color:#1B1816;border-color:var(--accent);font-weight:600;}
.raw-debug-btn{top:46px;}
.raw-debug-btn.on{background:var(--accent);color:#1B1816;border-color:var(--accent);font-weight:600;}
.field-debug-btn{top:82px;}
.field-debug-btn.on{background:#c04af0;color:#F3ECE2;border-color:#c04af0;font-weight:600;}

.adjust-scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 20px;background:var(--surface);}
.adjust-controls{display:flex;flex-direction:column;gap:14px;}

.angle-switch{display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;}
.angle-switch button{flex:1;background:transparent;border:none;color:var(--text-muted);padding:7px 0;font-size:11px;border-radius:7px;cursor:pointer;font-family:'JetBrains Mono',monospace;}
.angle-switch button.on{background:var(--accent);color:#1B1816;font-weight:600;}

.ai-card{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:12px 14px;}
.ai-card-hdr{display:flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--accent-soft);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px;}
.ai-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex-shrink:0;}
.ai-card-body{font-size:12px;color:var(--text-muted);line-height:1.7;margin-bottom:8px;}
.ai-tags{display:flex;flex-wrap:wrap;gap:5px;}
.ai-tag{font-size:10px;font-family:'JetBrains Mono',monospace;padding:3px 8px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--accent-soft);}

/* (11차) 슬라이더 가시성↑ — 어두운 트랙이 어두운 배경에 묻혀 안 보이던 것 밝게. */
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:#7A6E5C;outline:none;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--accent);cursor:pointer;border:3px solid #F3ECE2;box-shadow:0 1px 5px rgba(0,0,0,.45);}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#7A6E5C;}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--accent);border:3px solid #F3ECE2;cursor:pointer;}

.voice-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;}
.voice-btn{display:flex;align-items:center;gap:10px;cursor:pointer;padding:10px 12px;border-radius:9px;background:var(--surface-2);transition:background .15s;}
.voice-btn.listening{background:var(--warn);}
.voice-dot{width:9px;height:9px;border-radius:50%;background:var(--text-muted);flex-shrink:0;}
.voice-btn.listening .voice-dot{background:#fff;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}
.voice-transcript{font-size:11px;color:var(--text-muted);line-height:1.5;}
.voice-transcript b{color:var(--accent-soft);font-weight:600;}
.voice-hints{font-size:10px;color:var(--text-muted);line-height:1.8;font-family:'JetBrains Mono',monospace;}

/* ── SCREEN 4: COMPARE ── */
#screen-compare{overflow:hidden;}
.compare-wrap{flex:1;position:relative;overflow:hidden;}
.compare-base{width:100%;height:100%;display:block;}
.compare-clip{position:absolute;top:0;bottom:0;left:0;overflow:hidden;width:50%;}
.compare-clip canvas{position:absolute;top:0;left:0;width:100%;height:100%;}
.compare-divider{position:absolute;top:0;bottom:0;width:3px;background:var(--accent);left:50%;transform:translateX(-50%);cursor:ew-resize;touch-action:none;}
.compare-divider::after{content:'◂▸';position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--accent);color:#1B1816;font-size:10px;padding:5px 6px;border-radius:20px;letter-spacing:2px;}
.compare-label{position:absolute;top:10px;font-size:10px;letter-spacing:1px;padding:4px 9px;background:rgba(27,24,22,0.7);border-radius:7px;color:var(--text-muted);}
.compare-label.before{left:10px;}
.compare-label.after{right:10px;color:var(--accent-soft);}
.compare-bottom{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;flex-shrink:0;}

/* ── OVERLAYS ── */
.toast{
  position:fixed;bottom:80px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--surface-2);border:1px solid var(--line);
  padding:10px 18px;border-radius:12px;font-size:13px;
  opacity:0;pointer-events:none;transition:all .25s;z-index:50;
  white-space:nowrap;max-width:90vw;white-space:normal;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.ai-overlay{
  position:fixed;inset:0;background:rgba(27,24,22,0.92);z-index:100;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  backdrop-filter:blur(6px);
}
.ai-overlay.hidden{display:none;}
.ai-spinner{width:40px;height:40px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .9s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.ai-overlay-text{font-size:14px;color:var(--accent-soft);}
.ai-overlay-sub{font-size:12px;color:var(--text-muted);}

::-webkit-scrollbar{width:4px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:2px;}

.section-affects{font-size:10px;color:var(--text-muted);font-family:'JetBrains Mono',monospace;margin-top:2px;}

/* ════════════════════════════════════════════════════════════════
   gyeol 2D 설계 패널 (조정 화면) — 섹션칩 → 커트/펌/컬러 공정그룹 + 스타일링
   index 앱 셸(단일 컬럼·모바일)에 맞춰 gyeol 데스크톱 2컬럼 패널을 이식.
   ════════════════════════════════════════════════════════════════ */
.gy-section-bar{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:4px;}
.gy-chip{flex:1 1 auto;min-width:60px;text-align:center;font-size:12px;padding:9px 6px;
  border-radius:9px;cursor:pointer;background:var(--surface-2);border:1px solid transparent;
  color:var(--text-muted);transition:.15s;font-family:inherit;line-height:1.25;}
.gy-chip .en{display:block;font-size:8px;letter-spacing:1px;color:var(--text-muted);opacity:.7;margin-top:1px;font-family:'JetBrains Mono',monospace;}
.gy-chip.active{border-color:var(--accent);color:var(--accent-soft);background:#2a2318;}
.gy-chip:hover:not(.active){color:var(--text);}
.gy-chip.styling{flex-basis:100%;background:#241d28;color:var(--gy-color);}
.gy-chip.styling.active{border-color:var(--gy-color);color:var(--gy-color);background:#2b2130;}

.gy-groups{display:flex;flex-direction:column;}
.gy-group{border-bottom:1px solid var(--line);padding:14px 0;}
.gy-group:last-child{border-bottom:none;}
.gy-group-head{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;}
.gy-group-head.static{cursor:default;}
.gy-dot{width:9px;height:9px;border-radius:3px;flex:none;}
.gy-group-title{font-size:12px;letter-spacing:1.2px;text-transform:uppercase;font-weight:700;}
.gy-group-sub{font-size:10px;color:var(--text-muted);margin-left:auto;letter-spacing:.5px;}
.gy-chevron{color:var(--text-muted);transition:.2s;font-size:10px;margin-left:8px;}
.gy-group.collapsed .gy-chevron{transform:rotate(-90deg);}
.gy-group.collapsed .gy-group-body{display:none;}
.gy-group-body{padding-top:12px;display:flex;flex-direction:column;gap:13px;}
.gy-group.optional .gy-group-title{color:var(--text-muted);}

.gy-ctrl{display:flex;flex-direction:column;gap:6px;}
.gy-ctrl-top{display:flex;justify-content:space-between;align-items:baseline;}
.gy-ctrl-label{font-size:12.5px;color:var(--text);}
.gy-ctrl-hint{font-size:10px;color:var(--text-muted);margin-left:6px;}
.gy-ctrl-val{font-size:12px;color:var(--accent-soft);font-family:'JetBrains Mono',monospace;}
.gy-ends{display:flex;justify-content:space-between;font-size:10px;color:var(--text-muted);margin-top:1px;}
.gy-select{width:100%;background:var(--surface-2);color:var(--text);border:1px solid var(--line);
  border-radius:8px;padding:9px;font-family:inherit;font-size:12.5px;}
.gy-swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px;}
.gy-sw{width:28px;height:28px;border-radius:8px;cursor:pointer;border:2px solid transparent;}
.gy-sw.active{border-color:var(--text);}
.gy-toggle-row{display:flex;align-items:center;gap:8px;}
.gy-toggle{width:36px;height:20px;border-radius:11px;background:var(--line);position:relative;cursor:pointer;transition:.2s;flex:none;}
.gy-toggle.on{background:var(--accent);}
.gy-toggle::after{content:'';position:absolute;width:16px;height:16px;border-radius:50%;background:var(--text);top:2px;left:2px;transition:.2s;}
.gy-toggle.on::after{left:18px;background:#1B1816;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand-mark">결</div>
    <div class="stage-pill" id="stageLabel">단계 <b>1/4 · 촬영</b></div>
  </header>
  <main>

    <!-- ══ SCREEN 1: CAPTURE ══ -->
    <section class="screen active" id="screen-capture">
      <div class="capture-video-wrap">
        <div class="cam-off-msg" id="camOffMsg">카메라를 불러오는 중…<br><span style="font-size:11px;">아래 업로드 버튼도 이용 가능해요</span></div>
        <video id="video" autoplay playsinline muted></video>
        <img id="shotPreview">
        <svg class="face-guide-svg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
          <ellipse cx="50" cy="38" rx="34" ry="46" fill="none" stroke="rgba(232,195,158,0.55)" stroke-width="0.7" stroke-dasharray="3 3"/>
        </svg>
        <div class="cap-hint" id="captureHint">정면을 가이드 안에 맞춰주세요</div>
      </div>

      <!-- angle strip -->
      <div class="angle-strip" id="angleStrip">
        <div class="angle-item current" id="card-front" onclick="jumpToAngle(0)">
          <div class="angle-thumb" id="thumb-front"></div>
          <div class="angle-name">정면</div>
          <div class="angle-check" id="chk-front"></div>
        </div>
        <div class="angle-item" id="card-left" onclick="jumpToAngle(1)">
          <div class="angle-thumb" id="thumb-left"></div>
          <div class="angle-name">좌측</div>
          <div class="angle-check" id="chk-left"></div>
        </div>
        <div class="angle-item" id="card-right" onclick="jumpToAngle(2)">
          <div class="angle-thumb" id="thumb-right"></div>
          <div class="angle-name">우측</div>
          <div class="angle-check" id="chk-right"></div>
        </div>
        <div class="angle-item" id="card-back" onclick="jumpToAngle(3)">
          <div class="angle-thumb" id="thumb-back"></div>
          <div class="angle-name">후면</div>
          <div class="angle-check" id="chk-back"></div>
        </div>
      </div>

      <div class="capture-actions">
        <button class="shutter-btn" onclick="captureCurrentAngle()">📷</button>
        <div class="cap-right">
          <div class="dial-row">
            <div class="dial-mini">
              <svg viewBox="0 0 100 100">
                <circle class="seg" id="seg0" cx="50" cy="50" r="42" fill="none" stroke="#3A332B" stroke-width="6" stroke-dasharray="65 197" transform="rotate(-90 50 50)"/>
                <circle class="seg" id="seg1" cx="50" cy="50" r="42" fill="none" stroke="#3A332B" stroke-width="6" stroke-dasharray="65 197" stroke-dashoffset="-65" transform="rotate(-90 50 50)"/>
                <circle class="seg" id="seg2" cx="50" cy="50" r="42" fill="none" stroke="#3A332B" stroke-width="6" stroke-dasharray="65 197" stroke-dashoffset="-130" transform="rotate(-90 50 50)"/>
                <circle class="seg" id="seg3" cx="50" cy="50" r="42" fill="none" stroke="#3A332B" stroke-width="6" stroke-dasharray="65 197" stroke-dashoffset="-195" transform="rotate(-90 50 50)"/>
              </svg>
              <div class="dial-mini-center" id="dialCenter">0/4</div>
            </div>
            <div class="cap-hint-small" id="capHintSmall">촬영 버튼을 눌러주세요</div>
          </div>
          <div class="cap-btns">
            <button class="btn btn-ghost" style="flex:1;font-size:12px;padding:9px 8px;" onclick="retakeCurrent()">재촬영</button>
            <button class="btn btn-ghost" style="flex:1;font-size:12px;padding:9px 8px;" onclick="document.getElementById('fileInput').click()">업로드</button>
            <button class="btn btn-primary" id="toStyleBtn" style="flex:1;font-size:12px;padding:9px 8px;" onclick="navTo('style')" disabled>다음→</button>
          </div>
        </div>
      </div>
      <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="handleFileUpload(event)">
    </section>

    <!-- ══ SCREEN 2: STYLE ══ -->
    <section class="screen" id="screen-style">
      <div class="style-scroll">
        <div class="style-grid" id="styleGrid"></div>
      </div>
      <div class="style-footer">
        <button class="btn btn-ghost" style="flex:1;" onclick="navTo('capture')">← 촬영</button>
        <button class="btn btn-primary" id="toAdjustBtn" style="flex:2;" onclick="navTo('adjust')" disabled>조정하기 →</button>
      </div>
    </section>

    <!-- ══ SCREEN 3: ADJUST ══ -->
    <section class="screen" id="screen-adjust">
      <div class="adjust-preview">
        <canvas id="adjustCanvas"></canvas>
        <div class="preview-tag" id="adjustStyleTag">스타일 미선택</div>
        <button class="debug-btn mask-debug-btn" id="maskDebugToggle" onclick="toggleMaskDebug()">가닥 보기</button>
        <button class="debug-btn raw-debug-btn" id="rawDebugToggle" onclick="toggleRawDebug()">원본 결 보기</button>
        <button class="debug-btn field-debug-btn" id="fieldDebugToggle" onclick="toggleFieldDebug()">결필드 원본</button>
        <button class="debug-btn" id="diagToggle" onclick="toggleDiagInfo()" style="right:auto;left:8px;bottom:8px;">진단정보</button>
        <div id="diagInfoBox" style="display:none;position:absolute;left:8px;bottom:44px;right:8px;background:rgba(0,0,0,0.85);color:#0f0;font-family:monospace;font-size:10px;padding:8px;border-radius:6px;white-space:pre-wrap;z-index:50;max-height:200px;overflow:auto;"></div>
        <div class="seg-status" id="segStatus"></div>
        <!-- (10차) 개발용 3D 검증 미니뷰 — 3D 조정 엔진 β ON일 때만 표시.
             정규 3D 모델(state.hair3D)을 직접 렌더(드래그 회전). 탭(확대 버튼)으로
             전체화면 확대. 출시 땐 이 패널만 숨기면 됨. -->
        <div id="devMini3D" style="display:none;">
          <div id="devMini3DHeader">
            <span>3D 미리보기</span>
            <button id="devMini3DExpand" onclick="toggleDevMini3DExpand()" title="확대/축소">⛶</button>
          </div>
          <div id="devMini3DCanvasWrap"></div>
          <div id="devMini3DHint">드래그 회전 · ⛶ 확대</div>
        </div>
      </div>
      <div class="adjust-scroll">
        <div class="adjust-controls">

          <!-- 뷰 전환 (정면/좌/우/후) -->
          <div class="angle-switch" id="angleSwitch"></div>

          <!-- AI 분석 카드 -->
          <div class="ai-card" id="aiAnalysisCard" style="display:none;">
            <div class="ai-card-hdr"><div class="ai-dot"></div>AI 분석</div>
            <div class="ai-card-body" id="aiAnalysisText"></div>
            <div class="ai-tags" id="aiAnalysisTags"></div>
          </div>

          <!-- ══ gyeol 2D 설계 패널 ══ -->
          <!-- 섹션 칩 바 (크라운·프론트·템플·사이드·후두부·네이프 + 스타일링 마무리) -->
          <div class="gy-section-bar" id="gySectionBar"></div>
          <!-- 활성 섹션의 커트/펌/컬러 공정그룹 또는 스타일링 컨트롤 -->
          <div class="gy-groups" id="gyControls"></div>

          <div class="voice-box">
            <div class="voice-btn" id="voiceBtn" onclick="toggleVoice()">
              <div class="voice-dot"></div>
              <span id="voiceBtnLabel" style="font-size:13px;font-weight:600;">음성으로 조정하기</span>
            </div>
            <div class="voice-transcript" id="voiceTranscript">예: "크라운 길게", "네이프 짧게", "볼륨 추가"</div>
            <div class="voice-hints">크라운·프론트·템플·사이드·후두부·네이프 + 길게·짧게·볼륨·컬</div>
          </div>

          <button class="btn btn-ghost" style="font-size:12px;padding:10px;" onclick="resetSections()">초기화</button>
          <!-- (10차) 3D 조정 엔진 토글 — ON이면 3D 정규 모델을 현재 뷰로 투영해 표시
               (3D=원본, 2D=투영). 1단계는 표시 경로만; 조정 연산자 이관은 다음 단계. -->
          <button class="btn btn-ghost" style="font-size:12px;padding:10px;" id="btn3dEngine" onclick="toggle3DAdjust()">3D 조정 엔진 β: OFF</button>
          <button class="btn btn-primary" style="font-size:12px;padding:10px;" onclick="registerCurrentAsStyle()">★ 현재 모델을 스타일로 등록하기</button>
          <div style="height:4px;"></div>
        </div>
      </div>
      <div style="display:flex;gap:8px;padding:10px 14px 14px;flex-shrink:0;">
        <button class="btn btn-ghost" style="flex:1;font-size:13px;" onclick="navTo('style')">← 스타일</button>
        <button class="btn btn-primary" style="flex:2;font-size:13px;" onclick="navTo('compare')">비교 보기 →</button>
      </div>
    </section>

    <!-- ══ SCREEN 4: COMPARE ══ -->
    <section class="screen" id="screen-compare">
      <div class="compare-wrap" id="comparePane">
        <canvas id="compareBaseCanvas" class="compare-base"></canvas>
        <div class="compare-clip" id="compareClip">
          <canvas id="compareTopCanvas"></canvas>
        </div>
        <div class="compare-divider" id="compareDivider"></div>
        <div class="compare-label before">BEFORE</div>
        <div class="compare-label after">AFTER</div>

<!-- MediaPipe Tasks Vision (Hair Landmarker) -->
<!-- MediaPipe Tasks Vision: ES 모듈로만 배포되므로 classic <script src> 태그로는
     window.FilesetResolver 등 전역이 전혀 생성되지 않는다 (실제 원인이었던 버그).
     아래 loadVisionModule()에서 동적 import()로 직접 불러온다. -->
<script>
let __visionModulePromise = null;
function loadVisionModule(){
  if(!__visionModulePromise){
    __visionModulePromise = import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9');
  }
  return __visionModulePromise;
}
</script>
<script>
/* ════════════════════════════════════════
   FACE LANDMARKER
   yaw/pitch 계산 + 랜드마크 기반 섹션 경계 보정
════════════════════════════════════════ */
let faceLandmarker = null;
let faceLandmarkerReady = false;

async function initFaceLandmarker(){
  try{
    const { FaceLandmarker: FL, FilesetResolver: FR } = await loadVisionModule();
    if(!FL || !FR){ console.warn('FaceLandmarker API 없음'); return; }
    const fs = await FR.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm'
    );
    faceLandmarker = await FL.createFromOptions(fs, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task',
        delegate:'GPU'
      },
      runningMode:'IMAGE', numFaces:1,
      // outputFacialTransformationMatrixes: MediaPipe가 내부적으로 캐노니컬(표준) 3D
      // 얼굴 모델을 감지된 얼굴에 맞추는 변환(회전+이동) 행렬을 계산해서 넘겨줌 —
      // 이게 사실상 우리가 직접 구현하려던 PnP(Perspective-n-Point) 포즈 추정을
      // MediaPipe가 이미 해주는 것. 이 행렬에서 yaw/pitch/roll을 뽑아 4장 사진의
      // 실측 촬영 각도를 공통 좌표계(0도=정면 기준) 위에 놓는 데 사용한다.
      outputFacialTransformationMatrixes: true,
    });
    faceLandmarkerReady = true;
    console.log('Face Landmarker 준비 완료');
  } catch(e){
    faceLandmarkerReady = false;
    window.__lmDiag = 'init 실패: ' + (e && e.message ? e.message : e);
    console.warn('Face Landmarker 로드 실패:', e);
  }
}
initFaceLandmarker();

async function detectFaceLandmarks(angle){
  if(!faceLandmarkerReady || !faceLandmarker) return null;
  const dataUrl = state.shots[angle]; if(!dataUrl) return null;
  return new Promise(resolve=>{
    const img = new Image();
    img.onload = ()=>{
      try{
        const result = faceLandmarker.detect(img);
        if(!result||!result.faceLandmarks||!result.faceLandmarks.length){
          window.__lmDiag = `[${angle}] 얼굴 감지 실패 (얼굴 없음/각도 과함)`;
          console.warn(window.__lmDiag);
          resolve(null); return;
        }
        const lm = result.faceLandmarks[0];
        const nose     = lm[1];
        const lEar     = lm[234];
        const rEar     = lm[454];
        const lEye     = lm[33];
        const rEye     = lm[263];
        const chin     = lm[152];
        const forehead = lm[10];
        // 이미 468개 얼굴 랜드마크를 다 찍고 있으므로, 눈썹뿐 아니라 눈·입도
        // "박스 경계선 안쪽인지" 같은 간접 추정이 아니라 실제 그 부위 점들로
        // 직접 bounding box를 구해서, 머리카락이 절대 덮으면 안 되는 자리로
        // 얼굴제거박스와 별개로 정확히 등록해둔다. (박스 밖 관자놀이 쪽으로
        // 삐져나온 눈썹 꼬리 같은 경우를 좌표 기반으로 잡기 위함)
        const bboxOf = (idxs)=>{
          const xs = idxs.map(i=>lm[i].x), ys = idxs.map(i=>lm[i].y);
          return { minX:Math.min(...xs), maxX:Math.max(...xs), minY:Math.min(...ys), maxY:Math.max(...ys) };
        };
        const LEFT_BROW_IDX  = [70,63,105,66,107,55,65,52,53,46];
        const RIGHT_BROW_IDX = [300,293,334,296,336,285,295,282,283,276];
        const LEFT_EYE_IDX   = [33,246,161,160,159,158,157,173,133,155,154,153,145,144,163,7];
        const RIGHT_EYE_IDX  = [263,466,388,387,386,385,384,398,362,382,381,380,374,373,390,249];
        const MOUTH_IDX      = [61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146];
        const features = {
          leftBrow:  bboxOf(LEFT_BROW_IDX),
          rightBrow: bboxOf(RIGHT_BROW_IDX),
          leftEye:   bboxOf(LEFT_EYE_IDX),
          rightEye:  bboxOf(RIGHT_EYE_IDX),
          mouth:     bboxOf(MOUTH_IDX),
        };
        const browTopY = Math.min(features.leftBrow.minY, features.rightBrow.minY); // 눈썹 중 가장 위쪽 y
        const earCX    = (lEar.x + rEar.x) / 2;
        const earSpan  = Math.abs(rEar.x - lEar.x);
        const yaw      = earSpan > 0.01 ? (nose.x - earCX) / (earSpan * 0.5) : 0;
        const eyeY     = (lEye.y + rEye.y) / 2;
        const earY     = (lEar.y + rEar.y) / 2;
        // ── 실측 3D 포즈(PnP 결과) ──
        // outputFacialTransformationMatrixes로 받은 4x4 변환행렬에서 회전만
        // 뽑아 yaw/pitch/roll을 "도" 단위로 계산. earSpan 비율로 어림하던
        // 기존 yaw(-1~1)보다 훨씬 정확하고, 4장 사진을 하나의 공통 각도
        // 좌표계(0도=정면 기준) 위에 놓을 수 있게 해준다.
        let poseYawDeg = null, posePitchDeg = null, poseRollDeg = null;
        if(result.facialTransformationMatrixes && result.facialTransformationMatrixes.length){
          try{
            const pose = decomposePoseMatrix(result.facialTransformationMatrixes[0].data);
            poseYawDeg   = pose.yawRad   * 180/Math.PI;
            posePitchDeg = pose.pitchRad * 180/Math.PI;
            poseRollDeg  = pose.rollRad  * 180/Math.PI;
          }catch(e){ console.warn('포즈 행렬 분해 실패:', e); }
        }
        const info = { yaw, foreheadY:forehead.y, eyeY, earY, chinY:chin.y, browTopY, features,
                       lEarX:lEar.x, rEarX:rEar.x, poseYawDeg, posePitchDeg, poseRollDeg,
                       // 468개 랜드마크 원본(x,y,z) 전부 저장 — 지금까지는 이 중 10여 개
                       // 이름 붙은 점만 뽑아 쓰고 나머지(코 돌출·광대·턱선 등 실제 입체
                       // 정보)는 버리고 있었음. buildRealFaceMesh()가 이걸로 진짜 3D
                       // 얼굴 메쉬(FACE_MESH_TRI_V/VT/UV, MediaPipe 공식 토폴로지)를 만듦.
                       rawLandmarks: lm.map(p=>({x:p.x, y:p.y, z:p.z})) };
        state.landmarks = state.landmarks || {};
        state.landmarks[angle] = info;
        resolve(info);
      } catch(e){
        window.__lmDiag = `[${angle}] detect() 예외: ` + (e && e.message ? e.message : e);
        console.warn('랜드마크 추출 실패:', e);
        resolve(null);
      }
    };
    img.onerror = ()=>resolve(null);
    img.src = dataUrl;
  });
}

// facialTransformationMatrixes[0].data: 16개 값의 column-major 4x4 변환행렬
// (MediaPipe 캐노니컬 얼굴 모델 → 감지된 얼굴로의 변환, 사실상 PnP 결과).
// column-major이므로 data[col*4+row]가 수학적 행렬 표기 M[row][col]에 해당.
// 회전 성분(3x3)만 뽑아 표준 Tait-Bryan(Y-X-Z) 순서로 yaw/pitch/roll(라디안)을
// 분해한다. yaw = Y축 회전(고개를 좌우로 돌리는 것 = 우리가 4장 정렬에 쓸 값).
function decomposePoseMatrix(data){
  const m = (r,c)=> data[c*4+r];
  const r00=m(0,0), r10=m(1,0), r20=m(2,0);
  const r11=m(1,1), r12=m(1,2), r21=m(2,1), r22=m(2,2);
  const sy = Math.sqrt(r00*r00 + r10*r10);
  const singular = sy < 1e-6; // 짐벌락(거의 완전 위/아래를 보는 극단적 경우) 방지
  let yaw, pitch, roll;
  if(!singular){
    yaw   = Math.atan2(-r20, sy);
    pitch = Math.atan2(r21, r22);
    roll  = Math.atan2(r10, r00);
  } else {
    yaw   = Math.atan2(-r20, sy);
    pitch = Math.atan2(-r12, r11);
    roll  = 0;
  }
  return { yawRad: yaw, pitchRad: pitch, rollRad: roll };
}

// ── 랜드마크 실패 시 비율 기반 폴백 ──
// Face Landmarker 로딩/감지가 실패해도 얼굴 제거 박스, 어깨 컷오프,
// 귀·프론트 보강 로직이 완전히 꺼지지 않도록, 이 앱 촬영 가이드(얼굴을
// 프레임 중앙에 맞추는 캡처 UI) 기준의 대략적인 표준 비율로 대체한다.
// 실측 랜드마크보다는 부정확하지만, "전혀 동작 안 함"보다는 훨씬 낫다.
function getEstimatedLandmarks(angle){
  const isSideView = (angle === 'left' || angle === 'right');
  return {
    yaw: 0,
    foreheadY: 0.14,
    eyeY: 0.34,
    browTopY: 0.28, // 실측 실패 시의 대략적 추정치(eyeY보다 위, foreheadY보다 아래)
    earY: 0.40,
    chinY: 0.60,
    // 측면 사진은 얼굴이 한쪽으로 치우쳐 보이므로 귀 x좌표 범위를 좁혀
    // earSpan이 작게 나오도록 해서(> 0.08 조건 실패) 옆머리를 과도하게
    // 지우지 않는 "거의 완전 측면" 분기를 타게 한다.
    lEarX: isSideView ? 0.42 : 0.28,
    rEarX: isSideView ? 0.58 : 0.72,
  };
}

function refineSectionBoundaries(angle){
  const lm = state.landmarks && state.landmarks[angle]; if(!lm) return;

  // ── 두정선(Parietal Ridge / Crest Area) — 진짜 미용 기준선 도입 ──
  // 미용 교재(Milady's Cosmetology 등) 정의: "귀 위쪽 손가락 3개 너비 지점에서
  // 시작해 템플~크라운 하단까지 이어지는, 머리에서 가장 넓은 둘레선". 이 선을
  // 기준으로 위(Interior, 머리카락이 "눕는" 쪽)는 크라운/프론트, 아래(Exterior,
  // "늘어지는" 쪽)는 템플/사이드/후두부로 나뉨 — 실제 미용사가 두상을 나눌 때
  // 쓰는 물리적 기준이 이거임. 예전엔 이 개념 자체가 코드에 없어서 크라운 경계를
  // 엉뚱하게(이마 높이 기준) 잡고 있었음.
  // 실제 3D 스캔이 없어 정확한 cm 측정은 불가능 — 귀(earY)~이마 랜드마크
  // (foreheadY, MediaPipe 인덱스10=헤어라인 부근) 사이를 귀 쪽에서 40% 지점으로
  // 근사(경험적 근사치, "3 손가락 너비"를 비율로 환산한 것 — 실사진 검증 후
  // 재조정 필요할 수 있음).
  const parietalRidgeY = lm.earY - (lm.earY - lm.foreheadY) * 0.40;

  // Y 경계: 랜드마크 기반 실제 해부학적 위치로 보정
  // crown(정수리): Apex~두정선 사이(Interior 전체) — 예전엔 이마 높이 기준으로
  // 잘못 잡아서 실제 크라운 영역 대부분(두정선까지)이 빠져 있었음.
  SECTIONS.crown.yRange     = [0,                     parietalRidgeY];
  // front(프론트): 이마 헤어라인~눈썹 사이의 좁은 밴드 — 미용 용어로는 정확히
  // "Fringe(뱅)"에 더 가까움. crown과는 별개로, 그 안쪽의 더 좁은 중심 밴드.
  SECTIONS.front.yRange     = [lm.foreheadY * 0.85,   lm.browTopY * 1.05];
  // temple(템플): 두정선 바로 아래(귀 위/앞)의 좁은 영역 — 두정선을 상단 기준으로 씀
  SECTIONS.temple.yRange    = [parietalRidgeY * 0.97,  lm.earY * 1.05];
  // side("사이드", 정식 미용 용어는 아니고 편의상 이름 — 실제로는 두정선 아래
  // Exterior 영역 전체를 뜻함): 두정선부터 시작해야 크라운과 안 겹치고 이어짐.
  SECTIONS.side.yRange      = [parietalRidgeY,         lm.earY * 1.40];
  // occipital(후두부): 귀~후두골(정확한 랜드마크가 없어 chinY 기반 근사 유지)까지
  SECTIONS.occipital.yRange = [lm.earY * 1.10,         lm.chinY * 0.90];
  // nape(네이프): 후두골 아래~목선
  SECTIONS.nape.yRange      = [lm.chinY * 0.78,        1.0];

  const lx = Math.min(lm.lEarX, lm.rEarX);
  const rx = Math.max(lm.lEarX, lm.rEarX);
  SECTIONS.crown.xRange  = [lx * 0.3,  rx + (1-rx)*0.7];
  SECTIONS.front.xRange  = [lx * 0.55, rx + (1-rx)*0.45];
  SECTIONS.side.xRange   = [lx * 0.1,  rx + (1-rx)*0.9]; // 사이드는 넓게
  // 렌더마다 호출되므로 기본은 조용히 — 상세 모드에서만 출력(2026-07-22 로그 정리)
  if(window.DIAG_VERBOSE) console.log('[' + angle + '] yaw=' + lm.yaw.toFixed(2) + ' 섹션 경계 보정됨(두정선 y=' + parietalRidgeY.toFixed(3) + ')');
}

/* ────────────────────────────────────────
   4장 사진 랜드마크 매핑 테이블
   공통 기준점(귀/코/눈/턱)으로 뷰 간 섹션 연동 가중치 자동 산출
──────────────────────────────────────── */
// 뷰(angle)의 포즈 출처 등급 — 아래 getViewYawDeg(각도)와 getViewPoseConfidence
// (신뢰도)가 똑같은 3단 분기를 각자 복제하고 있던 것을 하나로 모음(2026-07-18).
// 둘이 같은 판정을 공유해야 "각도는 실측인데 신뢰도는 폴백값" 같은 어긋남이
// 구조적으로 불가능해짐. 등급:
// 1) 'pnp'    — MediaPipe 포즈 행렬(outputFacialTransformationMatrixes) 실측. 가장 정확
// 2) 'approx' — 랜드마크는 있으나 포즈 행렬 없음(구버전 API 등) → 귀 간격 비율 근사(yaw*90)
// 3) 'none'   — 랜드마크 자체가 없는 뷰(주로 얼굴이 안 보이는 후면) → 촬영 슬롯 기준각 가정
// ⚠ 부호 규약 정정 (2026-07-25). 실측 로그가 left=+39°, right=-45°(둘 다 tier=pnp,
// 신뢰 1.0)를 내는데 이 표는 left:-90, right:+90으로 **부호가 반대**였다. 저장되는
// 사진이 captureCurrentAngle에서 좌우 반전되기 때문에 생긴 어긋남이다.
// 영향: computeHeadCrossSections는 cos²/sin²만 써서 부호에 둔감하지만,
// projectImagePointToHead는 이 각도로 좌표를 실제 회전시키므로, 랜드마크가 없는
// 뷰(우측·후면)의 헤어가 반대쪽으로 돌아가 3D가 망가진다. 실측 규약에 맞춘다.
const ASSUMED_YAW_DEG = { front:0, left:90, right:-90, back:180 };
function getViewPoseSource(angle){
  const lm = state.landmarks && state.landmarks[angle];
  if(lm && typeof lm.poseYawDeg === 'number' && !Number.isNaN(lm.poseYawDeg)) return { tier:'pnp', lm };
  if(lm && typeof lm.yaw === 'number') return { tier:'approx', lm };
  // 사후 감지는 실패했지만 촬영 직전 라이브 가이드가 실측해둔 PnP yaw가 있는 경우.
  // 지어낸 슬롯 기본값(ASSUMED_YAW_DEG)보다 훨씬 낫다 — 셔터와 시차(≤1.5초)만 있을 뿐
  // 그 사람에게서 실제로 측정한 각도다.
  const live = state.liveYaw && state.liveYaw[angle];
  if(typeof live === 'number' && !Number.isNaN(live)) return { tier:'live', lm, liveYaw: live };
  return { tier:'none', lm };
}

// 뷰(angle)의 실측 좌우 회전각(도).
function getViewYawDeg(angle){
  const src = getViewPoseSource(angle);
  const { tier, lm } = src;
  if(tier === 'pnp') return lm.poseYawDeg;
  if(tier === 'approx') return lm.yaw * 90;
  if(tier === 'live') return src.liveYaw;
  return ASSUMED_YAW_DEG[angle] ?? 0;
}

// 위쪽(Interior)인 곳만 crown이 되도록 고침.
// ── 뷰별 섹션 경계 밴드 — 2026-07-22 재작성 → 같은 날 2차 수정(실기기) ──
// 1차(랜드마크 절대비율)의 실기기 실패: 두정선(earY-40%)과 네이프선(chinY×0.78)이
// "이미지 전체에 대한 절대 비율" 공식이라, 얼굴이 프레임 어디에 있느냐에 따라
// 두 선이 겹치거나 역전됨 — 실기기 로그에서 좌측 뷰 두정선 0.503 vs 네이프선
// ≈0.50으로 Exterior 밴드(템플/사이드/후두부)가 폭 0으로 붕괴, crown=100% 확인.
// 정면 temple=0%도 동일 원인(프론트 밴드 x공식 lx*0.55이 프레임 폭 기준이라
// 넓은 사진에선 머리 전체를 삼킴).
// → 2차: 경계를 "헤어 마스크의 실측 스팬"(머리 꼭대기 apex~모발 끝, 좌우 폭)과
// 랜드마크의 조합으로 머리 기준 상대좌표로 계산. 프레임 안 어디에 어떤 크기로
// 찍혀도 비율이 유지된다. 마스크가 아직 없으면(처리 초기) 랜드마크 폴백.
// 메모이즈: 랜드마크·마스크 객체 identity 기준(재촬영/재처리 시 자동 갱신).
// ── 진단 로그 상세 모드(2026-07-22) ──
// 실기기 피드백: "콘솔로그에 진단내용이 뭐 이렇게 많지?" — [진단·조정]/
// [진단·조정렌더]/[진단·섹션분포]/경계보정 로그가 슬라이더 input 이벤트마다
// (드래그 한 번에 수십 번) 찍히고 있었음. 기본은 끄고, 문제 추적할 때만
// 콘솔에서 window.DIAG_VERBOSE = true 로 켜서 보게 함.
// [진단·섹션분포]는 값이 "바뀔 때만" 1회 출력(검증에 필요한 최소한만 유지).
window.DIAG_VERBOSE = false;
const _secBandsCache = {};
function sectionBandsFor(angle){
  const lm = (state.landmarks && state.landmarks[angle]) || null;
  const mi = (state.hairMasks && state.hairMasks[angle]) || null;
  const c = _secBandsCache[angle];
  if(c && c.srcLm === lm && c.srcMi === mi) return c.bands;
  const L = lm || getEstimatedLandmarks(angle);
  // ── 머리 실측 스팬(헤어 마스크): apex(머리 꼭대기)·모발 최하단·좌우 폭 ──
  let headTopY = null, hairBotY = null, nxMin = 0.2, nxMax = 0.8;
  if(mi && mi.scalpY){
    let minS = Infinity, maxE = -Infinity, x0 = Infinity, x1 = -Infinity;
    for(let x = 0; x < mi.w; x++){
      const s = mi.scalpY[x]; if(s < 0) continue;
      if(s < minS) minS = s;
      const e = (mi.hairEndY && mi.hairEndY[x] >= 0) ? mi.hairEndY[x] : s;
      if(e > maxE) maxE = e;
      if(x < x0) x0 = x; if(x > x1) x1 = x;
    }
    if(isFinite(minS) && x1 > x0){
      headTopY = minS / mi.h; hairBotY = maxE / mi.h;
      nxMin = x0 / mi.w; nxMax = x1 / mi.w;
    }
  }
  if(headTopY === null){ // 마스크 미가용 폴백(랜드마크 기반 근사)
    headTopY = Math.max(0, L.foreheadY - 0.10);
    hairBotY = Math.min(1, L.chinY + 0.10);
  }
  const earLineY  = (typeof L.earY  === 'number') ? L.earY  : headTopY + (hairBotY - headTopY) * 0.60;
  const chinLineY = (typeof L.chinY === 'number') ? L.chinY : headTopY + (hairBotY - headTopY) * 0.95;
  // 두정선: apex(실측 머리 꼭대기)~귀 사이 지점 — "귀 위 손가락 3개" 근사를
  // 이마 랜드마크가 아니라 실제 머리 꼭대기 기준으로 계산(프레임 무관).
  // (4차, 사용자 교정 "측면에서 뿌리 기준이어도 크라운이 75%면 안 된다") 뷰별 분리:
  // 측면/후면에선 옆통수 두피면 전체가 보이므로 크라운(Interior)은 위쪽 ~35%만 —
  // 정면은 두정선 아래가 화면에 거의 안 보여 52% 유지. 편중 시 이 계수만 조정(튜닝 지점).
  const parietalFrac = (angle === 'front') ? 0.52 : 0.25; // (12차) 측면 크라운 축소 0.35→0.25(사이드 확대)
  const parietalY = headTopY + Math.max(0.02, earLineY - headTopY) * parietalFrac;
  // 네이프선: 귀~턱 사이 25% 지점(귀 바로 아래 목덜미 시작) — chinY 절대비율 폐기.
  // 두정선보다 항상 아래에 있도록 하한 보장(Exterior 밴드 붕괴 방지).
  const napeTopY  = Math.max(parietalY + 0.04, earLineY + (chinLineY - earLineY) * 0.25);
  // (12차) 프론트 중앙 밴드 = "머리 실측 좌우 폭의 중앙 50%". 예전엔 귀 간격 기준
  // 이었는데 정면 사진에서 귀가 좁게 잡히면(earSpan 작음) 밴드가 7%로 쪼그라들어
  // 프론트가 거의 안 잡혔음 → 프레임 무관한 헤어 폭 기준으로 통일(귀 폭이 더
  // 넓으면 그쪽을 존중). 앞머리 덩어리는 대략 앞 중앙 절반이라 50%가 적정.
  const lx = Math.min(L.lEarX, L.rEarX), rx = Math.max(L.lEarX, L.rEarX);
  const hs = Math.max(0.02, nxMax - nxMin);
  let frontX0 = nxMin + hs * 0.25, frontX1 = nxMax - hs * 0.25; // 헤어 폭 중앙 50%
  if((rx - lx) > (frontX1 - frontX0)){ frontX0 = lx; frontX1 = rx; } // 귀 폭이 더 넓으면 채택
  const browY = (typeof L.browTopY === 'number') ? L.browTopY : (headTopY + (earLineY - headTopY) * 0.80);
  const bands = {
    headTopY, hairBotY, parietalY, napeTopY,
    nxMin, nxMax,
    frontY0: Math.min(parietalY, L.foreheadY * 0.85 + 0), // 프린지 밴드 상단(헤어라인 부근)
    frontY1: browY * 1.05,                                 // 프린지 밴드 하단(눈썹 위)
    frontX0, frontX1,
    // 얼굴이 이미지에서 어느 쪽을 보는가(+1=오른쪽, -1=왼쪽). 랜드마크 yaw
    // (코가 귀 중심보다 어느 쪽인지)가 있으면 실측, 없으면 촬영 슬롯 가정.
    faceDir: (lm && typeof lm.yaw === 'number' && Math.abs(lm.yaw) > 0.05)
      ? (lm.yaw >= 0 ? 1 : -1)
      : (angle === 'right' ? 1 : -1),
  };
  _secBandsCache[angle] = { srcLm: lm, srcMi: mi, bands };
  return bands;
}

function resolveSectionId(angle, nx, ny){
  // ── 섹션 배분 재재설계(2026-07-22, 뿌리 실좌표 기반) ──
  // 이전 재설계(nx 하드코딩 0.32/0.64 분할)의 문제:
  //  · ny로 들어오던 값이 "컬럼의 실루엣 맨 꼭대기"라 세로 정보가 죽어 있었고,
  //    그 보상으로 좌우(nx)만으로 나누다 보니 측면 뷰에서 중앙 컬럼 전부(사실상
  //    보이는 머리 전체)가 side로 먹혔음 — "사이드만 조정하면 전체가 움직인다"의 원인.
  //  · 네이프는 어떤 뷰에서도 조건(ny>네이프선)을 만족할 수 없어 조정이 무반응.
  //  · left/right 모두 "nx 작으면 템플" 고정이라 우측 뷰에선 템플/후두부가 뒤바뀜.
  // 이제 호출부(drawStrandLayer)가 가닥의 "실제 뿌리 좌표"(루트 확산 레이어의
  // 깊이 포함)를 넘기므로 세로(ny)가 다시 의미를 갖는다 → 초반에 잡아둔 미용
  // 기준선(두정선 위=Interior=크라운, 아래=Exterior, 네이프선 아래=네이프)을
  // 그대로 적용하고, 측면의 앞/뒤(템플/후두부)는 귀 실측 x와 얼굴 방향으로 나눈다.
  const b = sectionBandsFor(angle);
  if(angle==='front'){
    if(ny >= b.napeTopY) return 'nape';
    // (12차) 프론트 = 중앙 컬럼 전체(꼭대기~눈썹). 예전엔 "헤어라인~눈썹" 얇은 띠만
    // 프론트라 그 위 중앙이 전부 크라운으로 먹혀, 프론트 조정이 거의 무반응이었음
    // (실기기: "프론트 만질 때 하나도 안 먹고 크라운만 먹힌다"). 정면 뷰에서 보이는
    // 앞머리 덩어리 전체가 프론트가 되도록 세로 하한(frontY0) 제거.
    const inFrontX = nx >= b.frontX0 && nx <= b.frontX1;
    if(inFrontX && ny <= b.frontY1) return 'front'; // 중앙 컬럼 눈썹 위까지 = 프론트
    if(ny <= b.parietalY) return 'crown';        // 중앙 밖 위쪽(정수리 양옆) = 크라운
    if(!inFrontX) return 'temple';               // 두정선 아래 좌우(귀 쪽) = 템플
    return 'front';
  }
  if(angle==='left' || angle==='right'){
    if(ny >= b.napeTopY) return 'nape';          // 목선 쪽 뿌리 = 네이프
    if(ny <= b.parietalY) return 'crown';        // 두정선 위(Interior) = 크라운
    // 두정선~네이프선 사이(Exterior): 헤어 좌우 스팬 기준 상대좌표로 앞/뒤 분할
    // (2차 수정: 귀 x 절대좌표 ± 고정폭 → 실기기 프레임에 따라 깨져서 폐기).
    // fw: 0=머리 뒤쪽 끝 ~ 1=머리 앞쪽 끝(얼굴 방향은 실측 yaw 부호로 결정).
    const span = Math.max(0.02, b.nxMax - b.nxMin);
    const fw = b.faceDir > 0 ? (nx - b.nxMin) / span : (b.nxMax - nx) / span;
    // (12차) 사이드 확대: 측면 뷰 주인공은 사이드인데 크라운(위 35%)+템플/후두부에
    // 밀려 작았음. 앞/뒤 밴드를 22%로 좁혀 사이드를 가운데 56%로. (크라운 축소는
    // sectionBandsFor의 측면 parietalFrac 0.35→0.25로 별도 처리.)
    if(fw > 0.78) return 'temple';               // 앞 22%(귀 앞·관자놀이)
    if(fw < 0.22) return 'occipital';            // 뒤 22%(뒤통수)
    return 'side';                               // 가운데 56%(귀 주변)
  }
  if(angle==='back'){
    if(ny >= b.napeTopY) return 'nape';
    if(ny <= b.parietalY) return 'crown';        // 두정선 위 = 크라운
    return 'occipital';                          // 그 사이 = 후두부
  }
  return 'crown';
}

// (2026-07-22 정리) 겹 스택 헴 캡(gySectionHemCapNy/HEM_OVERLAP)은 4차에 도입했으나
// 6차 실측 길이 렌더(마스크 이탈·결 불연속 실측)로 대체되며 호출부가 사라짐 — 제거.
// 3D 헴라인은 2단계에서 실측 기반으로 새로 구현.

const state = {
  // ROADMAP(voice): 향후 음성입력 연동 시, 인식 실패/수정 이벤트를 여기 state에
  // 사용자별로 누적 기록하는 필드 추가 예정 (예: state.voiceCorrections[]).
  // 서버측 범용 모델 개선이 아니라 클라이언트 로컬 개인화 목적 — 정정 이벤트 자체가
  // 학습 신호. UI 연동 지점은 섹션/슬라이더 명령 파싱하는 곳(추후 신설).
  shots: {front:null,left:null,right:null,back:null},
  hairMasks: {front:null,left:null,right:null,back:null},
  hairCanvases: {front:null,left:null,right:null,back:null},
  baseCanvases: {front:null,left:null,right:null,back:null},
  // 촬영 직전 라이브 각도 가이드가 실측한 yaw(도, 파이프라인 부호 규약).
  // 사후 랜드마크 감지가 실패한 뷰에서 ASSUMED_YAW_DEG 대신 쓰인다.
  liveYaw: {front:null,left:null,right:null,back:null},
  debugShowMask: false, // true면 조정화면에서 가닥 대신 hairMaskBuf 실루엣을 그대로 표시(진단용)
  debugShowRaw: false,  // true면 스타일/슬라이더 값 무시하고 전 섹션 중립값(길이·볼륨 50, 컬 0)으로 렌더링(진단용)
  debugShowField: false, // true면 strand 시뮬레이션(뿌리/중력/clamp) 전부 건너뛰고 orientation 컬럼 샘플을 가공 없이 그대로 표시(진단용)
  // ── 3D 조정 엔진(베타, 2026-07-22) ──
  // true면 조정 화면의 계산이 "중립 가닥 캡처 → 3D 리프트 → 3D에서 커트/펌 →
  // 같은 뷰로 역투영(깊이 정렬)" 경로로 바뀌고, 표시만 2D로 유지된다(사용자 설계:
  // "내부 로직은 3D로 조정을 계산하고 표현은 2D로"). false면 기존 2D 직접 렌더.
  use3DAdjust: false,
  currentCaptureIndex: 0,
  selectedStyle: null,
  currentViewAngle: 'front',
  currentSection: 'crown',   // 현재 편집 중인 섹션
  // 섹션별 파라미터 저장
  sections: Object.fromEntries(
    Object.entries(SECTIONS).map(([id,s])=>[id, {...s.defaults}])
  ),
  // ── 페이드/테이퍼(클리퍼 기법) — 길이 기준, 엘리베이션(각도)과는 완전히 별개 ──
  // 템플/사이드/후두부/네이프 하단(구레나룻·목선 쪽)에 적용되는 클리퍼 가드
  // 그라데이션. 실제 기법 그대로: guard 0=스킨(가드 없음, 맨살까지), 8=1인치

  fade: {
    enabled: false,
    guard: 1,        // 0~8, 페이드 최하단(구레나룻/목선 끝) 길이
    height: 35,       // 0~100, 그 섹션 안에서 페이드가 몇 %까지 올라가는지(로우/미드/하이 페이드)
    blendWidth: 40,   // 0~100, 가드 경계가 얼마나 부드럽게 섞이는지(테이퍼 레버 개념 — 낮으면 칼선, 높으면 부드러운 그라데이션)

  // gyeol 조정 패널: 현재 활성 섹션('styling'이면 마무리 탭), 그룹 접힘 상태
  activePanelSection: 'crown',
  panelCollapsed: { perm:false, color:true },
  // 하위 호환: sliders는 섹션 파라미터에서 파생 (renderFrame에서 사용)
  // length 필드는 더 이상 여기서 쓰이지 않음 — drawHairStrands가 컬럼별로
  // resolveSectionId()를 통해 해당 위치의 섹션 length를 직접 조회함
  // (머리 전체에 평균 길이 하나만 적용되던 문제를 고치기 위함).
  get sliders(){
    const sec = state.sections;
    // 각 뷰 렌더에 필요한 통합 파라미터 계산
    const blend = (a,b,t)=> a*(1-t)+b*t;
    // 엘리베이션(0~90°)을 기존 볼륨류 공식(numRootScatter 등)이 기대하는
    // 0~100 스케일로 환산. 실제 기법 파라미터로 바뀌었어도 렌더링 쪽 공식은
    // 그대로 재사용(입력만 바뀜) — elevation 90°=완전 레이어=볼륨 100.
    const elevToVol = (deg)=> Math.max(0, Math.min(100, ((deg ?? 45)/90) * 100));
    // left/right는 좌우 대칭이라 항상 동일한 값 — 한 번만 계산해서 공유
    const sideView = {
      length: blend(sec.side.length, sec.occipital.length, 0.5),
      curl:   state._globalCurl || 30,
      volume: blend(elevToVol(sec.crown.elevation), elevToVol(sec.occipital.elevation), 0.5),
      thickness: 50,
    };
    return {
      front: {
        length: blend(sec.crown.length, sec.front.length, 0.6),
        curl:   state._globalCurl || 30,
        volume: elevToVol(sec.crown.elevation),
        thickness: 50,
      },
      left: sideView,
      right: sideView,
      back: {
        length: blend(sec.occipital.length, sec.nape.length, 0.5),
        curl:   state._globalCurl || 30,
        volume: elevToVol(sec.occipital.elevation),
        thickness: 50,
      },
    };
  },
  _globalCurl: 30,
};

let segmenterReady = false;
let segmenterError = false;
let mpImageSegmenter = null; // MediaPipe Tasks Vision segmenter

async function initSegmenter(){
  // ── 1차: MediaPipe Tasks Vision (hair segmentation) ──
  try{
    const { FilesetResolver: FR, ImageSegmenter: IS } = await loadVisionModule();
    const vision = await FR.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.9/wasm'
    );
    mpImageSegmenter = await IS.createFromOptions(vision, {
      baseOptions:{
        modelAssetPath:'https://storage.googleapis.com/mediapipe-models/image_segmenter/hair_segmenter/float32/1/hair_segmenter.tflite',
        // GPU delegate가 특정 기기/브라우저 조합에서 카테고리 인덱스를 뒤섞는
        // 알려진 버그가 있음(google-ai-edge/mediapipe#6142, iOS Safari 사례지만
        // 같은 계열). hair_segmenter는 background=0/hair=1 2클래스라 이 버그에
        // 걸리면 hair 픽셀이 전부 0px로 나옴 — 실제로 겪은 증상과 일치.
        // CPU delegate가 느리지만 훨씬 안정적이라 정확도 우선으로 전환.
        delegate:'CPU',
      },
      // categoryMask는 0.5 argmax로 배경/머리카락을 딱 잘라 판정해서, 새치처럼
      // 저채도인 경계 픽셀이 배경 쪽으로 떨어져 커버리지가 낮게 나오는 문제가 있었음
      // (실측: 전체의 6%만 머리카락으로 판정). confidenceMask(0~1 확률값)를 받아서
      // 임계값을 직접 조정할 수 있게 변경.
      outputCategoryMask: false,
      outputConfidenceMasks: true,
      runningMode: 'IMAGE',
    });
    segmenter = mpImageSegmenter;
    segmenterReady = true;
    state.segmenterType = 'MediaPipe';
    console.log('MediaPipe Hair Segmenter 준비 완료');
    return;
  } catch(e){
    window.__segDiag = (e && e.name ? e.name + ': ' : '') + (e && e.message ? e.message : String(e));
    console.warn('MediaPipe Hair Segmenter 실패, TF.js 폴백:', e);
  }

  // ── 2차 폴백: TF.js SelfieSegmentation ──
  try{
    await tf.ready();
    await tf.setBackend('webgl');
    segmenter = await bodySegmentation.createSegmenter(
      bodySegmentation.SupportedModels.MediaPipeSelfieSegmentation,
      { runtime:'tfjs', modelType:'general' }
    );
    segmenterReady = true;
    state.segmenterType = 'TF.js';
    console.log('TF.js SelfieSegmentation 폴백 준비 완료');
  } catch(e){
    console.warn('모든 Segmenter 로드 실패:', e);
    segmenter = null;
    segmenterError = true;
    state.segmenterType = '실패';
  }
}

// MediaPipe가 window.FilesetResolver 버그로 계속 TF.js로 폴백되던 동안 쌓인 패치들이라,
// 실제 MediaPipe hair_segmenter 마스크 특성에 맞춰 검증된 적이 없음.

// 기준으로 튜닝된 것이라 MediaPipe에는 불필요/역효과였음.
// → MediaPipe가 정상 동작 중일 때는 이 후처리를 끄고, TF.js 폴백으로 떨어졌을 때만 켠다.
const ENABLE_LANDMARK_POSTPROCESS = true;

// 픽셀 RGB 합계(sumR/sumG/sumB)와 샘플 개수(cnt)로부터 평균 rgb() 문자열을 만든다.
// 두피/피부색 샘플링 3곳(이마 밴드 직접 샘플, reason=2 기반, 헤어라인 위 컬럼 샘플)에서
// "합산 후 rgb(...) 문자열로 변환" 로직이 그대로 반복되던 것을 하나로 합침.
// minCount 이하 샘플이면(신뢰할 수 없는 소수 샘플) null 반환 — 호출부는 그대로 폴백으로 넘어감.
function avgRGBString(sumR, sumG, sumB, cnt, minCount){
  if(cnt <= (minCount||0)) return null;
  return `rgb(${Math.round(sumR/cnt)},${Math.round(sumG/cnt)},${Math.round(sumB/cnt)})`;
}
